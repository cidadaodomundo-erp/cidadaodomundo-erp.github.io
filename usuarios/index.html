<!-- USUÁRIOS DO PAINEL (qua 18/11/2026, chat Telas). Dono 18/11 01:58 (#1093): "conseguimos trazer uma tela de usuario pro
     painel? com criação, edição, troca de senha e permissões?"; 02:12 (#1097): "pode começar o quanto antes".
     Só o dono: as funções painel_usuarios_lista / painel_usuario_salvar / _criar_login / _trocar_senha / _bloquear conferem
     eh_dono() no banco (script/sql/painel_usuarios_2026_11_18.sql). A senha vai direto ao banco (crypt) e não fica guardada
     em claro. Telas = painel_acesso.modulos (sem linha = todas). Quem mexe: o chat "Telas do painel". -->
<script>
  const NA_CASCA = window.parent !== window;
  if (NA_CASCA) document.documentElement.classList.add('na-casca');
  function avisarCasca(msg) { if (NA_CASCA) { try { parent.postMessage(msg, location.origin); } catch (e) {} } }
</script>
<link rel="stylesheet" href="../nucleo/nucleo.css?v=20261107t">
<style>
  .na-casca body::before { display:none !important; }
  .us-lin td { vertical-align:top; }
  .us-telas { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:2px 12px; margin:4px 0 10px; }
  .us-telas label { font-size:12.5px; display:flex; gap:6px; align-items:center; }
  .us-form { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin:8px 0 14px; white-space:normal; }
  .us-form input:not([type=checkbox]), .us-form select { background:var(--surface-2); border:1px solid var(--line); border-radius:8px; color:var(--tx-1); padding:7px 10px; font:inherit; }
</style>

<body>
<div class="main-content">
  <div class="wrap">
    <div id="erroMsg" style="display:none;"></div>
    <div id="modulo-usuarios" class="modulo" style="display:none;"><div id="view-usuarios"></div></div>
  </div>
</div>

<script src="../casca/menu.js?v=20261118us"></script>
<script src="../casca/modulos.js?v=20261118us"></script>
<script src="../nucleo/nucleo.js?v=20261122d"></script>
<script>
const US = { L: null, erro: null, aberto: null, busca: '', novo: false };
const usE = (s) => trEscH(String(s == null ? '' : s));
const US_PAPEIS = [['DONO', 'Gestão (vê todo o financeiro)'], ['FINANCEIRO', 'Financeiro'], ['FILIAL', 'Filial (só a própria loja)'], ['SEPARACAO', 'Separação / estoque'], ['', 'sem papel (só as telas marcadas)']];
const US_LOJAS = [['AGUA VERDE', 'Água Verde'], ['AHU', 'Ahú'], ['SÃO BRAZ', 'São Braz'], ['BOQUEIRAO', 'Boqueirão']];
// nomes das telas: os mesmos do menu da casca
function usRotulos() {
  const R = {}, CFG = window.CASCA_MODULOS_CFG || {};
  (window.CASCA_MENU || []).forEach((g) => (g.itens || []).forEach((it) => { R[it.chave] = it.rotulo; }));
  Object.entries(CFG.extras || {}).forEach(([k, v]) => { R[k] = v.rotulo; });
  Object.entries(CFG.rotulos || {}).forEach(([k, v]) => { R[k] = v; });
  return R;
}
function usGrupos() {
  const CFG = window.CASCA_MODULOS_CFG || {}, J = CFG.juncoes || {}, R = usRotulos(), vistos = new Set();
  const abre = (k) => J[k] ? J[k].abas.map(([c]) => c) : [k];
  const G = (window.CASCA_MODULOS || []).map((m) => {
    const ks = [...(m.lancar || []), ...(m.acompanhar || [])].flatMap(abre).filter((k) => k !== 'agenda' && k !== 'biblioteca' && !vistos.has(k) && vistos.add(k));
    return { nome: m.nome, telas: ks.map((k) => [k, R[k] || k]) };
  }).filter((g) => g.telas.length);
  return { G, vistos };
}
async function entrarUsuarios() {
  const alvo = document.getElementById('view-usuarios');
  if (!US.L) alvo.innerHTML = '<h2>Usuários do painel</h2><div class="contexto">Carregando…</div>';
  const r = await trRpcSeguro('painel_usuarios_lista', {});
  if (!r.ok) { US.erro = await trErroDe(r); US.L = null; } else { US.erro = null; US.L = await r.json(); }
  usDesenhar();
}
function usBuscar(v) { US.busca = v; clearTimeout(window._usB); window._usB = setTimeout(() => { usDesenhar(); const e = document.getElementById('usBusca'); if (e) { e.focus(); e.setSelectionRange(e.value.length, e.value.length); } }, 200); }
function usAbrir(em) { US.aberto = US.aberto === em ? null : em; US.novo = false; usDesenhar(); }
function usQuando(ts) { if (!ts) return '—'; return new Date(ts).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit', timeZone: 'America/Sao_Paulo' }); }
function usTelasTxt(u, R) {
  if (u.todas_as_telas) return '<b>todas as telas</b>';
  const m = u.modulos || []; if (!m.length) return '—';
  return m.slice(0, 4).map((k) => usE(R[k] || k)).join(', ') + (m.length > 4 ? ` <span style="color:var(--tx-4);">+${m.length - 4}</span>` : '');
}
// 18/11/2026 16:17 (dono, pelo Organizador: "tem como colocar uma ordenação no cabeçalho da tabela dos usuários e uma opção de
// excluir usuarios inativos?"): clicar no cabeçalho ordena, clicar de novo inverte; a setinha mostra coluna e sentido.
// "Excluir" só para inativo (bloqueado, ativo=false nas listas ou sem entrar há mais de 30 dias); nunca dono, robo.*, info@, administrativo@.
// O banco (painel_usuario_excluir) confere tudo de novo.
const US_ORD = { col: null, dir: 1 };
const US_COLS = [['pessoa', 'Pessoa'], ['papel', 'Papel'], ['telas', 'Telas'], ['ultimo', 'Último acesso'], ['situacao', 'Situação']];
function usSituacao(u) { return u.bloqueado ? 'bloqueado' : !u.tem_login ? 'sem login' : u.ativo === false ? 'inativo' : usDias(u) > 30 ? 'parado' : 'ativo'; }
function usDias(u) { const t = u.ultimo_login || u.criado_em; return t ? (Date.now() - new Date(t).getTime()) / 864e5 : Infinity; }
function usProtegido(u) { const e = String(u.email || '').toLowerCase(); let eu = ''; try { const ss = rmbSessao(); eu = String((ss && ss.user && ss.user.email) || '').toLowerCase(); } catch (x) {}
  return e === eu || (u.papel === 'DONO' && u.todas_as_telas) || e.startsWith('robo.') || /^(info|administrativo)@/.test(e); }
function usInativo(u) { return u.bloqueado || u.ativo === false || usDias(u) > 30; }
function usChave(u, c, R) {
  if (c === 'pessoa') return usUsuario(u.email);
  if (c === 'papel') return `${u.papel || 'zzz'} ${u.unidade || ''}`.toLowerCase();
  if (c === 'telas') return u.todas_as_telas ? 9999 : (u.modulos || []).length;
  if (c === 'ultimo') return u.ultimo_login ? new Date(u.ultimo_login).getTime() : 0;
  return usSituacao(u);
}
// 18/11/2026 16:25 (dono: "deixar os usuarios das pessoas no padrão tudo minúsculo"): a 1ª coluna mostra o usuário como a pessoa
// digita para entrar (e-mail sem @cidadaodomundo.com.br, minúsculo; de fora do domínio, inteiro) e o nome em formato de nome próprio.
// Só exibição: o banco fica como está.
function usUsuario(em) { const e = String(em || '').toLowerCase().trim(); return e.endsWith('@cidadaodomundo.com.br') ? e.slice(0, -'@cidadaodomundo.com.br'.length) : e; }
function usNomeProprio(n) { const pq = new Set(['da', 'de', 'do', 'das', 'dos', 'e']);
  return String(n || '').toLowerCase().trim().split(/\s+/).map((p, i) => i && pq.has(p) ? p : p.charAt(0).toUpperCase() + p.slice(1)).join(' '); }
// usuário digitado → e-mail do login (igual à tela de entrar); com @ fica como está (gente de fora do domínio)
function usEmailDe(t) { t = String(t || '').trim(); if (!t) return ''; if (t.includes('@')) return t.toLowerCase();
  return t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9._-]/g, '') + '@cidadaodomundo.com.br'; }
function usUsuarioDigitado(el) { if (el.value.includes('@')) return; const n = usUsuario(usEmailDe(el.value)); if (n !== el.value) el.value = n; }
// a mensagem do banco fala "e-mail"; na tela é "usuário"
async function usErro(r) { return String(await trErroDe(r)).replace(/Esse e-mail/gi, 'Esse usuário').replace(/e-mail/gi, 'usuário'); }
function usOrdenar(c) { if (US_ORD.col === c) US_ORD.dir = -US_ORD.dir; else { US_ORD.col = c; US_ORD.dir = c === 'ultimo' ? -1 : 1; } usDesenhar(); }
function usExcluirPedir(em) { US.excluir = em; usDesenhar(); }
async function usExcluir(email) {
  avisoAcao('enviando', 'Excluindo o login…');
  const r = await trRpcSeguro('painel_usuario_excluir', { p_email: email });
  if (!r.ok) return avisoAcao('erro', `✗ NÃO excluiu ${usUsuario(email)}: ${await usErro(r)}`, () => usExcluir(email));
  US.excluir = null; US.aberto = null; await entrarUsuarios();
  avisoAcao('ok', `✓ ${usUsuario(email)} excluído às ${avisoHora()}: não entra mais e saiu da lista de telas. O histórico das listas fica.`);
}
function usDesenhar() {
  const alvo = document.getElementById('view-usuarios');
  if (US.erro) { alvo.innerHTML = `<h2>Usuários do painel</h2><div class="contexto" style="border-color:var(--farol-fora);">✗ ${usE(US.erro)} <button type="button" class="preset-btn" onclick="entrarUsuarios()">Tentar de novo</button></div>`; return; }
  const L = US.L || [], R = usRotulos(), b = US.busca.trim().toLowerCase();
  const vis = L.filter((u) => !b || (u.email + ' ' + (u.nome || '') + ' ' + (u.papel || '') + ' ' + (u.unidade || '')).toLowerCase().includes(b));
  if (US_ORD.col) vis.sort((x, y) => { const a = usChave(x, US_ORD.col, R), c = usChave(y, US_ORD.col, R); return (a < c ? -1 : a > c ? 1 : 0) * US_ORD.dir; });
  const seta = (c) => US_ORD.col === c ? (US_ORD.dir > 0 ? ' ▲' : ' ▼') : ' <span style="opacity:.3;">↕</span>';
  let h = `<h2>Usuários do painel</h2>
    <div class="contexto" style="text-align:left;">Quem entra no painel, o que cada um vê e a senha. Clique na pessoa para mudar.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0;">
      <button type="button" class="preset-btn active" onclick="US.novo=!US.novo;US.aberto=null;usDesenhar()">+ Novo usuário</button>
      <input id="usBusca" type="search" placeholder="buscar usuário, nome, loja" value="${usE(US.busca)}" oninput="usBuscar(this.value)" style="flex:0 1 260px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;color:var(--tx-1);padding:7px 10px;font:inherit;">
      <span style="font-size:12px;color:var(--tx-4);">${L.length} pessoas · ${L.filter((u) => u.bloqueado).length} bloqueadas · ${L.filter((u) => !u.tem_login).length} sem login criado</span></div>`;
  if (US.novo) h += usForm(null);
  h += `<div id="tabelaUsuarios" style="overflow-x:auto;"><table><thead><tr>${US_COLS.map(([c, t]) => `<th style="cursor:pointer;user-select:none;" title="ordenar por ${t.toLowerCase()} (clique de novo inverte)" onclick="usOrdenar('${c}')">${t}${seta(c)}</th>`).join('')}</tr></thead><tbody>
    ${vis.map((u) => `<tr class="us-lin" style="cursor:pointer;" onclick="usAbrir(${usE(JSON.stringify(u.email))})">
      <td><b>${usE(usUsuario(u.email))}</b>${u.nome ? `<br><span style="font-size:11.5px;color:var(--tx-4);">${usE(usNomeProprio(u.nome))}</span>` : ''}</td>
      <td>${usE((u.papel || '—').toLowerCase())}${u.unidade ? ' · ' + usE(u.unidade) : ''}</td>
      <td style="white-space:normal;font-size:12.5px;">${usTelasTxt(u, R)}</td>
      <td>${usQuando(u.ultimo_login)}</td>
      <td>${(() => { const st = usSituacao(u);
        const sel = st === 'bloqueado' || st === 'inativo' ? `<span style="color:var(--farol-fora);font-weight:700;">${st}</span>` : st === 'sem login' ? '<span style="color:var(--farol-perto);">sem login</span>'
          : st === 'parado' ? `<span style="color:var(--farol-perto);">sem entrar há ${Math.floor(usDias(u))} dias</span>` : '<span style="color:var(--farol-ok);">ativo</span>';
        if (!usInativo(u) || usProtegido(u)) return sel;
        const emJs = usE(JSON.stringify(u.email));
        return sel + (US.excluir === u.email
          ? `<div onclick="event.stopPropagation()" style="margin-top:6px;white-space:normal;">Excluir o login de ${usE(usUsuario(u.email))}? Ele não entra mais no painel. <button type="button" class="preset-btn" style="color:var(--farol-fora);font-weight:700;" onclick="usExcluir(${emJs})">Sim, excluir</button> <button type="button" class="preset-btn" onclick="US.excluir=null;usDesenhar()">Não</button></div>`
          : ` <button type="button" class="preset-btn" style="margin-left:6px;color:var(--farol-fora);" onclick="event.stopPropagation();usExcluirPedir(${emJs})">Excluir</button>`); })()}</td></tr>
      ${US.aberto === u.email ? `<tr><td colspan="5">${usForm(u)}</td></tr>` : ''}`).join('') || '<tr><td colspan="5">Ninguém com essa busca.</td></tr>'}
    </tbody></table></div>`;
  alvo.innerHTML = h;
}
function usForm(u) {
  const novo = !u, { G, vistos } = usGrupos(), R = usRotulos();
  const marc = new Set(u && !u.todas_as_telas ? (u.modulos || []) : []);
  const outras = u && u.modulos ? u.modulos.filter((k) => !vistos.has(k)) : [];
  const todas = u ? !!u.todas_as_telas : false;
  const emJs = u ? usE(JSON.stringify(u.email)) : 'null';
  return `<div class="us-form" onclick="event.stopPropagation()">
    ${novo ? '<div style="font-weight:700;margin-bottom:6px;">Novo usuário</div>' : ''}
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
      ${novo ? '<input id="us_email" placeholder="usuário (ex.: mariaaurelia)" autocomplete="off" oninput="usUsuarioDigitado(this)" style="flex:1 1 240px;">' : `<b style="flex:1 1 240px;">${usE(usUsuario(u.email))}</b>`}
      <input id="us_nome" placeholder="nome" value="${usE(u ? u.nome || '' : '')}" style="flex:1 1 180px;">
      <select id="us_papel" onchange="document.getElementById('us_loja').style.display = this.value === 'FILIAL' ? '' : 'none'">${US_PAPEIS.map(([v, t]) => `<option value="${v}" ${(u ? u.papel || '' : '') === v ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <select id="us_loja" style="${u && u.papel === 'FILIAL' ? '' : 'display:none;'}"><option value="">loja…</option>${US_LOJAS.map(([v, t]) => `<option value="${v}" ${u && u.unidade === v ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <label style="font-size:12.5px;"><input type="checkbox" id="us_valores" ${u && u.ve_valores ? 'checked' : ''}> vê valores (R$)</label></div>
    <div style="margin:10px 0 2px;font-weight:700;">Telas que abre</div>
    <label style="font-size:13px;"><input type="checkbox" id="us_todas" ${todas ? 'checked' : ''} onchange="document.getElementById('us_lista').style.display = this.checked ? 'none' : ''"> todas as telas (como o dono)</label>
    <div id="us_lista" style="${todas ? 'display:none;' : ''}">
      ${G.map((g) => `<div class="section-label" style="text-align:left;margin-top:6px;">${usE(g.nome)}</div><div class="us-telas">${g.telas.map(([k, t]) => `<label><input type="checkbox" class="us-tela" value="${usE(k)}" ${marc.has(k) ? 'checked' : ''}> ${usE(t)}</label>`).join('')}</div>`).join('')}
      ${outras.length ? `<div class="section-label" style="text-align:left;margin-top:6px;">Já liberadas fora do menu</div><div class="us-telas">${outras.map((k) => `<label><input type="checkbox" class="us-tela" value="${usE(k)}" checked> ${usE(R[k] || k)}</label>`).join('')}</div>` : ''}
      <div style="font-size:12px;color:var(--tx-4);">A Minha agenda e a Biblioteca abrem para todo login.</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center;">
      <button type="button" class="preset-btn active" onclick="usSalvar(${emJs})">${novo ? 'Criar' : 'Salvar'}</button>
      ${novo || !u.tem_login ? '<input id="us_senha" type="password" autocomplete="new-password" placeholder="senha inicial (8+ caracteres)" style="flex:0 1 220px;">' : ''}
      ${novo ? '<button type="button" class="preset-btn" onclick="US.novo=false;usDesenhar()">Cancelar</button>' : '<button type="button" class="preset-btn" onclick="usAbrir(null)">Fechar</button>'}</div>
    ${!novo && u.tem_login ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center;border-top:1px solid var(--line);padding-top:10px;">
      <input id="us_senha_nova" type="password" autocomplete="new-password" placeholder="nova senha (8+ caracteres)" style="flex:0 1 220px;">
      <button type="button" class="preset-btn" onclick="usTrocarSenha(${emJs})">Trocar senha</button>
      <span style="flex:1;"></span>
      <button type="button" class="preset-btn" style="color:${u.bloqueado ? 'var(--farol-ok)' : 'var(--farol-fora)'};" onclick="usBloquear(${emJs}, ${!u.bloqueado})">${u.bloqueado ? 'Desbloquear o login' : 'Bloquear o login'}</button></div>` : ''}
  </div>`;
}
async function usSalvar(emailExistente) {
  const v = (id) => (document.getElementById(id) || {}).value || '';
  // 18/11/2026 16:30 (dono: "tem a necessidade do email? não pode ser só o nome direto?"): digita-se o usuário; a tela completa
  // com @cidadaodomundo.com.br por baixo (o login exige e-mail), a mesma conversão da tela de entrar (emailDoLogin)
  const email = (emailExistente || usEmailDe(v('us_email'))).trim().toLowerCase();
  const papel = v('us_papel') || null, loja = v('us_loja') || null;
  const todas = !!(document.getElementById('us_todas') || {}).checked;
  const telas = [...document.querySelectorAll('.us-tela:checked')].map((c) => c.value);
  const senha = v('us_senha');
  if (!/^[a-z0-9._-]+@[^@\s]+\.[^@\s]+$/.test(email)) return avisoAcao('atencao', '! Escreva o usuário: só letras e números, sem espaço.');
  if (papel === 'FILIAL' && !loja) return avisoAcao('atencao', '! Filial precisa da loja.');
  if (!todas && !telas.length) return avisoAcao('atencao', '! Marque pelo menos uma tela (ou "todas as telas").');
  const temLogin = !!(US.L || []).find((u) => u.email === email && u.tem_login);
  if (!temLogin && !emailExistente && !senha) return avisoAcao('atencao', '! Digite a senha inicial (a pessoa entra com ela).');
  if (!temLogin && senha && senha.length < 8) return avisoAcao('atencao', '! A senha precisa de pelo menos 8 caracteres.');
  avisoAcao('enviando', 'Salvando…');
  const r = await trRpcSeguro('painel_usuario_salvar', { p_email: email, p_nome: v('us_nome') || null, p_papel: papel, p_unidade: loja,
    p_ve_valores: !!(document.getElementById('us_valores') || {}).checked, p_todas: todas, p_modulos: todas ? null : telas, p_observacao: null });
  if (!r.ok) return avisoAcao('erro', `✗ NÃO salvou: ${await usErro(r)}`, () => usSalvar(emailExistente));
  let msg = `✓ ${usUsuario(email)} salvo às ${avisoHora()}`;
  if (!temLogin && senha) {
    const r2 = await trRpcSeguro('painel_usuario_criar_login', { p_email: email, p_senha: senha });
    if (!r2.ok) { const err = await usErro(r2); await entrarUsuarios(); return avisoAcao('erro', `✗ As telas foram salvas, mas o login NÃO foi criado: ${err}`); }
    msg += ` — login criado: a pessoa entra com o usuário "${usUsuario(email)}" e a senha que você digitou`;
  }
  US.novo = false; US.aberto = null; await entrarUsuarios();
  avisoAcao('ok', msg + '.');
}
async function usTrocarSenha(email) {
  const el = document.getElementById('us_senha_nova'), s = (el || {}).value || '';
  if (s.length < 8) return avisoAcao('atencao', '! A nova senha precisa de pelo menos 8 caracteres.');
  avisoAcao('enviando', 'Trocando a senha…');
  const r = await trRpcSeguro('painel_usuario_trocar_senha', { p_email: email, p_senha: s });
  if (!r.ok) return avisoAcao('erro', `✗ A senha NÃO foi trocada: ${await usErro(r)}`, () => usTrocarSenha(email));
  if (el) el.value = '';
  avisoAcao('ok', `✓ Senha de ${usUsuario(email)} trocada às ${avisoHora()}. Quem estava logado sai e entra com a nova.`);
}
async function usBloquear(email, bloquear) {
  avisoAcao('enviando', bloquear ? 'Bloqueando…' : 'Desbloqueando…');
  const r = await trRpcSeguro('painel_usuario_bloquear', { p_email: email, p_bloquear: bloquear });
  if (!r.ok) return avisoAcao('erro', `✗ NÃO ${bloquear ? 'bloqueou' : 'desbloqueou'} ${usUsuario(email)}: ${await usErro(r)}`, () => usBloquear(email, bloquear));
  await entrarUsuarios();
  avisoAcao('ok', `✓ ${usUsuario(email)} ${bloquear ? 'bloqueado: não entra mais no painel' : 'desbloqueado'} (${avisoHora()}).`);
}
