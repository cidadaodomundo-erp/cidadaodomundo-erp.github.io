<head>

<meta name="theme-color" content="#111110">
<link rel="icon" type="image/png" href="../icon-192.png">
<!-- AVALIAÇÕES DO DIA (16/11/2026, pedido do Fábio). Só leitura, pela RPC erp_avaliacoes_dia
     (supabase/avaliacoes-do-dia.sql). A mesma página abre em dois lugares do menu:
       ?modo=delivery -> iFood (ifood_avaliacoes_api) e Site (Accon: não há avaliações no sistema)
       ?modo=salao    -> Google (API oficial do Perfil da Empresa: google_avaliacao_recente / google_avaliacao_loja)
     22/11/2026: botão "Robô de respostas" (pedido do Fábio). Mostra o que o robô respondeu ou vai responder,
     pela RPC erp_robo_respostas (supabase/robo-respostas.sql). Daqui ninguém publica: só mostra.
     28/11/2026: Google passa a responder sozinho (supabase/google-robo-automatico.sql); esta tela continua só mostrando.
     Google: o robô fica no banco pessoal (chaves do Google não vêm para o ERP). iFood: só rascunhos até o OK do Fábio. -->
<script>
  const NA_CASCA = window.parent !== window;
  if (NA_CASCA) document.documentElement.classList.add('na-casca');
  function avisarCasca(msg) { if (NA_CASCA) { try { parent.postMessage(msg, location.origin); } catch (e) {} } }
</script>
<link rel="stylesheet" href="../nucleo/nucleo.css?v=20261102a">
<style>
  .na-casca body::before { display:none !important; }
  .av-topo h1 { font-size:20px; margin:8px 0 10px; }
  .av-filtros { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; margin:0 0 12px; }
  .av-filtros label { font-size:12.5px; opacity:.85; display:flex; flex-direction:column; gap:3px; }
  .av-filtros select, .av-filtros input { font:inherit; padding:6px 8px; border-radius:6px; border:1px solid var(--line-2); background:var(--surface); color:inherit; }
  .av-filtros button { font:inherit; padding:7px 12px; border-radius:8px; border:1px solid var(--line-2); background:var(--surface-2); color:inherit; cursor:pointer; font-weight:700; }
  .av-filtros button:hover, .av-filtros button.on { border-color:var(--brand); }
  .av-fonte { font-size:12px; margin:0 0 4px; display:flex; flex-direction:column; gap:3px; }
  .av-fonte-linha { display:flex; flex-wrap:wrap; gap:4px 8px; align-items:center; }
  .av-fonte-sem { opacity:.7; font-style:italic; }
  .av-velho { color:var(--farol-fora, #ff6b6b); font-weight:700; }
  .av-cards { display:flex; flex-wrap:wrap; gap:10px; margin:12px 0 16px; }
  .av-card { border:1px solid var(--line-2); border-radius:10px; padding:10px 14px; background:var(--surface); min-width:180px; flex:1 1 180px; }
  .av-card h3 { margin:0 0 6px; font-size:15px; }
  .av-card .n { font-size:24px; font-weight:800; }
  .av-card .l { font-size:12px; opacity:.8; }
  .av-card .linha { display:flex; justify-content:space-between; gap:8px; font-size:13px; margin-top:3px; }
  .av-ruim { color:var(--farol-fora, #ff6b6b); font-weight:700; }
  .av-ok { color:var(--farol-ok, #3fb950); }
  .av-sec h2 { font-size:16px; margin:16px 0 4px; }
  .av-sub { font-size:12px; opacity:.75; margin:0 0 8px; line-height:1.45; }
  .av-lista { display:flex; flex-direction:column; gap:8px; }
  .av-item { border:1px solid var(--line); border-radius:10px; padding:9px 12px; background:var(--surface); }
  .av-item.ruim { border-color:var(--farol-fora, #ff6b6b); }
  .av-cab { display:flex; flex-wrap:wrap; gap:4px 10px; font-size:12.5px; opacity:.9; align-items:center; }
  .av-estrelas { font-weight:800; font-size:14px; }
  .av-txt { margin:5px 0 0; font-size:14px; line-height:1.45; white-space:pre-wrap; }
  .av-tags { font-size:12px; opacity:.75; margin-top:4px; }
  .av-resp { font-size:12px; margin-top:5px; opacity:.85; }
  .av-selo { font-size:11px; font-weight:700; padding:1px 7px; border-radius:20px; border:1px solid var(--line-2); }
  .av-selo.sem { color:var(--farol-perto, #e0a33a); border-color:var(--farol-perto, #e0a33a); }
  .av-vazio { padding:14px; opacity:.75; }
  .av-nota { font-size:12px; opacity:.75; margin:14px 0 0; line-height:1.45; }
  .av-robo-btn { font:inherit; padding:7px 12px; border-radius:8px; border:1px solid var(--brand); background:var(--surface-2); color:inherit; cursor:pointer; font-weight:700; }
  .av-robo { border:1px solid var(--brand); border-radius:10px; padding:10px 14px; margin:0 0 14px; background:var(--surface); }
  .av-robo h2 { font-size:16px; margin:0 0 6px; }
  .av-robo .av-cards { margin:8px 0 10px; }
  .av-selo.rasc { color:var(--farol-perto, #e0a33a); border-color:var(--farol-perto, #e0a33a); }
  .av-selo.pub { color:var(--farol-ok, #3fb950); border-color:var(--farol-ok, #3fb950); }
  .av-selo.fal { color:var(--farol-fora, #ff6b6b); border-color:var(--farol-fora, #ff6b6b); }
  .av-mais { font:inherit; margin-top:8px; padding:6px 12px; border-radius:8px; border:1px solid var(--line-2); background:var(--surface-2); color:inherit; cursor:pointer; }
</style>
</head>
<body>
<div class="main-content">
  <div class="wrap">
    <div class="av-topo"><h1 id="titulo">Avaliações do dia</h1></div>
    <div class="av-filtros">
      <label>Unidade
        <select id="fUnidade">
          <option value="">Todas</option>
          <option value="AGUA VERDE">Água Verde</option>
          <option value="SÃO BRAZ">São Braz</option>
          <option value="AHU">Ahú</option>
        </select>
      </label>
      <label>Dia
        <input type="date" id="fDia">
      </label>
      <button type="button" id="btnHoje">Hoje</button>
      <button type="button" id="btnOntem">Ontem</button>
      <button type="button" id="btnAtualizar">Atualizar</button>
      <button type="button" id="btnRobo" class="av-robo-btn">🤖 Robô de respostas</button>
    </div>
    <div class="av-robo" id="robo" style="display:none;"></div>
    <div class="av-fonte" id="fonte"></div>
    <div id="erroMsg" style="display:none;"></div>
    <div id="conteudo"><div class="av-vazio">Carregando…</div></div>
  </div>
</div>

<script src="../nucleo/nucleo.js?v=20261122d"></script>
<script src="../nucleo/loja.js?v=20261028a"></script>
<script src="../nucleo/telas-extra.js?v=20261106a"></script>
<script>
const MODO = new URLSearchParams(location.search).get('modo') === 'salao' ? 'salao' : 'delivery';
const TELA = MODO === 'salao' ? 'avalsalao' : 'avaldel';
document.getElementById('titulo').textContent = MODO === 'salao'
  ? 'Avaliações do dia · Salão (Google)' : 'Avaliações do dia · Delivery (iFood e Site)';
const NOME_UN = { 'AGUA VERDE': 'Água Verde', 'AHU': 'Ahú', 'SÃO BRAZ': 'São Braz' };
const un = (u) => NOME_UN[u] || u || '—';
const esc = trEscH;
const TZ = { timeZone: 'America/Sao_Paulo' };

function hojeBR() { return new Date().toLocaleDateString('en-CA', TZ); }   // AAAA-MM-DD
function menosDias(iso, n) { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() - n); return d.toISOString().slice(0, 10); }
function ddmm(iso) { return iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : '—'; }
function quando(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  const dia = d.toLocaleDateString('pt-BR', Object.assign({ day: '2-digit', month: '2-digit' }, TZ));
  const hora = d.toLocaleTimeString('pt-BR', Object.assign({ hour: '2-digit', minute: '2-digit' }, TZ));
  return dia + ' ' + hora;
}
const estrelas = (n) => { const k = Math.max(0, Math.min(5, Math.round(Number(n) || 0))); return '★'.repeat(k) + '☆'.repeat(5 - k); };
const num = (v) => v == null ? '—' : Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 2 });

function exigirLogin(recado) {
  localStorage.removeItem('rmbSessao');
  if (NA_CASCA) { avisarCasca({ tipo: 'casca-login', recado: recado || '' }); return; }
  location.href = '../sistema.html';
}

// ------------------------------------------------ loja única (casca)
const LOJAS_SUPORTADAS = ['AGUA VERDE', 'SÃO BRAZ', 'AHU'];
let SINCRONIZANDO = false, LOJA_FORA = false;
function aplicarLojaDaCasca(loja) {
  const sel = document.getElementById('fUnidade');
  SINCRONIZANDO = true;
  if (!loja || loja === 'REDE') { sel.value = ''; LOJA_FORA = false; }
  else if (LOJAS_SUPORTADAS.includes(loja)) { sel.value = loja; LOJA_FORA = false; }
  else { sel.value = ''; LOJA_FORA = true; }
  SINCRONIZANDO = false;
}
async function sincronizarLoja() { try { await lojaCarregar(); } catch (e) {} aplicarLojaDaCasca(lojaAtual()); }
if (typeof aoMudarLoja === 'function') aoMudarLoja((loja) => { aplicarLojaDaCasca(loja); carregar(); });

let ULTIMA = 0;
function mostrarErro(txt) {
  const el = document.getElementById('erroMsg');
  el.style.display = 'block'; el.textContent = txt;
  document.getElementById('conteudo').innerHTML = '';
  document.getElementById('fonte').innerHTML = '';
}
async function carregar() {
  const minha = ++ULTIMA;
  document.getElementById('erroMsg').style.display = 'none';
  if (LOJA_FORA) {
    document.getElementById('fonte').innerHTML = '';
    document.getElementById('conteudo').innerHTML = '<div class="av-vazio">Esta unidade não está nesta tela (só Água Verde, São Braz e Ahú).</div>';
    return;
  }
  const fDia = document.getElementById('fDia');
  if (!fDia.value) fDia.value = hojeBR();
  marcarBotoes();
  document.getElementById('conteudo').innerHTML = '<div class="av-vazio">Carregando…</div>';
  let r;
  try {
    r = await trRpcSeguro('erp_avaliacoes_dia', { p_modo: MODO, p_dia: fDia.value, p_unidade: document.getElementById('fUnidade').value || null });
  } catch (e) { if (minha === ULTIMA) mostrarErro('Não foi possível completar a consulta agora. Tente novamente.'); return; }
  if (minha !== ULTIMA) return;
  if (r.status === 401) { exigirLogin('Entre de novo para ver as avaliações.'); return; }
  if (r.status === 403) { mostrarErro('Você ainda não tem acesso a esta consulta. Peça acesso ao administrador.'); return; }
  if (!r.ok) { mostrarErro(r.status === 0 ? 'Sem conexão com o servidor.' : (r.status === 404 ? 'Esta consulta ainda não está disponível no servidor.' : 'Não foi possível completar a consulta agora. Tente novamente.')); return; }
  let d;
  try { d = await r.json(); } catch (e) { mostrarErro('Resposta inesperada do servidor.'); return; }
  if (minha !== ULTIMA) return;
  desenhar(d || {});
}
function marcarBotoes() {
  const v = document.getElementById('fDia').value, h = hojeBR();
  document.getElementById('btnHoje').classList.toggle('on', v === h);
  document.getElementById('btnOntem').classList.toggle('on', v === menosDias(h, 1));
}

// --------------------------------------------------------- desenho
function desenharFontes(lista) {
  const c = document.getElementById('fonte');
  c.innerHTML = '';
  (lista || []).forEach((f) => {
    const linha = document.createElement('div');
    linha.className = 'av-fonte-linha';
    if (f.sem_fonte) {
      linha.innerHTML = '<b>' + esc(f.rotulo) + ':</b> <span class="av-fonte-sem">' + esc(f.obs || 'sem dados') + '</span>';
    } else {
      // dado velho se declara: leitura com mais de 3 horas fica em vermelho
      const horas = f.lido_em ? (Date.now() - new Date(f.lido_em).getTime()) / 3600000 : null;
      const velho = horas == null || horas > 3;
      linha.innerHTML = '<b>' + esc(f.rotulo) + ':</b> ' +
        '<span class="' + (velho ? 'av-velho' : '') + '">última leitura ' + esc(quando(f.lido_em)) +
        (velho && f.lido_em ? ' (parada há ' + (horas >= 48 ? Math.floor(horas / 24) + ' dias' : Math.floor(horas) + 'h') + ')' : '') + '</span>' +
        ' · avaliação mais nova recebida: ' + esc(quando(f.ultima_avaliacao)) +
        (f.obs ? ' · <span class="av-fonte-sem">' + esc(f.obs) + '</span>' : '');
    }
    c.appendChild(linha);
  });
}

function cartao(l, dia) {
  const ruins = Number(l.ruins) || 0, sem = Number(l.sem_resposta) || 0;
  return '<div class="av-card"><h3>' + esc(un(l.unidade)) + '</h3>' +
    '<div class="n">' + esc(num(l.novas)) + '</div><div class="l">avaliações em ' + esc(ddmm(dia)) + '</div>' +
    '<div class="linha"><span>Média do dia</span><b>' + esc(l.media == null ? '—' : num(l.media)) + '</b></div>' +
    '<div class="linha"><span>Notas 1 e 2</span><b class="' + (ruins ? 'av-ruim' : '') + '">' + ruins + '</b></div>' +
    (MODO === 'delivery' ? '<div class="linha"><span>Com comentário</span><b>' + esc(num(l.com_texto)) + '</b></div>' : '') +
    '<div class="linha"><span>Sem resposta' + (MODO === 'delivery' ? ' (7 dias)' : ' (30 dias)') + '</span><b class="' + (sem ? 'av-ruim' : 'av-ok') + '">' + sem + '</b></div>' +
    (MODO === 'salao' ? '<div class="linha"><span>Nota no Google</span><b>' + esc(l.nota_google == null ? '—' : num(l.nota_google)) +
      (l.total_google != null ? ' <span class="l">(' + esc(num(l.total_google)) + ')</span>' : '') + '</b></div>' : '') +
    '</div>';
}

function item(a, mostrarResposta) {
  const ruim = Number(a.nota) <= 2;
  const quem = MODO === 'salao' ? (a.iniciais ? 'Cliente ' + a.iniciais : '') : (a.marca || '') + (a.pedido ? ' · pedido ' + a.pedido : '');
  let selo = '';
  if (mostrarResposta) {
    if (a.respondida) selo = '<span class="av-selo">respondida</span>';
    else if (MODO === 'salao' || a.pede_resposta) selo = '<span class="av-selo sem">sem resposta</span>';
  }
  const tags = Array.isArray(a.tags) && a.tags.length ? '<div class="av-tags">' + a.tags.map(esc).join(' · ') + '</div>' : '';
  const resp = mostrarResposta && a.resposta_loja ? '<div class="av-resp"><b>Resposta da loja:</b> ' + esc(a.resposta_loja) + '</div>' : '';
  return '<div class="av-item' + (ruim ? ' ruim' : '') + '">' +
    '<div class="av-cab"><span class="av-estrelas' + (ruim ? ' av-ruim' : '') + '">' + estrelas(a.nota) + '</span>' +
    '<b>' + esc(un(a.unidade)) + '</b><span>' + esc(quem) + '</span><span>' + esc(quando(a.avaliado_em)) + '</span>' + selo + '</div>' +
    (a.comentario ? '<p class="av-txt">' + esc(a.comentario) + '</p>' : '<p class="av-txt av-fonte-sem">(sem comentário)</p>') +
    tags + resp + '</div>';
}

function lista(id, arr, mostrarResposta, vazio) {
  if (!arr.length) return '<div class="av-vazio">' + esc(vazio) + '</div>';
  const LIM = 40;
  const html = arr.slice(0, LIM).map((a) => item(a, mostrarResposta)).join('');
  const resto = arr.length > LIM
    ? '<button type="button" class="av-mais" data-lista="' + id + '">Mostrar mais ' + (arr.length - LIM) + '</button>' : '';
  return '<div class="av-lista" id="' + id + '">' + html + '</div>' + resto;
}

let DADOS = null;
function desenhar(d) {
  DADOS = d;
  desenharFontes(d.fontes);
  const dia = d.dia;
  const lojas = Array.isArray(d.lojas) ? d.lojas : [];
  const avs = Array.isArray(d.avaliacoes) ? d.avaliacoes : [];
  const pend = Array.isArray(d.pendentes) ? d.pendentes : [];
  // notas ruins primeiro no dia, depois as mais novas
  const ordem = avs.slice().sort((a, b) => (Number(a.nota) <= 2 ? 0 : 1) - (Number(b.nota) <= 2 ? 0 : 1) || String(b.avaliado_em).localeCompare(String(a.avaliado_em)));
  const vazioDia = d.dia === d.hoje
    ? 'Nenhuma avaliação recebida hoje até agora.' + (MODO === 'delivery' ? ' O iFood só libera a avaliação cerca de 24 horas depois; veja também "Ontem".' : '')
    : 'Nenhuma avaliação neste dia.';
  document.getElementById('conteudo').innerHTML =
    '<div class="av-cards">' + (lojas.length ? lojas.map((l) => cartao(l, dia)).join('') : '<div class="av-vazio">Nenhuma loja liberada para este login.</div>') + '</div>' +
    '<div class="av-sec"><h2>Avaliações de ' + esc(ddmm(dia)) + ' (' + avs.length + ')</h2>' +
      '<p class="av-sub">Notas 1 e 2 aparecem primeiro, com borda vermelha.</p>' +
      lista('lDia', ordem, true, vazioDia) + '</div>' +
    '<div class="av-sec"><h2>Ainda sem resposta (' + pend.length + ')</h2>' +
      '<p class="av-sub">' + (MODO === 'delivery'
        ? 'iFood: avaliações com comentário dos últimos 7 dias que a loja ainda não respondeu.'
        : 'Google: avaliações dos últimos 30 dias que ainda não têm resposta da loja.') +
      ' Esta tela só mostra; ninguém responde por aqui ainda.</p>' +
      lista('lPend', pend, false, 'Nada pendente de resposta.') + '</div>' +
    '<p class="av-nota">Consultado em ' + esc(quando(d.consultado_em)) + '.</p>';
  document.querySelectorAll('.av-mais').forEach((b) => b.addEventListener('click', () => {
    const id = b.dataset.lista;
    const arr = id === 'lDia' ? ordem : pend;
    document.getElementById(id).innerHTML = arr.map((a) => item(a, id === 'lDia')).join('');
    b.remove();
  }));
}

// ------------------------------------------------ robô de respostas (22/11/2026)
const ROBO_CANAL = MODO === 'salao' ? 'google' : 'ifood';
const ROBO_STATUS = { rascunho: ['rasc', 'rascunho, esperando OK'], publicada: ['pub', 'publicada'], falhou: ['fal', 'falhou'], descartada: ['', 'descartada'] };
function roboExplica() {
  return MODO === 'salao'
    ? 'O robô responde sozinho as avaliações do Google em nome da loja, pela API oficial do Perfil da Empresa. A cada 5 minutos ele escreve a resposta por modelo fixo e publica.'
    : 'O robô prepara as respostas das avaliações do iFood. Por enquanto são só rascunhos: nada é publicado até o OK do Fábio e a conferência com o robô de contestações.';
}
async function carregarRobo() {
  const c = document.getElementById('robo');
  c.innerHTML = '<h2>🤖 Robô de respostas · ' + (MODO === 'salao' ? 'Google' : 'iFood') + '</h2><p class="av-sub">' + esc(roboExplica()) + '</p><div class="av-vazio">Carregando…</div>';
  let r;
  try { r = await trRpcSeguro('erp_robo_respostas', { p_canal: ROBO_CANAL, p_unidade: document.getElementById('fUnidade').value || null }); }
  catch (e) { c.querySelector('.av-vazio').textContent = 'Não foi possível completar a consulta agora.'; return; }
  if (r.status === 401) { exigirLogin('Entre de novo para ver o robô.'); return; }
  if (!r.ok) { c.querySelector('.av-vazio').textContent = r.status === 404 ? 'O robô ainda não está ligado nesta tela.' : (r.status === 403 ? 'Você ainda não tem acesso a esta consulta.' : 'Não foi possível completar a consulta agora.'); return; }
  let d; try { d = await r.json(); } catch (e) { c.querySelector('.av-vazio').textContent = 'Resposta inesperada do servidor.'; return; }
  const rs = (d && d.resumo) || {};
  const itens = Array.isArray(d && d.itens) ? d.itens : [];
  const card = (t, n, cls) => '<div class="av-card"><div class="n ' + (cls || '') + '">' + esc(num(n || 0)) + '</div><div class="l">' + esc(t) + '</div></div>';
  const linhas = itens.map((a) => {
    const st = ROBO_STATUS[a.status] || ['', a.status];
    const ruim = Number(a.nota) <= 2;
    return '<div class="av-item' + (ruim ? ' ruim' : '') + '"><div class="av-cab"><span class="av-estrelas' + (ruim ? ' av-ruim' : '') + '">' + estrelas(a.nota) + '</span>' +
      '<b>' + esc(un(a.unidade)) + '</b><span>' + esc(a.quem || '') + '</span><span>' + esc(quando(a.avaliado_em)) + '</span>' +
      '<span class="av-selo ' + st[0] + '">' + esc(st[1]) + (a.publicado_em ? ' ' + esc(quando(a.publicado_em)) : '') + '</span></div>' +
      (a.comentario ? '<p class="av-txt">' + esc(a.comentario) + '</p>' : '<p class="av-txt av-fonte-sem">(sem comentário)</p>') +
      '<div class="av-resp"><b>' + (a.status === 'publicada' ? 'Resposta publicada:' : 'Resposta preparada:') + '</b> ' + esc(a.resposta) + '</div>' +
      (a.erro ? '<div class="av-resp av-ruim">' + esc(a.erro) + '</div>' : '') + '</div>';
  });
  c.innerHTML = '<h2>🤖 Robô de respostas · ' + (MODO === 'salao' ? 'Google' : 'iFood') + '</h2><p class="av-sub">' + esc(roboExplica()) + '</p>' +
    '<div class="av-cards">' + card('publicadas', rs.publicada, 'av-ok') + card('rascunhos esperando OK', rs.rascunho) + card('falharam', rs.falhou, rs.falhou ? 'av-ruim' : '') + '</div>' +
    '<p class="av-sub">Última publicação: ' + esc(quando(d.ultima_publicacao)) + ' · consultado em ' + esc(quando(d.consultado_em)) + '. Esta tela só mostra; ninguém publica por aqui.</p>' +
    (linhas.length ? '<div class="av-lista">' + linhas.join('') + '</div>' : '<div class="av-vazio">Nenhuma resposta registrada ainda.</div>');
}
document.getElementById('btnRobo').addEventListener('click', () => {
  const c = document.getElementById('robo');
  const abrir = c.style.display === 'none';
  c.style.display = abrir ? 'block' : 'none';
  document.getElementById('btnRobo').classList.toggle('on', abrir);
  if (abrir) carregarRobo();
});

document.getElementById('btnAtualizar').addEventListener('click', carregar);
document.getElementById('btnHoje').addEventListener('click', () => { document.getElementById('fDia').value = hojeBR(); carregar(); });
document.getElementById('btnOntem').addEventListener('click', () => { document.getElementById('fDia').value = menosDias(hojeBR(), 1); carregar(); });
document.getElementById('fDia').addEventListener('change', carregar);
document.getElementById('fUnidade').addEventListener('change', () => {
  if (!SINCRONIZANDO && NA_CASCA && !(typeof lojaTravada === 'function' && lojaTravada())) {
    avisarCasca({ tipo: 'casca-loja-pedir', loja: document.getElementById('fUnidade').value || 'REDE' });
  }
  carregar();
});
(function limitesDia() {
  const f = document.getElementById('fDia');
  f.max = hojeBR(); f.min = menosDias(hojeBR(), 60);
})();

if (!rmbSessao()) exigirLogin('Entre para ver as avaliações.');
else {
  registrarUso(TELA);
  avisarCasca({ tipo: 'casca-modulo', nome: TELA });
  (async () => { await sincronizarLoja(); carregar(); })();
}
window.reentrarTela = carregar;
</script>
</body>
</html>
