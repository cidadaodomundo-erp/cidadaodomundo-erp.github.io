<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>TVs · Cidadão do Mundo</title>
<meta name="theme-color" content="#111110">
<link rel="icon" type="image/png" href="../icon-192.png">
<script>
  const NA_CASCA = window.parent !== window;
  if (NA_CASCA) document.documentElement.classList.add('na-casca');
  function avisarCasca(msg) { if (NA_CASCA) { try { parent.postMessage(msg, location.origin); } catch (e) {} } }
</script>
<link rel="stylesheet" href="../nucleo/nucleo.css?v=20261102a">
<style>
  .tvs-grade { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:16px; margin-top:16px; }
  .tvs-card { display:block; color:inherit; text-decoration:none; cursor:pointer; transition:border-color .15s;  background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .tvs-prev { position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; background:#000; }
  .tvs-prev iframe { position:absolute; top:0; left:0; width:1280px; height:720px; border:0; transform-origin:0 0; pointer-events:none; }
  .tvs-info { padding:12px 14px; }
  .tvs-info b { font-size:17px; }
  .tvs-loja, .tvs-telas { color:var(--tx-3); font-size:14px; margin-top:4px; }
  .tvs-end { margin-top:8px; font-size:14px; color:var(--amber-2); word-break:break-all; }
  .tvs-sub { color:var(--tx-3); margin:4px 0 0; }
  .tvs-card:hover, .tvs-card:focus-visible { border-color:var(--amber-2); }
  .tvs-card .vivo { display:inline-block; margin-top:8px; font-size:13px; font-weight:700; color:#3fb950; }
</style>
</head>
<body>
<div class="main-content">
  <div class="wrap">
    <h1>Central das TVs</h1>
    <p class="tvs-sub">O que cada caixinha está mostrando agora. Para mudar, é só pedir no chat. Cada TV abre o endereço amarelo no app Fully Kiosk.</p>
    <div class="tvs-grade" id="tvsGrade"></div>
  </div>
</div>
<script src="../nucleo/nucleo.js?v=20261122d"></script>
<script>
(function(){
  const BASE = new URL('../tv/', location.href).href;
  fetch(BASE + 'programacao.json?t=' + Date.now(), {cache:'no-store'}).then(r => r.json()).then(p => {
    const g = document.getElementById('tvsGrade');
    p.tvs.forEach(t => {
      const url = BASE + 'tela.html?tv=' + t.codigo;
      const c = document.createElement('a'); c.className = 'tvs-card'; c.href = url; c.target = '_blank'; c.rel = 'noopener'; c.title = 'Abrir esta TV ao vivo';
      c.innerHTML = '<div class="tvs-prev"><iframe loading="lazy" title=""></iframe></div><div class="tvs-info"><b></b><div class="tvs-loja"></div><div class="tvs-telas"></div><div class="tvs-end"></div><span class="vivo">● Clique para ver ao vivo</span></div>';
      c.querySelector('iframe').src = url;
      c.querySelector('b').textContent = t.nome;
      c.querySelector('.tvs-loja').textContent = 'Loja: ' + t.loja;
      c.querySelector('.tvs-telas').textContent = 'Telas: ' + t.telas.join(', ');
      c.querySelector('.tvs-end').textContent = url.replace(/^https?:\/\//, '');
      g.appendChild(c);
    });
    const ajustar = () => document.querySelectorAll('.tvs-prev').forEach(d => d.querySelector('iframe').style.transform = 'scale(' + d.clientWidth / 1280 + ')');
    ajustar(); addEventListener('resize', ajustar);
  });
})();
</script>
</body>
</html>
