<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
<title>Produtos pausados · Cidadão do Mundo</title>
<meta name="theme-color" content="#111110">
<link rel="icon" type="image/png" href="../icon-192.png">
<!-- PRODUTOS PAUSADOS (10/11/2026, tela do Fábio incorporada ao portal novo; revisada 10/11/2026). Só leitura da
     tabela cardapio_pausado (Goomer/Accon). Sem pausar, despausar ou editar motivo — nenhum botão de ação. Os
     leitores próprios do Goomer/Accon ainda não foram ativados nesta etapa: a tela não afirma estar lendo hoje,
     só mostra o que a rotina já gravou, com o carimbo de quando. Goomer só cobre Água Verde e São Braz; Ahú entra
     como "sem coleta prevista". Lê pela RPC erp_pausados_ler (sql/ativar-consultas-reservas-pausados.sql), ainda
     não aplicada: até o clique do Fábio, esta tela mostra "sem acesso". -->
<script>
  const NA_CASCA = window.parent !== window;
  if (NA_CASCA) document.documentElement.classList.add('na-casca');
  function avisarCasca(msg) { if (NA_CASCA) { try { parent.postMessage(msg, location.origin); } catch (e) {} } }
</script>
<link rel="stylesheet" href="../nucleo/nucleo.css?v=20261102a">
<style>
  .na-casca body::before { display:none !important; }
  .ps-topo { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:8px 0 14px; }
  .ps-topo h1 { font-size:20px; margin:0; }
  .ps-filtros { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:0 0 12px; }
  .ps-filtros label { font-size:12.5px; opacity:.85; display:flex; flex-direction:column; gap:3px; }
  .ps-filtros select { font:inherit; padding:6px 8px; border-radius:6px; border:1px solid var(--line-2); background:var(--surface); color:inherit; }
  .ps-filtros button { font:inherit; padding:7px 14px; border-radius:8px; border:1px solid var(--line-2); background:var(--surface-2); color:inherit; cursor:pointer; font-weight:700; }
  .ps-filtros button:hover { border-color:var(--brand); }
  .ps-fonte { font-size:12px; opacity:.9; margin:-2px 0 4px; display:flex; flex-direction:column; gap:2px; }
  .ps-fonte-linha { display:flex; flex-wrap:wrap; gap:4px 8px; align-items:center; }
  .ps-fonte-rot { opacity:.85; }
  .ps-fonte-sem { opacity:.7; font-style:italic; }
  .ps-fonte-falha { color:var(--farol-fora, #ff6b6b); font-weight:700; }
  .ps-consultado { font-size:11px; opacity:.6; margin:0 0 12px; }
  .ps-nota { font-size:12px; opacity:.75; margin:8px 0 0; line-height:1.45; }
  .ps-tab { width:100%; border-collapse:collapse; font-size:14px; }
  .ps-tab th, .ps-tab td { padding:7px 8px; border-bottom:1px solid var(--line); text-align:left; }
  .ps-vazio { padding:18px; opacity:.75; }
  .ps-trunc { font-size:12px; color:var(--farol-perto, #e0a33a); margin:6px 0 0; }
  .ps-est { font-weight:700; }
</style>
</head>
<body>
<div class="main-content">
  <div class="wrap">
    <div class="ps-topo">
      <h1>Produtos pausados</h1>
    </div>
    <div class="ps-filtros">
      <label>Unidade
        <select id="fUnidade">
          <option value="">Todas</option>
          <option value="AGUA VERDE">Água Verde</option>
          <option value="SÃO BRAZ">São Braz</option>
          <option value="AHU">Ahú</option>
        </select>
      </label>
      <label>Canal
        <select id="fCanal">
          <option value="">Todos</option>
          <option value="Tablet (Goomer)">Tablet (Goomer)</option>
          <option value="Accon">Accon</option>
        </select>
      </label>
      <button type="button" id="btnAtualizar">Atualizar</button>
    </div>
    <div class="ps-fonte" id="fonte"></div>
    <div class="ps-consultado" id="consultado"></div>
    <div id="erroMsg" style="display:none;"></div>
    <div id="conteudo"><div class="ps-vazio">Carregando…</div></div>
  </div>
</div>

<script src="../nucleo/nucleo.js?v=20261105g"></script>
<script src="../nucleo/loja.js?v=20261028a"></script>
<script src="../nucleo/telas-extra.js?v=20261106a"></script>
<script>
const TELA = 'pausados';
const NOME_UN = { 'AGUA VERDE': 'Água Verde', 'AHU': 'Ahú', 'SÃO BRAZ': 'São Braz' };
const un = (u) => NOME_UN[u] || u || '—';
const esc = trEscH;

function exigirLogin(recado) {
  localStorage.removeItem('rmbSessao');
  if (NA_CASCA) { avisarCasca({ tipo: 'casca-login', recado: recado || '' }); return; }
  location.href = '../sistema.html';
}

let ULTIMA_REQ = 0;

function limparFonte() {
  document.getElementById('fonte').innerHTML = '';
  document.getElementById('consultado').textContent = '';
}
function mostrarErro(txt) {
  const el = document.getElementById('erroMsg');
  el.style.display = 'block'; el.textContent = txt;
  document.getElementById('conteudo').innerHTML = '';
  limparFonte();
}
// nunca repassa texto cru do servidor/SQL para a tela — só uma mensagem genérica por status.
function mensagemErro(r) {
  if (!r || r.status === 0) return 'sem conexão com o servidor.';
  if (r.status === 404) return 'esta consulta ainda não está disponível (aguardando preparação no servidor).';
  return 'Não foi possível completar a consulta agora. Tente novamente.';
}

function horaCurta(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  const tz = { timeZone: 'America/Sao_Paulo' };
  const hora = d.toLocaleTimeString('pt-BR', Object.assign({ hour: '2-digit', minute: '2-digit' }, tz));
  const dia = d.toLocaleDateString('pt-BR', Object.assign({ day: '2-digit', month: '2-digit' }, tz));
  const hoje = new Date().toLocaleDateString('pt-BR', Object.assign({ day: '2-digit', month: '2-digit' }, tz));
  return dia === hoje ? hora : dia + ' ' + hora;
}
// data de atualização do item: sempre com hora em BRT (atualizado_em é timestamptz, não um date puro)
function dataHoraBR(ts) { return ts ? horaCurta(ts) : '—'; }

// --------------------------------------------------------- loja única (casca)
// Esta tela só cobre AGUA VERDE/SÃO BRAZ/AHU. Loja da rede fora dessa lista (ex.: Boqueirão)
// não cai silenciosamente em "Todas" — travaria em "sem coleta prevista", sem chamar a RPC.
const LOJAS_SUPORTADAS = ['AGUA VERDE', 'SÃO BRAZ', 'AHU'];
let SINCRONIZANDO_DA_CASCA = false;
let LOJA_FORA_DE_ALCANCE = false;
function aplicarLojaDaCasca(loja) {
  const sel = document.getElementById('fUnidade');
  SINCRONIZANDO_DA_CASCA = true;
  if (!loja || loja === 'REDE') { sel.value = ''; LOJA_FORA_DE_ALCANCE = false; }
  else if (LOJAS_SUPORTADAS.includes(loja)) { sel.value = loja; LOJA_FORA_DE_ALCANCE = false; }
  else { sel.value = ''; LOJA_FORA_DE_ALCANCE = true; }
  SINCRONIZANDO_DA_CASCA = false;
}
async function sincronizarLoja() {
  try { await lojaCarregar(); } catch (e) {}
  aplicarLojaDaCasca(lojaAtual());
}
if (typeof aoMudarLoja === 'function') aoMudarLoja((loja) => { aplicarLojaDaCasca(loja); carregar(); });

async function carregar() {
  // incrementa ANTES de validar o filtro: um filtro inválido também marca este pedido
  // como o mais recente, para uma resposta antiga não sobrescrever a tela depois.
  const minhaReq = ++ULTIMA_REQ;

  limparFonte();

  if (LOJA_FORA_DE_ALCANCE) {
    document.getElementById('erroMsg').style.display = 'none';
    document.getElementById('conteudo').innerHTML = '<div class="ps-vazio">Sem coleta prevista para esta unidade.</div>';
    return;
  }

  const unidade = document.getElementById('fUnidade').value || null;
  const canal = document.getElementById('fCanal').value || null;

  document.getElementById('conteudo').innerHTML = '<div class="ps-vazio">Carregando…</div>';
  document.getElementById('erroMsg').style.display = 'none';

  let r;
  try {
    r = await trRpcSeguro('erp_pausados_ler', { p_unidade: unidade, p_canal: canal });
  } catch (e) {
    if (minhaReq !== ULTIMA_REQ) return;
    mostrarErro('não foi possível completar a consulta agora.');
    return;
  }
  if (minhaReq !== ULTIMA_REQ) return;

  if (r.status === 401) { exigirLogin('Entre de novo para ver os produtos pausados.'); return; }
  if (r.status === 403) {
    // 403 nunca limpa a sessão nem aparece como lista vazia
    mostrarErro('Você ainda não tem acesso a esta consulta. Fale com o Fábio ou o Neto.');
    return;
  }
  if (!r.ok) { mostrarErro(mensagemErro(r)); return; }

  let dados;
  try { dados = await r.json(); }
  catch (e) { if (minhaReq !== ULTIMA_REQ) return; mostrarErro('resposta inesperada do servidor.'); return; }
  if (minhaReq !== ULTIMA_REQ) return;

  desenhar(dados || {});
}

// meta.fontes: lista por canal+unidade com ultimo_ok / ultima_tentativa / status / suportado.
// Combinação sem suporte (ex.: Goomer em Ahú) nunca entra em rotinas_execucao — vem marcada
// suportado:false pela RPC — e aparece como "sem coleta prevista", nunca como saudável.
function montarFontes(lista) {
  const cont = document.getElementById('fonte');
  cont.innerHTML = '';
  (lista || []).forEach((x) => {
    const linha = document.createElement('div');
    linha.className = 'ps-fonte-linha';
    const rot = document.createElement('span');
    rot.className = 'ps-fonte-rot';
    rot.textContent = x.rotulo + ':';
    linha.appendChild(rot);
    if (x.suportado === false) {
      const sem = document.createElement('span');
      sem.className = 'ps-fonte-sem';
      sem.textContent = 'Sem coleta prevista';
      linha.appendChild(sem);
    } else {
      const badge = document.createElement('span');
      linha.appendChild(badge);
      // só chama carimboDados quando HÁ ultimo_ok (ver reservas/index.html para o porquê):
      // sem OK, o texto é explicitamente "aguardando primeira leitura", não o "sem dado" genérico.
      if (x.ultimo_ok) carimboDados(badge, x.ultimo_ok, { avisoMin: 180, velhoMin: 1440 });
      else { badge.className = 'ps-fonte-sem'; badge.textContent = 'aguardando primeira leitura'; }
      // falha nunca parece saudável: confia no ultimo_status (a RPC já desempata por id), mesmo
      // que a última tentativa tenha o MESMO horário de um ultimo_ok antigo. Não exige
      // ultima_tentativa > ultimo_ok: isso escondia a falha em caso de empate de horário.
      if (x.ultimo_status && x.ultimo_status !== 'OK' && x.ultima_tentativa) {
        const falha = document.createElement('span');
        falha.className = 'ps-fonte-falha';
        falha.textContent = 'última tentativa falhou (' + x.ultimo_status + ') em ' + horaCurta(x.ultima_tentativa);
        linha.appendChild(falha);
      }
    }
    cont.appendChild(linha);
  });
}

function estadoHtml(e) {
  if (!e) return '—';
  const baixo = String(e).toLowerCase();
  const cor = baixo.includes('pausa') || baixo.includes('escond') ? 'var(--farol-fora)' : 'inherit';
  return '<span class="ps-est" style="color:' + cor + '">' + esc(e) + '</span>';
}

function desenhar(dados) {
  montarFontes(dados.fonte && dados.fonte.fontes);
  document.getElementById('consultado').textContent = dados.consultado_em ? 'Consultado em ' + horaCurta(dados.consultado_em) : '';

  const linhas = Array.isArray(dados.itens) ? dados.itens : [];
  const c = document.getElementById('conteudo');
  if (!linhas.length) {
    c.innerHTML = '<div class="ps-vazio">Nenhum item pausado/escondido encontrado para este filtro. Isto não significa que não existam itens pausados no fornecedor — pode ser que a leitura ainda não tenha chegado, ou que o canal não tenha coleta prevista nesta unidade.</div>';
  } else {
    c.innerHTML = '<div id="tabelaPausados"><table class="ps-tab"><thead><tr>' +
      '<th>Unidade</th><th>Canal</th><th>Item</th><th>Tipo</th><th>Estado</th><th>Marca</th><th>Atualizado (BRT)</th>' +
      '</tr></thead><tbody>' +
      linhas.map((x) => '<tr>' +
        '<td>' + esc(un(x.unidade)) + '</td>' +
        '<td>' + esc(x.canal || '—') + '</td>' +
        '<td>' + esc(x.item || '—') + '</td>' +
        '<td>' + esc(x.tipo || '—') + '</td>' +
        '<td data-valor="' + esc(x.estado || '') + '">' + estadoHtml(x.estado) + '</td>' +
        '<td>' + esc(x.marca || '—') + '</td>' +
        '<td>' + esc(dataHoraBR(x.atualizado_em)) + '</td>' +
        '</tr>').join('') +
      '</tbody></table></div>';
  }
  if (dados.truncado) {
    const p = document.createElement('p');
    p.className = 'ps-trunc';
    p.textContent = 'Mostrando os primeiros ' + linhas.length + ' de ' + (dados.total_linhas != null ? dados.total_linhas : '—') + ' itens. Estreite o filtro para ver o restante.';
    c.appendChild(p);
  }
  const nota = document.createElement('p');
  nota.className = 'ps-nota';
  nota.textContent = 'Fonte esperada: Goomer (tablet) e Accon, gravados no ERP pelos leitores próprios — ainda não ativados nesta etapa. Só consulta — pausar, despausar e editar motivo continuam nos próprios sistemas. Goomer cobre Água Verde e São Braz; Ahú aparece como "sem coleta prevista". Accon pode cobrir até três unidades.';
  c.appendChild(nota);
}

document.getElementById('btnAtualizar').addEventListener('click', carregar);
document.getElementById('fUnidade').addEventListener('change', () => {
  // "Todas" pede REDE à casca — nunca string vazia. Loja travada: a casca ignora; não insiste.
  if (!SINCRONIZANDO_DA_CASCA && NA_CASCA && !(typeof lojaTravada === 'function' && lojaTravada())) {
    const v = document.getElementById('fUnidade').value;
    avisarCasca({ tipo: 'casca-loja-pedir', loja: v || 'REDE' });
  }
  carregar();
});
document.getElementById('fCanal').addEventListener('change', carregar);

if (!rmbSessao()) exigirLogin('Entre para ver os produtos pausados.');
else {
  registrarUso(TELA);
  avisarCasca({ tipo: 'casca-modulo', nome: TELA });
  (async () => { await sincronizarLoja(); carregar(); })();
}
window.reentrarTela = carregar;
</script>
</body>
</html>
