<!--
  A CASCA DO PAINEL (14/10/2026)

  Pedido do dono: "Pode começar pela casca, no mesmo modelo do portal do Fabio, com o
  painel atual dentro dela." É o passo 0 da divisão do painel em módulos — o mapa e a
  ordem dos blocos estão em contexto/project_painel_em_modulos.md.

  Como funciona:
  - LOGIN: o mesmo do painel (Supabase, e-mail e senha) e a MESMA sessão ('rmbSessao' no
    localStorage). Quem entra aqui entra no painel, e vice-versa.
  - MENU: docs/casca/menu.js, GERADO do menu lateral do dashboard.html por
    script/gerar_menu_casca.py. Não se escreve menu aqui. Quem vê o quê continua sendo
    painel_acesso / rpc meus_modulos — e, como no painel, isso organiza a tela, não é cofre.
  - MOLDURA: toda tela abre dentro do painel antigo (dashboard.html?casca=1), que esconde
    o menu dele e avisa a casca de qual tela está aberta. Tela que já saiu para página
    própria está em docs/casca/paginas.js e abre na sua moldura, sem carregar o painel.
  - RENOVAÇÃO DE SESSÃO: a casca só renova o token na abertura, ANTES de existir a
    moldura. Depois quem renova é o painel. O refresh_token do Supabase é de uso único:
    dois renovando ao mesmo tempo derrubam o login (a lição de 21/08 no dashboard.html).
-->
<script>
  // CLARO OU ESCURO, CADA UM ESCOLHE (dono 07/11/2026 04:34). Vale o que o login gravou no banco (painel_meu_tema, lido
  // depois de entrar); até lá, a cópia deste navegador. Sem escolha = escuro (o de hoje). ?tema=proposta|claro e
  // ?tema=oficial|escuro ainda funcionam (links da simulação). As telas de dentro leem o sessionStorage (nucleo.js).
  function temaAplicar(t) {
    const claro = t === 'claro';
    try { localStorage.setItem('painelTema', claro ? 'claro' : 'escuro'); if (claro) sessionStorage.setItem('temaProposta', '1'); else sessionStorage.removeItem('temaProposta'); } catch (e) {}
    document.documentElement.classList.toggle('tema-proposta', claro);
    document.querySelectorAll('iframe').forEach((f) => { try { f.contentDocument.documentElement.classList.toggle('tema-proposta', claro); } catch (e) {} });
    const b = document.getElementById('btnTema');
    if (b) { b.textContent = claro ? '🌙' : '☀️'; b.title = claro ? 'Mudar para o visual escuro' : 'Mudar para o visual claro'; }
  }
  try {
    const t = new URLSearchParams(location.search).get('tema');
    const pedido = t === 'proposta' || t === 'claro' ? 'claro' : t === 'oficial' || t === 'escuro' ? 'escuro' : null;
    temaAplicar(pedido || localStorage.getItem('painelTema') || 'escuro');
    if (pedido) window.TEMA_DO_LINK = pedido;   // o link manda: grava no login depois de entrar
  } catch (e) {}
</script>

function sessao() { try { return JSON.parse(localStorage.getItem('rmbSessao') || 'null'); } catch (e) { return null; } }
function gravarSessao(d, email) {
  localStorage.setItem('rmbSessao', JSON.stringify({
    access_token: d.access_token, refresh_token: d.refresh_token,
    email: (d.user && d.user.email) || email,
    expira_em: Date.now() + ((d.expires_in || 3600) * 1000),
  }));
}
function cabecalho() {
  const s = sessao();
  return { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + ((s && s.access_token) || SUPABASE_ANON_KEY) };
}
// Só roda na abertura, antes de existir moldura (ver o comentário do topo).
async function renovarNaAbertura() {
  const s = sessao();
  if (!s || !s.refresh_token) return false;
  const r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
    method: 'POST', headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ refresh_token: s.refresh_token }) });
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (!r.ok || !d.access_token) {
    if (r.status === 400 || r.status === 401) localStorage.removeItem('rmbSessao');
    return false;
  }
  gravarSessao(d, s.email);
  return true;
}
async function sessaoValida() {
  const s = sessao();
  if (!s || !s.access_token) return false;
  if (s.expira_em && s.expira_em - Date.now() < 120000) await renovarNaAbertura();
  let r = await fetch(SUPABASE_URL + '/auth/v1/user', { headers: cabecalho() });
  if (r.status === 401 && await renovarNaAbertura()) r = await fetch(SUPABASE_URL + '/auth/v1/user', { headers: cabecalho() });
  if (r.ok) return true;
  if (r.status === 401 || r.status === 403) { localStorage.removeItem('rmbSessao'); return false; }
  throw new Error('sem conexão com o servidor (' + r.status + ')');
}

// -------------------------------------------------------------- busca de telas (07/11/2026, dono 03:44 pelo Organizador)
// Acha TELA pelo nome, pelo grupo, pelas palavras de casca/busca.js e pela descrição da tela (painel_telas.responde, em DESC).
// Sem acento, sem maiúscula. Só o que o login pode abrir (visivel). Enter abre a primeira (ou a marcada com as setas).
const BUSCA_SIN = window.CASCA_BUSCA || {};
Object.entries(SETORES_CFG.busca || {}).forEach(([k, v]) => { if (!BUSCA_SIN[k] && Array.isArray(v)) BUSCA_SIN[k] = v; });   // 12/11: só o que faltava
const buscaNorm = (t) => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9%]+/g, ' ').trim();
const BUSCA_PARADAS = new Set(['a', 'o', 'as', 'os', 'de', 'da', 'do', 'das', 'dos', 'e', 'em', 'no', 'na', 'nos', 'nas', 'um', 'uma', 'para', 'pra', 'por', 'com', 'que', 'tela', 'ver', 'onde', 'como', 'qual', 'meu', 'minha']);
let BUSCA_SEL = 0, BUSCA_ACHOU = [];
function buscaGrupoNome(it) { const k = Object.keys(ITENS).find((c) => ITENS[c] === it); const m = MODULOS.find((x) => [...(x.lancar || []), ...(x.acompanhar || [])].includes(k)); return m ? m.nome : ''; }
function buscaPontos(k, q, palavras) {
  const it = ITENS[k], rot = buscaNorm(it.rotulo), sin = (BUSCA_SIN[k] || []).map(buscaNorm);
  const desc = buscaNorm((typeof DESC === 'object' && DESC && DESC[k]) || ''), grupo = buscaNorm(buscaGrupoNome(it));
  let p = 0;
  if (rot === q) p = 120; else if (rot.startsWith(q)) p = 100; else if (rot.includes(q)) p = 85;
  sin.forEach((x) => { if (x === q) p = Math.max(p, 110); else if (x.startsWith(q)) p = Math.max(p, 80); else if (x.length >= 4 && q.includes(x)) p = Math.max(p, 75); });
  if (p) return p;
  // palavra a palavra: todas precisam aparecer (começo de palavra) no nome, nas palavras, no grupo ou na descrição
  if (!palavras.length) return 0;
  const onde = [rot, ...sin, grupo, desc].join(' ').split(' ');
  const acha = (w) => onde.some((x) => x.startsWith(w));
  if (!palavras.every(acha)) return 0;
  const noNome = palavras.filter((w) => rot.split(' ').some((x) => x.startsWith(w))).length;
  return 40 + 10 * noNome;
}
function buscaProcurar(texto) {
  const q = buscaNorm(texto);
  if (!q) return [];
  const palavras = q.split(' ').filter((w) => w.length >= 2 && !BUSCA_PARADAS.has(w));
  return Object.keys(ITENS).filter((k) => alvoMenu(k) && !FORA_DO_MENU.has(k))
    .map((k) => ({ k, p: buscaPontos(k, q, palavras) })).filter((x) => x.p > 0)
    .sort((a, b) => b.p - a.p || String(ITENS[a.k].rotulo).localeCompare(String(ITENS[b.k].rotulo), 'pt-BR')).slice(0, 8).map((x) => x.k);
}
function buscaDesenhar() {
  const box = $('buscaRes'), v = $('busca').value;
  if (!v.trim()) { box.hidden = true; return; }
  BUSCA_ACHOU = buscaProcurar(v);
  if (BUSCA_SEL >= BUSCA_ACHOU.length) BUSCA_SEL = 0;
  box.innerHTML = BUSCA_ACHOU.length ? BUSCA_ACHOU.map((k, i) => { const it = ITENS[k];
    return `<button type="button" class="br${i === BUSCA_SEL ? ' sel' : ''}" role="option" data-busca="${esc(k)}"><span>${esc(it.icone || '')}</span><span>${esc(it.rotulo)}${it.link ? ' ↗' : ''}</span><small>${esc(buscaGrupoNome(it))}</small></button>`; }).join('')
    : '<div class="vazio">Nenhuma tela com esse nome. Tente outra palavra (ex.: "férias", "quanto devo", "estoque").</div>';
  box.hidden = false;
}
function buscaAbrir(k) {
  $('busca').value = ''; $('buscaRes').hidden = true; $('busca').blur();
  registrarUsoCasca('busca');
  abrir(k);
}
$('busca').addEventListener('input', () => { BUSCA_SEL = 0; buscaDesenhar(); });
$('busca').addEventListener('focus', () => { if ($('busca').value.trim()) buscaDesenhar(); });
$('busca').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (!BUSCA_ACHOU.length) return;
    BUSCA_SEL = (BUSCA_SEL + (e.key === 'ArrowDown' ? 1 : -1) + BUSCA_ACHOU.length) % BUSCA_ACHOU.length;
    buscaDesenhar();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    BUSCA_ACHOU = buscaProcurar($('busca').value);
    if (BUSCA_ACHOU.length) buscaAbrir(BUSCA_ACHOU[Math.min(BUSCA_SEL, BUSCA_ACHOU.length - 1)]);
  } else if (e.key === 'Escape') { $('busca').value = ''; $('buscaRes').hidden = true; $('busca').blur(); }
});
$('buscaRes').addEventListener('mousedown', (e) => {   // mousedown: antes do blur fechar a lista
  const b = e.target.closest('[data-busca]');

// ---------------------------------------------------------- molduras
function urlDoPainel(chave) { return 'dashboard.html?casca=1' + (chave ? '&m=' + encodeURIComponent(chave) : ''); }
// 30/10/2026 (dono): link que cai direto numa aba, ex.: sistema.html#cargos/fcaixa. Vale só na abertura; o login não perde o endereço.
let ABA_PEDIDA = null;

function moldura(chave) {
  // tela que já saiu do painel abre a página dela; o resto abre no painel antigo
  const url = PAGINAS[chave] || 'painel';
  if (!MOLDURAS[url]) {
    const f = document.createElement('iframe');
    f.title = url === 'painel' ? 'Painel' : (ITENS[chave] || {}).rotulo || url;
    f.setAttribute('allow', 'fullscreen; screen-wake-lock; clipboard-write');
    if (url === 'painel') { PAINEL_PRONTO = false; PAINEL_ALVO = chave; f.src = urlDoPainel(chave); }
    else f.src = ABA_PEDIDA ? (url.includes('#') ? url.replace('#', '?aba=' + encodeURIComponent(ABA_PEDIDA) + '#') : url + '?aba=' + encodeURIComponent(ABA_PEDIDA)) : url;
    f.hidden = true;
    $('vista').appendChild(f);
    MOLDURAS[url] = f;
  }
  return { url, f: MOLDURAS[url] };
}

function mostrarSo(el) {
  [...$('vista').children].forEach((c) => { c.hidden = c !== el; });
}

function abrir(chave, deDentro) {
  // 12/11/2026 (dono 16:39: "junção do em desenvolvimento com a agenda"): o Plano virou o bloco Desenvolvimentos da agenda
  if (chave === 'plano') { const f = MOLDURAS[PAGINAS.agenda]; ABA_PEDIDA = 'desenvolvimentos'; abrir('agenda', deDentro); ABA_PEDIDA = null;
    try { if (f && f.contentWindow.agIrDesenv) f.contentWindow.agIrDesenv(); } catch (e) {} return; }
  // 12/11/2026 (dono 16:55, grupo "Agora"): o Controle das atividades virou o bloco "Equipe" da agenda do dono
  if (chave === 'atividades') { const f = MOLDURAS[PAGINAS.agenda]; ABA_PEDIDA = 'atividades'; abrir('agenda', deDentro); ABA_PEDIDA = null;
    try { if (f && f.contentWindow.agIrAtiv) f.contentWindow.agIrAtiv(); } catch (e) {} return; }
  // item de junção: abre a primeira aba que o login pode abrir (Motoboys → Financeiro da logística ou Acertos)
  if (JUNCOES[chave]) { const a = alvoMenu(chave); if (a && a !== chave) { abrir(a, deDentro); return; } }
  const it = ITENS[chave];
  if (!it || !visivel(chave)) { inicio(); return; }
  // link: outra aba, sem referência à casca e sem levar token (12/11/2026: + noreferrer)
  if (it.link) { window.open(it.link, '_blank', 'noopener,noreferrer'); return; }
  if (semPagina(chave)) { inicio(); abrirModulo('outras'); return; }   // integração pendente (sem rota): mostra o agrupamento, com o aviso
  ATUAL = chave;
  $('titulo').textContent = it.icone + ' ' + it.rotulo;
  atualizarFaixaLoja();
  history.replaceState(null, '', '#' + chave);
  $('side').classList.remove('aberta');
  desenharMenu();
  const jaAberta = !!MOLDURAS[PAGINAS[chave] || 'painel'];
  const { url, f } = moldura(chave);
  mostrarSo(f);
  // página própria reaberta: recarrega os dados da tela, como o painel antigo faz no mostrarModulo (24/10/2026)
  if (url !== 'painel' && jaAberta && !deDentro) { try { if (typeof f.contentWindow.reentrarTela === 'function') f.contentWindow.reentrarTela(); } catch (e) {} }
  let botoes = '<button class="btn" type="button" id="btnRecarregar" title="Recarregar a tela">↻</button>';
  if (url !== 'painel') botoes += `<a class="btn so-largo" href="${esc(url)}" target="_blank" rel="noopener">↗ abrir</a>`;
  $('acoes').innerHTML = botoes;
  $('btnRecarregar').onclick = () => {
    if (url === 'painel') { PAINEL_PRONTO = false; PAINEL_ALVO = ATUAL; f.src = urlDoPainel(ATUAL); } else f.src = url;
  };
  if (url === 'painel' && !deDentro) {
    if (PAINEL_PRONTO && f.contentWindow && typeof f.contentWindow.mostrarModulo === 'function') {
      f.contentWindow.mostrarModulo(chave);
    } else {
      PAINEL_ALVO = chave;                    // aplicado quando o painel avisar que está pronto
    }
  }
}

// O painel antigo conversa com a casca por mensagem (só da mesma origem).
window.addEventListener('message', (e) => {
  if (e.origin !== location.origin || !e.data || typeof e.data !== 'object') return;
  const f = MOLDURAS.painel;
  // página própria (Listas, Estoque, 24/10/2026): atalho para outra tela e aviso de sessão vencida
  if (!f || e.source !== f.contentWindow) {
    const daPagina = Object.values(MOLDURAS).find((m) => m.contentWindow === e.source);
    if (!daPagina) return;
    // 05/11/2026: moldura ESCONDIDA não troca a tela. Com uma moldura por tela (Gestão, Canal), trocar a loja redesenha
    // também as escondidas, e a "Esta semana" de fundo puxava a casca para ela no meio do Contas a pagar.
    if (e.data.tipo === 'casca-modulo' && ITENS[e.data.nome] && e.data.nome !== ATUAL) { if (!daPagina.hidden) abrir(e.data.nome); }
    else if (e.data.tipo === 'casca-titulo' && ITENS[e.data.nome] && !daPagina.hidden) {
      // 05/11/2026: a página trocou de tela por dentro (Placar → DRE na Gestão): a casca acompanha o título e o menu, e a
      // moldura fica a mesma
      const it = ITENS[e.data.nome];
      ATUAL = e.data.nome;
      $('titulo').textContent = it.icone + ' ' + it.rotulo;
      history.replaceState(null, '', '#' + e.data.nome);
      desenharMenu();
    }
    else if (e.data.tipo === 'casca-sinal' && ITENS[e.data.nome]) { SINAIS[e.data.nome] = Math.max(0, Number(e.data.n) || 0); desenharMenu(); }
    else if (e.data.tipo === 'casca-login') mostrarPorta(e.data.recado || 'Sua sessão acabou. Entre de novo.');
    else if (e.data.tipo === 'casca-loja-pedir') trocarLoja(e.data.loja);   // a tela pediu uma loja (ex.: Estoque na Rede)
    return;
  }
  if (e.data.tipo === 'casca-loja-pedir') { trocarLoja(e.data.loja); return; }   // clicar numa loja da tabela troca a loja do topo
  if (e.data.tipo === 'casca-pronto') {
    PAINEL_PRONTO = true;
    const atual = e.data.modulo;
    if (PAINEL_ALVO && PAINEL_ALVO !== atual && typeof f.contentWindow.mostrarModulo === 'function') {
      f.contentWindow.mostrarModulo(PAINEL_ALVO);
    }
    PAINEL_ALVO = null;
  } else if (e.data.tipo === 'casca-modulo') {
    // a tela mudou por dentro (atalho do Placar, link de um módulo para outro)
    if (ITENS[e.data.nome] && ATUAL !== null && ATUAL !== e.data.nome && !PAGINAS[e.data.nome]) abrir(e.data.nome, true);
  } else if (e.data.tipo === 'casca-login') {
    mostrarPorta(e.data.recado || 'Sua sessão acabou. Entre de novo.');
  }
});

function abrirModulo(id, aba) {
  const m = MODULOS.find((x) => x.id === id);
  if (!m) { inicio(); return; }
  MODULO_ATUAL = id;
  const nl = telasDo(m, 'lancar').length;
  ABA_ATUAL = aba || (nl ? 'lancar' : 'acompanhar');
  $('titulo').textContent = m.icone + ' ' + m.nome;
  const casa = $('vista').querySelector('.home');
  const semAbas = !!MOD_CFG.semAbas;   // menu novo (07/11/2026): uma lista só, na ordem do menu
  const lista = semAbas ? [...telasDo(m, 'lancar'), ...telasDo(m, 'acompanhar')] : telasDo(m, ABA_ATUAL);
  let h = `<div class="home-cab"><button class="voltar" type="button" data-inicio="1">← Início</button><h1>${esc(m.icone)} ${esc(m.nome)}</h1></div>
    <div class="abas"${semAbas ? ' style="display:none;"' : ''}>${['lancar', 'acompanhar'].map((a) => `<button class="aba${a === ABA_ATUAL ? ' on' : ''}" type="button" data-aba="${a}">${a === 'lancar' ? 'Lançar' : 'Acompanhar'} (${telasDo(m, a).length})</button>`).join('')}</div>
    <div class="cards">`;
  const cartao = (k) => { const i = ITENS[k];
    // 12/11/2026: tela do agrupamento do Fábio com acesso ainda não conectado (sem rota) = cartão sem botão ativo, com o aviso
    if (semPagina(k)) return `<div class="card vazio" aria-disabled="true"><span class="t"><span>${esc(i.icone)}</span>${esc(i.rotulo)}</span><span class="n">integração pendente · acesso ainda não conectado</span></div>`;
    const d = DESC[k];
    return `<button class="card" type="button" data-chave="${esc(k)}"><span class="t"><span>${esc(i.icone)}</span>${esc(i.rotulo)}${i.link ? ' ↗' : ''}</span>` +
      (d ? `<span class="d">${esc(d)}</span>` : '') + '</button>'; };
  // 12/11/2026 (Fabio): o agrupamento do Fábio separa as telas por setor (as mesmas telas da lista, nenhuma a mais)
  const porSetor = m.setores && lista.length
    ? m.setores.map((s) => { const ks = s.chaves.filter((k) => lista.includes(k)); if (!ks.length) return '';
        const ativo = ks.some((k) => !semPagina(k));
        // aviso do setor: só texto, sem botão nem link (ex.: telas do Delivery ainda em migração)
        const aviso = s.aviso ? `<div class="setor-aviso">${esc(s.aviso)}</div>` : '';
        return `<div class="gh">${esc(s.icone)} ${esc(s.nome)}${ativo ? '' : ' · em construção'}</div>` + ks.map(cartao).join('') + aviso; }).join('')
    : null;
  h += porSetor !== null ? porSetor : lista.length ? lista.map(cartao).join('')
    : `<div class="gh" style="text-transform:none; letter-spacing:0;">${semAbas ? 'Nenhuma tela neste módulo.' : ABA_ATUAL === 'lancar' ? 'Nada para lançar neste módulo.' : 'Nada para acompanhar neste módulo.'}</div>`;
  h += '</div>';
  casa.innerHTML = h;
  casa.onclick = (e) => {
    if (e.target.closest('[data-inicio]')) { inicio(); return; }
    const a = e.target.closest('[data-aba]');
    if (a) { abrirModulo(id, a.dataset.aba); return; }
    const t = e.target.closest('[data-chave]');
    if (t) abrir(t.dataset.chave);
  };
  mostrarSo(casa);
}

// o sinal da Minha agenda, calculado pela casca ao entrar (a mesma regra da agenda, que manda o número de novo ao abrir):
// o que depende do dono com prazo até hoje + contas vencidas DE VERDADE (situação VENCIDA, sem as "aguardando
// conciliação"), contadas por título como no Contas a pagar
async function carregarSinalAgenda() {
  if (!ehDono() || !visivel('agenda')) return;
  try {
    const hoje = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo' }).format(new Date());
    const ler = async (q) => { const r = await fetch(SUPABASE_URL + '/rest/v1/' + q, { headers: cabecalho() }); if (!r.ok) throw new Error(r.status); return r.json(); };
    const opc = (q) => ler(q).catch(() => []);
    const [pend, venc, rmb, fer, fUlt, fVal] = await Promise.all([
      ler('dono_pendencia?select=id,prazo&para=is.null&resolvido_em=is.null'),
      ler(`vw_fin_contas_pagar?select=vencimento,origem,id_titulo,conta_exibida&sentido=eq.PAGAR&situacao=eq.VENCIDA&dia_pagamento=lt.${hoje}`),
      opc('vw_rmb_pedidos?select=id&situacao=eq.PEDIDO&so_o_dono=is.true'),
      opc(`vw_rh_ferias_alertas?select=pagar_ate,pagamento&situacao=eq.programada&pagar_ate=lt.${hoje}`),
      opc('vw_rh_pagamento_mes?select=competencia&liquido_folha=not.is.null&order=competencia.desc&limit=1'),
      opc('rh_folha_validada?select=competencia')]);
    // 07/11/2026 (dono 03:44): só o bloco "Depende de você" da agenda conta — pendências até hoje, vencidas de verdade (por
    // título), reembolso que só o dono aprova, férias vencidas e não pagas (as "aguardando conciliação" não), folha a validar
    const nPend = pend.filter((p) => !p.prazo || p.prazo <= hoje).length;
    const nVenc = new Set(venc.map((c, i) => c.id_titulo ? `${c.origem}|${c.id_titulo}|${c.vencimento}|${c.conta_exibida || ''}` : `l${i}`)).size;
    const nFer = fer.filter((x) => x.pagamento ? x.pagamento !== 'AGUARDANDO_CONCILIACAO' : false).length;
    const comp = fUlt[0] ? String(fUlt[0].competencia).slice(0, 10) : null;
    const nFolha = comp && !fVal.some((v) => String(v.competencia).slice(0, 10) === comp) ? 1 : 0;
    SINAIS.agenda = nPend + nVenc + rmb.length + nFer + nFolha;
    desenharMenu();
  } catch (e) {}   // sem o número, o menu segue igual
}

// o tema do login (banco) manda; o clique troca e grava (o navegador guarda uma cópia)
async function temaDoLogin() {
  try {
    if (window.TEMA_DO_LINK) { temaGravar(window.TEMA_DO_LINK); return; }
    const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/painel_meu_tema', { method: 'POST', headers: Object.assign(cabecalho(), { 'Content-Type': 'application/json' }), body: '{}' });
    if (!r.ok) return;
    const t = await r.json();
    if (t === 'claro' || t === 'escuro') temaAplicar(t);
  } catch (e) {}
}
async function temaGravar(t) {
  try {
    await fetch(SUPABASE_URL + '/rest/v1/rpc/painel_tema_gravar', { method: 'POST', headers: Object.assign(cabecalho(), { 'Content-Type': 'application/json' }), body: JSON.stringify({ p_tema: t }) });
  } catch (e) {}   // sem rede: fica a cópia deste navegador
}
$('btnTema').addEventListener('click', () => {
  const novo = document.documentElement.classList.contains('tema-proposta') ? 'escuro' : 'claro';
  temaAplicar(novo);
  temaGravar(novo);
});
temaAplicar(document.documentElement.classList.contains('tema-proposta') ? 'claro' : 'escuro');   // acerta o ícone

async function montar() {
  $('quem').textContent = (sessao() || {}).email || '';
  temaDoLogin();
  [PODE, DESC, , VE_PESSOAL, VE_GESTAO, VE_EQUIPE] = await Promise.all([carregarAcesso(), carregarDescricoes(), lojaCarregar(), carregarVePessoal(), carregarVeGestao(), carregarVeEquipe()]);
  desenharLoja();
  // 02/11/2026 (dono): Pagamento fora da folha virou aba de Cálculos da folha; o link antigo cai nela
  const [pedido, abaPedida] = decodeURIComponent(location.hash.replace('#', '')).replace(/^forafolha$/, 'pcalc/fora').replace(/^plano$/, 'agenda/desenvolvimentos').replace(/^atividades$/, 'agenda/atividades').split('/');
  const minhas = Object.keys(ITENS).filter((k) => visivel(k) && !ITENS[k].link && !semPagina(k));
  if (pedido && alvoMenu(pedido)) { ABA_PEDIDA = abaPedida || null; abrir(pedido); ABA_PEDIDA = null; }
  else if (PODE && minhas.length) abrir(minhas[0]);     // acesso restrito abre direto no que é dele, como o painel
  // 07/11/2026 (dono, pelo Organizador: "a tela inicial poderia abrir já na tela da agenda"): por ora só o dono;
  // os outros logins quando a agenda deles for ao ar
  else if (visivel('agenda') && ehDono()) abrir('agenda');
  else inicio();
  carregarSinalAgenda();
}

(async function abrirCasca() {
  if (!MENU.length) { document.body.textContent = 'O menu da casca (casca/menu.js) não carregou.'; return; }
  desenharMenu();
  try {
    if (!(await sessaoValida())) { mostrarPorta(); return; }
  } catch (e) { mostrarPorta('Não consegui falar com o servidor. Confira a internet e entre de novo.'); return; }
  await montar();
})();
