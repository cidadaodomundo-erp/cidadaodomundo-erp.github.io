<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Saída da antecipação</title>
<!-- SAÍDA DA ANTECIPAÇÃO — página TRAVADA só para o Neto e o Fabio (dono 13/11/2026 13:32: "comunicação com o Fabio = página
     visual, direta e travada só para os dois"). Nenhum número neste HTML: o conteúdo vem de plano_pagina (slug = nome do
     arquivo, RLS pode_ver_plano; anon não lê) com o login do painel. Molde do login: plano-saida.html (nunca renova o token).
     Casca genérica: a próxima página ao Fabio = nova linha em plano_pagina + cópia deste arquivo com outro nome. Quem mexe: Telas. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root {
  --bg: #f4f6f4; --card: #ffffff; --fg: #18201c; --muted: #5f6b65; --line: #dde3df;
  --accent: #1f6f5c; --accent-soft: #e2efe9; --warn: #b4531c; --warn-soft: #f7e9df; --bar: #9fb8ad;
  --f-text: "IBM Plex Sans", system-ui, sans-serif;
  --f-head: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111513; --card: #19201c; --fg: #e6ece9; --muted: #9eaba4; --line: #2b3430;
  --accent: #5cc0a4; --accent-soft: #1d2b25; --warn: #e3935f; --warn-soft: #2e231c; --bar: #4f6b60; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111513; --card: #19201c; --fg: #e6ece9; --muted: #9eaba4; --line: #2b3430;
  --accent: #5cc0a4; --accent-soft: #1d2b25; --warn: #e3935f; --warn-soft: #2e231c; --bar: #4f6b60; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font: 16px/1.5 var(--f-text); margin: 0; }
.wrap { max-width: 820px; margin: 0 auto; padding-block: 32px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 36px; }
h1 { font: 700 2rem/1.1 var(--f-head); margin: 0; text-wrap: balance; }
h2 { font: 600 .85rem/1 var(--f-head); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0; }
.sub { color: var(--muted); margin: 6px 0 0; font-size: .95rem; }
section { display: grid; gap: 14px; }
.big { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.n { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 6px; min-width: 0; }
.n b { font: 700 2.3rem/1 var(--f-head); color: var(--accent); }
.n.w b { color: var(--warn); }
.n span { color: var(--muted); font-size: .95rem; }
.dest { background: var(--warn-soft); border: 2px solid var(--warn); border-radius: 12px; padding: 18px 20px; display: grid; gap: 8px; }
.dest b { font: 700 1.35rem/1.2 var(--f-head); color: var(--warn); }
.dest ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.dest .nt { color: var(--muted); font-size: .88rem; }
.chart { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 12px 8px; overflow-x: auto; }
.chart svg { width: 100%; min-width: 480px; height: auto; display: block; }
.bar { fill: var(--bar); } .bar.hi { fill: var(--accent); }
.vl { font: 500 13px var(--f-num); fill: var(--fg); } .ml { font: 13px var(--f-text); fill: var(--muted); }
.cx { font: 12px var(--f-text); fill: var(--warn); } .base { stroke: var(--line); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.c { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 4px; align-content: start; }
.c .d { font: 600 1.05rem var(--f-head); color: var(--accent); }
.c .q { font-weight: 600; }
.c .s { font-size: .88rem; color: var(--muted); }
.c.later { border-style: dashed; } .c.later .d { color: var(--warn); }
.dec { display: grid; gap: 10px; }
.dc { background: var(--warn-soft); border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px; color: inherit; text-decoration: none; }
.dc b { font-family: var(--f-head); font-size: 1.05rem; }
.dc span { color: var(--muted); font-size: .92rem; }
.last { background: var(--accent-soft); border-radius: 10px; padding: 18px; font-size: 1.1rem; font-weight: 600; }
.foot { color: var(--muted); font-size: .8rem; }
.login { max-width: 360px; margin: 12vh auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 6px; }
.login input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; }
.login button, .sair { background: var(--accent); color: var(--card); border: 0; border-radius: 6px; padding: 10px 14px; font: inherit; cursor: pointer; }
.sair { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 4px 10px; font-size: .8rem; }
.erro { color: var(--warn); font-size: .85rem; }
@media (max-width: 480px) { h1 { font-size: 1.6rem; } .n b { font-size: 2rem; } }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="sub">Carregando…</p></div>
<script>
const SLUG = location.pathname.split('/').pop().replace(/\.html$/, '') || 'sair-antecipacao';
const SUPABASE_URL = "https://rtmgzsikwglsvpopbfbw.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0bWd6c2lrd2dsc3Zwb3BiZmJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NDgwMjcsImV4cCI6MjEwMTQyNDAyN30.-vwbQkcuAbbonmBVCeUWXjTg54uB5MNN94QmMlBxTA4";
const app = document.getElementById('app');
// Mesma sessão do painel (localStorage 'rmbSessao'). NUNCA renova o token (refresh de uso único derrubaria o painel).
function sessao() { try { return JSON.parse(localStorage.getItem('rmbSessao') || 'null'); } catch (e) { return null; } }
function sessaoValida() { const s = sessao(); return s && s.access_token && (!s.expira_em || s.expira_em > Date.now() + 60000) ? s : null; }
const esc = (t) => String(t == null ? '' : t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function telaLogin(msg) {
  app.innerHTML = `<div class="login"><h1 style="font-size:1.3rem">Saída da antecipação</h1>
    <p class="sub">Página só do Neto e do Fabio. Entre com o mesmo nome e senha do painel.</p>
    <label>Nome<input id="e" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username" placeholder="seu nome (ex.: fabio)"></label>
    <label>Senha<input id="s" type="password" autocomplete="current-password"></label>
    <button id="b">Entrar</button><p class="erro" id="m">${esc(msg || '')}</p></div>`;
  const ir = async () => {
    const nome = String(document.getElementById('e').value || '').trim();
    const email = !nome || nome.includes('@') ? nome : nome.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, '').toLowerCase() + '@cidadaodomundo.com.br';
    const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, { method: 'POST', headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: document.getElementById('s').value }) });
    const s = await r.json().catch(() => ({}));
    if (!r.ok || !s.access_token) { document.getElementById('m').textContent = 'Nome ou senha não conferem.'; return; }
    localStorage.setItem('rmbSessao', JSON.stringify({ access_token: s.access_token, refresh_token: s.refresh_token, email: (s.user && s.user.email) || '', expira_em: Date.now() + (s.expires_in || 3600) * 1000 }));
    carregar();
  };
  document.getElementById('b').onclick = ir;
  document.getElementById('s').onkeydown = (e) => { if (e.key === 'Enter') ir(); };
}
async function carregar() {
  const s = sessaoValida();
  if (!s) return telaLogin();
  let r;
  try { r = await fetch(`${SUPABASE_URL}/rest/v1/plano_pagina?slug=eq.${encodeURIComponent(SLUG)}&select=titulo,conteudo`, { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${s.access_token}` } }); }
  catch (e) { app.innerHTML = `<p class="erro">Sem conexão agora. <button class="sair" onclick="carregar()">tentar de novo</button></p>`; return; }
  if (r.status === 401) return telaLogin('Sessão vencida, entre de novo.');
  const L = r.ok ? await r.json() : [];
  if (!L.length) { app.innerHTML = `<p class="sub">Esta página é só do Neto e do Fabio.</p><button class="sair" onclick="localStorage.removeItem('rmbSessao');carregar()">entrar com outro login</button>`; return; }
  desenhar(L[0], s);
}
function grafico(g) {
  const B = (g && g.barras) || [];
  if (!B.length) return '';
  const max = Math.max(...B.map((b) => Number(b.valor) || 0), 1), w = 64, passo = 520 / B.length;
  const ult = Number(B[0].valor) || 0;
  const barras = B.map((b, i) => {
    const v = Number(b.valor) || 0, h = Math.max(3, Math.round(140 * v / max)), x = Math.round(20 + passo * i + (passo - w) / 2), cx = x + w / 2;
    return `<rect class="bar${v < ult ? ' hi' : ''}" x="${x}" y="${180 - h}" width="${w}" height="${h}"/>`
      + `<text class="vl" x="${cx}" y="${172 - h}" text-anchor="middle">${esc(String(v).replace('.', ','))}</text>`
      + `<text class="ml" x="${cx}" y="198" text-anchor="middle">${esc(b.mes)}</text>`
      + (b.nota ? `<text class="cx" x="${cx}" y="218" text-anchor="middle">${esc(b.nota)}</text>` : '');
  }).join('');
  return `<section><h2>${esc(g.titulo || 'Mês a mês')}</h2><div class="chart"><svg viewBox="0 0 560 230" role="img" aria-label="${esc(g.titulo || '')}">
    <line x1="20" x2="540" y1="180" y2="180" class="base"/>${barras}</svg></div></section>`;
}
function desenhar(p, s) {
  const c = p.conteudo || {};
  let h = `<header><h1>${esc(p.titulo)}</h1><p class="sub">Estudo do Financeiro${c.data ? ' · ' + esc(c.data) : ''}</p></header>`;
  if ((c.numeros || []).length) h += `<section class="big">${c.numeros.map((n) => `<div class="n${n.tom === 'alerta' ? ' w' : ''}"><b>${esc(n.valor)}</b><span>${esc(n.texto)}</span></div>`).join('')}</section>`;
  // dono 13/11: "para sair, vamos parar de guardar lucro por um tempo" — em destaque, logo abaixo dos números, nunca escondido
  if (c.destaque) h += `<section class="dest"><b>${esc(c.destaque.titulo)}</b>${(c.destaque.linhas || []).length ? `<ul>${c.destaque.linhas.map((l) => `<li>${esc(l)}</li>`).join('')}</ul>` : ''}${c.destaque.nota ? `<span class="nt">${esc(c.destaque.nota)}</span>` : ''}</section>`;
  if ((c.custo || []).length) h += `<section><h2>Quanto custa</h2><div class="cards">${c.custo.map((x) => `<div class="c"><span class="q">${esc(x.nome)}</span><span class="d">${esc(x.valor)}</span><span class="s">${esc(x.texto)}</span></div>`).join('')}</div></section>`;
  h += grafico(c.grafico);
  if ((c.passos || []).length) h += `<section><h2>Os passos</h2><div class="cards">${c.passos.map((x) => `<div class="c${x.depois ? ' later' : ''}"><span class="d">${esc(x.quando)}</span><span class="q">${esc(x.o_que)}</span><span class="s">caixa ${esc(x.caixa)}</span></div>`).join('')}</div></section>`;
  if ((c.decisoes || []).length) h += `<section class="dec"><h2>Falta decidir (Neto)</h2>${c.decisoes.map((d) => `<a class="dc" href="sistema.html?item=${Number(d.id)}#agenda"><b>#${Number(d.id)} · ${esc(d.titulo)}</b><span>${esc(d.texto)}</span></a>`).join('')}</section>`;
  if (c.ultima_linha) h += `<div class="last">${esc(c.ultima_linha)}</div>`;
  h += `<p class="foot">${c.fonte ? 'Fontes: ' + esc(c.fonte) + ' · ' : ''}Entrou como ${esc(s.email || '')} · <button class="sair" onclick="localStorage.removeItem('rmbSessao');carregar()">sair</button></p>`;
  app.innerHTML = h;
}
carregar();
</script>
</body>
</html>
