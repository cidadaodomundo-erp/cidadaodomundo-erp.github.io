<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Saúde das rotinas</title>
<!-- Saúde das rotinas para o Fabio (dono pelo Organizador 25/11 14:48; proposta 2026-11-25-saude-das-rotinas-fabio.md, chat
     Rotinas). Lido AO VIVO de rotina_ficha (RLS: DONO ou pode_ver_plano) + vw_rotinas_placar_7d. Nenhum dado mora neste
     arquivo. 26/11: bloco "Robôs agora" (robo_saude_ler, vigia de 1 em 1 min no pg_cron; chat "Vigiar robôs de minuto em minuto"). Mesma sessão do painel (localStorage 'rmbSessao'). Quem mexe: o chat "Telas do painel". -->
<style>
  :root { --fundo:#FAF8F7; --papel:#FFFFFF; --alt:#F3EEEC; --tinta:#241C1B; --suave:#4E4442; --mudo:#756A67;
          --linha:#E4DBD8; --forte:#CFC2BE; --acento:#C8102E; --acento-fundo:#FBE9EC;
          --anda:#8A5A00; --anda-fundo:#FBF0DC; --ok:#2F6B4F; --ok-fundo:#E6F1EB; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
          --fundo:#161211; --papel:#1E1817; --alt:#262020; --tinta:#F2EBE9; --suave:#D6CBC8; --mudo:#A29793;
          --linha:#332A29; --forte:#453A38; --acento:#FF5A70; --acento-fundo:#3A1B20;
          --anda:#E8B55A; --anda-fundo:#2E2415; --ok:#7BC4A0; --ok-fundo:#1C2E25; } }
  :root[data-theme="dark"] { --fundo:#161211; --papel:#1E1817; --alt:#262020; --tinta:#F2EBE9; --suave:#D6CBC8; --mudo:#A29793;
          --linha:#332A29; --forte:#453A38; --acento:#FF5A70; --acento-fundo:#3A1B20;
          --anda:#E8B55A; --anda-fundo:#2E2415; --ok:#7BC4A0; --ok-fundo:#1C2E25; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fundo); color:var(--tinta); font-family:"Segoe UI",system-ui,sans-serif; line-height:1.5; }
  .wrap { max-width:900px; margin:0 auto; padding:24px 16px 64px; }
  .eyebrow { font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--acento); font-weight:600; margin:0; }
  h1 { font-size:1.8rem; line-height:1.1; margin:.35rem 0 .3rem; }
  .lede { color:var(--suave); margin:0 0 1rem; }
  .placar { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 1.2rem; }
  .placar span { padding:4px 10px; border-radius:999px; font-size:.85rem; font-weight:600; }
  .f-PRONTO { background:var(--ok-fundo); color:var(--ok); } .f-ANDA { background:var(--anda-fundo); color:var(--anda); }
  .f-RISCO, .f-PARADO { background:var(--acento-fundo); color:var(--acento); }
  .ent { background:var(--papel); border:1px solid var(--linha); border-radius:6px; padding:14px 16px; margin-bottom:12px; }
  .ent.b-PRONTO { border-left:5px solid var(--ok); } .ent.b-ANDA { border-left:5px solid var(--anda); }
  .ent.b-RISCO, .ent.b-PARADO { border-left:5px solid var(--acento); }
  .topo { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:baseline; }
  .tit { font-weight:700; font-size:1.05rem; }
  .ref { font-size:.75rem; color:var(--mudo); }
  .diss { font-size:.82rem; color:var(--mudo); font-style:italic; margin:.2rem 0 .5rem; }
  .bl { margin:.45rem 0 0; font-size:.92rem; }
  .bl b { display:inline-block; min-width:64px; font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--mudo); }
  .bl.semdono { color:var(--acento); } .bl.semdono b { color:var(--acento); }
  details > summary { cursor:pointer; color:var(--mudo); font-size:.8rem; margin-top:.5rem; }
  .card { border-top:1px solid var(--linha); padding:6px 0; font-size:.85rem; color:var(--suave); }
  .card i { color:var(--mudo); font-style:normal; font-size:.75rem; }
  .vazio { color:var(--mudo); font-size:.9rem; }
  .login { max-width:360px; margin:12vh auto; background:var(--papel); border:1px solid var(--forte); border-radius:8px; padding:20px; }
  .login input { width:100%; padding:10px; margin:6px 0 10px; border:1px solid var(--forte); border-radius:4px; background:var(--fundo); color:var(--tinta); font:inherit; }
  .login button, .sair { background:var(--acento); color:#fff; border:0; border-radius:4px; padding:10px 14px; font:inherit; cursor:pointer; }
  .sair { background:transparent; color:var(--mudo); border:1px solid var(--forte); padding:4px 10px; font-size:.8rem; }
  .erro { color:var(--acento); font-size:.85rem; }
  footer { margin-top:2rem; color:var(--mudo); font-size:.8rem; }
  @media (max-width:520px) { h1 { font-size:1.45rem; } .bl b { display:block; } }

  .lin { background:var(--papel); border:1px solid var(--linha); border-left:5px solid var(--forte); border-radius:6px; padding:10px 12px; margin-bottom:8px; }
  .lin.verde { border-left-color:var(--ok); } .lin.vermelho { border-left-color:var(--acento); } .lin.cinza { border-left-color:var(--forte); }
  .cab { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; cursor:pointer; }
  .n { font-weight:700; flex:1; min-width:180px; }
  .farol { font-size:.8rem; font-weight:700; padding:2px 10px; border-radius:999px; white-space:nowrap; }
  .farol.verde { background:var(--ok-fundo); color:var(--ok); } .farol.vermelho { background:var(--acento-fundo); color:var(--acento); }
  .farol.cinza { background:var(--alt); color:var(--mudo); }
  .bol { display:inline-flex; gap:3px; } .bol i { width:11px; height:11px; border-radius:50%; display:inline-block; background:var(--forte); }
  .bol i.R { background:var(--ok); } .bol i.E, .bol i.N, .bol i.T { background:var(--acento); } .bol i.P, .bol i.A { background:var(--anda); }
  .qd { font-size:.8rem; color:var(--mudo); white-space:nowrap; }
  .det { font-size:.9rem; color:var(--suave); margin-top:6px; } .det b { color:var(--tinta); }
  .leg { font-size:.8rem; color:var(--mudo); display:flex; flex-wrap:wrap; gap:10px; margin:0 0 1rem; align-items:center; }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="vazio">Carregando…</p></div>
<script>
const SUPABASE_URL = "https://rtmgzsikwglsvpopbfbw.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0bWd6c2lrd2dsc3Zwb3BiZmJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NDgwMjcsImV4cCI6MjEwMTQyNDAyN30.-vwbQkcuAbbonmBVCeUWXjTg54uB5MNN94QmMlBxTA4";
const app = document.getElementById('app');
function sessao() { try { return JSON.parse(localStorage.getItem('rmbSessao') || 'null'); } catch (e) { return null; } }
function sessaoValida() { const s = sessao(); return s && s.access_token && (!s.expira_em || s.expira_em > Date.now() + 60000) ? s : null; }
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dataBR = d => d ? String(d).slice(8,10) + '/' + String(d).slice(5,7) : '';

function telaLogin(msg) {
  app.innerHTML = `<div class="login"><p class="eyebrow">Cidadão do Mundo</p><h1 style="font-size:1.3rem">Saúde das rotinas</h1>
    <p class="lede">Entre com o mesmo nome e senha do painel.</p>
    <label>Nome<input id="e" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username" placeholder="seu nome"></label>
    <label>Senha<input id="s" type="password" autocomplete="current-password"></label>
    <button id="b">Entrar</button><p class="erro" id="m">${esc(msg || '')}</p></div>`;
  const ir = async () => {
    const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, { method:'POST',
      headers:{ apikey:SUPABASE_ANON_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ email:((t) => { t = String(t || '').trim(); return !t || t.includes('@') ? t : t.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, '').toLowerCase() + '@cidadaodomundo.com.br'; })(document.getElementById('e').value), password:document.getElementById('s').value }) });
    const s = await r.json();
    if (!r.ok || !s.access_token) { document.getElementById('m').textContent = 'Nome ou senha não conferem.'; return; }
    localStorage.setItem('rmbSessao', JSON.stringify({ access_token:s.access_token, refresh_token:s.refresh_token,
      email:(s.user && s.user.email) || '', expira_em: Date.now() + (s.expires_in || 3600) * 1000 }));
    carregar();
  };
  document.getElementById('b').onclick = ir;
  document.getElementById('s').onkeydown = e => { if (e.key === 'Enter') ir(); };
}


let FICHA = [], ABERTA = new Set(), ROBOS = null;
const SIT = { RODOU:'verde', ERROU:'vermelho', NAO_RODOU:'vermelho', PRESA:'vermelho' };
const ROT = { verde:'funcionando', vermelho:'parou', cinza:'aguardando' };
const DIA = { R:'rodou', E:'deu erro', N:'não rodou', T:'travou', P:'pulou (de propósito)', A:'ainda vai rodar' };
const dh = t => t ? new Date(t).toLocaleString('pt-BR', { timeZone:'America/Sao_Paulo', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }).replace(',', '') : '—';
async function carregar() {
  const s = sessaoValida();
  if (!s) return telaLogin();
  const h = { headers:{ apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${s.access_token}` } };
  const [rf, rp, rr] = await Promise.all([
    fetch(`${SUPABASE_URL}/rest/v1/rotina_ficha?select=rotina,nome_simples,o_que_faz,efeito_se_parar,o_que_fazer,roda_em,passada_em&order=nome_simples`, h),
    fetch(`${SUPABASE_URL}/rest/v1/vw_rotinas_placar_7d?select=rotina,dias,situacao_ultima,conferido_em`, h),
    fetch(`${SUPABASE_URL}/rest/v1/rpc/robo_saude_ler`, { method:'POST', headers:{ ...h.headers, 'Content-Type':'application/json' }, body:'{}' }).catch(() => null)]);
  ROBOS = rr && rr.ok ? await rr.json() : null;
  if (rf.status === 401 || rp.status === 401) return telaLogin('Sessão vencida, entre de novo.');
  const F = rf.ok ? await rf.json() : [], P = rp.ok ? await rp.json() : [];
  if (!F.length) { app.innerHTML = `<p class="vazio">Este login não tem acesso (é só do Neto e do Fabio).</p>
      <button class="sair" onclick="localStorage.removeItem('rmbSessao');carregar()">entrar com outro login</button>`; return; }
  const pm = new Map(P.map(x => [x.rotina, x]));
  FICHA = F.map(f => { const p = pm.get(f.rotina) || {}; return { ...f, dias:p.dias || '', sit:p.situacao_ultima || null, conf:p.conferido_em || null,
    farol: SIT[p.situacao_ultima] || 'cinza' }; });
  const ord = { vermelho:0, cinza:1, verde:2 };
  FICHA.sort((a, b) => ord[a.farol] - ord[b.farol] || String(a.nome_simples).localeCompare(String(b.nome_simples), 'pt-BR'));
  desenhar();
}
// Robôs agora: vigia de 1 em 1 min dentro do banco (vigia_robos_rodar, pg_cron) + vigia do vigia no note do Japa e no BENTOIK. Só leitura (robo_saude_ler).
const COR = { VERMELHO:['vermelho','parado'], AMARELO:['amarelo','atenção'], CINZA:['cinza','parado de propósito'], VERDE:['verde','funcionando'] };
function blocoRobos() {
  if (!ROBOS || ROBOS.erro) return '';
  const v = ROBOS.vigia || {}, ha = v.rodou_em ? Math.round((Date.now() - new Date(v.rodou_em)) / 1000) : null;
  const vigiaOk = ha !== null && ha < 180;
  const it = ROBOS.itens || [];
  const ev = (ROBOS.eventos || []).slice(0, 8);
  return `<h2 style="font-size:1.15rem;margin:0 0 .3rem">Robôs agora</h2>
    <p class="lede" style="font-size:.9rem">${vigiaOk ? `O vigia conferiu há ${ha} s (confere de 1 em 1 minuto, sozinho, sem IA).` : `<b style="color:var(--acento)">O VIGIA DE 1 EM 1 MIN PAROU</b>${ha !== null ? ` (último: ${dh(v.rodou_em)})` : ''}. O note do Japa e o BENTOIK avisam no WhatsApp.`}</p>
    <div class="placar"><span class="f-PRONTO">${v.verdes || 0} funcionando</span>${v.vermelhos ? `<span class="f-RISCO">${v.vermelhos} parado${v.vermelhos > 1 ? 's' : ''}</span>` : ''}${v.amarelos ? `<span class="f-ANDA">${v.amarelos} atenção</span>` : ''}${v.cinzas ? `<span>${v.cinzas} parado de propósito</span>` : ''}</div>
    ${it.map(x => { const [c, t] = COR[x.cor] || COR.CINZA; return `<div class="lin ${c === 'amarelo' ? '' : c}" style="${c === 'amarelo' ? 'border-left-color:var(--anda)' : ''}"><div class="cab" style="cursor:default">
      <span class="n">${esc(x.nome)}</span><span class="farol ${c}" style="${c === 'amarelo' ? 'background:var(--anda-fundo);color:var(--anda)' : ''}">${t}</span>
      <span class="qd">${esc(x.grupo || '')}${x.maquina ? ' · ' + esc(x.maquina) : ''} · sinal ${dh(x.ultimo_sinal)}</span></div>
      ${x.texto && x.cor !== 'VERDE' ? `<div class="det">${esc(x.texto)}</div>` : ''}</div>`; }).join('')}
    ${ev.length ? `<details><summary>Últimas mudanças</summary>${ev.map(e => `<div class="card">${dh(e.em)} · <b>${esc(e.nome)}</b>: ${esc((COR[e.de] || ['', e.de || 'novo'])[1])} → ${esc((COR[e.para] || ['', e.para])[1])}${e.texto ? ` <i>(${esc(e.texto)})</i>` : ''}</div>`).join('')}</details>` : ''}
    <h2 style="font-size:1.15rem;margin:1.6rem 0 .3rem">Rotinas</h2>`;
}
function abrir(r) { if (ABERTA.has(r)) ABERTA.delete(r); else ABERTA.add(r); desenhar(); }
function desenhar() {
  const n = k => FICHA.filter(x => x.farol === k).length;
  app.innerHTML = `<p class="eyebrow">Cidadão do Mundo · rotinas automáticas</p><h1>Saúde das rotinas</h1>
    <p class="lede">As rotinas que rodam sozinhas, sem o Claude. Verde: rodou na última vez. Vermelho: parou — veja o que fazer. Clique numa rotina para ver o que ela faz.</p>
    ${blocoRobos()}
    <div class="placar"><span class="f-PRONTO">${n('verde')} funcionando</span>${n('vermelho') ? `<span class="f-RISCO">${n('vermelho')} parada${n('vermelho') > 1 ? 's' : ''}</span>` : ''}${n('cinza') ? `<span class="f-ANDA">${n('cinza')} aguardando</span>` : ''}</div>
    <div class="leg">Últimos 7 dias, do mais antigo ao de hoje: <span class="bol"><i class="R"></i></span> rodou <span class="bol"><i class="E"></i></span> não rodou ou deu erro <span class="bol"><i class="P"></i></span> pulou ou ainda vai rodar</div>
    ${FICHA.map(x => { const ab = ABERTA.has(x.rotina) || x.farol === 'vermelho';
      return `<div class="lin ${x.farol}"><div class="cab" onclick="abrir('${esc(x.rotina)}')">
        <span class="n">${esc(x.nome_simples)}</span><span class="farol ${x.farol}">${ROT[x.farol]}</span>
        <span class="bol" title="últimos 7 dias">${[...String(x.dias)].map(c => `<i class="${esc(c)}" title="${DIA[c] || ''}"></i>`).join('')}</span>
        <span class="qd">última conferência ${dh(x.conf)}</span></div>
        ${ab ? `<div class="det">${x.o_que_faz ? `<div><b>O que faz:</b> ${esc(x.o_que_faz)}</div>` : ''}${x.roda_em ? `<div><b>Quando roda:</b> ${esc(x.roda_em)}</div>` : ''}
          ${x.efeito_se_parar ? `<div><b>Se parar:</b> ${esc(x.efeito_se_parar)}</div>` : ''}${x.o_que_fazer ? `<div><b>O que fazer:</b> ${esc(x.o_que_fazer)}</div>` : ''}</div>` : ''}
      </div>`; }).join('')}
    <footer>Robôs agora: atualiza sozinho a cada 1 minuto. Rotinas: a conferência roda de 30 em 30 minutos. <button class="sair" onclick="localStorage.removeItem('rmbSessao');carregar()">sair</button></footer>`;
}
carregar();
setInterval(() => { if (sessaoValida()) carregar(); }, 60000);
</script>
</body>
</html>
