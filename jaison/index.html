<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<!-- GARANTIDO DOS MOTOBOYS — tela do Jaison (20/11/2026, chat-jaison-garantido-portal-20-11).
     Feita para o celular; salva na tela inicial abre como app. Lê SÓ o banco do ERP pela função garantido_motoboys_dia(dia),
     que usa o MESMO cálculo da tela Pagar motoboys (pagar_motoboys_calc) e devolve só garantido, taxas, refeição, a receber
     e o motivo. Sem chave Pix, sem RH, sem financeiro. Quem vê: dono, quem vê pessoal, ou e-mail em rmb_config 'emails_garantido'.
     Esta página não grava nada. -->
<script>const NA_CASCA = false; function avisarCasca() {}</script>
<style>
  :root { --bg:#111110; --card:#1c1c1a; --line:#2e2e2b; --tx:#f2f1ec; --fraco:#a3a29b; --amarelo:#f5c518; --verde:#46c46e; --verm:#ff6b5e; --laranja:#f0a23a; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--tx); font:16px/1.4 -apple-system, "Segoe UI", Roboto, Inter, sans-serif; -webkit-text-size-adjust:100%; }
  body { padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px); max-width:640px; margin:0 auto; }
  h1 { font-size:20px; margin:0; }
  .topo { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; }
  .sair { background:none; border:1px solid var(--line); color:var(--fraco); border-radius:10px; padding:6px 10px; font-size:13px; }
  .dia { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .dia button { flex:0 0 48px; height:48px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--tx); font-size:22px; }
  .dia button:disabled { opacity:.35; }
  .dia .meio { flex:1; text-align:center; background:var(--card); border:1px solid var(--line); border-radius:12px; height:48px; position:relative; display:flex; flex-direction:column; justify-content:center; }
  .dia .meio b { font-size:17px; } .dia .meio small { color:var(--fraco); font-size:12px; }
  .dia input[type=date] { position:absolute; inset:0; opacity:0; width:100%; height:100%; }
  .lojas { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px; scrollbar-width:none; }
  .lojas button { flex:0 0 auto; border:1px solid var(--line); background:var(--card); color:var(--tx); border-radius:999px; padding:8px 14px; font-size:14px; }
  .lojas button.on { background:var(--amarelo); color:#111; border-color:var(--amarelo); font-weight:700; }
  .total { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:12px; display:flex; justify-content:space-between; gap:8px; }
  .total div { text-align:center; flex:1; } .total b { display:block; font-size:18px; } .total small { color:var(--fraco); font-size:12px; }
  .cartao { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:10px; }
  .cartao.corta { border-color:var(--verm); }
  .c1 { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .nome { font-weight:700; font-size:16px; } .loja { color:var(--fraco); font-size:13px; }
  .recebe { text-align:right; white-space:nowrap; } .recebe b { font-size:20px; color:var(--verde); display:block; } .recebe small { color:var(--fraco); font-size:11px; }
  .numeros { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin:10px 0 6px; }
  .numeros div { background:#151514; border-radius:10px; padding:6px 8px; } .numeros small { color:var(--fraco); font-size:11px; display:block; } .numeros span { font-weight:600; font-size:15px; }
  .numeros .vale { outline:2px solid var(--amarelo); }
  .turnos { width:100%; border-collapse:collapse; margin:10px 0 4px; font-size:14px; }
  .turnos th, .turnos td { text-align:left; padding:6px 4px; border-top:1px solid var(--line); vertical-align:top; }
  .turnos tr:first-child th { border-top:0; color:var(--fraco); font-size:12px; font-weight:600; padding-top:0; }
  .turnos th { width:22%; } .turnos td small { color:var(--fraco); font-size:11px; }
  .turnos td em { display:block; font-style:normal; font-size:12px; }
  .turnos td.bom em { color:var(--verde); } .turnos td.meio em { color:var(--laranja); } .turnos td.ruim, .turnos td.ruim em { color:var(--verm); }
  .turnos td.semfila { color:var(--fraco); font-size:13px; } .turnos td em.cinza { color:var(--fraco); }
  .numeros .sim { color:var(--verde); } .numeros .nao { color:var(--verm); font-size:13px; }
  details.conta { background:none; border:0; border-top:1px dashed var(--line); border-radius:0; padding:8px 0 0; margin-top:8px; }
  details.conta summary { font-weight:600; font-size:13px; color:var(--fraco); } details.conta li { font-size:13px; margin:3px 0 3px 16px; } details.conta ul { margin:6px 0 0; padding:0; }
  .linha { font-size:13px; color:var(--fraco); margin-top:4px; }
  .motivo { font-size:13px; margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); }
  .motivo li { margin:2px 0 2px 16px; } .motivo ul { margin:0; padding:0; }
  .selo { display:inline-block; font-size:11px; padding:2px 7px; border-radius:999px; margin-left:6px; vertical-align:middle; }
  .selo.conf { background:#3a2c10; color:var(--laranja); } .selo.corta { background:#3a1512; color:var(--verm); }
  .aviso { background:#2a1e10; border:1px solid #5a3e14; color:#ffd59a; border-radius:12px; padding:10px 12px; font-size:14px; margin-bottom:10px; }
  .vazio { color:var(--fraco); text-align:center; padding:30px 0; }
  .fonte { color:var(--fraco); font-size:12px; margin:4px 0 12px; }
  details { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 14px; margin-top:16px; }
  summary { font-weight:700; cursor:pointer; } details li { font-size:14px; margin:6px 0; }
  .login { margin-top:40px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; }
  .login label { display:block; font-size:14px; color:var(--fraco); margin:12px 0 4px; }
  .login input { width:100%; height:48px; border-radius:12px; border:1px solid var(--line); background:#151514; color:var(--tx); font-size:17px; padding:0 12px; }
  .login button { width:100%; height:50px; margin-top:18px; border:0; border-radius:12px; background:var(--amarelo); color:#111; font-weight:800; font-size:17px; }
  .erro { color:var(--verm); font-size:14px; margin-top:10px; display:none; }
  .dica { color:var(--fraco); font-size:13px; margin-top:14px; }
  #btnAjuda { display:none !important; }   /* a Ajuda geral do portal não serve para esta tela */
</style>
</head>
<body>
<div id="app"></div>
<script src="../nucleo/nucleo.js?v=20261105g"></script>
<script>
(function () {
  'use strict';
  const app = document.getElementById('app');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const brl = (v) => 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const brl0 = (v) => 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
  const hojeSP = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo' }).format(new Date());
  const somaDias = (d, n) => { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
  const horasTxt = (h) => { if (h == null) return '—'; const m = Math.round(Number(h) * 60); return Math.floor(m / 60) + 'h' + (m % 60 ? String(m % 60).padStart(2, '0') : ''); };
  let DIA = somaDias(hojeSP(), -1), LOJA = 'todas', DADOS = null, SEQ = 0;
  window.exigirLogin = () => telaLogin('Sua sessão venceu. Entre de novo.');

  function telaLogin(recado) {
    app.innerHTML = '<div class="topo"><h1>🛵 Garantido dos motoboys</h1></div>' +
      '<form class="login" id="fLogin"><b>Entrar</b>' + (recado ? '<div class="aviso" style="margin-top:10px">' + esc(recado) + '</div>' : '') +
      '<label for="rmbEmail">Seu nome</label><input id="rmbEmail" autocomplete="username" autocapitalize="none" placeholder="ex.: jaison">' +
      '<label for="rmbSenha">Senha</label><input id="rmbSenha" type="password" autocomplete="current-password">' +
      '<button type="submit">Entrar</button><div class="erro" id="rmbLoginErro"></div>' +
      '<div class="dica">Depois de entrar, use “Adicionar à tela inicial” no navegador para abrir como app.</div></form>';
    document.getElementById('fLogin').onsubmit = async (e) => {
      e.preventDefault();
      const b = e.target.querySelector('button'); b.disabled = true; b.textContent = 'Entrando…';
      const ok = await rmbFazerLogin('');
      if (ok) carregar(); else { b.disabled = false; b.textContent = 'Entrar'; const er = document.getElementById('rmbLoginErro'); if (er) er.textContent = 'Nome ou senha errados.'; }
    };
  }

  function moldura(conteudo) {
    const ontem = somaDias(hojeSP(), -1);
    const d = new Date(DIA + 'T12:00:00');
    const sem = d.toLocaleDateString('pt-BR', { weekday: 'long' });
    const lojas = ['todas'].concat([...new Set((DADOS && DADOS.linhas || []).map((l) => l.loja))]);
    return '<div class="topo"><h1>🛵 Garantido</h1><button class="sair" id="bSair">Sair</button></div>' +
      '<div class="dia"><button id="bAntes" aria-label="Dia anterior">‹</button>' +
      '<div class="meio"><b>' + DIA.slice(8, 10) + '/' + DIA.slice(5, 7) + '</b><small>' + esc(sem) + (DIA === hojeSP() ? ' · hoje, ainda rodando' : '') + '</small>' +
      '<input type="date" id="iDia" value="' + DIA + '" max="' + hojeSP() + '" aria-label="Escolher o dia"></div>' +
      '<button id="bDepois" aria-label="Próximo dia"' + (DIA >= hojeSP() ? ' disabled' : '') + '>›</button></div>' +
      (lojas.length > 2 ? '<div class="lojas">' + lojas.map((k) => '<button data-l="' + esc(k) + '" class="' + (k === LOJA ? 'on' : '') + '">' + (k === 'todas' ? 'Todas' : esc(k)) + '</button>').join('') + '</div>' : '') +
      conteudo;
  }
  function ligar() {
    const q = (id) => document.getElementById(id);
    q('bSair').onclick = () => { localStorage.removeItem('rmbSessao'); telaLogin(''); };
    q('bAntes').onclick = () => { DIA = somaDias(DIA, -1); carregar(); };
    q('bDepois').onclick = () => { if (DIA < hojeSP()) { DIA = somaDias(DIA, 1); carregar(); } };
    q('iDia').onchange = (e) => { if (e.target.value) { DIA = e.target.value > hojeSP() ? hojeSP() : e.target.value; carregar(); } };
    document.querySelectorAll('.lojas button').forEach((b) => { b.onclick = () => { LOJA = b.dataset.l; desenhar(); }; });
  }

  async function carregar() {
    if (!rmbSessao()) { telaLogin(''); return; }
    const seq = ++SEQ; DADOS = null;
    app.innerHTML = moldura('<div class="vazio">Carregando o dia…</div>'); ligar();
    await rmbGarantirTokenValido();
    let r;
    try { r = await trRpc('garantido_motoboys_dia', { p_dia: DIA }); } catch (e) { if (seq === SEQ) falha('Sem internet agora. Tente de novo.'); return; }
    if (seq !== SEQ) return;
    if (r.status === 401) { localStorage.removeItem('rmbSessao'); telaLogin('Sua sessão venceu. Entre de novo.'); return; }
    if (!r.ok) { falha(r.status === 403 || r.status === 400 ? 'Este login ainda não tem acesso ao garantido. Fale com o Fábio.' : await trErroDe(r)); return; }
    DADOS = await r.json();
    if (seq === SEQ) desenhar();
  }
  function falha(msg) { app.innerHTML = moldura('<div class="aviso">' + esc(msg) + '</div>'); ligar(); }

  // Minutos do dia, com a madrugada (antes das 05h) contando como depois da meia-noite do mesmo turno.
  const minDia = (h) => { if (!h) return null; const [a, b] = h.split(':').map(Number); return (a < 5 ? a + 24 : a) * 60 + b; };
  function turnoLinha(nome, esc, escFim, chegou, ehPatio, rodou, tol) {
    const escTxt = esc ? esc + (escFim ? ' às ' + escFim : '') : 'fora da escala';
    let cheg, cls = '';
    if (!rodou) { cheg = esc ? 'não rodou' : '—'; cls = esc ? 'ruim' : ''; }
    else if (!ehPatio) { cheg = 'sem registro na fila' + (chegou ? '<em class="cinza">1ª coleta ' + chegou + '</em>' : ''); cls = 'semfila'; }
    else {
      cheg = chegou;
      if (esc) {
        const d = minDia(chegou) - minDia(esc);
        if (d > tol) { cls = 'ruim'; cheg += '<em>' + d + ' min atrasado</em>'; }
        else if (d > 0) { cls = 'meio'; cheg += '<em>' + d + ' min depois</em>'; }
        else { cls = 'bom'; cheg += '<em>no horário</em>'; }
      }
    }
    return '<tr><th>' + nome + '</th><td>' + esc_(escTxt) + '</td><td class="' + cls + '">' + cheg + '</td></tr>';
  }
  const esc_ = (s) => esc(s);
  function cartao(l) {
    const tol = Number((DADOS && DADOS.tolerancia_min) || 15);
    const motivos = String(l.detalhe || '').split(' · ').filter(Boolean);
    const sai = minDia(l.saida), ch = minDia(l.chegada);
    const rodouAlm = ch != null && ch < 15 * 60;
    const rodouJan = (ch != null && ch >= 15 * 60) || !!l.chegada_jan || (sai != null && sai >= 19 * 60);
    const chegAlm = l.patio_alm || (rodouAlm ? l.chegada : null);
    const chegJan = l.patio_jan || l.chegada_jan || (!rodouAlm ? l.chegada : null);
    let linhas = '';
    if (l.esc_alm || rodouAlm) linhas += turnoLinha('Almoço', l.esc_alm, l.esc_alm_fim, chegAlm, !!l.patio_alm, rodouAlm, tol);
    // Almoço e jantar emendados na escala (fim do almoço = início do jantar) e rodou no almoço: ele já estava na loja.
    const emendou = !l.patio_jan && rodouAlm && rodouJan && l.esc_alm_fim && l.esc_jan && minDia(l.esc_alm_fim) >= minDia(l.esc_jan);
    if (emendou) linhas += '<tr><th>Jantar</th><td>' + esc(l.esc_jan + (l.esc_jan_fim ? ' às ' + l.esc_jan_fim : '')) + '</td><td class="bom">emendou<em>já estava desde o almoço</em></td></tr>';
    else if (l.esc_jan || rodouJan) linhas += turnoLinha('Jantar', l.esc_jan, l.esc_jan_fim, chegJan, !!l.patio_jan, rodouJan, tol);
    const temGar = Number(l.garantido || 0) > 0;
    const garVence = temGar && Number(l.garantido) > Number(l.taxas || 0);
    const semGar = l.corta_dia ? 'perdeu por atraso' : 'não tem';
    return '<div class="cartao' + (l.corta_dia ? ' corta' : '') + '">' +
      '<div class="c1"><div><div class="nome">' + esc(l.nome) + (l.conferir ? '<span class="selo conf">conferir</span>' : '') + '</div>' +
        '<div class="loja">' + esc(l.loja) + ' · saiu ' + esc(l.saida || '—') + '</div></div>' +
        '<div class="recebe"><b>' + brl(l.pagar) + '</b><small>vai ganhar</small></div></div>' +
      '<table class="turnos"><tr><th></th><th>Escala</th><th>Chegou na fila</th></tr>' + linhas + '</table>' +
      '<div class="numeros">' +
        '<div><small>Corridas</small><span>' + Number(l.entregas || 0) + '</span></div>' +
        '<div class="' + (garVence ? 'vale' : '') + '"><small>Garantido</small><span class="' + (temGar ? 'sim' : 'nao') + '">' + (temGar ? 'Sim · ' + brl0(l.garantido) : 'Não · ' + semGar) + '</span></div>' +
        '<div class="' + (!garVence ? 'vale' : '') + '"><small>Taxas</small><span>' + brl0(l.taxas) + '</span></div>' +
      '</div>' +
      (Number(l.cobrar_refeicao) ? '<div class="linha">Refeição a mais descontada: − ' + brl0(l.cobrar_refeicao) + '</div>' : '') +
      (Number(l.ajustes) ? '<div class="linha">Acerto à mão: ' + brl0(l.ajustes) + '</div>' : '') +
      (motivos.length ? '<details class="conta"><summary>Ver a conta</summary><ul>' + motivos.map((m) => '<li>' + esc(m) + '</li>').join('') + '</ul></details>' : '') +
      '</div>';
  }

  function regras() {
    const g = DADOS.regras || {};
    const pisos = (DADOS.piso_turno || []).map((p) => esc(p.loja) + ' ' + esc(p.turno).toLowerCase() + ' R$ ' + Number(p.valor)).join(' · ');
    return '<details><summary>Como o garantido é calculado</summary><ul>' +
      '<li>Recebe o <b>maior</b> entre o garantido e as taxas das entregas, mais acertos, menos as refeições a mais.</li>' +
      '<li>Garantido = horas da escala × valor da hora: <b>R$ ' + Number(g.hora_semana || 0) + '/h</b> na semana, <b>R$ ' + Number(g.hora_fds || 0) + '/h</b> no Água Verde no sábado e domingo. Ahú: R$ 25/h com 1 motoboy no almoço, R$ 20/h com 2; jantar R$ 25/h.</li>' +
      '<li>Escala sem hora de saída: vale o piso do turno (' + pisos + ').</li>' +
      '<li>Turno fora da escala só conta se rodou 1 hora ou mais. Menos que isso, só as entregas.</li>' +
      '<li>Chegou no pátio mais de <b>' + Number(g.tolerancia_min || 0) + ' min</b> depois da escala: perde o garantido e a refeição do dia.</li>' +
      '<li>1 refeição por turno trabalhado. A mais é descontada: R$ ' + Number(g.refeicao || 0).toLocaleString('pt-BR') + (g.refeicao_acomp ? ' (R$ ' + Number(g.refeicao_acomp).toLocaleString('pt-BR') + ' com batata ou onion)' : '') + '.</li>' +
      '<li>Corrida reprovada no TrackEat não entra na conta.</li>' +
      '</ul></details>';
  }

  function desenhar() {
    const linhas = (DADOS.linhas || []).filter((l) => LOJA === 'todas' || l.loja === LOJA);
    const tot = linhas.reduce((a, l) => { a.p += Number(l.pagar || 0); a.e += Number(l.entregas || 0); return a; }, { p: 0, e: 0 });
    const f = DADOS.fontes || {};
    const conferir = linhas.filter((l) => l.conferir).length;
    const semPatio = linhas.length && !linhas.some((l) => l.patio_alm || l.patio_jan);
    const corpo = !linhas.length ? '<div class="vazio">Nenhum motoboy rodou neste dia' + (LOJA === 'todas' ? '' : ' nesta loja') + '.</div>' :
      '<div class="total"><div><b>' + linhas.length + '</b><small>motoboys</small></div><div><b>' + tot.e + '</b><small>corridas</small></div><div><b>' + brl(tot.p) + '</b><small>a receber</small></div></div>' +
      (semPatio ? '<div class="aviso">A chegada na fila ainda não aparece nesta tela. Embaixo de cada turno vai a 1ª coleta no TrackEat só como referência; ela não conta como chegada.</div>' : '') +
      (conferir ? '<div class="aviso">' + conferir + ' com “conferir”: a conta pode mudar depois que o escritório olhar.</div>' : '') +
      linhas.map(cartao).join('');
    app.innerHTML = moldura('<div class="fonte">Entregas do TrackEat carregadas em ' + esc(f.trackeat_carregado_em || '—') + ' · escala gravada em ' + esc(f.escala_gravada_em || '—') + ' · consultado ' + esc(DADOS.agora || '') + '</div>' + corpo + regras());
    ligar();
  }

  carregar();
})();
</script>
</body>
</html>
