<script>
(function () {
  'use strict';
  const app = document.getElementById('app');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const brl = (v) => 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const brl0 = (v) => 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
  const hojeSP = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo' }).format(new Date());
  const somaDias = (d, n) => { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
  const horasTxt = (h) => { if (h == null) return '—'; const m = Math.round(Number(h) * 60); return Math.floor(m / 60) + 'h' + (m % 60 ? String(m % 60).padStart(2, '0') : ''); };
  let DIA = somaDias(hojeSP(), -1), LOJA = 'todas', DADOS = null, SEQ = 0, MODO = (location.hash === '#garantido' ? 'garantido' : 'escala'), DIAE = hojeSP(), LOJAE = 'Água Verde', ESC = null, SUG = null, RECADO = '';
  const maxDia = () => MODO === 'escala' ? somaDias(hojeSP(), 30) : hojeSP();
  // 22/11/2026 (Fábio): o Jaison vê só o último dia — Garantido: ontem e hoje; Escala: de hoje em diante. Donos e quem vê pessoal veem tudo.
  let TUDO = false;
  const diaMin = () => TUDO ? '2000-01-01' : (MODO === 'escala' ? hojeSP() : somaDias(hojeSP(), -1));
  window.exigirLogin = () => telaLogin('Sua sessão venceu. Entre de novo.');

  function telaLogin(recado) {
    app.innerHTML = '<div class="topo"><h1>🛵 Garantido dos motoboys</h1></div>' +
      '<form class="login" id="fLogin"><b>Entrar</b>' + (recado ? '<div class="aviso" style="margin-top:10px">' + esc(recado) + '</div>' : '') +
      '<label for="rmbEmail">Seu nome</label><input id="rmbEmail" autocomplete="username" autocapitalize="none" placeholder="ex.: jaison">' +
      '<label for="rmbSenha">Senha</label><input id="rmbSenha" type="password" autocomplete="current-password">' +
      '<button type="submit">Entrar</button><div class="erro" id="rmbLoginErro"></div>' +
      '<div class="dica">Depois de entrar, use “Adicionar à tela inicial” no navegador para abrir como app.</div></form>';
    document.getElementById('fLogin').onsubmit = async (e) => {
      e.preventDefault();
      const b = e.target.querySelector('button'); b.disabled = true; b.textContent = 'Entrando…';
      const ok = await rmbFazerLogin('');
      if (ok) carregar(); else { b.disabled = false; b.textContent = 'Entrar'; const er = document.getElementById('rmbLoginErro'); if (er) er.textContent = 'Nome ou senha errados.'; }
    };
  }


  // PREVISÃO DO TEMPO (20/11/2026, pedido do Fábio): Open-Meteo direto do navegador, sem robô, mesma fonte da tela Escala e Clima.
  const METEO = 'https://api.open-meteo.com/v1/forecast?latitude=-25.43&longitude=-49.27&hourly=precipitation,precipitation_probability&forecast_days=8&past_days=31&timezone=America%2FSao_Paulo';
  const FERIADOS = { '2026-11-20': 'Consciência Negra', '2026-12-25': 'Natal', '2027-01-01': 'Ano Novo', '2027-02-09': 'Carnaval',
    '2027-03-26': 'Sexta-feira Santa', '2027-04-21': 'Tiradentes', '2027-05-01': 'Dia do Trabalho', '2027-05-27': 'Corpus Christi',
    '2027-09-07': 'Independência', '2027-09-08': 'N. Sra. da Luz (Curitiba)', '2027-10-12': 'N. Sra. Aparecida', '2027-11-02': 'Finados',
    '2027-11-15': 'Proclamação da República', '2027-11-20': 'Consciência Negra', '2027-12-25': 'Natal' };
  // Por hora: { 'AAAA-MM-DD': [{h, p, mm}, ...] }. Hora difícil = chance de 60% ou mais com 0,5 mm ou mais.
  let CLIMA = null;
  async function lerClima() {
    if (CLIMA) return CLIMA;
    try {
      const j = await (await fetch(METEO)).json(); const h = j.hourly || {}; const m = {};
      (h.time || []).forEach((t, i) => { const d = t.slice(0, 10); (m[d] = m[d] || []).push({ h: +t.slice(11, 13), p: Number(h.precipitation_probability[i]) || 0, mm: Number(h.precipitation[i]) || 0 }); });
      CLIMA = m;
    } catch (e) { CLIMA = {}; }
    return CLIMA;
  }
  const nivelPrev = (x) => (x.p >= 60 && x.mm >= 0.5) || x.mm >= 2 ? 2 : (x.p >= 40 && x.mm >= 0.1) ? 1 : 0;
  const nivelFoi = (x) => x.mm >= 0.5 ? 2 : x.mm >= 0.1 ? 1 : 0;
  // Junta horas seguidas de chuva em faixas: "19h às 22h".
  function faixas(hs) {
    const r = []; hs.forEach((x) => { const u = r[r.length - 1]; if (u && x.h === u.f) u.f = x.h + 1; else r.push({ i: x.h, f: x.h + 1 }); });
    return r.map((x) => x.i + 'h às ' + (x.f === 24 ? '0h' : x.f + 'h')).join(' e ');
  }
  const PERIODOS = [['Manhã', 6, 12], ['Tarde', 12, 18], ['Noite', 18, 24]];
  function climaDia(d) {
    const hs = (CLIMA && CLIMA[d]) || []; if (!hs.length) return '';
    const nivel = d < hojeSP() ? nivelFoi : nivelPrev;   // dia passado: só a chuva que caiu (mm); a chance (%) não vale mais
    const per = PERIODOS.map(([nome, i, f]) => {
      const x = hs.filter((y) => y.h >= i && y.h < f), n = Math.max(0, ...x.map(nivel)), mm = x.reduce((a, y) => a + y.mm, 0);
      const chuva = x.filter((y) => nivel(y) > 0);
      return { nome, n, mm, txt: n === 2 ? 'Difícil' : n === 1 ? 'Atenção' : 'Tranquilo', quando: chuva.length ? 'chuva ' + faixas(chuva) : 'sem chuva' };
    });
    const ruins = hs.filter((y) => nivel(y) === 2), alm = ruins.some((y) => y.h >= 10 && y.h < 16), jan = ruins.some((y) => y.h >= 17);
    const amanha = somaDias(d, 1), fer = FERIADOS[d], vesp = FERIADOS[amanha];
    const nomeDia = (d === hojeSP() ? 'Hoje' : d === somaDias(hojeSP(), 1) ? 'Amanhã' : d === somaDias(hojeSP(), -1) ? 'Ontem' : new Date(d + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'long' })) + ' ' + d.slice(8, 10) + '/' + d.slice(5, 7);
    // 22/11/2026 (Fábio): dia que já passou mostra como foi, sem ordem de chamar motoboy
    if (d < hojeSP()) {
      const foi = per.map((x) => '<div class="' + (x.n === 2 ? 'cl-dificil' : x.n === 1 ? 'cl-atencao' : 'cl-facil') + '">' + x.nome + '<span>' + (x.n === 2 ? 'Choveu' : x.n === 1 ? 'Garoou' : 'Sem chuva') + '</span>' + esc(x.quando === 'sem chuva' ? '—' : x.quando.replace('chuva ', '')) + '</div>').join('');
      return '<div class="cl-dia"><b>Como foi · ' + esc(nomeDia) + '</b>' + (fer ? '<span class="cl-fer">' + esc('feriado: ' + fer) + '</span>' : '') +
        '<div class="cl-per">' + foi + '</div>' +
        (ruins.length ? '<div class="cl-ordem">🌧️ ' + esc((alm && jan ? 'Choveu no almoço e no jantar' : alm ? 'Choveu no almoço' : jan ? 'Choveu no jantar' : 'Choveu fora dos turnos') + '. Isso ajuda a explicar atraso e corrida a mais.') + '</div>' : '<div class="cl-ok">☀️ Dia sem chuva forte.</div>') + '</div>';
    }
    const ordens = [];
    if (alm && jan) ordens.push('Vai chover no almoço e no jantar. Veja abaixo quantos motoboys chamar em cada loja.');
    else if (alm) ordens.push('Vai chover no almoço (' + faixas(ruins.filter((y) => y.h >= 10 && y.h < 16)) + '). Veja abaixo quantos motoboys chamar em cada loja.');
    else if (jan) ordens.push('Vai chover no jantar (' + faixas(ruins.filter((y) => y.h >= 17)) + '). Veja abaixo quantos motoboys chamar em cada loja.');
    if (fer) ordens.push('Feriado (' + fer + '). Reforce a escala.');
    else if (vesp) ordens.push('Véspera de feriado (' + vesp + '). Reforce a escala do jantar.');
    return '<div class="cl-dia"><b>' + esc(nomeDia) + '</b>' + (fer || vesp ? '<span class="cl-fer">' + esc(fer ? 'feriado: ' + fer : 'véspera de feriado: ' + vesp) + '</span>' : '') +
      '<div class="cl-per">' + per.map((x) => '<div class="' + (x.n === 2 ? 'cl-dificil' : x.n === 1 ? 'cl-atencao' : 'cl-facil') + '">' + x.nome + '<span>' + x.txt + '</span>' + esc(x.quando) + '</div>').join('') + '</div>' +
      (ordens.length ? ordens.map((o) => '<div class="cl-ordem">👉 ' + esc(o) + '</div>').join('') : '<div class="cl-ok">✅ Sem chuva forte nos turnos. Escala normal.</div>') + '</div>';
  }
  // 22/11/2026 (Fábio): o quadro acompanha o dia escolhido em cima (antes mostrava sempre hoje + 3 dias)
  function climaHtml(dia) {
    if (!CLIMA || !Object.keys(CLIMA).length || !dia) return '';
    const passado = dia < hojeSP();
    const corpo = (CLIMA[dia] ? climaDia(dia) : '<div class="cl-ok">Ainda não há previsão para este dia (a previsão cobre só 7 dias à frente).</div>') + passosHtml(dia);
    return '<details class="clima" open><summary>' + (passado ? '🌦️ Chuva neste dia' : '🌦️ Chuva e o que fazer') + '</summary>' + corpo +
      '<div class="cl-pe">' + (passado ? 'Chuva estimada em Curitiba por hora (Open-Meteo, modelo do tempo, não é medição de estação).' : 'Previsão de Curitiba por hora (Open-Meteo), lida agora. Difícil = chance de 60% ou mais e chuva de verdade. Atenção = pode chuviscar.') + '</div></details>';
  }

  // 22/11/2026 (Fábio): sugestão de motoboys por loja e turno + passo a passo para o Jaison.
  // Base = mediana dos motoboys que rodaram nos últimos 6 dias iguais da semana (TrackEat, escala_sugestao).
  // 22/11/2026 (Fábio): quantos motoboys cabem para CADA UM bater o garantido só com as entregas (sem a loja completar).
  // Teto = arredondar para baixo (entregas previstas ÷ entregas para bater o garantido), mínimo 1.
  // Com previsão de chuva ≥ 3 mm na janela do turno (almoço 11h–15h, jantar 18h–0h), as entregas previstas sobem pelo fator medido
  // no histórico jan–nov/2026 (conversa "Calcular motoboys necessários com chuva", 22/11).
  const LOJA_NOME = { 'AGUA VERDE': 'Água Verde', 'AHU': 'Ahú', 'SÃO BRAZ': 'São Braz' };
  const FATOR_CHUVA = { 'AGUA VERDE': { almoco: 1.10, jantar: 1.00 }, 'AHU': { almoco: 1.20, jantar: 1.10 }, 'SÃO BRAZ': { almoco: 1.25, jantar: 1.15 } };
  function chuvaMm(dia, k) {
    const hs = (CLIMA && CLIMA[dia]) || [];
    return hs.filter((y) => k === 'almoco' ? (y.h >= 11 && y.h < 15) : y.h >= 18).reduce((a, y) => a + y.mm, 0);
  }
  function sugestoes(dia) {
    if (!SUG || SUG.dia !== dia || !ESC) return [];
    return (SUG.linhas || []).filter((x) => x.por_moto > 0).map((x) => {
      const loja = LOJA_NOME[x.unidade] || x.unidade, mm = chuvaMm(dia, x.turno), chuva = mm >= 3;
      const fator = chuva ? ((FATOR_CHUVA[x.unidade] || {})[x.turno] || 1) : 1;
      const prev = Math.round(x.entregas * fator);
      const precisa = Math.max(1, Math.floor(prev / x.por_moto));
      const tem = (ESC.linhas || []).filter((l) => l.loja === loja && l.turno === x.turno).length;
      return Object.assign({}, x, { loja, chuva, mm, fator, prev, precisa, tem, falta: precisa - tem });
    });
  }
  function passosHtml(dia) {
    if (MODO !== 'escala' || dia < hojeSP()) return '';
    const S = sugestoes(dia);
    if (!S.length) return SUG && SUG.dia === dia ? '' : '<div class="cl-ok">Calculando quantos motoboys chamar…</div>';
    const nomeT = { almoco: 'almoço', jantar: 'jantar' };
    const faltam = S.filter((x) => x.falta > 0).sort((a, b) => b.falta - a.falta);
    const sobram = S.filter((x) => x.falta < 0).sort((a, b) => a.falta - b.falta);
    const p = [];
    const conta = (x) => ' Previstas ' + x.prev + ' entregas' + (x.chuva ? ' (com chuva)' : '') + ', cada um precisa de ' + String(x.por_moto).replace('.', ',') + ' para bater o garantido.';
    faltam.forEach((x) => p.push('<b>' + esc(x.loja) + ', ' + nomeT[x.turno] + ':</b> chame mais ' + x.falta + ' motoboy' + (x.falta > 1 ? 's' : '') + '. Tem ' + x.tem + ', cabem ' + x.precisa + '.' + conta(x)));
    sobram.forEach((x) => p.push('<b>' + esc(x.loja) + ', ' + nomeT[x.turno] + ':</b> tem ' + x.tem + ', mas o movimento só dá para ' + x.precisa + ' bater o garantido sem a loja completar. Libere ' + (-x.falta) + ' se puder.' + conta(x)));
    if (!faltam.length && !sobram.length) p.push('<b>Escala certa</b> nas 3 lojas para almoço e jantar. Não precisa mexer.');
    p.push('Pôs alguém? Abra a loja em cima, use <b>➕ Pôr motoboy</b> e depois <b>📲 Copiar para o WhatsApp</b> e cole no grupo.');
    p.push('No dia, confira na aba <b>💰 Garantido</b> quem chegou na fila no horário.');
    const tab = '<table class="sug"><tr><th>Loja</th><th>Almoço</th><th>Jantar</th></tr>' + ['Água Verde', 'Ahú', 'São Braz'].map((l) => '<tr><td>' + l + '</td>' + ['almoco', 'jantar'].map((k) => {
      const x = S.find((y) => y.loja === l && y.turno === k); if (!x) return '<td>—</td>';
      return '<td class="' + (x.falta !== 0 ? 'sug-falta' : 'sug-ok') + '"><b>' + x.tem + ' de ' + x.precisa + '</b>' + (x.chuva ? ' 🌧️' : '') + '</td>';
    }).join('') + '</tr>').join('') + '</table>';
    return '<div class="passos"><b>✅ Passo a passo para ' + esc(dia === hojeSP() ? 'hoje' : dia.slice(8, 10) + '/' + dia.slice(5, 7)) + '</b><ol>' + p.map((t) => '<li>' + t + '</li>').join('') + '</ol>' + tab +
      '<div class="cl-pe">"Cabem" = quantos motoboys conseguem, cada um, bater o garantido só com as entregas: entregas previstas (mediana dos últimos 6 dias iguais da semana no TrackEat, até ' + esc(SUG.dados_ate || '—') + ') ÷ entregas para bater o garantido (horas do turno na escala × R$ ' + esc(String(SUG.r_hora)) + '/h' + (SUG.fds ? ' de fim de semana' : '') + ' ÷ valor médio pago por entrega nas últimas 4 semanas), arredondado para baixo, mínimo 1. Com previsão de chuva de 3 mm ou mais no turno, as entregas previstas sobem conforme o histórico de jan a nov/2026. "Tem" = escala gravada agora.</div></div>';
  }

  function moldura(conteudo) {
    const dia = MODO === 'escala' ? DIAE : DIA;
    const d = new Date(dia + 'T12:00:00');
    const sem = d.toLocaleDateString('pt-BR', { weekday: 'long' });
    const lojas = MODO === 'escala' ? ['Água Verde', 'Ahú', 'São Braz'] : ['todas'].concat([...new Set((DADOS && DADOS.linhas || []).map((l) => l.loja))]);
    const lojaAtual = MODO === 'escala' ? LOJAE : LOJA;
    return cabeca() +
      '<div class="dia"><button id="bAntes" aria-label="Dia anterior"' + (dia <= diaMin() ? ' disabled' : '') + '>‹</button>' +
      '<div class="meio"><b>' + dia.slice(8, 10) + '/' + dia.slice(5, 7) + '</b><small>' + esc(sem) + (dia === hojeSP() ? ' · hoje' + (MODO === 'garantido' ? ', ainda rodando' : '') : '') + '</small>' +
      '<input type="date" id="iDia" value="' + dia + '" min="' + diaMin() + '" max="' + maxDia() + '" aria-label="Escolher o dia"></div>' +
      '<button id="bDepois" aria-label="Próximo dia"' + (dia >= maxDia() ? ' disabled' : '') + '>›</button></div>' +
      (lojas.length > 2 || MODO === 'escala' ? '<div class="lojas">' + lojas.map((k) => '<button data-l="' + esc(k) + '" class="' + (k === lojaAtual ? 'on' : '') + '">' + (k === 'todas' ? 'Todas' : esc(k)) + '</button>').join('') + '</div>' : '') +
      (MODO === 'escala' ? climaHtml(DIAE) : '') + conteudo;
  }
  // 22/11/2026 (Fábio): mesma cabeça nas 3 abas, na ordem Escala, Garantido, Documentos. Cada aba mostra só o seu assunto.
  const ABAS = [['escala', '📋 Escala'], ['garantido', '💰 Garantido'], ['docs', '🪪 Documentos']];
  function cabeca() {
    const t = { escala: 'Escala', garantido: 'Garantido', docs: 'Documentos' }[MODO];
    return '<div class="topo"><h1>🛵 ' + t + '</h1><button class="sair" id="bSair">Sair</button></div>' +
      '<div class="modos">' + ABAS.map(([k, n]) => '<button data-m="' + k + '" class="' + (MODO === k ? 'on' : '') + '">' + n + '</button>').join('') + '</div>';
  }
  // Documentos: abre a tela dos documentos, que com ?de=jaison usa esta mesma cabeça e volta para cá por #escala / #garantido
  function abrirDocs() { location.href = '../delivery/motoboys-documentos.html?de=jaison'; }
  function ligar() {
    const q = (id) => document.getElementById(id);
    const mudaDia = (x) => { if (MODO === 'escala') DIAE = x; else DIA = x; recarregar(); };
    const dia = () => MODO === 'escala' ? DIAE : DIA;
    q('bSair').onclick = () => { localStorage.removeItem('rmbSessao'); telaLogin(''); };
    q('bAntes').onclick = () => { if (dia() > diaMin()) mudaDia(somaDias(dia(), -1)); };
    q('bDepois').onclick = () => { if (dia() < maxDia()) mudaDia(somaDias(dia(), 1)); };
    q('iDia').onchange = (e) => { if (e.target.value) mudaDia(e.target.value > maxDia() ? maxDia() : e.target.value < diaMin() ? diaMin() : e.target.value); };
    document.querySelectorAll('.lojas button').forEach((b) => { b.onclick = () => { if (MODO === 'escala') { LOJAE = b.dataset.l; RECADO = ''; desenharEscala(); } else { LOJA = b.dataset.l; desenhar(); } }; });
    document.querySelectorAll('.modos button').forEach((b) => { b.onclick = () => { if (MODO !== b.dataset.m) { MODO = b.dataset.m; if (MODO === 'escala' && LOJA !== 'todas') LOJAE = LOJA; RECADO = ''; recarregar(); } }; });
  }
  const recarregar = () => { if (MODO !== 'docs') try { history.replaceState(null, '', '#' + MODO); } catch (e) {} return MODO === 'escala' ? carregarEscala() : MODO === 'docs' ? abrirDocs() : carregar(); };

  async function carregar() {
    if (!rmbSessao()) { telaLogin(''); return; }
    const seq = ++SEQ; DADOS = null;
    if (!CLIMA) lerClima().then(() => { if (seq === SEQ && DADOS && MODO === 'garantido') desenhar(); });
    app.innerHTML = moldura('<div class="vazio">Carregando o dia…</div>'); ligar();
    await rmbGarantirTokenValido();
    let r;
    try { r = await trRpc('garantido_motoboys_dia', { p_dia: DIA }); } catch (e) { if (seq === SEQ) falha('Sem internet agora. Tente de novo.'); return; }
    if (seq !== SEQ) return;
    if (r.status === 401) { localStorage.removeItem('rmbSessao'); telaLogin('Sua sessão venceu. Entre de novo.'); return; }
    if (!r.ok) { falha(r.status === 403 || r.status === 400 ? 'Este login ainda não tem acesso ao garantido. Fale com o Fábio.' : await trErroDe(r)); return; }
    DADOS = await r.json();
    if (seq === SEQ) desenhar();
  }
  function falha(msg) { app.innerHTML = moldura('<div class="aviso">' + esc(msg) + '</div>'); ligar(); }

  // Minutos do dia, com a madrugada (antes das 05h) contando como depois da meia-noite do mesmo turno.
  const minDia = (h) => { if (!h) return null; const [a, b] = h.split(':').map(Number); return (a < 5 ? a + 24 : a) * 60 + b; };
  function turnoLinha(nome, esc, escFim, chegou, ehPatio, rodou, tol) {
    const escTxt = esc ? esc + (escFim ? ' às ' + escFim : '') : 'fora da escala';
    let cheg, cls = '';
    if (!rodou) { cheg = esc ? 'não rodou' : '—'; cls = esc ? 'ruim' : ''; }
    else if (!ehPatio) { cheg = 'sem registro na fila' + (chegou ? '<em class="cinza">1ª coleta ' + chegou + '</em>' : ''); cls = 'semfila'; }
    else {
      cheg = chegou;
      if (esc) {
        const d = minDia(chegou) - minDia(esc);
        if (d > tol) { cls = 'ruim'; cheg += '<em>' + d + ' min atrasado</em>'; }
        else if (d > 0) { cls = 'meio'; cheg += '<em>' + d + ' min depois</em>'; }
        else { cls = 'bom'; cheg += '<em>no horário</em>'; }
      }
    }
    return '<tr><th>' + nome + '</th><td>' + esc_(escTxt) + '</td><td class="' + cls + '">' + cheg + '</td></tr>';
  }
  const esc_ = (s) => esc(s);
  function cartao(l) {
    const tol = Number((DADOS && DADOS.tolerancia_min) || 15);
    const motivos = String(l.detalhe || '').split(' · ').filter(Boolean);
    const sai = minDia(l.saida), ch = minDia(l.chegada);
    const rodouAlm = ch != null && ch < 15 * 60;
    const rodouJan = (ch != null && ch >= 15 * 60) || !!l.chegada_jan || (sai != null && sai >= 19 * 60);
    const chegAlm = l.patio_alm || (rodouAlm ? l.chegada : null);
    const chegJan = l.patio_jan || l.chegada_jan || (!rodouAlm ? l.chegada : null);
    let linhas = '';
    if (l.esc_alm || rodouAlm) linhas += turnoLinha('Almoço', l.esc_alm, l.esc_alm_fim, chegAlm, !!l.patio_alm, rodouAlm, tol);
    // Almoço e jantar emendados na escala (fim do almoço = início do jantar) e rodou no almoço: ele já estava na loja.
    const emendou = !l.patio_jan && rodouAlm && rodouJan && l.esc_alm_fim && l.esc_jan && minDia(l.esc_alm_fim) >= minDia(l.esc_jan);
    if (emendou) linhas += '<tr><th>Jantar</th><td>' + esc(l.esc_jan + (l.esc_jan_fim ? ' às ' + l.esc_jan_fim : '')) + '</td><td class="bom">emendou<em>já estava desde o almoço</em></td></tr>';
    else if (l.esc_jan || rodouJan) linhas += turnoLinha('Jantar', l.esc_jan, l.esc_jan_fim, chegJan, !!l.patio_jan, rodouJan, tol);
    const temGar = Number(l.garantido || 0) > 0;
    const garVence = temGar && Number(l.garantido) > Number(l.taxas || 0);
      return '<div class="cartao' + (l.corta_dia ? ' corta' : '') + '">' +
      '<div class="c1"><div><div class="nome">' + esc(l.nome) + (l.conferir ? '<span class="selo conf">conferir</span>' : '') + '</div>' +
        '<div class="loja">' + esc(l.loja) + ' · saiu ' + esc(l.saida || '—') + '</div></div>' +
        '<div class="recebe"><b>' + brl(l.pagar) + '</b><small>vai ganhar</small></div></div>' +
      '<table class="turnos"><tr><th></th><th>Escala</th><th>Chegou na fila</th></tr>' + linhas + '</table>' +
      '<div class="numeros">' +
        '<div><small>Corridas</small><span>' + Number(l.entregas || 0) + '</span></div>' +
        '<div class="' + (garVence ? 'vale' : '') + '"><small>Garantido</small><span class="' + (temGar ? 'sim' : 'nao') + '">' + (temGar ? 'Sim' : 'Não') + '</span></div>' +
        '<div class="' + (!garVence ? 'vale' : '') + '"><small>Taxas</small><span>' + brl0(l.taxas) + '</span></div>' +
      '</div>' +
      (temGar ? '<div class="gar-ok">✅ Tem garantido e refeição: chegou até ' + tol + ' min depois do horário da escala.</div>'
        : l.corta_dia ? '<div class="gar-nao">❌ Sem garantido e sem refeição: chegou mais de ' + tol + ' min atrasado.</div>'
        : '<div class="gar-nao">❌ Sem garantido: não estava na escala ou rodou menos de 1 hora fora dela. Recebe só as taxas.</div>') +
      (Number(l.cobrar_refeicao) ? '<div class="linha">Refeição a mais descontada: − ' + brl0(l.cobrar_refeicao) + '</div>' : '') +
      (Number(l.ajustes) ? '<div class="linha">Acerto à mão: ' + brl0(l.ajustes) + '</div>' : '') +
      (motivos.length ? '<details class="conta"><summary>Ver a conta</summary><ul>' + motivos.map((m) => '<li>' + esc(m) + '</li>').join('') + '</ul></details>' : '') +
      '</div>';
  }

  function regras() {
    const g = DADOS.regras || {};
    const pisos = (DADOS.piso_turno || []).map((p) => esc(p.loja) + ' ' + esc(p.turno).toLowerCase() + ' R$ ' + Number(p.valor)).join(' · ');
    return '<details><summary>Como o garantido é calculado</summary><ul>' +
      '<li>Recebe o <b>maior</b> entre o garantido e as taxas das entregas, mais acertos, menos as refeições a mais.</li>' +
      '<li>Garantido = horas da escala × valor da hora: <b>R$ ' + Number(g.hora_semana || 0) + '/h</b> na semana, <b>R$ ' + Number(g.hora_fds || 0) + '/h</b> no Água Verde no sábado e domingo. Ahú: R$ 25/h com 1 motoboy no almoço, R$ 20/h com 2; jantar R$ 25/h.</li>' +
      '<li>Escala sem hora de saída: vale o piso do turno (' + pisos + ').</li>' +
      '<li>Turno fora da escala só conta se rodou 1 hora ou mais. Menos que isso, só as entregas.</li>' +
      '<li>Chegou no pátio mais de <b>' + Number(g.tolerancia_min || 0) + ' min</b> depois da escala: perde o garantido e a refeição do dia.</li>' +
      '<li>1 refeição por turno trabalhado. A mais é descontada: R$ ' + Number(g.refeicao || 0).toLocaleString('pt-BR') + (g.refeicao_acomp ? ' (R$ ' + Number(g.refeicao_acomp).toLocaleString('pt-BR') + ' com batata ou onion)' : '') + '.</li>' +
      '<li>Corrida reprovada no TrackEat não entra na conta.</li>' +
      '</ul></details>';
  }

  function desenhar() {
    const linhas = (DADOS.linhas || []).filter((l) => LOJA === 'todas' || l.loja === LOJA);
    const tot = linhas.reduce((a, l) => { a.p += Number(l.pagar || 0); a.e += Number(l.entregas || 0); return a; }, { p: 0, e: 0 });
    const f = DADOS.fontes || {};
    const conferir = linhas.filter((l) => l.conferir).length;
    const semPatio = linhas.length && !linhas.some((l) => l.patio_alm || l.patio_jan);
    const corpo = !linhas.length ? '<div class="vazio">Nenhum motoboy rodou neste dia' + (LOJA === 'todas' ? '' : ' nesta loja') + '.</div>' :
      '<div class="total"><div><b>' + linhas.length + '</b><small>motoboys</small></div><div><b>' + tot.e + '</b><small>corridas</small></div><div><b>' + brl(tot.p) + '</b><small>a receber</small></div></div>' +
      (semPatio ? '<div class="aviso">A chegada na fila ainda não aparece nesta tela. Embaixo de cada turno vai a 1ª coleta no TrackEat só como referência; ela não conta como chegada.</div>' : '') +
      (conferir ? '<div class="aviso">' + conferir + ' com “conferir”: a conta pode mudar depois que o escritório olhar.</div>' : '') +
      linhas.map(cartao).join('');
    app.innerHTML = moldura('<div class="fonte">Entregas do TrackEat carregadas em ' + esc(f.trackeat_carregado_em || '—') + ' · escala gravada em ' + esc(f.escala_gravada_em || '—') + ' · consultado ' + esc(DADOS.agora || '') + '</div>' + corpo + regras());
    ligar();
  }

  // ESCALA (21/11/2026, pedido do Fábio): o Jaison põe e tira motoboy. Grava em escala_ajuste no portal novo e vale por cima da cópia automática.
  async function carregarEscala() {
    if (!rmbSessao()) { telaLogin(''); return; }
    const seq = ++SEQ; ESC = null;
    if (!CLIMA) lerClima().then(() => { if (seq === SEQ && ESC && MODO === 'escala') desenharEscala(); });
    app.innerHTML = moldura('<div class="vazio">Carregando a escala…</div>'); ligar();
    await rmbGarantirTokenValido();
    let r;
    try { r = await trRpc('escala_dia', { p_dia: DIAE }); } catch (e) { if (seq === SEQ) falha('Sem internet agora. Tente de novo.'); return; }
    if (seq !== SEQ) return;
    if (r.status === 401) { localStorage.removeItem('rmbSessao'); telaLogin('Sua sessão venceu. Entre de novo.'); return; }
    if (!r.ok) { falha(r.status === 403 ? 'Este login ainda não pode mexer na escala. Fale com o Fábio.' : await trErroDe(r)); return; }
    ESC = await r.json();
    if (seq === SEQ) desenharEscala();
    trRpc('escala_sugestao', { p_dia: DIAE }).then((q) => q.ok ? q.json() : null).then((j) => { if (j && seq === SEQ) { SUG = j; if (ESC && MODO === 'escala') desenharEscala(); } }).catch(() => {});
  }
  const TURNOS = [['almoco', 'Almoço'], ['jantar', 'Jantar']];
  function desenharEscala() {
    const ls = (ESC.linhas || []).filter((l) => l.loja === LOJAE);
    const mot = (ESC.motoboys || []).filter((m) => m.loja === LOJAE);
    const podeMexer = DIAE >= somaDias(hojeSP(), -7);
    const bloco = TURNOS.map(([k, nome]) => {
      const x = ls.filter((l) => l.turno === k);
      const sg = sugestoes(DIAE).find((y) => y.loja === LOJAE && y.turno === k);
      return '<div class="esc-t">' + nome + ' · ' + x.length + ' motoboy' + (x.length === 1 ? '' : 's') + (sg ? ' · <span class="' + (sg.falta !== 0 ? 'sug-falta' : 'sug-ok') + '">' + (sg.falta > 0 ? 'faltam ' + sg.falta + ' (cabem ' + sg.precisa + ')' : sg.falta < 0 ? 'sobram ' + (-sg.falta) + ' (cabem ' + sg.precisa + ')' : 'certo, cabem ' + sg.precisa) + '</span>' : '') + '</div>' +
        (x.length ? x.map((l, i) => '<div class="esc-l"><div><b>' + esc(l.nome) + '</b><small>' + esc(l.inicio + (l.fim ? ' às ' + l.fim : ' · sem hora de saída')) + (l.mexido ? ' · mexido na tela' : '') + (l.id ? '' : ' · sem cadastro no TrackEat') + '</small></div>' +
          (podeMexer ? '<button data-t="' + k + '" data-n="' + esc(l.nome) + '">Tirar</button>' : '') + '</div>').join('') : '<div class="linha">Ninguém na escala.</div>');
    }).join('');
    const form = !podeMexer ? '' : '<form class="esc-f" id="fEsc"><b>➕ Pôr motoboy na escala</b>' +
      '<label for="eTurno">Turno</label><select id="eTurno"><option value="almoco">Almoço</option><option value="jantar">Jantar</option></select>' +
      '<label for="eMoto">Motoboy</label><select id="eMoto"><option value="">Escolha…</option>' + mot.map((m) => '<option value="' + m.id + '">' + esc(m.nome) + '</option>').join('') + '<option value="outro">Outro (digitar o nome)</option></select>' +
      '<input id="eNome" placeholder="Nome do motoboy" style="display:none;margin-top:8px">' +
      '<div class="dois"><div><label for="eIni">Entrada</label><input id="eIni" type="time" value="18:00"></div><div><label for="eFim">Saída</label><input id="eFim" type="time" value="23:59"></div></div>' +
      '<button class="salvar" type="submit">Salvar na escala</button><div class="erro" id="eErro"></div></form>';
    const acoes = '<div class="esc-acoes">' + (podeMexer ? '<button id="bCopiaSem">🔁 Copiar a semana passada</button>' : '') + '<button id="bZap">📲 Copiar para o WhatsApp</button></div>';
    app.innerHTML = moldura((RECADO ? '<div class="ok">' + esc(RECADO) + '</div>' : '') + acoes +
      (ls.length ? '' : '<div class="aviso">Ainda não tem escala da ' + esc(LOJAE) + ' neste dia.</div>') + bloco + form +
      '<div class="fonte">A escala do WhatsApp continua chegando sozinha a cada 5 minutos. O que você muda aqui fica valendo por cima dela e já entra no garantido.</div>');
    ligar();
    document.querySelectorAll('.esc-l button').forEach((b) => {
      b.onclick = async () => {
        if (!b.classList.contains('conf')) { b.classList.add('conf'); b.textContent = 'Confirmar'; return; }
        b.disabled = true; b.textContent = 'Tirando…';
        await mexer({ p_turno: b.dataset.t, p_nome: b.dataset.n, p_id: null, p_inicio: null, p_fim: null, p_acao: 'tirar' }, b.dataset.n + ' saiu da escala.');
      };
    });
    document.getElementById('bZap').onclick = async (ev) => {
      const dd = new Date(DIAE + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit' });
      const txt = '*Escala ' + LOJAE + ' — ' + dd + '*\n' + TURNOS.map(([k, nome]) => {
        const x = ls.filter((l) => l.turno === k);
        return '\n*' + nome + '*\n' + (x.length ? x.map((l) => '• ' + l.nome + ' — ' + l.inicio + (l.fim ? ' às ' + l.fim : '')).join('\n') : '• ninguém');
      }).join('\n') + '\n\nChegar no horário: até 15 min de atraso mantém o garantido e a refeição.';
      try { await navigator.clipboard.writeText(txt); ev.target.textContent = '✅ Copiado! Cole no grupo'; }
      catch (e) { const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); ev.target.textContent = '✅ Copiado! Cole no grupo'; }
    };
    const bc = document.getElementById('bCopiaSem');
    if (bc) bc.onclick = async () => {
      const fim = somaDias(DIAE, 6);
      if (!bc.classList.contains('conf')) { bc.classList.add('conf'); bc.textContent = 'Confirmar: ' + DIAE.slice(8, 10) + '/' + DIAE.slice(5, 7) + ' a ' + fim.slice(8, 10) + '/' + fim.slice(5, 7); return; }
      bc.disabled = true; bc.textContent = 'Copiando…';
      await rmbGarantirTokenValido();
      let r; try { r = await trRpc('escala_copiar_semana', { p_inicio: DIAE, p_loja: LOJAE }); } catch (e) { falha('Sem internet agora. Nada foi mudado.'); return; }
      if (!r.ok) { RECADO = ''; const m = await trErroDe(r); await carregarEscala(); const er = document.getElementById('eErro'); if (er) { er.textContent = 'Não copiou: ' + m; er.style.display = 'block'; } return; }
      const j = await r.json();
      RECADO = '✅ Copiei ' + j.copiados + ' lugar' + (j.copiados === 1 ? '' : 'es') + ' da semana passada para ' + LOJAE + '.' + (j.dias_que_ja_tinham ? ' ' + j.dias_que_ja_tinham + ' dia(s) já tinham escala e ficaram como estavam.' : '');
      await carregarEscala();
    };
    const f = document.getElementById('fEsc'); if (!f) return;
    const sel = document.getElementById('eMoto'), nome = document.getElementById('eNome'), tur = document.getElementById('eTurno');
    sel.onchange = () => { nome.style.display = sel.value === 'outro' ? '' : 'none'; };
    tur.onchange = () => { const al = tur.value === 'almoco'; document.getElementById('eIni').value = al ? '11:00' : '18:00'; document.getElementById('eFim').value = al ? '15:00' : '23:59'; };
    tur.value = 'jantar';
    f.onsubmit = async (e) => {
      e.preventDefault();
      const er = document.getElementById('eErro'); er.style.display = 'none';
      const id = sel.value && sel.value !== 'outro' ? Number(sel.value) : null;
      const n = id ? sel.options[sel.selectedIndex].text : nome.value.trim();
      const ini = document.getElementById('eIni').value, fim = document.getElementById('eFim').value;
      if (!n || !ini) { er.textContent = 'Escolha o motoboy e a hora de entrada.'; er.style.display = 'block'; return; }
      const b = f.querySelector('.salvar'); b.disabled = true; b.textContent = 'Salvando…';
      await mexer({ p_turno: tur.value, p_nome: n, p_id: id, p_inicio: ini, p_fim: fim || null, p_acao: 'por' }, n + ' entrou no ' + (tur.value === 'almoco' ? 'almoço' : 'jantar') + '.');
    };
  }
  async function mexer(arg, ok) {
    await rmbGarantirTokenValido();
    let r;
    try { r = await trRpc('escala_mexer', Object.assign({ p_dia: DIAE, p_loja: LOJAE }, arg)); } catch (e) { RECADO = ''; falha('Sem internet agora. Nada foi mudado. Tente de novo.'); return; }
    if (!r.ok) { const m = await trErroDe(r); RECADO = ''; await carregarEscala(); const er = document.getElementById('eErro'); if (er) { er.textContent = 'Não salvou: ' + m; er.style.display = 'block'; } return; }
    RECADO = '✅ ' + ok; DADOS = null; await carregarEscala();
  }

  (async () => {
    try { await carregarEmailDono(); } catch (e) {}
    const em = String((rmbSessao() || {}).email || '').toLowerCase();
    TUDO = (typeof souODono === 'function' && souODono()) || em === 'hellen@cidadaodomundo.com.br';
    recarregar();
  })();
})();
</script>
