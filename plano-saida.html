<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Plano de saída</title>
<!-- Plano de saída do Neto, lido AO VIVO de transicao_itens (fases 10-15 = plano; 90 = arquivo da revisão de 22/10).
     Só abre com login: a tabela tem RLS (pode_ver_plano = Neto e Fabio). Feita pelo chat "Plano de saída" em 23/10/2026
     (dono: "não tem como colocar o plano de um jeito melhor pro Fabio acessar, um html talvez" e "deixar mais claro os já
     resolvidos ... e o que está em andamento, separar melhor isso"). A rotina atualizar-plano-saida atualiza os dados. -->
<style>
  :root { --fundo:#FAF8F7; --papel:#FFFFFF; --alt:#F3EEEC; --tinta:#241C1B; --suave:#4E4442; --mudo:#756A67;
          --linha:#E4DBD8; --forte:#CFC2BE; --acento:#C8102E; --acento-fundo:#FBE9EC;
          --anda:#8A5A00; --anda-fundo:#FBF0DC; --ok:#2F6B4F; --ok-fundo:#E6F1EB; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
          --fundo:#161211; --papel:#1E1817; --alt:#262020; --tinta:#F2EBE9; --suave:#D6CBC8; --mudo:#A29793;
          --linha:#332A29; --forte:#453A38; --acento:#FF5A70; --acento-fundo:#3A1B20;
          --anda:#E8B55A; --anda-fundo:#2E2415; --ok:#7BC4A0; --ok-fundo:#1C2E25; } }
  :root[data-theme="dark"] { --fundo:#161211; --papel:#1E1817; --alt:#262020; --tinta:#F2EBE9; --suave:#D6CBC8; --mudo:#A29793;
          --linha:#332A29; --forte:#453A38; --acento:#FF5A70; --acento-fundo:#3A1B20;
          --anda:#E8B55A; --anda-fundo:#2E2415; --ok:#7BC4A0; --ok-fundo:#1C2E25; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fundo); color:var(--tinta); font-family:"Segoe UI",system-ui,sans-serif; line-height:1.5; }
  .wrap { max-width:900px; margin:0 auto; padding:24px 16px 64px; }
  .eyebrow { font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--acento); font-weight:600; margin:0; }
  h1 { font-size:1.8rem; line-height:1.1; margin:.35rem 0 .3rem; }
  .lede { color:var(--suave); margin:0 0 1rem; }
  h2 { font-size:1.1rem; margin:1.8rem 0 .6rem; display:flex; align-items:center; gap:8px; }
  h2 .n { font-size:.8rem; font-weight:600; padding:1px 8px; border-radius:999px; background:var(--alt); color:var(--mudo); }
  h2.anda { color:var(--anda); } h2.ok { color:var(--ok); }
  .fase { font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--mudo); margin:1rem 0 .4rem; font-weight:600; }
  .item { background:var(--papel); border:1px solid var(--linha); border-radius:6px; padding:12px 14px; margin-bottom:8px; }
  .item.anda { border-left:4px solid var(--anda); } .item.pend { border-left:4px solid var(--forte); }
  .topo { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:baseline; }
  .tit { font-weight:600; }
  .quem { font-size:.75rem; color:var(--mudo); }
  .data { font-size:.75rem; color:var(--acento); }
  .andou { margin:.5rem 0 0; padding:8px 10px; background:var(--anda-fundo); border-radius:4px; font-size:.9rem; color:var(--tinta); }
  .andou b { color:var(--anda); font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; margin-right:4px; }
  details.det > summary { cursor:pointer; color:var(--mudo); font-size:.8rem; margin-top:.4rem; }
  .det p { white-space:pre-wrap; color:var(--suave); font-size:.9rem; margin:.4rem 0 0; }
  a { color:var(--acento); }
  details.bloco { background:var(--papel); border:1px solid var(--linha); border-radius:6px; margin-bottom:10px; }
  details.bloco > summary { cursor:pointer; padding:12px 14px; font-weight:600; list-style:none; display:flex; gap:8px; align-items:center; }
  details.bloco > summary::before { content:"▸"; color:var(--mudo); }
  details.bloco[open] > summary::before { content:"▾"; }
  details.bloco .corpo { padding:0 14px 10px; }
  .linha { border-top:1px solid var(--linha); padding:8px 0; }
  .linha .tit { font-weight:500; }
  .linha .quando { font-size:.75rem; color:var(--mudo); margin-left:6px; }
  .vazio { color:var(--mudo); font-size:.9rem; }
  .missao { background:var(--acento-fundo); border-left:4px solid var(--acento); border-radius:4px; padding:10px 14px; margin:0 0 1rem; }
  .rascunho { font-size:.8rem; color:var(--mudo); margin:-.3rem 0 .6rem; }
  .jan p { white-space:pre-wrap; color:var(--suave); font-size:.9rem; margin:.4rem 0 0; }
  .login { max-width:360px; margin:12vh auto; background:var(--papel); border:1px solid var(--forte); border-radius:8px; padding:20px; }
  .login input { width:100%; padding:10px; margin:6px 0 10px; border:1px solid var(--forte); border-radius:4px; background:var(--fundo); color:var(--tinta); font:inherit; }
  .login button, .sair { background:var(--acento); color:#fff; border:0; border-radius:4px; padding:10px 14px; font:inherit; cursor:pointer; }
  .sair { background:transparent; color:var(--mudo); border:1px solid var(--forte); padding:4px 10px; font-size:.8rem; }
  .erro { color:var(--acento); font-size:.85rem; }
  footer { margin-top:2rem; color:var(--mudo); font-size:.8rem; }
  /* 25/11/2026 [migracao]: seção "Migração sem Claude — entrega 01/12" (dono pelo Organizador 14:58; fonte migracao_passos) */
  .mig { background:var(--papel); border:1px solid var(--linha); border-radius:8px; padding:14px 16px; margin:0 0 1rem; }
  .mig-nums { display:flex; flex-wrap:wrap; gap:8px; margin:.2rem 0 .8rem; }
  .mig-nums span { padding:4px 12px; border-radius:999px; font-size:.85rem; font-weight:700; background:var(--alt); color:var(--mudo); }
  .mig-nums .feito { background:var(--ok-fundo); color:var(--ok); } .mig-nums .andamento { background:var(--anda-fundo); color:var(--anda); }
  .mig-nums .travado { background:var(--acento-fundo); color:var(--acento); }
  .mig-barra { position:relative; height:12px; background:var(--alt); border-radius:999px; overflow:hidden; }
  .mig-barra i { position:absolute; left:0; top:0; bottom:0; background:var(--ok); border-radius:999px; }
  .mig-tempo { position:relative; height:18px; font-size:.72rem; color:var(--mudo); margin-top:4px; }
  .mig-tempo b { position:absolute; transform:translateX(-50%); color:var(--acento); white-space:nowrap; }
  .mig-tempo span { position:absolute; } .mig-tempo span.fim { right:0; }
  .mig-filtro { display:flex; flex-wrap:wrap; gap:6px; margin:.9rem 0 .2rem; }
  .mig-filtro button { border:1px solid var(--forte); background:var(--papel); color:var(--tinta); border-radius:999px; padding:4px 11px; font:inherit; font-size:.85rem; cursor:pointer; }
  .mig-filtro button.on { background:var(--acento); color:#fff; border-color:var(--acento); }
  .mig-l { display:flex; gap:10px; align-items:flex-start; border-top:1px solid var(--linha); padding:7px 0; font-size:.92rem; }
  .mig-l .bola { width:10px; height:10px; border-radius:50%; margin-top:7px; flex:none; background:var(--forte); }
  .mig-l .bola.feito { background:var(--ok); } .mig-l .bola.andamento { background:var(--anda); } .mig-l .bola.travado { background:var(--acento); }
  .mig-l .tx { flex:1; min-width:0; } .mig-l .meta { font-size:.75rem; color:var(--mudo); }
  .mig-l .meta .atraso { color:var(--acento); font-weight:700; } .mig-l .trav { font-size:.82rem; color:var(--acento); }
  .mig-l.feito .tx { color:var(--mudo); }
  .chk { font-size:.72rem; color:var(--mudo); white-space:nowrap; } .chk.sim { color:var(--ok); } .chk.nao { color:var(--acento); }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="vazio">Carregando…</p></div>
<script>
const SUPABASE_URL = "https://rtmgzsikwglsvpopbfbw.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0bWd6c2lrd2dsc3Zwb3BiZmJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NDgwMjcsImV4cCI6MjEwMTQyNDAyN30.-vwbQkcuAbbonmBVCeUWXjTg54uB5MNN94QmMlBxTA4";
const app = document.getElementById('app');
let ITENS = [];
// As 6 entregas do dono (30/10/2026); item novo da fase 10 fora daqui aparece em "Outras".
const ENTREGAS = [
  ['1. Estoque e produção', ['m-estoque']],
  ['2. Financeiro e RH', ['m-financeiro', 'm-rh']],
  ['3. Compras e orçamentos', ['m-compras', 'm-atacado']],
  ['4. Lojinha no lugar do ePadoca', ['m-lojinha']],
  ['5. Rotinas do computador da loja', ['adm-mini-pc']],
  ['6. Juntar os painéis e separar as bases', ['unificar', 'separar-bases']],
];

// Mesma sessão do painel (localStorage 'rmbSessao'). Esta página NUNCA renova o token: o refresh_token é de uso
// único e dois renovando derrubam o login do painel. Sessão vencida = pede o login de novo.
function sessao() { try { return JSON.parse(localStorage.getItem('rmbSessao') || 'null'); } catch (e) { return null; } }
function sessaoValida() { const s = sessao(); return s && s.access_token && (!s.expira_em || s.expira_em > Date.now() + 60000) ? s : null; }
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const comLinks = t => esc(t).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">abrir</a>');
const dataBR = d => d ? d.slice(8,10) + '/' + d.slice(5,7) : '';

function telaLogin(msg) {
  app.innerHTML = `<div class="login"><p class="eyebrow">Cidadão do Mundo</p><h1 style="font-size:1.3rem">Plano de saída</h1>
    <p class="lede">Entre com o mesmo e-mail e senha do painel.</p>
    <label>Nome<input id="e" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username" placeholder="seu nome (ex.: rita)"></label>
    <label>Senha<input id="s" type="password" autocomplete="current-password"></label>
    <button id="b">Entrar</button><p class="erro" id="m">${esc(msg || '')}</p></div>`;
  const ir = async () => {
    const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, { method:'POST',
      headers:{ apikey:SUPABASE_ANON_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ email:((t) => { t = String(t || '').trim(); return !t || t.includes('@') ? t : t.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, '').toLowerCase() + '@cidadaodomundo.com.br'; })(document.getElementById('e').value), password:document.getElementById('s').value }) });   // 29/10/2026: só o nome basta
    const s = await r.json();
    if (!r.ok || !s.access_token) { document.getElementById('m').textContent = 'E-mail ou senha não conferem.'; return; }
    localStorage.setItem('rmbSessao', JSON.stringify({ access_token:s.access_token, refresh_token:s.refresh_token,
      email:(s.user && s.user.email) || '', expira_em: Date.now() + (s.expires_in || 3600) * 1000 }));
    carregar();
  };
  document.getElementById('b').onclick = ir;
  document.getElementById('s').onkeydown = e => { if (e.key === 'Enter') ir(); };
}

async function carregar() {
  const s = sessaoValida();
  if (!s) return telaLogin();
  const r = await fetch(`${SUPABASE_URL}/rest/v1/transicao_itens?select=*&order=fase_ordem,ordem`,
    { headers:{ apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${s.access_token}` } });
  if (r.status === 401) return telaLogin('Sessão vencida, entre de novo.');
  ITENS = r.ok ? await r.json() : [];
  // 25/11/2026 [migracao]: os passos da migração sem Claude (mesma RLS pode_ver_plano)
  const rm = await fetch(`${SUPABASE_URL}/rest/v1/migracao_passos?select=id,fase,passo,responsavel,prazo,situacao,travado_por,atualizado_em&order=fase,prazo,id`,
    { headers:{ apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${s.access_token}` } }).catch(() => null);
  MIG = rm && rm.ok ? await rm.json() : [];
  // 25/11/2026 17:00 [migracao] (rumo final do dono, livro chat-frente-organizador/respostas/migrar-rotinas-escritas-fabio-escolhe):
  // a migração é POR ROTINA (rotina_migracao, RLS pode_ver_plano)
  const rr = await fetch(`${SUPABASE_URL}/rest/v1/rotina_migracao?select=rotina,tipo,nome,lote,lote_data,situacao,placar_ok,texto_ok,regras_ok,atualizado_em&order=lote,nome`,
    { headers:{ apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${s.access_token}` } }).catch(() => null);
  ROTM = rr && rr.ok ? await rr.json() : [];
  // 25/11/2026 [migracao]: selo do estoque ("X de Y itens confiáveis", ±3%; livro chat-frente-organizador/respostas/selo-por-modulo-e-margem-3)
  const hh = { headers:{ apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${s.access_token}` } };
  const [rs1, rs2] = await Promise.all([
    fetch(`${SUPABASE_URL}/rest/v1/vw_est_selo_resumo?select=unidade,data_partida,data_contagem,itens,confiaveis,texto,selo_modulo`, hh).catch(() => null),
    fetch(`${SUPABASE_URL}/rest/v1/vw_est_selo_item?select=unidade,nome_saipos,un,esperado,contado,diferenca,dif_pct,selo,motivo,conserto`, hh).catch(() => null)]);
  SELO = { res: rs1 && rs1.ok ? await rs1.json() : [], itens: rs2 && rs2.ok ? await rs2.json() : [] };
  if (!ITENS.length) { app.innerHTML = `<p class="vazio">Este login não tem acesso ao plano (é só do Neto e do Fabio).</p>
      <button class="sair" onclick="localStorage.removeItem('rmbSessao');carregar()">entrar com outro login</button>`; return; }
  desenhar();
}

// ---- Migração sem Claude — entrega 01/12 (25/11/2026 [migracao]; dono: "um passo a passo dessa migração, resumido e
// objetivo, onde eu possa ver o que está em andamento, já foi feito, etc."). Travados primeiro, depois por prazo.
let MIG = [], MIG_F = 'todos';
// 25/11 15:10 (dono: "vai depender do Claude, mas do Claude do Fabio"): 4 fases
const MIG_FASES = { 1:'1. Consertar e congelar', 2:'2. Regras por módulo', 3:'3. Trocar as contas para o Fabio', 4:'4. Teste' };
const MIG_ORD = { travado:0, andamento:1, 'a fazer':2, feito:3 };
const MIG_INICIO = '2026-11-25', MIG_FIM = '2026-12-01';
// ---- Rotina a rotina (rumo final 25/11 15:25: "garantir que cada rotina esteja escrita 100% corretamente e ir passando
// isso pro robo do Fabio"). Situação: escrita → validada → entregue → migrada. Lista por lote, com a ficha no GitHub.
let ROTM = [], ROTM_F = 'todos';
const ROTM_SIT = ['escrita', 'validada', 'entregue', 'migrada'];
const ROTM_COR = { escrita:'var(--forte)', validada:'var(--anda)', entregue:'var(--acento)', migrada:'var(--ok)' };
const ROTM_LOTE = { 1:'Financeiro', 2:'Estoque e compras', 3:'RH e avisos', 4:'iFood, promoções, cardápio e entrega', 5:'Vigias e infraestrutura' };
const ROTM_FICHA = 'https://github.com/cidadaodomundo-erp/ifood-dashboard-core/blob/master/contexto/para-fabio/rotinas/';
function migHtml() {
  const hoje = new Date().toLocaleDateString('en-CA', { timeZone:'America/Sao_Paulo' });
  const dias = (a, b) => (new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5;
  const posHoje = Math.max(0, Math.min(100, dias(MIG_INICIO, hoje) * 100 / dias(MIG_INICIO, MIG_FIM)));
  let h = `<h2>Migração para o Fabio — entrega 01/12</h2>
    <p class="rascunho"><a href="saude-rotinas.html">Saúde das rotinas ›</a> — as rotinas que rodam sozinhas, com farol e o que fazer se parar.</p>`;
  if (ROTM.length) {
    const n = k => ROTM.filter(x => x.situacao === k).length, T = ROTM.length;
    const sem = new Date(hoje + 'T12:00:00');
    const dsem = d => ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'][new Date(d + 'T12:00:00').getDay()];
    const ok = (v, rot) => `<span class="chk ${v === true ? 'sim' : v === false ? 'nao' : ''}" title="${rot}: ${v === true ? 'ok' : v === false ? 'falta' : 'ainda não conferido'}">${v === true ? '✓' : v === false ? '✗' : '–'} ${rot}</span>`;
    const vis = ROTM.filter(x => ROTM_F === 'todos' || x.situacao === ROTM_F);
    const lotes = [...new Set(ROTM.map(x => x.lote))].sort((a, b) => a - b);
    const corpo = lotes.map(l => { const L = vis.filter(x => x.lote === l); if (!L.length) return '';
      const d = (ROTM.find(x => x.lote === l) || {}).lote_data, atr = d && d < hoje;
      return `<div class="fase">${l}. ${esc(ROTM_LOTE[l] || 'Lote ' + l)}${d ? ` · ${dsem(d)} ${dataBR(d)}` : ''} · ${L.length}</div>` + L.map(x => `
        <div class="mig-l"><span class="bola" style="background:${ROTM_COR[x.situacao] || 'var(--forte)'}" title="${esc(x.situacao)}"></span><div class="tx">${esc(x.nome || x.rotina)}
          <div class="meta">${esc(x.situacao)}${atr && x.situacao !== 'migrada' ? ' <span class="atraso">(lote passou do dia)</span>' : ''} · ${x.tipo === 'windows' ? 'tarefa do Windows' : 'rotina do Claude'} · ${ok(x.placar_ok, '7 dias sem falha')} ${ok(x.texto_ok, 'texto')} ${ok(x.regras_ok, 'regras')}
            · <a href="${ROTM_FICHA}${encodeURIComponent(x.rotina)}.md" target="_blank" rel="noopener">ficha ›</a></div></div></div>`).join(''); }).join('') || '<p class="vazio">Nada aqui para este filtro.</p>';
    h += `<div class="mig">
      <div class="mig-nums">${ROTM_SIT.map(k => `<span style="background:var(--alt);color:var(--tinta)"><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${ROTM_COR[k]};margin-right:5px"></i>${n(k)} ${k}${n(k) === 1 ? '' : 's'}</span>`).join('')}</div>
      <div class="mig-barra" title="de ${T} rotinas">${(() => { let acc = 0; return ROTM_SIT.slice().reverse().map(k => { const w = n(k) * 100 / T; const s = `<i style="left:${acc}%;width:${w}%;background:${ROTM_COR[k]};border-radius:0"></i>`; acc += w; return s; }).join(''); })()}</div>
      <div class="mig-tempo"><span>${n('migrada')} de ${T} migradas · 25/11</span><b style="left:${posHoje}%">hoje</b><span class="fim">ter 01/12</span></div>
      <div class="mig-filtro">${[['todos', 'Todas'], ...ROTM_SIT.map(k => [k, k[0].toUpperCase() + k.slice(1) + 's'])]
        .map(([k, t]) => `<button class="${ROTM_F === k ? 'on' : ''}" onclick="ROTM_F='${k}';desenhar()">${t} · ${k === 'todos' ? T : n(k)}</button>`).join('')}</div>
      ${corpo}
      <p class="rascunho" style="margin-top:.6rem">Cada rotina passa por: escrita (a ficha) → validada (conferida rodando) → entregue (ao robô do Fabio) → migrada. A ficha abre no GitHub, com o login do GitHub.</p>
    </div>`;
  }
  h += seloHtml();
  if (MIG.length) h += `<details class="bloco"><summary>Consertos, regras e contas <span class="n" style="font-weight:400;color:var(--mudo)">${MIG.filter(x => x.situacao === 'feito').length} de ${MIG.length} feitos</span></summary><div class="corpo">${migPassosHtml()}</div></details>`;
  return h;
}
// selo por módulo: hoje só o estoque tem (uma linha por loja); vermelho primeiro, sem botões
let SELO = { res: [], itens: [] };
function seloHtml() {
  if (!SELO.res.length) return '';
  const num = v => v == null ? '—' : Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 3 });
  return SELO.res.map(r => { const ok = /CONFI/i.test(r.selo_modulo || '');
    const I = SELO.itens.filter(x => x.unidade === r.unidade).sort((a, b) => (a.selo === b.selo ? 0 : a.selo === 'EM CONSERTO' ? -1 : 1) || String(a.nome_saipos).localeCompare(String(b.nome_saipos)));
    return `<details class="bloco"><summary>Selo do estoque (${esc(r.unidade)}): <span style="color:${ok ? 'var(--ok)' : 'var(--acento)'}">${esc(r.texto || '')} · ${ok ? 'confiável' : 'em conserto'}</span>
      <span class="n" style="font-weight:400;color:var(--mudo)">contagem de ${dataBR(r.data_contagem)} contra ${dataBR(r.data_partida)} · margem 3%</span></summary>
      <div class="corpo">${I.map(x => { const v = x.selo === 'EM CONSERTO'; return `<div class="mig-l"><span class="bola" style="background:${v ? 'var(--acento)' : 'var(--ok)'}"></span><div class="tx">${esc(x.nome_saipos)}
        <div class="meta">esperado ${num(x.esperado)} · contado ${num(x.contado)} ${esc(String(x.un || '').toLowerCase())} · diferença ${x.dif_pct != null ? num(x.dif_pct) + '%' : '—'} · ${v ? 'em conserto' : 'confiável'}</div>
        ${x.motivo ? `<div class="meta">por quê: ${esc(x.motivo)}${x.conserto ? ' · o que falta: ' + esc(x.conserto) : ''}</div>` : ''}</div></div>`; }).join('')}</div></details>`; }).join('');
}
function migPassosHtml() {
  if (!MIG.length) return '';
  const hoje = new Date().toLocaleDateString('en-CA', { timeZone:'America/Sao_Paulo' });
  const n = k => MIG.filter(x => x.situacao === k).length;
  const pct = Math.round(n('feito') * 100 / MIG.length);
  const dias = (a, b) => (new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5;
  const posHoje = Math.max(0, Math.min(100, dias(MIG_INICIO, hoje) * 100 / dias(MIG_INICIO, MIG_FIM)));
  const vis = MIG.filter(x => MIG_F === 'todos' || x.situacao === MIG_F);
  const linha = x => { const atrasado = x.prazo && x.prazo < hoje && x.situacao !== 'feito';
    return `<div class="mig-l ${esc(x.situacao)}"><span class="bola ${esc(x.situacao)}" title="${esc(x.situacao)}"></span><div class="tx">${esc(x.passo)}
      <div class="meta">${esc(x.responsavel || '')}${x.prazo ? ` · <span class="${atrasado ? 'atraso' : ''}">até ${dataBR(x.prazo)}${atrasado ? ' (passou)' : ''}</span>` : ''} · ${esc(x.situacao)}</div>
      ${x.situacao === 'travado' && x.travado_por ? `<div class="trav">travado por: ${esc(x.travado_por)}</div>` : ''}</div></div>`; };
  const fases = [...new Set(MIG.map(x => x.fase))].sort();
  const corpo = fases.map(f => { const l = vis.filter(x => x.fase === f).sort((a, b) => (MIG_ORD[a.situacao] ?? 9) - (MIG_ORD[b.situacao] ?? 9) || String(a.prazo || '9').localeCompare(String(b.prazo || '9')));
    return l.length ? `<div class="fase">${esc(MIG_FASES[f] || 'Fase ' + f)} · ${l.length}</div>${l.map(linha).join('')}` : ''; }).join('') || '<p class="vazio">Nada aqui para este filtro.</p>';
  const ult = MIG.map(x => x.atualizado_em).filter(Boolean).sort().pop();
  return `<div class="mig" style="border:0;padding:0;margin:0">
      <div class="mig-nums"><span class="feito">${n('feito')} feito${n('feito') === 1 ? '' : 's'}</span><span class="andamento">${n('andamento')} em andamento</span>
        <span>${n('a fazer')} a fazer</span>${n('travado') ? `<span class="travado">${n('travado')} travado${n('travado') === 1 ? '' : 's'}</span>` : ''}</div>
      <div class="mig-barra" title="${pct}% feito"><i style="width:${pct}%"></i></div>
      <div class="mig-tempo"><span>${pct}% feito · 25/11</span><b style="left:${posHoje}%">hoje</b><span class="fim">ter 01/12</span></div>
      <div class="mig-filtro">${[['todos', 'Todos'], ['travado', 'Travados'], ['andamento', 'Em andamento'], ['a fazer', 'A fazer'], ['feito', 'Feitos']]
        .map(([k, t]) => `<button class="${MIG_F === k ? 'on' : ''}" onclick="MIG_F='${k}';desenhar()">${t} · ${k === 'todos' ? MIG.length : n(k)}</button>`).join('')}</div>
      ${corpo}
      ${ult ? `<p class="rascunho" style="margin-top:.6rem">Situação atualizada em ${dataBR(ult.slice(0, 10))} ${new Date(ult).toLocaleTimeString('pt-BR', { timeZone:'America/Sao_Paulo', hour:'2-digit', minute:'2-digit' })}; parte dela se atualiza sozinha de 30 em 30 minutos.</p>` : ''}
    </div>`;
}

function card(i) {
  const cls = i.estado === 'andando' ? 'anda' : 'pend';
  return `<div class="item ${cls}"><div class="topo"><span class="tit">${esc(i.titulo)}</span>
      <span class="quem">${esc(i.quem)}</span>${i.dependencia ? `<span class="data">${esc(i.dependencia)}</span>` : ''}</div>
    ${i.andamento ? `<div class="andou"><b>andou ${dataBR(i.andamento_em)}</b>${comLinks(i.andamento)}</div>` : ''}
    <details class="det"><summary>ver detalhes</summary><p>${comLinks(i.detalhe)}</p></details></div>`;
}
function porFase(lista) {
  let h = '', fase = null;
  for (const i of lista) {
    if (i.fase_titulo !== fase) { fase = i.fase_titulo; h += `<div class="fase">${esc(fase)}</div>`; }
    h += card(i);
  }
  return h || '<p class="vazio">Nada aqui para este filtro.</p>';
}
function linhas(lista, data) {
  return lista.map(i => `<div class="linha"><details class="det"><summary style="color:var(--tinta);font-size:.92rem">
      <span class="tit">${esc(i.titulo)}</span><span class="quando">${esc(i.quem || '')}${data(i) ? ' · ' + data(i) : ''}</span></summary>
      ${i.evidencia ? `<p><b>Prova:</b> ${comLinks(i.evidencia)}</p>` : ''}<p>${comLinks(i.detalhe)}</p></details></div>`).join('')
    || '<p class="vazio">Nenhum.</p>';
}

function desenhar() {
  const vivo = ITENS.filter(i => i.fase_ordem < 15), arq = ITENS.filter(i => i.fase_ordem >= 90);
  const jan = ITENS.filter(i => i.fase_ordem === 15);
  const eixo = vivo.filter(i => i.fase_ordem === 10 && i.estado !== 'feito');
  const comGrupo = ENTREGAS.flatMap(e => e[1]);
  const grupos = [...ENTREGAS, ['Outras', eixo.map(i => i.id).filter(id => !comGrupo.includes(id))]];
  const entregas = grupos.map(([t, ids]) => { const l = eixo.filter(i => ids.includes(i.id));
    return l.length ? `<div class="fase">${esc(t)}</div>${l.map(card).join('')}` : ''; }).join('');
  const demais = vivo.filter(i => i.fase_ordem !== 10 && i.estado !== 'feito' && i.estado !== 'na');
  const pronto = vivo.filter(i => i.estado === 'feito');
  const arqFeito = arq.filter(i => i.estado === 'feito');
  const ult = vivo.map(i => i.andamento_em).filter(Boolean).sort().pop();
  const s = sessao() || {};
  app.innerHTML = `
    <p class="eyebrow">Cidadão do Mundo · só Neto e Fabio${ult ? ' · atualizado em ' + dataBR(ult) : ''}</p>
    <h1>Plano de saída</h1>
    <p class="missao"><b>A missão até 31/12:</b> entregar e fazer rodar. Quem assume cada coisa depois é decisão do Fabio.</p>
    ${migHtml()}
    <h2>As 6 entregas até 31/12</h2>
    <p class="rascunho">O prazo é 31/12. As outras datas são referência de trabalho.</p>
    ${entregas || '<p class="vazio">Todas entregues.</p>'}
    ${jan.length ? `<h2>${esc(jan[0].fase_titulo)} <span class="n">${jan.length}</span></h2>
      ${jan[0].fase_quando.startsWith('Rascunho') ? `<p class="rascunho">${esc(jan[0].fase_quando)}</p>` : ''}
      ${jan.map(i => `<div class="item pend jan"><div class="topo"><span class="tit">${esc(i.titulo)}</span><span class="data">${esc(i.dependencia)}</span></div><p>${esc(i.detalhe)}</p></div>`).join('')}` : ''}
    <h2>Demais itens</h2>
    <details class="bloco"><summary>Outros módulos, equipe e o que combinar com o Fabio <span class="n" style="font-weight:400;color:var(--mudo)">${demais.length}</span></summary>
      <div class="corpo">${porFase(demais)}</div></details>
    <h2 class="ok">Já resolvido <span class="n">${pronto.length + arqFeito.length}</span></h2>
    <details class="bloco"><summary>Prontos nesta fase <span class="n" style="font-weight:400;color:var(--mudo)">${pronto.length}</span></summary>
      <div class="corpo">${linhas(pronto, i => i.resolvido_em ? 'pronto em ' + dataBR(i.resolvido_em) : '')}</div></details>
    <details class="bloco"><summary>Resolvidos antes <span class="n" style="font-weight:400;color:var(--mudo)">${arqFeito.length}</span></summary>
      <div class="corpo">${linhas(arqFeito, i => i.resolvido_em ? dataBR(i.resolvido_em) : '')}</div></details>
    <footer>Entrou como ${esc(s.email || '')} · <button class="sair" onclick="localStorage.removeItem('rmbSessao');carregar()">sair</button>
      <br>Atualizado todo dia às 20:00 pela rotina do plano. Para comentar um item, use o módulo Plano no painel.</footer>`;
}
carregar();
</script>
</body>
</html>
