<!-- MINHA AGENDA (07/11/2026, dono 02:52: "uma tela de agenda e o que fazer no dia só pra mim no painel"; "pode montar a agenda" 03:03).
     Só do dono. Hoje e os próximos 7 dias: o que depende dele (dono_pendencia, gravada pelos chats) e as datas que já estão no
     banco (contas a pagar, férias, rescisões, cálculos da folha, reembolso que só ele aprova). Cada linha leva à tela onde age.
     Quem mexe: o chat "Telas do painel". -->
<script>
  const NA_CASCA = window.parent !== window;
  if (NA_CASCA) document.documentElement.classList.add('na-casca');
  function avisarCasca(msg) { if (NA_CASCA) { try { parent.postMessage(msg, location.origin); } catch (e) {} } }
</script>
<link rel="stylesheet" href="../nucleo/nucleo.css?v=20261107g">
<style>
  .na-casca body::before { display:none !important; }
  .ag-dia { font-size:14px; font-weight:800; color:var(--tx-1); margin:16px 2px 4px; }
  .ag-dia.hoje { color:var(--marca-amarelo); }
  .ag-lin { display:flex; gap:10px; align-items:center; justify-content:space-between; padding:7px 10px; border:1px solid var(--line); border-radius:8px; margin:4px 0; background:var(--surface); }
  .ag-lin .t { flex:1 1 auto; }
  .ag-lin .f { font-size:11px; color:var(--tx-4); white-space:nowrap; }
  .ag-lin.alerta { border-color:var(--farol-perto); }
  .ag-lin.atraso { border-color:var(--farol-fora); }
  .ag-lin.feito { opacity:.7; }
  .ag-bloco { font-size:15px; font-weight:800; color:var(--tx-1); margin:18px 2px 2px; }
  .ag-bloco .f { font-size:11.5px; font-weight:400; color:var(--tx-4); }
  details.ag-saber > summary { cursor:pointer; list-style-position:inside; }
  .ag-ctx { flex-basis:100%; font-size:12px; color:var(--tx-3); margin-top:2px; line-height:1.4; }
  details.ag-saber { margin-top:14px; padding-top:4px; border-top:1px solid var(--line); }
  .ag-lin .bts { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .ag-form { display:flex; gap:6px; flex-wrap:wrap; align-items:center; padding:8px 10px; margin:-2px 0 6px; border:1px dashed var(--line-2); border-radius:8px; }
  .ag-form input[type=text], .ag-form textarea { flex:1 1 220px; background:var(--surface-2); color:var(--tx-1); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; }
  .ag-eq { margin-top:26px; padding-top:10px; border-top:1px solid var(--line); }
  .ag-eq select { background:var(--surface-2); color:var(--tx-1); border:1px solid var(--line); border-radius:6px; padding:5px 8px; font:inherit; }
  @media (max-width:760px) { .ag-lin { flex-wrap:wrap; } .ag-lin .bts { width:100%; justify-content:flex-start; } }
</style>
</head>
<body>
<div class="main-content">
  <div class="wrap">
    <div id="erroMsg" style="display:none;"></div>
    <div id="modulo-agenda" class="modulo" style="display:none;"><div id="view-agenda"></div></div>
  </div>
</div>

<script src="../nucleo/nucleo.js?v=20261109a"></script>
<script>
const AG = { dados: null };
const agHoje = () => new Date().toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' });
const agMais = (d, n) => { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return x.toLocaleDateString('en-CA'); };
const agDm = (d) => d ? String(d).slice(8, 10) + '/' + String(d).slice(5, 7) : '';
const agSem = (d) => ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'][new Date(String(d).slice(0, 10) + 'T12:00:00').getDay()];
const agR = (v) => 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const agR0 = (v) => 'R$ ' + Math.round(Number(v || 0)).toLocaleString('pt-BR');
const agE = (s) => trEscH(String(s == null ? '' : s));
const agNome = (s) => String(s || '').toLowerCase().replace(/(^|\s)\S/g, (c) => c.toUpperCase());
// atalho para a tela onde o dono age (na casca abre a tela; solta, troca o endereço)
function agIr(nome) { if (NA_CASCA) avisarCasca({ tipo: 'casca-modulo', nome }); else location.href = '../sistema.html#' + nome; }

async function entrarAgenda(silencioso) {   // silencioso = releitura sozinha (sem "Carregando…", sem piscar)
  const alvo = document.getElementById('view-agenda');
  AG_LIDO = Date.now();
  await rmbGarantirTokenValido().catch(() => {});
  await carregarEmailDono();
  if (EMAIL_DONO === null) {   // não deu para confirmar quem está logado: nunca concluir "não é o dono" por falha de leitura
    alvo.innerHTML = '<h2>Minha agenda</h2><div class="contexto" style="border-color:var(--farol-fora);">✗ Não consegui confirmar o seu login agora. <button type="button" class="preset-btn" onclick="entrarAgenda()">Tentar de novo</button></div>';
    return;
  }
  // 07/11/2026 (dono 03:11): cada login tem a sua agenda (minha_agenda). Fica escondida da equipe até o "manda" do dono na
  // mensagem do Avisos (AGENDA_TODOS); até lá o dono confere a de cada um pelo "ver como".
  if (!souODono()) {
    // 07/11/2026 (dono 03:59): o Fabio vê a agenda da equipe (só leitura), nunca o "Depende de você" do dono
    if (AGP.veEquipe === null) { const r = await trRpcSeguro('agenda_ve_equipe', {}); AGP.veEquipe = r.ok ? (await r.json()) === true : false; }
    if (AGENDA_TODOS) await agPessoaEntrar(silencioso ? AGP.verComo || null : null);
    else alvo.innerHTML = '<h2>Minha agenda</h2>' + (AGP.veEquipe ? '' : '<div class="contexto">A sua agenda chega em breve.</div>');
    if (AGP.veEquipe) agEquipeMontar().then(agGuia);
    return;
  }
  if (!silencioso) alvo.innerHTML = '<h2>Minha agenda</h2><div class="contexto">Carregando…</div>';
  // 09/11/2026: o que o fato já resolveu (ex.: rotina logou depois do pedido) fecha antes de ler
  await trRpcSeguro('dono_pendencia_conferir', {}).catch(() => {});
  const hoje = agHoje(), fim = agMais(hoje, 7), ler = (q) => consultarTudo(q).catch((e) => ({ erro: e.message }));
  const [pend, cp, fer, prev, calc, rmb, ext, folhaUlt, folhaVal] = await Promise.all([
    ler('dono_pendencia?select=id,chave,frente,o_que,desde,prazo,link,contexto,resposta,respondido_em,retorno,retorno_em,fio&resolvido_em=is.null&order=prazo.nullsfirst,id'),
    ler(`vw_fin_contas_pagar?select=vencimento,dia_pagamento,situacao,descricao,debito,credito,conta,conta_exibida,origem,id_titulo&sentido=eq.PAGAR&situacao=neq.PAGO&dia_pagamento=lte.${fim}&order=dia_pagamento,descricao`).then((L) => (Array.isArray(L) && L.forEach((r) => { if (r.dia_pagamento) r.vencimento = r.dia_pagamento; }), L)),
    ler('vw_rh_ferias_alertas?select=nome,situacao,limite_gozo,pagar_ate,valor_estimado,pagamento,extrato_ate&order=limite_gozo'),
    ler(`vw_rh_previsao_a_pagar?select=dia,tipo,unidade,valor&dia=gte.${hoje}&dia=lte.${fim}&order=dia,tipo`),
    ler(`vw_rh_calculos_mes?select=nome,calculo,data_limite,calculado_em,fechado_em,enviado_em,pessoas,total&data_limite=gte.${hoje}&data_limite=lte.${fim}&order=data_limite`),
    ler('vw_rmb_pedidos?select=id,pessoa,valor,descricao,situacao,so_o_dono&situacao=eq.PEDIDO&so_o_dono=is.true&order=id'),
    ler('vw_fin_conciliado_ate?select=conta,conciliado_ate&order=conta'),
    ler('vw_rh_pagamento_mes?select=competencia&liquido_folha=not.is.null&order=competencia.desc&limit=1'),
    ler('rh_folha_validada?select=competencia')]);
  AG.dados = { hoje, fim, pend, cp, fer, prev, calc, rmb, ext, folhaUlt, folhaVal };
  agDesenhar();
}
function agDesenhar() {
  const { hoje, fim, pend, cp, fer, prev, calc, rmb, ext, folhaUlt, folhaVal } = AG.dados;
  // 07/11/2026 (dono: "sempre espere o tempo de conciliação nas baixas do a pagar do painel"): conta vencida só é "vencida"
  // depois que o extrato daquela conta já cobre o dia do vencimento; antes disso, "aguardando conciliação"
  // fonte única do Financeiro: até que dia cada conta está conciliada (vw_fin_conciliado_ate)
  const ult = {}; (Array.isArray(ext) ? ext : []).forEach((e) => { if (e.conciliado_ate) ult[e.conta] = String(e.conciliado_ate).slice(0, 10); });
  const ultMin = Object.values(ult).sort()[0] || null;
  const conciliou = (dia, conta) => { const u = (conta && ult[conta]) || ultMin; return !!u && String(dia).slice(0, 10) <= u; };
  const itens = [];   // { dia, txt, ir, chat, tipo: 'atraso'|'alerta'|'', id (pendência) }
  AG.sinal = 0;
  const add = (o) => itens.push(Object.assign({ tipo: '' }, o));
  const falhou = [];
  const ok = (x, rot) => { if (x && x.erro) { falhou.push(rot); return false; } return Array.isArray(x); };
  // 1) o que depende de mim (os chats gravam)
  if (ok(pend, 'o que depende de você')) pend.forEach((p) => {
    if (!p.resposta && (!p.prazo || p.prazo <= hoje)) AG.sinal++;   // respondido = aguardando aplicar: sai do número
    const dia = !p.prazo || p.prazo < hoje ? hoje : p.prazo;
    if (dia > fim) return;
    const chat = String(p.link || '').startsWith('chat:') ? p.link.slice(5) : null;
    add({ dep: !p.resposta, dia, txt: `${agE(p.o_que)}${p.prazo && p.prazo < hoje ? ` <span class="f">desde ${agDm(p.prazo)}</span>` : ''}`, ir: chat ? null : String(p.link || '').replace(/^#/, '') || null, chat, id: p.id, frente: p.frente, tipo: p.resposta ? '' : p.prazo && p.prazo < hoje ? 'atraso' : 'alerta', pend: p });
  });
  // 2) reembolso que só eu aprovo (o da Hellen)
  if (ok(rmb, 'reembolsos')) rmb.forEach((g) => (AG.sinal++, add({ dep: true, dia: hoje, txt: `Aprovar o reembolso de <b>${agR(g.valor)}</b> (${agE(agNome(g.pessoa))}: ${agE(g.descricao)})`, ir: 'reembolsos', tipo: 'alerta' })));
  // 3) contas a pagar: vencidas hoje, e o total de cada dia
  if (ok(cp, 'contas a pagar')) {
    const val = (c) => Math.max(0, (Number(c.debito) || 0) - (Number(c.credito) || 0));
    // a situação já vem do banco (vw_fin_contas_pagar: 'VENCIDA' só depois da conciliação; antes, 'AGUARDANDO CONCILIACAO')
    const venc = cp.filter((c) => c.vencimento < hoje && c.situacao === 'VENCIDA'), agu = cp.filter((c) => c.vencimento < hoje && c.situacao !== 'VENCIDA');
    // 07/11/2026 (Organizador: "o mesmo número em toda tela"): conta-se TÍTULO, como o Contas a pagar (cpTitulos), não linha de rateio
    const nTit = (L) => new Set(L.map((c, i) => c.id_titulo ? `${c.origem}|${c.id_titulo}|${c.vencimento}|${c.conta_exibida || ''}` : `l${i}`)).size;
    AG.sinal += nTit(venc);
    if (venc.length) add({ dep: true, dia: hoje, txt: `<b>${nTit(venc)}</b> ${nTit(venc) === 1 ? 'conta vencida' : 'contas vencidas'}, <b>${agR0(venc.reduce((a, c) => a + val(c), 0))}</b>`, ir: 'contaspagar', tipo: 'atraso' });
    if (agu.length) add({ dia: hoje, txt: `<span style="color:var(--tx-3);">${nTit(agu)} ${nTit(agu) === 1 ? 'conta' : 'contas'} aguardando conciliação (${agR0(agu.reduce((a, c) => a + val(c), 0))}) — a conciliação do banco desse dia ainda não terminou</span>`, ir: 'contaspagar' });
    [...new Set(cp.filter((c) => c.vencimento >= hoje).map((c) => c.vencimento))].forEach((d) => {
      const L = cp.filter((c) => c.vencimento === d), m = L.slice().sort((a, b) => val(b) - val(a))[0];
      add({ dia: d, txt: `<b>${agR0(L.reduce((a, c) => a + val(c), 0))}</b> a pagar (${nTit(L)} ${nTit(L) === 1 ? 'conta' : 'contas'}; maior: ${agE(String(m.descricao || '').replace(/\s*\(parc\..*$/, '').slice(0, 60))} ${agR0(val(m))})`, ir: 'contaspagar' });
    });
  }
  // 4) férias: pagar (até) e começar
  if (ok(fer, 'férias')) fer.forEach((x) => {
    if (x.situacao === 'programada' && x.pagar_ate && x.pagar_ate <= fim) {
      const passou = x.pagar_ate < hoje, espera = passou && (x.pagamento ? x.pagamento === 'AGUARDANDO_CONCILIACAO' : !conciliou(x.pagar_ate, null));
      if (passou && !espera) AG.sinal++;
      add({ dep: passou && !espera, dia: passou ? hoje : x.pagar_ate, txt: espera ? `<span style="color:var(--tx-3);">Férias de <b>${agE(agNome(x.nome))}</b>${x.valor_estimado ? ' (' + agR(x.valor_estimado) + ')' : ''}: aguardando conciliação</span> <span class="f">pagar até ${agDm(x.pagar_ate)}</span>`
        : `${passou ? '✗ ' : ''}Pagar as férias de <b>${agE(agNome(x.nome))}</b>${x.valor_estimado ? ' (' + agR(x.valor_estimado) + ')' : ''}${passou ? ` <span class="f">vencia ${agDm(x.pagar_ate)}</span>` : ''}`,
        ir: 'pferias', tipo: espera ? '' : passou ? 'atraso' : 'alerta' }); }
    if (x.situacao === 'programada' && x.limite_gozo && x.limite_gozo >= hoje && x.limite_gozo <= fim) add({ dia: x.limite_gozo, txt: `${agE(agNome(x.nome))} começa as férias`, ir: 'pferias' });
  });
  // 5) folha: rescisões e o que vence de cálculo
  if (ok(prev, 'previsão da folha')) prev.filter((p) => p.tipo !== 'FERIAS').forEach((p) => add({ dia: p.dia, txt: `${agE(agNome(String(p.tipo).replace(/_/g, ' ')))}: <b>${agR(p.valor)}</b>${p.unidade ? ' · ' + agE(p.unidade) : ''}`, ir: p.tipo === 'RESCISAO' ? 'presc' : 'pcalc' }));
  if (ok(folhaUlt, 'folha') && ok(folhaVal, 'folha validada') && folhaUlt[0]) {
    const comp = String(folhaUlt[0].competencia).slice(0, 10);
    if (!folhaVal.some((v) => String(v.competencia).slice(0, 10) === comp)) {
      AG.sinal++;
      const mes = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'][Number(comp.slice(5, 7)) - 1];
      add({ dep: true, dia: hoje, txt: `Validar a conferência da folha de <b>${mes}</b> (o robô só atualiza o Saipos e a lista de pagamento depois)`, ir: 'pconf', tipo: 'alerta' });
    }
  }
  if (ok(calc, 'cálculos da folha')) calc.forEach((c) => add({ dia: c.data_limite, txt: `${agE(c.nome)}: ${c.calculado_em ? `calculado, ${Number(c.pessoas || 0)} pessoas, <b>${agR(c.total)}</b>` : '<b>ainda não calculado</b>'}`, ir: 'pcalc', tipo: c.calculado_em ? '' : 'alerta' }));

  const alvo = document.getElementById('view-agenda');
  const dias = []; for (let i = 0; i <= 7; i++) dias.push(agMais(hoje, i));
  const ordemTipo = { atraso: 0, alerta: 1, '': 2 };
  let h = '<h2>Minha agenda</h2>';
  if (falhou.length) h += `<div class="contexto" style="text-align:left;border-color:var(--farol-fora);">✗ Não li: ${falhou.join(', ')}. <button type="button" class="preset-btn" onclick="entrarAgenda()">Tentar de novo</button></div>`;
  const linha = (x) => {
    const acao = x.ir ? `<button type="button" class="preset-btn" onclick="agIr('${agE(x.ir)}')">abrir</button>` : x.chat ? `<span class="f">chat ${agE(x.chat)}</span>` : '';
    const feito = x.id ? `<button type="button" class="preset-btn" title="tirar da agenda" onclick="agFeito(${x.id})">✓</button>` : '';
    // 12/11/2026 (dono, pelo Organizador): o contexto do item à vista, e responder ou tirar dúvida ali mesmo
    const p = x.pend;
    if (!p) return `<div class="ag-lin ${x.tipo}"><span class="t">${x.txt}${x.frente ? ` <span class="f">· ${agE(x.frente)}</span>` : ''}</span>${acao}${feito}</div>`;
    const resp = p.resposta ? `<div class="ag-ctx" style="color:var(--farol-ok);">✓ resposta enviada ${agDm(new Date(p.respondido_em).toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' }))} às ${agHm(p.respondido_em)} — respondido, aguardando aplicar: “${agE(p.resposta)}” <a href="javascript:void(0)" onclick="agRespForm(${p.id})">mudar</a></div>` : '';
    // 12/11/2026 (Organizador): a frente devolve ao dono ("↩ resposta para você"); o fio guarda a conversa
    const fio = Array.isArray(p.fio) ? p.fio : [];
    const quando = (t) => t ? `${agDm(new Date(t).toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' }))} ${agHm(t)}` : '';
    const volta = !p.resposta && p.retorno ? `<div class="ag-ctx" style="color:var(--info);font-weight:700;">↩ resposta para você${p.retorno_em ? ' (' + quando(p.retorno_em) + ')' : ''}: <span style="font-weight:400;color:var(--tx-1);">${agE(p.retorno)}</span></div>` : '';
    const conversa = fio.length > 1 ? `<details class="ag-ctx"><summary style="cursor:pointer;">conversa (${fio.length})</summary>${fio.map((m) => `<div><b>${m.de === 'dono' ? 'você' : agE(m.de)}</b> ${quando(m.em)}: ${agE(m.texto)}</div>`).join('')}</details>` : '';
    const bts = p.resposta ? '' : `<button type="button" class="preset-btn" onclick="agRespForm(${p.id})">Responder</button><button type="button" class="preset-btn" onclick="agDuvidaForm(${p.id})">Tenho dúvida</button>`;
    return `<div class="ag-lin ${x.tipo}" style="flex-wrap:wrap;"><span class="t">${x.txt}${x.frente ? ` <span class="f">· ${agE(x.frente)}</span>` : ''}</span>${acao}${bts}${feito}
      ${p.contexto ? `<div class="ag-ctx">${agE(p.contexto)}</div>` : ''}${volta}${resp}${conversa}<div id="agForm_${p.id}" style="flex-basis:100%;"></div></div>`;
  };
  const porDia = (lista, vazio) => {
    let b = '';
    dias.forEach((d) => {
      const L = lista.filter((x) => x.dia === d).sort((a, b2) => ordemTipo[a.tipo] - ordemTipo[b2.tipo]);
      if (!L.length && (d !== hoje || !vazio)) return;
      b += `<div class="ag-dia${d === hoje ? ' hoje' : ''}">${d === hoje ? 'Hoje · ' : ''}${agSem(d)} ${agDm(d)}</div>`;
      b += L.length ? L.map(linha).join('') : `<div class="ag-lin"><span class="t" style="color:var(--farol-ok);">${vazio}</span></div>`;
    });
    return b;
  };
  // 07/11/2026 (dono 03:44): em cima só o que exige ação dele (é o que conta no sinal do menu); o resto, recolhido
  const dep = itens.filter((x) => x.dep), saber = itens.filter((x) => !x.dep);
  h += `<div class="ag-bloco">Depende de você</div>` + porDia(dep, '✓ nada depende de você hoje');
  let aberto = false; try { aberto = sessionStorage.getItem('agSaberAberto') === '1'; } catch (e) {}
  if (saber.length) h += `<details class="ag-saber"${aberto ? ' open' : ''} ontoggle="try{sessionStorage.setItem('agSaberAberto',this.open?'1':'0')}catch(e){}">
      <summary class="ag-bloco">Para saber <span class="f">· ${saber.length} ${saber.length === 1 ? 'item' : 'itens'}, sem ação sua</span></summary>${porDia(saber, '')}</details>`;
  alvo.innerHTML = h;
  // o número do menu (casca): o que depende de mim com prazo até hoje + contas vencidas de verdade (por título)
  avisarCasca({ tipo: 'casca-sinal', nome: 'agenda', n: AG.sinal });
  agEquipeMontar().then(agGuia);
}
// GUIA DE PRIMEIRO ACESSO (07/11/2026, exemplo do padrão novo; mecanismo no nucleo.js): abre uma vez por login; "?" revê
function agGuia() {
  guiaRegistrar('agenda', [
    { sel: '.ag-bloco', texto: '<b>Depende de você</b>: só o que pede uma ação sua, de hoje e dos próximos dias. É isto que conta no número vermelho do menu.' },
    { sel: '.ag-lin button[title="tirar da agenda"]', texto: 'Resolveu? Toque no <b>✓</b> e a linha sai da agenda (e do número do menu).' },
    { sel: '.ag-lin .preset-btn[onclick^="agIr"]', texto: '<b>abrir</b> leva direto à tela onde se resolve aquilo.' },
    { sel: 'details.ag-saber > summary', texto: '<b>Para saber</b>: o que não pede nada de você (aguardando conciliação, contas dos próximos dias). Fica fechado; toque para abrir.' },
    { sel: '#tabelaAgEquipe', texto: '<b>Agenda da equipe</b>: clique na pessoa para ver a agenda dela, do jeito que ela vê.' },
  ]);
  guiaTalvez('agenda');
}
function agPend(id) { return ((AG.dados && Array.isArray(AG.dados.pend)) ? AG.dados.pend : []).find((p) => p.id === id) || {}; }
function agRespForm(id) {
  const box = document.getElementById('agForm_' + id); if (!box) return;
  if (box.innerHTML) { box.innerHTML = ''; return; }
  const p = agPend(id);
  box.innerHTML = `<div class="ag-form" style="display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;margin-top:6px;"><textarea id="agRespTx_${id}" rows="2" maxlength="2000" style="flex:1 1 260px;" placeholder="Sua resposta (a frente aplica e o item fecha sozinho)">${agE(p.resposta || '')}</textarea>
    <button type="button" class="preset-btn active" onclick="agResponder(${id})">Enviar resposta</button><button type="button" class="preset-btn" onclick="agRespForm(${id})">Cancelar</button></div>`;
  const t = document.getElementById('agRespTx_' + id); if (t) t.focus();
}
async function agResponder(id) {
  const t = document.getElementById('agRespTx_' + id), txt = t ? t.value.trim() : '';
  if (!txt) return avisoAcao('atencao', '! Escreva a resposta.');
  avisoAcao('enviando', 'Enviando a resposta…');
  const r = await trRpcSeguro('dono_pendencia_responder', { p_id: id, p_texto: txt });
  if (!r.ok) return avisoAcao('erro', `✗ Não gravou: ${await trErroDe(r)}`, () => agResponder(id));
  avisoAcao('ok', `✓ Resposta enviada às ${avisoHora()}. A frente aplica e o item fecha sozinho.`);
  await entrarAgenda(true);
}
function agDuvidaForm(id) {
  const box = document.getElementById('agForm_' + id); if (!box) return;
  if (box.innerHTML) { box.innerHTML = ''; return; }
  box.innerHTML = `<div class="ag-form" style="display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;margin-top:6px;"><textarea id="agDuvTx_${id}" rows="2" maxlength="1500" style="flex:1 1 260px;" placeholder="Qual é a dúvida? A resposta vem pelo WhatsApp do robô."></textarea>
    <button type="button" class="preset-btn active" onclick="agDuvida(${id})">Enviar dúvida</button><button type="button" class="preset-btn" onclick="agDuvidaForm(${id})">Cancelar</button></div>`;
  const t = document.getElementById('agDuvTx_' + id); if (t) t.focus();
}
// mesmo caminho do botão Ajuda (painel_ajuda): a triagem responde pelo WhatsApp do robô
async function agDuvida(id) {
  const t = document.getElementById('agDuvTx_' + id), txt = t ? t.value.trim() : '';
  if (!txt) return avisoAcao('atencao', '! Escreva a dúvida.');
  const p = agPend(id);
  avisoAcao('enviando', 'Enviando a dúvida…');
  const r = await trRpcSeguro('painel_ajuda_gravar', { p_tela: 'agenda', p_loja: null, p_tipo: 'duvida', p_print_url: null,
    p_texto: `Dúvida do dono sobre o item da agenda #${id} (${p.frente || ''}; chave ${p.chave || ''}): "${p.o_que || ''}" — ${txt}` });
  if (!r.ok) return avisoAcao('erro', `✗ Não chegou: ${await trErroDe(r)}`, () => agDuvida(id));
  avisoAcao('ok', `✓ Dúvida enviada às ${avisoHora()}. A resposta vem pelo WhatsApp do robô.`);
  const box = document.getElementById('agForm_' + id); if (box) box.innerHTML = '';
}
async function agFeito(id) {
  avisoAcao('enviando', '… tirando da agenda');
  const r = await trRpcSeguro('dono_pendencia_resolver', { p_id: id });
  if (!r.ok) return avisoAcao('erro', `✗ Não gravou: ${await trErroDe(r)}`, () => agFeito(id));
  await entrarAgenda();
  avisoAcao('ok', `✓ Feito às ${avisoHora()}.`);
}

// =====================================================================================================================
// A AGENDA DE CADA PESSOA (07/11/2026, dono 03:11 no Organizador; plano aprovado pelo Organizador).
// Fonte: minha_agenda() — as atividades do robô (wa_tarefa) com o e-mail do login. Três botões gravam em agenda_acao
// (o Avisos lê de lá): ✓ Concluí, ⏱ Preciso de mais tempo (1 a 3 dias), 🙋 Preciso de ajuda (vai para a Ajuda do painel).
// "abrir" leva à tela da atividade e registra que a pessoa abriu. O dono vê a de cada um pelo "ver como" (só leitura).
// =====================================================================================================================
const AGENDA_TODOS = true;   // ligado 07/11/2026 12:15: "manda" do dono no chat Avisos (12:09); comunicado sai seg 09/11 08:00
const AGP = { linhas: [], verComo: null, form: null, pessoas: null, veEquipe: null };
const AG_ESTADO = { 'A fazer': '', 'Atrasada': 'atraso', 'Travada': 'atraso', 'Mais tempo': '', 'Pediu ajuda': 'alerta', 'Concluí': 'feito' };
const AG_ORDEM = ['Travada', 'Atrasada', 'Pediu ajuda', 'A fazer', 'Mais tempo', 'Concluí'];
const agHm = (t) => t ? new Date(t).toLocaleTimeString('pt-BR', { timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit' }) : '';

async function agPessoaLer(verComo) {
  const r = await trRpcSeguro('minha_agenda', verComo ? { p_ver_como: verComo } : {});
  if (!r.ok) throw new Error(await trErroDe(r));
  return r.json();
}
async function agPessoaEntrar(verComo) {
  const alvo = document.getElementById('view-agenda');
  try { AGP.linhas = await agPessoaLer(verComo); AGP.verComo = verComo; }
  catch (e) {
    alvo.innerHTML = `<h2>Minha agenda</h2><div class="contexto" style="border-color:var(--farol-fora);">✗ Não consegui abrir a agenda: ${agE(e.message)}. <button type="button" class="preset-btn" onclick="agPessoaEntrar(null)">Tentar de novo</button></div>`;
    return;
  }
  agPessoaRedesenhar();
}
// a lista de uma pessoa (soLeitura = o dono vendo a de outro: os botões aparecem, mas não gravam)
function agPessoaHtml(L, soLeitura) {
  const hoje = agHoje();
  const dias = []; for (let i = 0; i <= 7; i++) dias.push(agMais(hoje, i));
  const diaDe = (x) => (x.estado === 'Concluí' && x.dia < hoje) || x.dia < hoje ? hoje : x.dia;   // o que passou aparece em hoje
  let h = '';
  dias.forEach((d) => {
    const doDia = L.filter((x) => diaDe(x) === d).sort((a, b) => AG_ORDEM.indexOf(a.estado) - AG_ORDEM.indexOf(b.estado));
    if (!doDia.length && d !== hoje) return;
    h += `<div class="ag-dia${d === hoje ? ' hoje' : ''}">${d === hoje ? 'Hoje · ' : ''}${agSem(d)} ${agDm(d)}</div>`;
    if (!doDia.length) h += '<div class="ag-lin"><span class="t" style="color:var(--farol-ok);">✓ nada para hoje</span></div>';
    doDia.forEach((x) => {
      const id = Number(x.tarefa_id);
      const nota = x.estado === 'Concluí' ? `✓ marcado às ${agHm(x.concluiu_em)} · o robô confere`
        : x.estado === 'Atrasada' ? `atrasada desde ${agDm(x.dia)}`
        : x.estado === 'Travada' ? 'travada: sem resposta ao robô'
        : x.estado === 'Mais tempo' ? `novo prazo ${agSem(x.dia)} ${agDm(x.dia)}${x.prazo_motivo ? ' · ' + agE(x.prazo_motivo) : ''}`
        : x.estado === 'Pediu ajuda' ? `pediu ajuda às ${agHm(x.ajuda_em)}${x.ajuda_resposta ? ' · resposta: ' + agE(x.ajuda_resposta) : ' · aguardando resposta'}`
        : '';
      const bt = (rot, fn, tit) => `<button type="button" class="preset-btn" title="${tit}" onclick="${soLeitura ? 'agSoLeitura()' : fn}">${rot}</button>`;
      const abrir = x.tela ? bt('abrir', `agPessoaAbrir(${id})`, 'ir para a tela desta atividade') : '';
      const bts = x.estado === 'Concluí' ? abrir
        : [abrir,
           bt('✓ Concluí', `agPessoaConcluir(${id})`, 'avisar que já fez'),
           bt('⏱ Preciso de mais tempo', `agPessoaForm(${id},'prazo')`, 'pedir 1, 2 ou 3 dias'),
           bt('🙋 Preciso de ajuda', `agPessoaForm(${id},'ajuda')`, 'contar o que travou')].join('');
      h += `<div class="ag-lin ${AG_ESTADO[x.estado] || ''}"><span class="t">${agE(x.atividade)}${nota ? ` <span class="f">· ${nota}</span>` : ''}</span><span class="bts">${bts}</span></div>`;
      if (!soLeitura && AGP.form && AGP.form.id === id) h += agPessoaFormHtml(id, AGP.form.tipo);
    });
  });
  return h;
}
function agSoLeitura() { avisoAcao('atencao', 'Você está vendo a agenda de outra pessoa: os botões são dela e não gravam daqui.'); }
function agPessoaRedesenhar() {
  const v = document.getElementById('view-agenda');
  v.innerHTML = '<h2>Minha agenda</h2>' + (AGP.linhas.length ? agPessoaHtml(AGP.linhas, false)
    : '<div class="ag-lin"><span class="t" style="color:var(--farol-ok);">✓ nada na sua agenda nos próximos 7 dias</span></div>');
  avisarCasca({ tipo: 'casca-sinal', nome: 'agenda', n: AGP.linhas.filter((x) => ['Atrasada', 'Travada'].includes(x.estado) || (x.estado === 'A fazer' && x.dia <= agHoje())).length });
}
function agPessoaForm(id, tipo) { AGP.form = AGP.form && AGP.form.id === id && AGP.form.tipo === tipo ? null : { id, tipo }; agPessoaRedesenhar(); }
function agPessoaFormHtml(id, tipo) {
  if (tipo === 'prazo') return `<div class="ag-form"><span>Quantos dias a mais?</span>${[1, 2, 3].map((n) =>
    `<button type="button" class="preset-btn" onclick="agPessoaPrazo(${id},${n})">${n} ${n === 1 ? 'dia' : 'dias'}</button>`).join('')}<input type="text" id="agMotivo" maxlength="300" placeholder="motivo (se quiser)"></div>`;
  return `<div class="ag-form"><textarea id="agAjudaTx" rows="2" maxlength="2000" placeholder="O que travou? Escreva com as suas palavras."></textarea><button type="button" class="preset-btn" onclick="agPessoaAjuda(${id})">Enviar pedido de ajuda</button></div>`;
}
function agPessoaAbrir(id) {
  const x = AGP.linhas.find((l) => Number(l.tarefa_id) === id); if (!x || !x.tela) return;
  trRpcSeguro('agenda_abrir', { p_tarefa: id });   // registra que abriu; não segura a pessoa
  agIr(x.tela);
}
async function agPessoaGravar(fn, args, ok, refazer) {
  avisoAcao('enviando', '… gravando');
  const r = await trRpcSeguro(fn, args);
  if (!r.ok) return avisoAcao('erro', `✗ Não gravou: ${await trErroDe(r)}`, refazer);
  const v = await r.json().catch(() => null);
  AGP.form = null;
  try { AGP.linhas = await agPessoaLer(null); } catch (e) {}
  agPessoaRedesenhar();
  avisoAcao('ok', `✓ ${ok(v)} (${avisoHora()}).`);
}
function agPessoaConcluir(id) {
  agPessoaGravar('agenda_concluir', { p_tarefa: id }, () => 'Marcado como concluído; o robô confere', () => agPessoaConcluir(id));
}
function agPessoaPrazo(id, n) {
  const m = ((document.getElementById('agMotivo') || {}).value || '').trim();
  agPessoaGravar('agenda_pedir_prazo', { p_tarefa: id, p_dias: n, p_motivo: m || null },
    (d) => `Prazo novo: ${agSem(d)} ${agDm(d)}. Ninguém cobra antes disso`, () => agPessoaPrazo(id, n));
}
function agPessoaAjuda(id) {
  const t = ((document.getElementById('agAjudaTx') || {}).value || '').trim();
  if (!t) return avisoAcao('atencao', 'Escreva em poucas palavras o que travou e toque em enviar.');
  agPessoaGravar('agenda_pedir_ajuda', { p_tarefa: id, p_texto: t }, () => 'Pedido de ajuda enviado; a resposta chega pelo WhatsApp', () => agPessoaAjuda(id));
}

// a parte do dono: a agenda de cada pessoa da equipe, como ela vai ver (só leitura)
async function agEquipeMontar() {
  const alvo = document.getElementById('view-agenda');
  if (!alvo || !(souODono() || AGP.veEquipe)) return;
  let box = document.getElementById('agEquipe');
  if (!box) { box = document.createElement('div'); box.id = 'agEquipe'; box.className = 'ag-eq'; alvo.appendChild(box); }
  if (!AGP.pessoas) { const r = await trRpcSeguro('agenda_pessoas', {}); AGP.pessoas = r.ok ? await r.json() : []; }
  const P = AGP.pessoas || [];
  // 07/11/2026 (dono 03:59): o quadro da equipe — uma linha por pessoa; clicar abre a agenda dela como ela vê
  const n = (v, cor) => Number(v) ? `<b style="color:${cor};">${Number(v)}</b>` : '<span style="color:var(--tx-5);">–</span>';
  box.innerHTML = `<div class="ag-bloco" style="margin-top:0;">Agenda da equipe <span class="f">· clique na pessoa para ver a agenda dela, como ela vê${AGENDA_TODOS ? '' : ' (ainda escondida da equipe)'}</span></div>
    ${P.length ? `<div id="tabelaAgEquipe"><table><thead><tr><th>Pessoa</th><th>Atividades</th><th>Atrasadas</th><th>Para hoje</th><th>Pediu mais tempo</th><th>Pediu ajuda</th><th>Travadas</th><th>Concluiu</th></tr></thead><tbody>
      ${P.map((p) => `<tr style="cursor:pointer;${p.email === AGP.verComo ? 'background:var(--surface-2);' : ''}" onclick="agEquipeVer('${agE(p.email)}')">
        <td><b>${agE(p.pessoa || p.email)}</b></td><td>${Number(p.abertas)}</td><td>${n(p.atrasadas, 'var(--farol-fora)')}</td><td>${n(p.hoje, 'var(--tx-1)')}</td>
        <td>${n(p.mais_tempo, 'var(--farol-perto)')}</td><td>${n(p.pediu_ajuda, 'var(--farol-perto)')}</td><td>${n(p.travadas, 'var(--farol-fora)')}</td><td>${n(p.concluidas, 'var(--farol-ok)')}</td></tr>`).join('')}
    </tbody></table></div>` : '<div class="contexto">Ninguém da equipe tem atividade aberta nos próximos 7 dias.</div>'}
    <div id="agEquipeLista"></div>`;
  if (AGP.verComo) { const e = AGP.verComo; AGP.verComo = null; agEquipeVer(e); }   // redesenho: reabre a mesma pessoa
}
async function agEquipeVer(email) {
  const lista = document.getElementById('agEquipeLista'); if (!lista) return;
  AGP.verComo = AGP.verComo === email ? null : (email || null);   // clicar de novo fecha
  document.querySelectorAll('#tabelaAgEquipe tbody tr').forEach((tr) => { tr.style.background = tr.getAttribute('onclick').includes(`'${AGP.verComo}'`) ? 'var(--surface-2)' : ''; });
  if (!AGP.verComo) { lista.innerHTML = ''; return; }
  email = AGP.verComo;
  const pes = (AGP.pessoas || []).find((p) => p.email === email) || {};
  lista.innerHTML = '<div class="contexto">Carregando…</div>';
  try {
    const L = await agPessoaLer(email);
    lista.innerHTML = `<div class="ag-bloco">Agenda de ${agE(pes.pessoa || email)} <span class="f">· só leitura: os botões são dela</span></div>`
      + (L.length ? agPessoaHtml(L, true) : '<div class="contexto">Nenhuma atividade aberta para esta pessoa nos próximos 7 dias.</div>');
  } catch (e) { lista.innerHTML = `<div class="contexto" style="border-color:var(--farol-fora);">✗ ${agE(e.message)}</div>`; }
}

const TELA = 'agenda';
let MODULO_ATUAL = 'agenda';
function exigirLogin(recado) {
  localStorage.removeItem('rmbSessao');
  if (NA_CASCA) { avisarCasca({ tipo: 'casca-login', recado: recado || '' }); return; }
  location.href = '../sistema.html#' + TELA;
}
document.getElementById('modulo-agenda').style.display = '';
registrarUso(TELA);
avisarCasca({ tipo: 'casca-modulo', nome: TELA });
window.reentrarTela = () => { entrarAgenda(); };
// 09/11/2026 (proposta 2026-11-09-agenda-pendencia-se-fecha-sozinha; dono 13:04 "pode a agenda"): a agenda se relê sozinha —
// ao voltar a ficar visível (se passou 1 min) e a cada 5 min aberta. Não relê com formulário aberto, campo em foco ou guia na tela.
let AG_LIDO = Date.now();
function agReler() {
  if (document.visibilityState !== 'visible') return;
  try { if (window.frameElement && window.frameElement.offsetParent === null) return; } catch (e) {}   // na casca, outra tela à frente
  const v = document.getElementById('view-agenda');
  if (!v || v.querySelector('.ag-form') || document.getElementById('guiaBalao')) return;
  const f = document.activeElement; if (f && /^(INPUT|TEXTAREA|SELECT)$/.test(f.tagName)) return;
  const y = window.scrollY;
  entrarAgenda(true).then(() => window.scrollTo(0, y)).catch(() => {});
}
setInterval(agReler, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - AG_LIDO > 60000) agReler(); });
entrarAgenda();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('../sw.js').catch(() => {});
}
