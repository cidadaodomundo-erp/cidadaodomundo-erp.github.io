     Só do dono. Hoje e os próximos 7 dias: o que depende dele (dono_pendencia, gravada pelos chats) e as datas que já estão no
     banco (contas a pagar, férias, rescisões, cálculos da folha, reembolso que só ele aprova). Cada linha leva à tela onde age.
     Quem mexe: o chat "Telas do painel". -->
<script>
  const NA_CASCA = window.parent !== window;
  if (NA_CASCA) document.documentElement.classList.add('na-casca');
  function avisarCasca(msg) { if (NA_CASCA) { try { parent.postMessage(msg, location.origin); } catch (e) {} } }
</script>
<link rel="stylesheet" href="../nucleo/nucleo.css?v=20261107g">
<style>
  .na-casca body::before { display:none !important; }
  .ag-dia { font-size:14px; font-weight:800; color:var(--tx-1); margin:16px 2px 4px; }
  .ag-dia.hoje { color:var(--marca-amarelo); }
  .ag-lin { display:flex; gap:10px; align-items:center; justify-content:space-between; padding:7px 10px; border:1px solid var(--line); border-radius:8px; margin:4px 0; background:var(--surface); }
  .ag-lin .t { flex:1 1 auto; }
  .ag-lin .f { font-size:11px; color:var(--tx-4); white-space:nowrap; }
  /* 13/11/2026 (dono 01:23): o número do item é a referência dos chats — grande, no canto, maior que o título */
  .ag-lin .ag-id { display:inline-block; font-size:17px; font-weight:800; color:var(--tx-1); white-space:nowrap; margin-right:8px;
    padding:0 6px; border:1px solid var(--line-2); border-radius:6px; background:var(--surface-2); vertical-align:middle; }
  .ag-lin.alerta { border-color:var(--farol-perto); }
  .ag-lin.atraso { border-color:var(--farol-fora); }
  .ag-lin.feito { opacity:.7; }
  .ag-bloco { font-size:15px; font-weight:800; color:var(--tx-1); margin:18px 2px 2px; }
  .ag-bloco .f { font-size:11.5px; font-weight:400; color:var(--tx-4); }
  details.ag-saber > summary { cursor:pointer; list-style-position:inside; }
  .ag-ctx { flex-basis:100%; font-size:12px; color:var(--tx-3); margin-top:2px; line-height:1.4; }
  .ag-ctx a { color:var(--info); }
  details.ag-saber { margin-top:14px; padding-top:4px; border-top:1px solid var(--line); }
  .ag-lin .bts { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .ag-form { display:flex; gap:6px; flex-wrap:wrap; align-items:center; padding:8px 10px; margin:-2px 0 6px; border:1px dashed var(--line-2); border-radius:8px; }
  .ag-form input[type=text], .ag-form textarea { flex:1 1 220px; background:var(--surface-2); color:var(--tx-1); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; }
  .ag-eq { margin-top:26px; padding-top:10px; border-top:1px solid var(--line); }
  .ag-eq select { background:var(--surface-2); color:var(--tx-1); border:1px solid var(--line); border-radius:6px; padding:5px 8px; font:inherit; }
  @media (max-width:760px) { .ag-lin { flex-wrap:wrap; } .ag-lin .bts { width:100%; justify-content:flex-start; } }
</style>

<body>
<div class="main-content">
  <div class="wrap">
    <div id="erroMsg" style="display:none;"></div>
    <div id="modulo-agenda" class="modulo" style="display:none;"><div id="view-agenda"></div></div>
  </div>
</div>

<script src="../nucleo/nucleo.js?v=20261109a"></script>
<script>
const AG = { dados: null };
const agHoje = () => new Date().toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' });
const agMais = (d, n) => { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return x.toLocaleDateString('en-CA'); };
const agDm = (d) => d ? String(d).slice(8, 10) + '/' + String(d).slice(5, 7) : '';
const agSem = (d) => ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'][new Date(String(d).slice(0, 10) + 'T12:00:00').getDay()];
const agR = (v) => 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const agR0 = (v) => 'R$ ' + Math.round(Number(v || 0)).toLocaleString('pt-BR');
const agE = (s) => trEscH(String(s == null ? '' : s));
const agNome = (s) => String(s || '').toLowerCase().replace(/(^|\s)\S/g, (c) => c.toUpperCase());
// atalho para a tela onde o dono age (na casca abre a tela; solta, troca o endereço)
function agIr(nome) { if (NA_CASCA) avisarCasca({ tipo: 'casca-modulo', nome }); else location.href = '../sistema.html#' + nome; }

async function entrarAgenda(silencioso) {   // silencioso = releitura sozinha (sem "Carregando…", sem piscar)
  const alvo = document.getElementById('view-agenda');
  AG_LIDO = Date.now();
  AGPL.pend = null;   // relê a agenda do Fabio junto
  await rmbGarantirTokenValido().catch(() => {});
  await carregarEmailDono();
  if (EMAIL_DONO === null) {   // não deu para confirmar quem está logado: nunca concluir "não é o dono" por falha de leitura
    alvo.innerHTML = '<h2>Minha agenda</h2><div class="contexto" style="border-color:var(--farol-fora);">✗ Não consegui confirmar o seu login agora. <button type="button" class="preset-btn" onclick="entrarAgenda()">Tentar de novo</button></div>';
    return;
  }
  // 07/11/2026 (dono 03:11): cada login tem a sua agenda (minha_agenda). Fica escondida da equipe até o "manda" do dono na
  // mensagem do Avisos (AGENDA_TODOS); até lá o dono confere a de cada um pelo "ver como".
  if (!souODono()) {
    // 07/11/2026 (dono 03:59): o Fabio vê a agenda da equipe (só leitura), nunca o "Depende de você" do dono
    if (AGP.veEquipe === null) { const r = await trRpcSeguro('agenda_ve_equipe', {}); AGP.veEquipe = r.ok ? (await r.json()) === true : false; }
    if (AGENDA_TODOS) await agPessoaEntrar(silencioso ? AGP.verComo || null : null);
    else alvo.innerHTML = '<h2>Minha agenda</h2>' + (AGP.veEquipe ? '' : '<div class="contexto">A sua agenda chega em breve.</div>');
    if (AGP.veEquipe) agEquipeMontar().then(agGuia);
    agPlanoMontar();
    return;
  }
  if (!silencioso) alvo.innerHTML = '<h2>Minha agenda</h2><div class="contexto">Carregando…</div>';
  // 09/11/2026: o que o fato já resolveu (ex.: rotina logou depois do pedido) fecha antes de ler
  await trRpcSeguro('dono_pendencia_conferir', {}).catch(() => {});
  const hoje = agHoje(), fim = agMais(hoje, 7), ler = (q) => consultarTudo(q).catch((e) => ({ erro: e.message }));
  // 12/11/2026 (dono 01:09): o que o robô conferiu nas últimas 24 h aparece como "✓ conferido"
  const ontem = new Date(Date.now() - 24 * 3600 * 1000).toISOString();
  // 13/11/2026 (dono 10:07; chat Avisos): a aba Avisos — esperando o "manda", automáticos validados e enviados/travados em 7 dias
  AG.avisos = await consultarTudo('vw_avisos_painel_dono_le?select=*&order=grupo,quando.desc.nullslast,ref').catch((e) => ({ erro: e.message }));
  const [pend, cp, fer, prev, calc, rmb, ext, folhaUlt, folhaVal, conf] = await Promise.all([
    ler('dono_pendencia?select=id,chave,frente,o_que,desde,prazo,link,contexto,resposta,respondido_em,retorno,retorno_em,retorno_visto_em,fio,feito_em,confere,conferencia_nota&para=is.null&resolvido_em=is.null&order=prazo.nullsfirst,id'),
    ler(`vw_fin_contas_pagar?select=vencimento,dia_pagamento,situacao,descricao,debito,credito,conta,conta_exibida,origem,id_titulo&sentido=eq.PAGAR&situacao=neq.PAGO&dia_pagamento=lte.${fim}&order=dia_pagamento,descricao`).then((L) => (Array.isArray(L) && L.forEach((r) => { if (r.dia_pagamento) r.vencimento = r.dia_pagamento; }), L)),
    ler('vw_rh_ferias_alertas?select=nome,situacao,limite_gozo,pagar_ate,valor_estimado,pagamento,extrato_ate&order=limite_gozo'),
    ler(`vw_rh_previsao_a_pagar?select=dia,tipo,unidade,valor&dia=gte.${hoje}&dia=lte.${fim}&order=dia,tipo`),
    ler(`vw_rh_calculos_mes?select=nome,calculo,data_limite,calculado_em,fechado_em,enviado_em,pessoas,total&data_limite=gte.${hoje}&data_limite=lte.${fim}&order=data_limite`),
    ler('vw_rmb_pedidos?select=id,pessoa,valor,descricao,situacao,so_o_dono&situacao=eq.PEDIDO&so_o_dono=is.true&order=id'),
    ler('vw_fin_conciliado_ate?select=conta,conciliado_ate&order=conta'),
    ler('vw_rh_pagamento_mes?select=competencia&liquido_folha=not.is.null&order=competencia.desc&limit=1'),
    ler('rh_folha_validada?select=competencia'),
    ler(`dono_pendencia?select=id,frente,o_que,resolvido_em&para=is.null&resolvido_por=like.conferido*&resolvido_em=gte.${ontem}&order=resolvido_em.desc`)]);
  AG.dados = { hoje, fim, pend, cp, fer, prev, calc, rmb, ext, folhaUlt, folhaVal, conf };
  agDesenhar();
}
function agDesenhar() {
  const { hoje, fim, pend, cp, fer, prev, calc, rmb, ext, folhaUlt, folhaVal, conf } = AG.dados;
  // 07/11/2026 (dono: "sempre espere o tempo de conciliação nas baixas do a pagar do painel"): conta vencida só é "vencida"
  // depois que o extrato daquela conta já cobre o dia do vencimento; antes disso, "aguardando conciliação"
  // fonte única do Financeiro: até que dia cada conta está conciliada (vw_fin_conciliado_ate)
  const ult = {}; (Array.isArray(ext) ? ext : []).forEach((e) => { if (e.conciliado_ate) ult[e.conta] = String(e.conciliado_ate).slice(0, 10); });
  const ultMin = Object.values(ult).sort()[0] || null;
  const conciliou = (dia, conta) => { const u = (conta && ult[conta]) || ultMin; return !!u && String(dia).slice(0, 10) <= u; };
  const itens = [];   // { dia, txt, ir, chat, tipo: 'atraso'|'alerta'|'', id (pendência) }
  AG.sinal = 0;
  const add = (o) => itens.push(Object.assign({ tipo: '' }, o));
  const falhou = [];
  const ok = (x, rot) => { if (x && x.erro) { falhou.push(rot); return false; } return Array.isArray(x); };
  // 1) o que depende de mim (os chats gravam)
  if (ok(pend, 'o que depende de você')) pend.forEach((p) => {
    const espera = !!(p.resposta || p.feito_em);   // respondido (aguardando aplicar) ou feito (conferindo): sai do número
    if (!espera && (!p.prazo || p.prazo <= hoje)) AG.sinal++;
    const dia = !p.prazo || p.prazo < hoje ? hoje : p.prazo;
    if (dia > fim) return;
    const chat = String(p.link || '').startsWith('chat:') ? p.link.slice(5) : null;
    // 12/11/2026 (dono 01:30): "desde dd/mm (N dias)" e "prazo dd/mm" com farol em cada cartão
    add({ dep: !espera, grupo: espera ? 'anda' : 'dep', dia, txt: `${agE(p.o_que)} ${agDatas(p.desde, p.prazo, espera)}`, ir: chat ? null : String(p.link || '').replace(/^#/, '') || null, chat, id: p.id, frente: p.frente, tipo: espera ? '' : p.prazo && p.prazo < hoje ? 'atraso' : 'alerta', pend: p,
      desde: String(p.desde || '').slice(0, 10), prazo: p.prazo || '' });
  });
  // 13/11/2026 (chat Avisos): os rascunhos esperando o "manda" saíram da agenda geral e vivem na aba Avisos; contam no número
  const avEsp = Array.isArray(AG.avisos) ? AG.avisos.filter((a) => Number(a.grupo) === 1 && a.estado === 'ESPERA').length : 0;
  AG.avEsp = avEsp;
  if (avEsp) { AG.sinal += avEsp; add({ dep: true, dia: hoje, tipo: 'alerta', txt: `<b>${avEsp}</b> ${avEsp === 1 ? 'aviso à equipe esperando' : 'avisos à equipe esperando'} o seu "manda" — <a href="javascript:void(0)" onclick="agFiltrar('avisos')" style="color:var(--info);">abrir os avisos</a>` }); }
  // 12/11/2026 (dono 01:09): o que o robô conferiu na fonte e fechou (últimas 24 h)
  if (Array.isArray(conf)) conf.forEach((c) => add({ grupo: 'anda', dia: hoje, txt: `<span style="color:var(--farol-ok);">✓ conferido ${agHm(c.resolvido_em)}:</span> ${agE(c.o_que)}`, frente: c.frente }));
  // 2) reembolso que só eu aprovo (o da Hellen)
  if (ok(rmb, 'reembolsos')) rmb.forEach((g) => (AG.sinal++, add({ dep: true, dia: hoje, txt: `Aprovar o reembolso de <b>${agR(g.valor)}</b> (${agE(agNome(g.pessoa))}: ${agE(g.descricao)})`, ir: 'reembolsos', tipo: 'alerta' })));
  // 3) contas a pagar: vencidas hoje, e o total de cada dia
  if (ok(cp, 'contas a pagar')) {
    const val = (c) => Math.max(0, (Number(c.debito) || 0) - (Number(c.credito) || 0));
    // a situação já vem do banco (vw_fin_contas_pagar: 'VENCIDA' só depois da conciliação; antes, 'AGUARDANDO CONCILIACAO')
    const venc = cp.filter((c) => c.vencimento < hoje && c.situacao === 'VENCIDA'), agu = cp.filter((c) => c.vencimento < hoje && c.situacao !== 'VENCIDA');
    // 07/11/2026 (Organizador: "o mesmo número em toda tela"): conta-se TÍTULO, como o Contas a pagar (cpTitulos), não linha de rateio
    const nTit = (L) => new Set(L.map((c, i) => c.id_titulo ? `${c.origem}|${c.id_titulo}|${c.vencimento}|${c.conta_exibida || ''}` : `l${i}`)).size;
    AG.sinal += nTit(venc);
    if (venc.length) add({ dep: true, dia: hoje, txt: `<b>${nTit(venc)}</b> ${nTit(venc) === 1 ? 'conta vencida' : 'contas vencidas'}, <b>${agR0(venc.reduce((a, c) => a + val(c), 0))}</b>`, ir: 'contaspagar', tipo: 'atraso' });
    if (agu.length) add({ dia: hoje, txt: `<span style="color:var(--tx-3);">${nTit(agu)} ${nTit(agu) === 1 ? 'conta' : 'contas'} aguardando conciliação (${agR0(agu.reduce((a, c) => a + val(c), 0))}) — a conciliação do banco desse dia ainda não terminou</span>`, ir: 'contaspagar' });
    [...new Set(cp.filter((c) => c.vencimento >= hoje).map((c) => c.vencimento))].forEach((d) => {
      const L = cp.filter((c) => c.vencimento === d), m = L.slice().sort((a, b) => val(b) - val(a))[0];
      add({ dia: d, txt: `<b>${agR0(L.reduce((a, c) => a + val(c), 0))}</b> a pagar (${nTit(L)} ${nTit(L) === 1 ? 'conta' : 'contas'}; maior: ${agE(String(m.descricao || '').replace(/\s*\(parc\..*$/, '').slice(0, 60))} ${agR0(val(m))})`, ir: 'contaspagar' });
    });
  }
  // 4) férias: pagar (até) e começar
  if (ok(fer, 'férias')) fer.forEach((x) => {
    if (x.situacao === 'programada' && x.pagar_ate && x.pagar_ate <= fim) {
      const passou = x.pagar_ate < hoje, espera = passou && (x.pagamento ? x.pagamento === 'AGUARDANDO_CONCILIACAO' : !conciliou(x.pagar_ate, null));
      if (passou && !espera) AG.sinal++;
      add({ dep: passou && !espera, dia: passou ? hoje : x.pagar_ate, txt: espera ? `<span style="color:var(--tx-3);">Férias de <b>${agE(agNome(x.nome))}</b>${x.valor_estimado ? ' (' + agR(x.valor_estimado) + ')' : ''}: aguardando conciliação</span> <span class="f">pagar até ${agDm(x.pagar_ate)}</span>`
        : `${passou ? '✗ ' : ''}Pagar as férias de <b>${agE(agNome(x.nome))}</b>${x.valor_estimado ? ' (' + agR(x.valor_estimado) + ')' : ''}${passou ? ` <span class="f">vencia ${agDm(x.pagar_ate)}</span>` : ''}`,
        ir: 'pferias', tipo: espera ? '' : passou ? 'atraso' : 'alerta' }); }
    if (x.situacao === 'programada' && x.limite_gozo && x.limite_gozo >= hoje && x.limite_gozo <= fim) add({ dia: x.limite_gozo, txt: `${agE(agNome(x.nome))} começa as férias`, ir: 'pferias' });
  });
  // 5) folha: rescisões e o que vence de cálculo
  if (ok(prev, 'previsão da folha')) prev.filter((p) => p.tipo !== 'FERIAS').forEach((p) => add({ dia: p.dia, txt: `${agE(agNome(String(p.tipo).replace(/_/g, ' ')))}: <b>${agR(p.valor)}</b>${p.unidade ? ' · ' + agE(p.unidade) : ''}`, ir: p.tipo === 'RESCISAO' ? 'presc' : 'pcalc' }));
  if (ok(folhaUlt, 'folha') && ok(folhaVal, 'folha validada') && folhaUlt[0]) {
    const comp = String(folhaUlt[0].competencia).slice(0, 10);
    if (!folhaVal.some((v) => String(v.competencia).slice(0, 10) === comp)) {
      AG.sinal++;
      const mes = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'][Number(comp.slice(5, 7)) - 1];
      add({ dep: true, dia: hoje, txt: `Validar a conferência da folha de <b>${mes}</b> (o robô só atualiza o Saipos e a lista de pagamento depois)`, ir: 'pconf', tipo: 'alerta' });
    }
  }
  if (ok(calc, 'cálculos da folha')) calc.forEach((c) => add({ dia: c.data_limite, txt: `${agE(c.nome)}: ${c.calculado_em ? `calculado, ${Number(c.pessoas || 0)} pessoas, <b>${agR(c.total)}</b>` : '<b>ainda não calculado</b>'}`, ir: 'pcalc', tipo: c.calculado_em ? '' : 'alerta' }));

  const alvo = document.getElementById('view-agenda');
  const dias = []; for (let i = 0; i <= 7; i++) dias.push(agMais(hoje, i));
  const ordemTipo = { atraso: 0, alerta: 1, '': 2 };
  let h = '<h2>Minha agenda</h2>' + agOrdemHtml(true);
  if (falhou.length) h += `<div class="contexto" style="text-align:left;border-color:var(--farol-fora);">✗ Não li: ${falhou.join(', ')}. <button type="button" class="preset-btn" onclick="entrarAgenda()">Tentar de novo</button></div>`;
  const linha = (x) => {
    const acao = x.ir ? `<button type="button" class="preset-btn" onclick="agIr('${agE(x.ir)}')">abrir</button>` : x.chat ? `<span class="f">chat ${agE(x.chat)}</span>` : '';
    // 12/11/2026 (dono 01:09): "Feito" não fecha — fica "feito por você — conferindo" e o robô confere na fonte
    const feito = x.id && !(x.pend && x.pend.feito_em) ? `<button type="button" class="preset-btn" title="avisar que já fez (o robô confere)" onclick="agFeito(${x.id})">Feito</button>` : '';
    // 12/11/2026 (dono, pelo Organizador): o contexto do item à vista, e responder ou tirar dúvida ali mesmo
    const p = x.pend;
    if (!p) return `<div class="ag-lin ${x.tipo}"><span class="t">${x.txt}${x.frente ? ` <span class="f">· ${agE(x.frente)}</span>` : ''}</span>${acao}${feito}</div>`;
    const feitoTx = p.feito_em ? `<div class="ag-ctx" style="color:var(--farol-ok);">✓ feito por você ${agQuando(p.feito_em)} —${p.confere
        ? `conferindo: o robô fecha ${agE(agConfereTxt(p.confere))}`
        : `sem conferência automática: a frente ${agE(p.frente || '')} confere${p.conferencia_nota ? ' · ' + agE(p.conferencia_nota) : ''}`}
      <a href="javascript:void(0)" onclick="agFeito(${p.id},true)">desfazer</a></div>` : '';
    const resp = p.resposta ?`<div class="ag-ctx" style="color:var(--farol-ok);">✓ resposta enviada ${agDm(new Date(p.respondido_em).toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' }))} às ${agHm(p.respondido_em)} — respondido, aguardando aplicar: “${agE(p.resposta)}” <a href="javascript:void(0)" onclick="agRespForm(${p.id})">mudar</a></div>` : '';
    // 12/11/2026 (Organizador): a frente devolve ao dono ("↩ resposta para você"); o fio guarda a conversa
    const fio = Array.isArray(p.fio) ? p.fio : [];
    const quando = (t) => t ? `${agDm(new Date(t).toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' }))} ${agHm(t)}` : '';
    const volta = !p.resposta && !p.feito_em && p.retorno ?`<div class="ag-ctx" style="color:var(--info);font-weight:700;">↩ resposta para você${p.retorno_em ? ' (' + quando(p.retorno_em) + ')' : ''}: <span style="font-weight:400;color:var(--tx-1);">${agE(p.retorno)}</span></div>` : '';
    const conversa = fio.length > 1 ? `<details class="ag-ctx"><summary style="cursor:pointer;">conversa (${fio.length})</summary>${fio.map((m) => `<div><b>${m.de === 'dono' ? 'você' : agE(m.de)}</b> ${quando(m.em)}: ${agE(m.texto)}</div>`).join('')}</details>` : '';

// 13/11/2026 13:16 (dono não entendeu "1,2,3,4,5,6 às 10:30"): os dias de wa_atividade_repetida.dias_semana (0=dom … 6=sáb)
// por nome — seguidos "seg a sáb" (inclusive virando a semana, "qua a seg"), soltos "seg, qua, sex", os 7 = "todo dia"
function agAvDias(txt) {
  const N = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  return String(txt).replace(/\[?\b([0-6](?:\s*,\s*[0-6])*)\b\]?(?=\s*às\b)/g, (m, lista) => {
    const S = [...new Set(lista.split(',').map((x) => Number(x.trim())))];
    if (S.length === 7) return 'todo dia';
    if (S.length === 1) return N[S[0]];
    const tem = new Set(S), inicios = S.filter((d) => !tem.has((d + 6) % 7));
    if (inicios.length === 1) { let f = inicios[0]; while (tem.has((f + 1) % 7)) f = (f + 1) % 7; if (f < inicios[0] && S.length === 6) return `todo dia menos ${N[[0, 1, 2, 3, 4, 5, 6].find((d) => !tem.has(d))]}`; return `${N[inicios[0]]} a ${N[f]}`; }
    return [1, 2, 3, 4, 5, 6, 0].filter((d) => tem.has(d)).map((d) => N[d]).join(', ');
  });
}

// a lista de uma pessoa (soLeitura = o dono vendo a de outro: os botões aparecem, mas não gravam)
function agPessoaHtml(L, soLeitura) {
  const hoje = agHoje();
  const dias = []; for (let i = 0; i <= 7; i++) dias.push(agMais(hoje, i));
  const diaDe = (x) => x.estado === 'Conferido' || x.dia < hoje ? hoje : x.dia;   // o que passou (e o conferido) aparece em hoje
  let h = '';
  dias.forEach((d) => {
    const antigos = agOrdemLer() === 'antigos';   // 12/11 (dono 01:30): "mais antigos primeiro"; o padrão é por prazo
    const doDia = L.filter((x) => diaDe(x) === d).sort((a, b) => (antigos ? String(a.dia_original || '').localeCompare(String(b.dia_original || '')) : 0)
      || AG_ORDEM.indexOf(a.estado) - AG_ORDEM.indexOf(b.estado) || String(a.dia || '').localeCompare(String(b.dia || '')));
    if (!doDia.length && d !== hoje) return;
    h += `<div class="ag-dia${d === hoje ? ' hoje' : ''}">${d === hoje ? 'Hoje · ' : ''}${agSem(d)} ${agDm(d)}</div>`;
    if (!doDia.length) h += '<div class="ag-lin"><span class="t" style="color:var(--farol-ok);">✓ nada para hoje</span></div>';
    doDia.forEach((x) => {
      const id = Number(x.tarefa_id);
      const falta = Number(x.falta_agora) > 0 ? Number(x.falta_agora).toLocaleString('pt-BR') : '';
      const nota = x.estado === 'Conferindo' ? `feito por você ${agQuando(x.concluiu_em)} — conferindo: o robô confere sozinho na tela`
        : x.estado === 'Feito sem conferência' ? `feito por você ${agQuando(x.concluiu_em)} — sem conferência automática: quem passou a atividade confere${x.nota ? ' · ' + agE(x.nota) : ''}`
        : x.estado === 'Conferido' ? '<span style="color:var(--farol-ok);">✓ conferido</span>'
        : x.estado === 'Falta' ? `<span style="color:var(--info);font-weight:700;">↩ o robô conferiu ${agQuando(x.conferido_em)} e ainda ${falta === '1' ? 'falta 1' : 'faltam ' + (falta || 'itens')}.</span> Termine e toque em Feito de novo`
        : x.estado === 'Voltou' ? `<span style="color:var(--info);font-weight:700;">↩ resposta para você${x.retorno_em ? ' (' + agQuando(x.retorno_em) + ')' : ''}:</span> <span style="color:var(--tx-1);">${agE(x.retorno)}</span>`
        : x.estado === 'Respondido' ? `<span style="color:var(--farol-ok);">✓ resposta enviada ${agQuando(x.resposta_em)}</span> — aguardando quem passou a atividade`
        : x.estado === 'Atrasada' ? `atrasada desde ${agDm(x.dia)}`
        : x.estado === 'Travada' ? 'travada: sem resposta ao robô'
        : x.estado === 'Mais tempo' ? `novo prazo ${agSem(x.dia)} ${agDm(x.dia)}${x.prazo_motivo ? ' · ' + agE(x.prazo_motivo) : ''}`
        : x.estado === 'Pediu ajuda' ? `pediu ajuda às ${agHm(x.ajuda_em)}${x.ajuda_resposta ? ' · resposta: ' + agE(x.ajuda_resposta) : ' · aguardando resposta'}`
        : '';
      const bt = (rot, fn, tit) => `<button type="button" class="preset-btn" title="${tit}" onclick="${soLeitura ? 'agSoLeitura()' : fn}">${rot}</button>`;
      const abrir = x.tela ? bt('abrir', `agPessoaAbrir(${id})`, 'ir para a tela desta atividade') : '';
      const bts = AG_FEITO.includes(x.estado) ? abrir
        : [abrir,
           bt('Feito', `agPessoaConcluir(${id})`, 'avisar que já fez (o robô confere)'),
           bt('Responder', `agPessoaForm(${id},'resp')`, 'responder, perguntar ou pedir ajuda no próprio item'),
           bt('⏱ Preciso de mais tempo', `agPessoaForm(${id},'prazo')`, 'pedir 1, 2 ou 3 dias')].join('');   // 12/11 01:56 (dono): só o Responder, que faz o papel da dúvida/ajuda
      // o contexto do item e a conversa (Feito, respostas e retornos), como na agenda do dono
      const fio = Array.isArray(x.fio) ? x.fio : [];
      const conversa = fio.length > 1 ? `<details class="ag-ctx"><summary style="cursor:pointer;">conversa (${fio.length})</summary>${fio.map((m) =>
        `<div><b>${m.de === 'voce' ? 'você' : agE(m.de)}</b> ${agQuando(m.em)}: ${agE(m.texto)}</div>`).join('')}</details>` : '';
      h += `<div class="ag-lin ${AG_ESTADO[x.estado] || ''}" id="agItem_${id}" style="flex-wrap:wrap;"><span class="t"><span class="ag-id" title="número do item">#${id}</span>${agE(x.atividade)} ${agDatas(x.dia_original, x.dia, AG_FEITO.includes(x.estado))}${nota ? ` <span class="f">· ${nota}</span>` : ''}</span><span class="bts">${bts}</span>
        ${x.contexto ? `<div class="ag-ctx">${agE(x.contexto)}</div>` : ''}${conversa}${agAnxLugar('tarefa', id)}</div>`;
      if (!soLeitura && AGP.form && AGP.form.id === id) h += agPessoaFormHtml(id, AGP.form.tipo);
    });
  });
  return h;
}

// ---- BUSCA (dono, sex 13/11/2026 10:35: "coloca um campo de busca na agenda pra eu achar a mensagem, o link aqui não direciona
// pra mensagem certa"). Duas partes: (1) esconde os cartões da tela que não têm o termo; (2) procura no banco (dono_pendencia),
// inclusive o que já foi resolvido e o que está na agenda de outra pessoa — o que cada login pode ver é o banco que decide (RLS).
let AG_BUSCA = '', AG_BUSCA_FOCO = null, AG_BUSCA_T = null;
const agNorm = (t) => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function agBuscaHtml() {
  return `<div style="display:flex;gap:8px;align-items:center;margin:6px 0 4px;"><input id="agBusca" type="search" value="${agE(AG_BUSCA)}" oninput="agBuscar(this.value)"

function agBuscar(v, ja) {

  clearTimeout(AG_BUSCA_T);
  if (ja) { const i = document.getElementById('agBusca'); if (i) i.value = AG_BUSCA; }
  AG_BUSCA_T = setTimeout(agBuscaAplicar, ja ? 0 : 300);

async function agBuscaAplicar() {
  const t = AG_BUSCA.trim(), res = document.getElementById('agBuscaRes');
  const num = /^#?\d+$/.test(t) ? Number(t.replace('#', '')) : null;
  // (1) os cartões já na tela
  document.querySelectorAll('.ag-lin').forEach((el) => {
    if (el.closest('#agBuscaRes')) return;
    el.style.display = !t || (num ? el.id === 'agItem_' + num || agNorm(el.textContent).includes('#' + num) : agNorm(el.textContent).includes(agNorm(t))) ? '' : 'none';
  });
  if (!res) return;
  if (!t || (!num && t.length < 2)) { res.innerHTML = ''; return; }
  // (2) no banco: tudo o que este login pode ver, aberto ou resolvido
  res.innerHTML = '<div class="caption-label" style="text-align:left;">procurando…</div>';
  const w = t.replace(/[,()*%\\"]/g, ' ').trim();
  const cols = 'select=id,para,frente,o_que,desde,prazo,contexto,resposta,respondido_em,resolvido_em,resolvido_por,feito_em,retorno,retorno_em,fio';
  const filtro = num ? `id=eq.${num}` : 'or=(' + ['o_que', 'frente', 'para', 'contexto', 'resposta', 'chave'].map((c) => `${c}.ilike.*${encodeURIComponent(w)}*`).join(',') + ')';
  let L;
  try { L = await consultarTudo(`dono_pendencia?${cols}&${filtro}&order=id.desc&limit=40`); }
  catch (e) { res.innerHTML = `<div class="contexto" style="text-align:left;border-color:var(--farol-fora);">✗ Não consegui procurar: ${agE(e.message)} <button type="button" class="preset-btn" onclick="agBuscaAplicar()">Tentar de novo</button></div>`; return; }
  if (AG_BUSCA.trim() !== t) return;   // digitou de novo enquanto procurava
  const dmh = (x) => x ? `${agDm(new Date(x).toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' }))} ${agHm(x)}` : '';
  const quem = (e) => e ? String(e).split('@')[0].replace(/^./, (c) => c.toUpperCase()) : '';
  res.innerHTML = !L.length ? `<div class="caption-label" style="text-align:left;">Nada com "${agE(t)}"${num ? ' (o item não existe ou não é da sua agenda)' : ''}.</div>`
    : `<div class="caption-label" style="text-align:left;">${L.length} ${L.length === 1 ? 'item encontrado' : 'itens encontrados'} — inclui os resolvidos${souODono() ? ' e os da agenda de outras pessoas' : ''}</div>`
    + L.map((p) => {
      const est = p.resolvido_em ? `<span style="color:var(--farol-ok);font-weight:700;">✓ resolvido ${dmh(p.resolvido_em)}${p.resolvido_por ? ' · ' + agE(quem(p.resolvido_por)) : ''}</span>`
        : p.feito_em ? '<span style="color:var(--farol-ok);">feito — conferindo</span>' : p.resposta ? '<span style="color:var(--info);">respondido — esperando aplicar</span>'
        : `<span style="color:var(--farol-perto);font-weight:700;">aberto${p.prazo ? ' · prazo ' + agDm(p.prazo) : ''}</span>`;
      const fio = Array.isArray(p.fio) ? p.fio : [];
      const naTela = document.getElementById('agItem_' + p.id);
      return `<div class="ag-lin" id="agBusca_${p.id}" style="flex-wrap:wrap;${AG_BUSCA_FOCO === p.id ? 'outline:2px solid var(--info);' : ''}"><span class="t"><span class="ag-id">#${p.id}</span>${agE(p.o_que)}
          <span class="f">· ${agE(p.frente || '')}${p.para ? ' · agenda de ' + agE(quem(p.para)) : ''}${p.desde ? ' · desde ' + agDm(String(p.desde).slice(0, 10)) : ''}</span> · ${est}</span>
        ${naTela && naTela.style.display !== 'none' ? `<button type="button" class="preset-btn" onclick="document.getElementById('agItem_${p.id}').scrollIntoView({block:'center',behavior:'smooth'})">ir ao cartão</button>` : ''}
        <details class="ag-ctx"${AG_BUSCA_FOCO === p.id || L.length === 1 ? ' open' : ''}><summary style="cursor:pointer;">detalhes</summary>
          ${p.contexto ? `<div>${agE(p.contexto)}</div>` : ''}
          ${p.resposta ? `<div style="color:var(--farol-ok);">resposta${p.respondido_em ? ' (' + dmh(p.respondido_em) + ')' : ''}: ${agE(p.resposta)}</div>` : ''}
          ${p.retorno ? `<div style="color:var(--info);">retorno${p.retorno_em ? ' (' + dmh(p.retorno_em) + ')' : ''}: ${agE(p.retorno)}</div>` : ''}
          ${fio.length ? fio.map((m) => `<div><b>${m.de === 'dono' ? 'você' : agE(m.de)}</b> ${dmh(m.em)}: ${agE(m.texto || m.text || '')}</div>`).join('') : ''}
        </details></div>`;
    }).join('');
  if (AG_BUSCA_FOCO) { const el = document.getElementById('agBusca_' + AG_BUSCA_FOCO); if (el) setTimeout(() => el.scrollIntoView({ block: 'center', behavior: 'smooth' }), 150); }
}
// 12/11/2026 02:08 (dono): ?item=131 no endereço abre a agenda rolada até o item (uma vez) e o destaca
let AG_ITEM_FEITO = false;

function agRolarAteItem() {

const AGA_ABERTOS = ['Travada', 'Respondeu', 'Enviada', 'A enviar'];
const AGA_ORDEM = AGA_ABERTOS.concat(['Feita', 'Cancelada']);
const AGA_COR = { Travada: 'var(--farol-fora)', Respondeu: 'var(--farol-perto)', Enviada: 'var(--tx-1)', 'A enviar': 'var(--tx-3)', Feita: 'var(--farol-ok)', Cancelada: 'var(--tx-4)' };
const AGA = { linhas: null, filtro: null, fechadas: false, erro: null, lidoEm: 0 };
async function agAtivMontar(reler) {
  const alvo = document.getElementById('view-agenda');
  if (!alvo || !souODono()) return;
  if (reler || AGA.linhas === null || Date.now() - AGA.lidoEm > 60000) {
    try { AGA.linhas = await consultarTudo('vw_wa_atividade?select=*&order=pessoa,id.desc'); AGA.erro = null; }
    catch (e) { AGA.erro = e.message; if (!Array.isArray(AGA.linhas)) AGA.linhas = []; }
    AGA.lidoEm = Date.now();
  }
  let box = document.getElementById('agAtiv');
  if (!box) { box = document.createElement('div'); box.id = 'agAtiv'; box.className = 'ag-eq'; alvo.appendChild(box); }
  agAtivDesenhar();
  if (AG_ATIV_IR) { AG_ATIV_IR = false; agIrAtiv(); }
}
function agAtivFiltrar(e) { AGA.filtro = AGA.filtro === e ? null : e; agAtivDesenhar(); }
function agAtivDesenhar() {
  const box = document.getElementById('agAtiv'); if (!box) return;
  const dia = (t) => (t ? new Date(t).toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' }) : null);
  const hoje = agHoje();
  const dias = (x) => { const d = dia(x.enviada_em); if (!d || ['A enviar', 'Feita', 'Cancelada'].includes(x.estado)) return '–';
    const n = Math.round((Date.parse(hoje) - Date.parse(d)) / 86400000); return n <= 0 ? 'hoje' : `${n} ${n === 1 ? 'dia' : 'dias'}`; };
  const falta = (x) => x.falta_agora == null && x.falta_inicial == null ? '–'
    : x.falta_inicial == null ? String(x.falta_agora) : `${x.falta_agora == null ? '?' : x.falta_agora} de ${x.falta_inicial}`;
  const L0 = Array.isArray(AGA.linhas) ? AGA.linhas : [];
  let h = `<div class="ag-bloco" style="margin-top:0;">Equipe <span class="f">· o que o robô passou a cada pessoa pelo WhatsApp e em que pé está; quem muda o estado é o robô</span></div>`;
  if (AGA.erro) h += `<div class="contexto" style="text-align:left;border-color:var(--farol-fora);">✗ Não consegui ler as atividades da equipe: ${agE(AGA.erro)} <button type="button" class="preset-btn" onclick="agAtivMontar(true)">Tentar de novo</button></div>`;
  if (!L0.length) { box.innerHTML = h + (AGA.erro ? '' : '<div class="contexto" style="text-align:left;">Nenhuma atividade com a equipe.</div>'); return; }
  const n = (e) => L0.filter((x) => x.estado === e).length;
  h += `<div class="cards">${AGA_ABERTOS.map((e) => `<div class="card ${e === 'Travada' && n(e) ? 'highlight' : 'neutral'}" style="cursor:pointer;${AGA.filtro === e ? ' outline:2px solid var(--marca-amarelo);' : ''}" onclick="agAtivFiltrar('${e}')"><div class="card-lbl">${e}</div><div class="card-val">${n(e)}</div></div>`).join('')}</div>`;
  const nFech = n('Feita') + n('Cancelada');
  const vis = L0.filter((x) => (AGA.filtro ? x.estado === AGA.filtro : AGA.fechadas || AGA_ABERTOS.includes(x.estado)));
  const ordem = (x) => { const i = AGA_ORDEM.indexOf(x.estado); return i < 0 ? 99 : i; };
  const pessoas = [...new Set(vis.map((x) => x.pessoa))].sort((a, b) => {
    const m = (p) => Math.min(...vis.filter((x) => x.pessoa === p).map(ordem));
    return m(a) - m(b) || String(a).localeCompare(String(b), 'pt-BR');
  });
  if (!vis.length) h += '<div class="contexto" style="text-align:left;">Nada neste estado.</div>';
  pessoas.forEach((p, i) => {
    const L = vis.filter((x) => x.pessoa === p).sort((a, b) => ordem(a) - ordem(b));
    h += `<div style="margin:14px 2px 4px;color:var(--tx-1);font-size:14px;font-weight:800;">${agE(p)} <span style="font-size:11.5px;font-weight:400;color:var(--tx-4);">(${L.length})</span></div>
      <div id="tabelaAgAt${i}" style="overflow-x:auto;"><table><thead><tr><th>Atividade</th><th>Estado</th><th>Enviada em</th><th>Há quantos dias</th><th>Falta</th><th>Resposta</th></tr></thead><tbody>
      ${L.map((x) => `<tr><td style="white-space:normal;">${agE(x.atividade || '')}</td>
        <td style="color:${AGA_COR[x.estado] || 'var(--tx-3)'};font-weight:700;">${agE(x.estado || '')}</td>
        <td>${x.estado === 'A enviar' ? (x.previsto_em ? 'previsto ' + agDm(dia(x.previsto_em)) : '–') : (agDm(dia(x.enviada_em)) || '–')}</td>
        <td>${dias(x)}</td><td>${agE(falta(x))}</td>
        <td style="white-space:normal;">${agE(x.resposta || '')}</td></tr>`).join('')}
      </tbody></table></div>`;
  });
  if (!AGA.filtro && nFech) h += `<div style="margin:12px 2px;font-size:13px;"><a href="javascript:void(0)" style="color:var(--tx-3);" onclick="AGA.fechadas=!AGA.fechadas;agAtivDesenhar()">${AGA.fechadas ? 'esconder' : 'ver'} feitas e canceladas (${nFech})</a></div>`;
  box.innerHTML = h;
}

// =====================================================================================================================
// ANEXO NA RESPOSTA (dono 12/11/2026 11:30; livro chat-frente-telas/respostas/agenda-anexo-na-resposta). O Responder do dono,
// do Fabio e de cada pessoa aceita até 5 arquivos (foto, PDF, planilha; 20 MB cada). Bucket privado agenda-anexos, na pasta do
// e-mail de quem envia; a linha vai para agenda_anexo (agenda_anexo_gravar), que só deixa ver quem pode (RLS). Os anexos aparecem
// no item com "abrir" e "baixar" (link assinado de 1 h, pedido em lote); quem mandou pode "tirar".
// =====================================================================================================================
const AGX = { lista: null, links: {}, feitos: {}, lendo: false };
const AGX_MAX = 5, AGX_MB = 20;
const AGX_EXT = { pdf: 'application/pdf', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', heic: 'image/heic', heif: 'image/heif',
  gif: 'image/gif', csv: 'text/csv', txt: 'text/plain', xls: 'application/vnd.ms-excel', xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
  ods: 'application/vnd.oasis.opendocument.spreadsheet', doc: 'application/msword', docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' };
const agAnxExt = (f) => String(f.name || '').toLowerCase().split('.').pop();
const agAnxMime = (f) => AGX_EXT[agAnxExt(f)] || (/^image\//.test(f.type) ? f.type : '');
const agAnxEu = () => String((rmbSessao() || {}).email || '').toLowerCase();
const agAnxTam = (b) => !b ? '' : b < 1048576 ? Math.max(1, Math.round(b / 1024)) + ' KB' : (b / 1048576).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' MB';
function agAnxLugar(tipo, id) { return `<div class="ag-ctx ag-anx" data-t="${tipo}" data-i="${Number(id)}"></div>`; }
function agAnxCampo(campo) {
  return `<label class="preset-btn" style="cursor:pointer;" title="foto, PDF ou planilha; até ${AGX_MAX} arquivos de ${AGX_MB} MB">📎 Anexar<input type="file" id="${campo}" multiple
    accept="image/*,.pdf,.csv,.txt,.xls,.xlsx,.ods,.doc,.docx" style="display:none;" onchange="agAnxEscolheu('${campo}')"></label><span id="${campo}_lista" class="f" style="align-self:center;"></span>`;
}
function agAnxEscolheu(campo) {
  const fs = agAnxArquivos(campo), alvo = document.getElementById(campo + '_lista'); if (!alvo) return;
  alvo.textContent = fs.length ? fs.map((f) => `${f.name} (${agAnxTam(f.size)})`).join(' · ') : '';
}
function agAnxArquivos(campo) { const i = document.getElementById(campo); return i && i.files ? Array.from(i.files) : []; }
async function agAnxFetch(url, op) {
  const faz = () => fetch(url, Object.assign({}, op, { headers: Object.assign(rmbHeaders(), (op || {}).headers || {}) }));
  let r = await faz();
  if (await rmbRenovarSeExpirado(r)) r = await faz();
  return r;
}
// sobe e grava cada arquivo; o que já foi não sobe de novo no "Tentar de novo". Devolve true se todos foram.
async function agAnxEnviar(tipo, id, arqs, refazer) {
  const eu = agAnxEu();
  if (!eu) { avisoAcao('erro', '✗ Entre com o seu login para anexar.'); return false; }
  if (arqs.length > AGX_MAX) { avisoAcao('atencao', `! No máximo ${AGX_MAX} arquivos por vez.`); return false; }
  for (const f of arqs) {
    if (!agAnxMime(f)) { avisoAcao('atencao', `! ${f.name}: só foto, PDF, planilha, texto ou Word.`); return false; }
    if (f.size > AGX_MB * 1048576) { avisoAcao('atencao', `! ${f.name} passa de ${AGX_MB} MB. Mande um menor.`); return false; }
  }
  let i = 0;
  for (const f of arqs) {
    i++;
    const chave = `${tipo}:${id}:${f.name}:${f.size}:${f.lastModified}`;
    if (AGX.feitos[chave]) continue;
    avisoAcao('enviando', `Enviando ${arqs.length > 1 ? `anexo ${i} de ${arqs.length}` : 'o anexo'}: ${f.name}…`);
    try {
      const limpo = f.name.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9._-]+/g, '-').slice(-80) || 'arquivo';
      const caminho = `${eu}/${tipo}-${Number(id)}/${Date.now()}-${limpo}`;
      const up = await agAnxFetch(`${SUPABASE_URL}/storage/v1/object/agenda-anexos/${caminho}`, { method: 'POST', headers: { 'Content-Type': agAnxMime(f) }, body: f });
      if (!up.ok) { const d = await up.json().catch(() => ({})); throw new Error(d.message || d.error || `o arquivo não subiu (${up.status})`); }
      const sg = await agAnxFetch(`${SUPABASE_URL}/storage/v1/object/sign/agenda-anexos/${caminho}`, { method: 'POST', body: JSON.stringify({ expiresIn: 2592000 }) });
      const d = sg.ok ? await sg.json().catch(() => ({})) : {};
      const r = await trRpcSeguro('agenda_anexo_gravar', { p_tipo: tipo, p_item: Number(id), p_caminho: caminho, p_nome: f.name, p_tamanho: f.size,
        p_mime: agAnxMime(f), p_url: d.signedURL ? `${SUPABASE_URL}/storage/v1${d.signedURL}` : null });
      if (!r.ok) throw new Error(await trErroDe(r));
      AGX.feitos[chave] = true;
    } catch (e) {
      avisoAcao('erro', `✗ ${f.name} não foi: ${e.message || e}`, refazer);
      AGX.lista = null; agAnxPintar(true);
      return false;
    }
  }
  AGX.lista = null;
  return true;
}
// lê a lista (a RLS já filtra) e os links de 1 h em lote; pinta os lugares que estiverem na tela
async function agAnxPintar(reler) {
  const lugares = document.querySelectorAll('#view-agenda .ag-anx'); if (!lugares.length) return;
  if ((reler || AGX.lista === null || Date.now() - (AGX.lidoEm || 0) > 120000) && !AGX.lendo) {
    AGX.lendo = true; AGX.lidoEm = Date.now();
    try {
      AGX.lista = await consultarTudo('agenda_anexo?select=id,item_tipo,item_id,caminho,nome,tamanho,por,criado_em&order=id');
      const falta = AGX.lista.map((a) => a.caminho).filter((c) => !AGX.links[c]);
      if (falta.length) {
        const r = await agAnxFetch(`${SUPABASE_URL}/storage/v1/object/sign/agenda-anexos`, { method: 'POST', body: JSON.stringify({ expiresIn: 3600, paths: falta }) });
        const L = r.ok ? await r.json().catch(() => []) : [];
        (Array.isArray(L) ? L : []).forEach((x) => { if (x && x.signedURL && x.path) AGX.links[x.path] = `${SUPABASE_URL}/storage/v1${x.signedURL}`; });
      }
    } catch (e) { AGX.lista = AGX.lista || []; }
    AGX.lendo = false;
  }
  const L = Array.isArray(AGX.lista) ? AGX.lista : [], eu = agAnxEu();
  document.querySelectorAll('#view-agenda .ag-anx').forEach((el) => {
    const meus = L.filter((a) => a.item_tipo === el.dataset.t && Number(a.item_id) === Number(el.dataset.i));
    const html = meus.length ? '📎 ' + meus.map((a) => {
      const u = AGX.links[a.caminho];
      return `<span style="white-space:nowrap;"><b style="color:var(--tx-1);">${agE(a.nome)}</b> <span class="f">${agAnxTam(a.tamanho)}${a.por !== eu ? ' · ' + agE(String(a.por).split('@')[0]) : ''}</span>
        ${u ? `<a href="${agE(u)}" target="_blank" rel="noopener">abrir</a> · <a href="${agE(u)}&download=${encodeURIComponent(a.nome)}">baixar</a>` : '<span class="f">(link indisponível)</span>'}${a.por === eu ? ` · <a href="javascript:void(0)" onclick="agAnxTirar(${a.id})" title="tira este anexo do item">tirar</a>` : ''}</span>`;
    }).join(' &nbsp;·&nbsp; ') : '';
    if (el.dataset.h !== html) { el.dataset.h = html; el.innerHTML = html; }
    el.style.display = html ? '' : 'none';
  });
}
async function agAnxTirar(id) {
  const a = (AGX.lista || []).find((x) => x.id === id); if (!a) return;
  if (!confirm(`Tirar o anexo "${a.nome}" deste item?`)) return;
  avisoAcao('enviando', '… tirando o anexo');
  const r = await trRpcSeguro('agenda_anexo_tirar', { p_id: id });
  if (!r.ok) return avisoAcao('erro', `✗ Não tirou: ${await trErroDe(r)}`, () => agAnxTirar(id));
  const caminho = await r.json().catch(() => a.caminho);
  await agAnxFetch(`${SUPABASE_URL}/storage/v1/object/agenda-anexos`, { method: 'DELETE', body: JSON.stringify({ prefixes: [caminho] }) }).catch(() => {});
  AGX.lista = null; await agAnxPintar(true);
  avisoAcao('ok', `✓ Anexo tirado (${avisoHora()}).`);
}
// qualquer redesenho da agenda (dono, Fabio, equipe, "ver como") ganha os anexos sem mexer em cada função de desenho
(function () {
  const v = document.getElementById('view-agenda'); if (!v || !window.MutationObserver) return;
  let t = null;
  new MutationObserver(() => { clearTimeout(t); t = setTimeout(() => agAnxPintar(false), 150); }).observe(v, { childList: true, subtree: true });
})();

const TELA = 'agenda';
let MODULO_ATUAL = 'agenda';
function exigirLogin(recado) {
  localStorage.removeItem('rmbSessao');
  if (NA_CASCA) { avisarCasca({ tipo: 'casca-login', recado: recado || '' }); return; }
  location.href = '../sistema.html#' + TELA;
}
document.getElementById('modulo-agenda').style.display = '';
registrarUso(TELA);
avisarCasca({ tipo: 'casca-modulo', nome: TELA });
window.reentrarTela = () => { entrarAgenda(); };
// 09/11/2026 (proposta 2026-11-09-agenda-pendencia-se-fecha-sozinha; dono 13:04 "pode a agenda"): a agenda se relê sozinha —
// ao voltar a ficar visível (se passou 1 min) e a cada 5 min aberta. Não relê com formulário aberto, campo em foco ou guia na tela.
let AG_LIDO = Date.now();
function agReler() {
  if (document.visibilityState !== 'visible') return;
  try { if (window.frameElement && window.frameElement.offsetParent === null) return; } catch (e) {}   // na casca, outra tela à frente
  const v = document.getElementById('view-agenda');
  if (!v || v.querySelector('.ag-form') || document.getElementById('guiaBalao')) return;
  const f = document.activeElement; if (f && /^(INPUT|TEXTAREA|SELECT)$/.test(f.tagName)) return;
  const y = window.scrollY;
  entrarAgenda(true).then(() => window.scrollTo(0, y)).catch(() => {});
}
setInterval(agReler, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - AG_LIDO > 60000) agReler(); });
entrarAgenda();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('../sw.js').catch(() => {});
}
