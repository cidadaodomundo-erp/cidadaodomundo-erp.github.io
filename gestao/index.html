<!-- PÁGINA PRÓPRIA DA GESTÃO (05/11/2026, bloco 7 do painel em módulos): Começar por aqui, Resultado e Financeiro.
     A casca abre gestao/index.html#<tela> (docs/casca/paginas.js). Carrega o núcleo, canal.js e gestao.js, o mesmo código
     do painel antigo. Diferente das outras páginas, TROCA DE TELA POR DENTRO entre as telas dela (e Resumo, Cancelamentos
     e Promoções): é assim que o clique num número do Placar leva o recorte (mês e loja) para a tela que ele abre.
     Quem mexe: o chat "Telas do painel". -->
<script>
  // aqui a casca abre a página sem ?casca=1: dentro de moldura da mesma origem é casca
  const NA_CASCA = window.parent !== window;
  if (NA_CASCA) document.documentElement.classList.add('na-casca');
  // TROCA_DENTRO: a página trocou de tela sozinha (atalho do Placar). Aí ela não pede à casca para abrir a tela,
  // porque a casca abriria outra moldura, sem o recorte.
  let TROCA_DENTRO = false;
  function avisarCasca(msg) {
    if (!NA_CASCA) return;
    // troca por dentro: a casca só acompanha o título; abrir a tela trocaria a moldura e perderia o recorte
    if (TROCA_DENTRO && msg && msg.tipo === 'casca-modulo') msg = { tipo: 'casca-titulo', nome: msg.nome };
    try { parent.postMessage(msg, location.origin); } catch (e) {}
  }
</script>

<script>
// O que é desta página: qual tela abrir, a carga de vendas antes dela e a troca de tela por dentro.
const TELAS_GESTAO = ['estasemana', 'hoje', 'placar', 'indicadores', 'semana', 'fechamento', 'evolucao', 'dre', 'fluxo',
  'despesas', 'lucrouni', 'concbanco', 'conciliacao', 'contaspagar', 'contasreceber', 'projecao', 'rede'];
const TELAS_DAQUI = new Set([...TELAS_GESTAO, 'resumo', 'cancelamentos', 'promocoes']);
// 07/11/2026 (dono, Reorganizacao do menu): a Esta semana entrou na Hoje (semana em curso) e o Fechamento do mês
// virou a aba "O mês em uma página" do Placar. Os endereços antigos continuam abrindo o lugar certo.
const TELA_JUNTADA = { estasemana: 'hoje', fechamento: 'placar' };
function telaDe(nome) {
  if (nome === 'estasemana') HOJE_IR_SEMANA = true;
  if (nome === 'fechamento') PLC_ABA = 'fech';
  if (nome === 'placar') PLC_ABA = 'oito';
  return TELA_JUNTADA[nome] || nome;
}
const TELA_PEDIDA = TELAS_GESTAO.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'hoje';
const TELA = telaDe(TELA_PEDIDA);
// as mesmas listas do painel antigo
// 07/11/2026 (auditoria canal-15): o rodapé do Líquido só onde há Líquido
const MODULOS_COM_RODAPE = new Set(['estasemana', 'resumo', 'cancelamentos', 'promocoes', 'relatorios']);
const MODULOS_COM_FILTRO_TOPO = new Set(['estasemana', 'resumo', 'cancelamentos',
  'promocoes', 'qualidade', 'site', 'evolucao']);
let VENDAS_CARREGADAS = false;
function abrirGrupoDoModulo() {}   // o menu é o da casca
function moduloAtivo() { return MODULO_ATUAL; }

function exigirLogin(recado) {
  localStorage.removeItem('rmbSessao');
  if (NA_CASCA) { avisarCasca({ tipo: 'casca-login', recado: recado || '' }); return; }
  location.href = '../sistema.html#' + TELA_PEDIDA;   // aberta solta (botão "abrir"): a porta é a da casca
}

function renderAll() {
  limparFiltrosVer(MODULO_ATUAL);
  const m = computeMetrics();
  const ant = periodoAnterior();
  const a = ant ? computeMetrics(ant.ini, ant.fim) : null;
  renderPresets();
  const ativo = moduloAtivo();
  renderAllCanal(m, a, ant, linhaContexto(ant), ativo);
  renderAllGestao(ativo);
}

// Tela daqui: troca por dentro (o recorte do Placar vai junto). Outra tela: a casca abre.
function mostrarModulo(nome) {
  nome = telaDe(nome);
  if (!TELAS_DAQUI.has(nome)) {
    if (NA_CASCA) { TROCA_DENTRO = false; avisarCasca({ tipo: 'casca-modulo', nome }); return; }
    location.href = '../sistema.html#' + nome; return;
  }
  TROCA_DENTRO = MODULO_ATUAL !== null && nome !== TELA;
  if (!prepararTela(nome)) return;
  entrarTelaCanal(nome);
  entrarTelaGestao(nome);
  window.scrollTo(0, 0);
}

async function abrirTela() {
  try {
    MODULO_ATUAL = null;
    await rmbGarantirTokenValido();
    await carregar();
    montarFiltrosBase();
    renderPerimetro();
    renderTopNav();
    rebuildLojaOptions();
    VENDAS_CARREGADAS = true;
    document.getElementById('loadingMsg').style.display = 'none';
    document.getElementById('painel').style.display = 'block';
    mostrarModulo(TELA_PEDIDA);
    avisarCasca({ tipo: 'casca-pronto', modulo: TELA });
  } catch (e) {
    document.getElementById('loadingMsg').style.display = 'none';
    const el = document.getElementById('erroMsg');
    el.style.display = 'block'; el.textContent = 'Erro ao carregar dados do Supabase: ' + e.message;
  }
}
// a casca reabre a tela: volta para a tela desta moldura e recarrega os dados dela
window.reentrarTela = () => { try { TROCA_DENTRO = false; mostrarModulo(TELA_PEDIDA); } catch (e) {} };
window.addEventListener('hashchange', () => location.reload());
abrirTela();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('../sw.js').catch(() => {});
}
</script>
