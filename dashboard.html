<script>

// Menu em sanfona: cada secao abre/fecha ao clicar no titulo.
function toggleGrupo(id) {
  const grupo = document.getElementById(id);
  const aberto = grupo.classList.toggle('aberto');
  grupo.previousElementSibling.classList.toggle('aberto', aberto);
}

// Garante que o grupo que contem o modulo esteja aberto (ex.: botao que leva
// a Cancelamentos a partir da Visao geral, ou o modulo inicial no boot).
function abrirGrupoDoModulo(nome) {
  // Le o grupo do proprio menu (12/09/2026). O mapa escrito a mao tinha envelhecido e
  // mandava Placar, Evolucao, Lucro por unidade, Contagem e outras para o grupo do iFood.
  const btn = document.querySelector(`.sidebar-btn[onclick="mostrarModulo('${nome}')"]`);
  const grupo = btn ? btn.closest('.sidebar-grupo') : null;
  if (grupo && !grupo.classList.contains('aberto')) toggleGrupo(grupo.id);
}

// O rodapé explica como o Líquido do iFood é calculado. Isso vale para os
// módulos de venda e para mais nenhum — na conciliação bancária, no financeiro
// ou no CMV ele é texto que ninguém lê e que empurra a tela para baixo. O dono
// cortou em 19/08/2026: "a tela pode encerrar antes deles começarem".
const MODULOS_COM_RODAPE = new Set(['estasemana', 'resumo', 'cancelamentos',
  'promocoes', 'negociacoes', 'avaliacoes', 'relatorios', 'contestacoes']);

// O CABECALHO DE UNIDADE/MARCAS SO APARECE ONDE ELE MUDA ALGUMA COISA
// (24/08/2026). Levantado funcao a funcao: destes modulos, e so destes, o
// desenho passa por computeMetrics/DADOS/activeUnidades. Nos outros o filtro
// ficava na tela sem efeito nenhum — e em tres deles (Resultado por canal,
// Atrasos, Financeiro da logistica) competia com o seletor de unidade DO
// PROPRIO modulo, o que e pior: a pessoa mexe no de cima e nada acontece.
// DRE e Engenharia de cardapio fixam AGUA VERDE na consulta, entao o filtro
// tambem nao valia ali. Modulo novo entra escondido — se precisar do filtro,
// e so por o nome aqui.
// 'evolucao' entrou em 12/09/2026: a tela SEMPRE leu activeUnidades (o naJanela dela
// filtra por unidade) e o renderAll ja a redesenhava quando o filtro mudava — so o
// controle ficava escondido. A legenda da tabela "Por loja" mandava a pessoa usar
// "o filtro de unidade lá em cima", e lá em cima nao havia nada.
const MODULOS_COM_FILTRO_TOPO = new Set(['estasemana', 'resumo', 'cancelamentos',
  'promocoes', 'qualidade', 'site', 'evolucao']);

function mostrarModulo(nome) {
  // 01/11/2026: Vendas agora mora em pagina propria (docs/vendas/), aberta pela casca
  if (nome === 'vendasagora') { window.top.location.href = 'sistema.html#vendasagora'; return; }
  if (nome === 'atividades') { window.top.location.href = 'sistema.html#atividades'; return; }
  // 09/09/2026: Conciliacao de cartao virou parte do Fechamento de Caixas — link
  // antigo cai no modulo unico em vez de quebrar. (Taxas da maquininha voltou a
  // ser modulo proprio no mesmo dia.)
  if (nome === 'concartao') nome = 'caixa';
  // 24/10/2026: abriu pelas Listas (abertura leve) e agora pediu tela que precisa das vendas: carrega uma vez e segue
  if (!VENDAS_CARREGADAS && !MODULOS_LEVES.has(nome)) {
    const msg = document.getElementById('loadingMsg');
    if (msg) msg.style.display = '';
    garantirVendas().then(() => { if (msg) msg.style.display = 'none'; mostrarModulo(nome); })
      .catch((err) => {
        if (msg) msg.style.display = 'none';
        const erroEl = document.getElementById('erroMsg');
        if (erroEl) { erroEl.style.display = 'block'; erroEl.textContent = `Erro ao carregar dados do Supabase: ${err.message}`; }
      });
    return;
  }
  if (!prepararTela(nome)) return;   // docs/gestao/gestao.js: rodapé, filtros, janela e recorte do Placar

  // Os graficos Chart.js ficam com tamanho zerado se forem desenhados enquanto o container
  // esta com display:none — por isso redesenhamos ao entrar no modulo.
  entrarTelaCanal(nome);   // docs/canal/canal.js: resumo, promoções, cancelamentos... (05/11/2026)
  // Modulos com carga sob demanda: os dados so sao buscados na primeira visita,
  // pra nao pesar a abertura do painel.
  entrarTelaGestao(nome);   // docs/gestao/gestao.js (05/11/2026)
  if (nome === 'listas') entrarListas();
  if (nome === 'listasfin') entrarListasFin();
  if (nome === 'contagem') entrarContagem();
  if (nome === 'processos') entrarProcessos();
  if (nome === 'plprod') entrarPlprod();
  if (nome === 'separacao') entrarSeparacao();
  if (nome === 'ordens') entrarOrdens();
  if (nome === 'producao') entrarApontar();
  if (nome === 'fechaturno') entrarFechaTurno();
  if (nome === 'comprateto') entrarCompraTeto();
  if (nome === 'prodhist') entrarProdHist();
  if (nome === 'conferencias') entrarConferencias();
  if (nome === 'controle') entrarControle();
  if (nome === 'posicao') entrarPosicao();
  if (nome === 'fichas') entrarFichas();
  if (nome === 'engcard') entrarEngcard();
  entrarTelaSistema(nome);   // docs/sistema/sistema.js (05/11/2026)
  if (nome === 'caixa') entrarCaixa();
  if (nome === 'reembolsos') entrarReembolsos();
  if (nome === 'rh') entrarRh();
  if (nome === 'forafolha') entrarForaFolha();
  if (nome === 'cargos') entrarPesCargos();
  if (nome === 'phoje') entrarPesHoje();
  if (nome === 'pcalc') entrarPesCalc();
  if (nome === 'pferias') entrarPesFerias();
  if (nome === 'macertos') entrarMotoboyAcertos();
  if (nome === 'presc') entrarPesResc();
  if (nome === 'penvio') entrarPesEnvio();
  if (nome === 'pconf') entrarPesConf();
  if (nome === 'pcusto') entrarPesCusto();
  if (nome === 'orcamentos') entrarOrcamentos();
  if (nome === 'lojaempresas') entrarLojaEmpresas();
  if (nome === 'pacertos') entrarPesAcertos();
  if (nome === 'flash') entrarFlashRh();

}

// Qual modulo esta aberto agora — usado pra so redesenhar os graficos do modulo visivel.
function moduloAtivo() {
  // estasemana primeiro: e o modulo inicial e ficou fora desta lista ate
  // 12/08/2026 — com a home aberta a funcao respondia 'resumo' e o renderAll
  // redesenhava o modulo errado (por isso clicar em unidade nao atualizava).
  const home = document.getElementById('modulo-estasemana');
  if (home && home.style.display !== 'none') return 'estasemana';
  const qual = document.getElementById('modulo-qualidade');
  if (qual && qual.style.display !== 'none') return 'qualidade';
  const evo = document.getElementById('modulo-evolucao');
  if (evo && evo.style.display !== 'none') return 'evolucao';
  const plc = document.getElementById('modulo-placar');
  if (plc && plc.style.display !== 'none') return 'placar';
  const atr = document.getElementById('modulo-atrasos');
  if (atr && atr.style.display !== 'none') return 'atrasos';
  for (const [idm, nomem] of [['modulo-site','site'],
                              ['modulo-frete','frete'], ['modulo-listas','listas'],
                              ['modulo-listasfin','listasfin'],
                              ['modulo-fichas','fichas'], ['modulo-engcard','engcard'],
                              ['modulo-plano','plano'],
                              ['modulo-reembolsos','reembolsos'], ['modulo-rh','rh'],
                              ['modulo-forafolha','forafolha'], ['modulo-cargos','cargos'], ['modulo-phoje','phoje'], ['modulo-fechaturno','fechaturno'], ['modulo-comprateto','comprateto'], ['modulo-pcalc','pcalc'], ['modulo-pferias','pferias'], ['modulo-macertos','macertos'], ['modulo-presc','presc'], ['modulo-penvio','penvio'], ['modulo-pconf','pconf'], ['modulo-pcusto','pcusto'], ['modulo-orcamentos','orcamentos'], ['modulo-lojaempresas','lojaempresas'], ['modulo-pacertos','pacertos'], ['modulo-flash','flash'],
                              ['modulo-contaspagar','contaspagar'], ['modulo-contasreceber','contasreceber']]) {
    const el = document.getElementById(idm);
    if (el && el.style.display !== 'none') return nomem;
  }
  const lgf = document.getElementById('modulo-logfin');
  if (lgf && lgf.style.display !== 'none') return 'logfin';
  if (document.getElementById('modulo-cancelamentos').style.display !== 'none') return 'cancelamentos';
  if (document.getElementById('modulo-promocoes').style.display !== 'none') return 'promocoes';
  if (document.getElementById('modulo-negociacoes').style.display !== 'none') return 'negociacoes';
  if (document.getElementById('modulo-avaliacoes').style.display !== 'none') return 'avaliacoes';
  if (document.getElementById('modulo-relatorios').style.display !== 'none') return 'relatorios';
  if (document.getElementById('modulo-cardapio').style.display !== 'none') return 'cardapio';
  if (document.getElementById('modulo-clientes').style.display !== 'none') return 'clientes';
  if (document.getElementById('modulo-fluxo').style.display !== 'none') return 'fluxo';
  if (document.getElementById('modulo-indicadores').style.display !== 'none') return 'indicadores';
  return 'resumo';
}

// MODULO "VENDAS" REMOVIDO em 12/09/2026 (revisao dos modulos, decisao do dono).
// Ficou sem botao no menu em 17/08 — "redundante com o Resumo" — e o codigo

// Era `entrarVendas` + `renderModuloVendas` lendo vw_vendas_rede (retrato do

// 19/08 quem marca e a caixa de selecao + "conciliar marcadas", e a funcao ja

// ------------------------------------------------------------------
// MODULO TRANSFERENCIAS AV -> FILIAIS (aplicado da fila em 16/08/2026).
// A Agua Verde e a central de producao; as filiais pedem por lista e a
// conta fecha por mes. Fonte: views vw_tr_* (historico da planilha via
// import_listas.py — fase 1, so leitura; pedido/separacao/conferencia
// pela tela e fase 2, apos decisoes do dono).
// Cuidados aplicados: valor_lista (congelado no mes fechado), frete so
// Boqueirao, royalty derivado de regra, total_pago pelo mes de referencia.

// 24/10/2026: o modulo Listas (Pedidos e Financeiro) mora em docs/listas/listas.js (bloco 1 do painel em modulos).

// ------------------------------------------------------------------
// VISAO CONSOLIDADA — APOSENTADA em 12/09/2026, a pedido do dono ("aposenta a Visao
// consolidada"). Medido antes: por canal ela dava EXATAMENTE os mesmos numeros da
// Evolucao de vendas (mesma vendas_saipos; semana 31/08-06/09: iFood 128.848,39,
// salao 55.519,96, site 3.346,97, balcao 488,94 nas duas). A Evolucao tem tudo o que
// ela tinha e mais — faixa de horario, item, cruzamento — e herdou as canceladas, que
// eram a unica coisa a mais daqui. Codigo removido de verdade, nao comentado: esta no
// historico do git (docs, antes do commit desta aposentadoria). A view
// vw_consolidado_diario continua no banco, sem leitor.

// so mudancas de ESTRUTURA (childList) disparam — mexer em style/classe nas
// proprias tabelas e' mutacao de atributo e nao re-dispara (sem loop)
new MutationObserver(() => {
  clearTimeout(encaixarTodas._t);
  encaixarTodas._t = setTimeout(encaixarTodas, 250);
}).observe(document.body, { childList: true, subtree: true });
window.addEventListener('resize', () => { clearTimeout(encaixarTodas._t); encaixarTodas._t = setTimeout(encaixarTodas, 150); });

// "Pra onde foi o dinheiro" saiu da DRE em 12/09/2026: era copia da secao 4 do
// Fechamento do mes, mesma view (vw_fin_ponte_mensal) e as mesmas 9 linhas, e as
// duas dividiam o id "tabelaPonte" na mesma pagina. Um calculo, um dono — mora no
// Fechamento. A DRE ficou com o que so ela tem: os 3 cards, o fechamento e a ponte
// DRE x DFC. A funcao blocoCaixaReal e a busca de DRE_PONTE foram removidas junto.

// 24/10→26/10/2026: o Fechamento de Caixas (módulo) mora em docs/caixa/caixa.js (bloco 3 do painel em módulos).

function renderAll() {
  limparFiltrosVer(MODULO_ATUAL);
  const m = computeMetrics();
  // Mesmas metricas para a janela anterior de mesmo tamanho — e o que alimenta os selos de
  // variacao. `a` fica null quando nao ha periodo anterior com dados, e nesse caso os cards
  // simplesmente nao mostram comparacao.
  const ant = periodoAnterior();
  const a = ant ? computeMetrics(ant.ini, ant.fim) : null;

  renderPresets();
  const contexto = linhaContexto(ant);

  // Ordem de leitura de dono: quanto sobrou → por que mudou → pulso da operacao →
  // quem fez/quem vazou → para onde foi o dinheiro → sinais e detalhes.
  const ativo = moduloAtivo();
  renderAllCanal(m, a, ant, contexto, ativo);   // docs/canal/canal.js
  // Modulos de carga sob demanda: so re-renderiza se os dados ja foram buscados.
  // A home ESTAVA FORA desta lista — clicar numa unidade com a home aberta
  // nao atualizava nada (achado do dono em 12/08/2026). Mesma regra dos
  // demais: so re-renderiza se as fontes dela ja carregaram.
  renderAllGestao(ativo);   // docs/gestao/gestao.js
  if (ativo === 'listas') entrarListas();
  if (ativo === 'listasfin' && LISTAS !== null) renderModuloListasFin();
  if (ativo === 'reembolsos' && REEMBOLSOS !== null) renderModuloReembolsos(REEMBOLSOS);
  if (ativo === 'rh' && RH !== null) renderModuloRh();
  if (['phoje', 'cargos', 'pcalc', 'pferias', 'presc', 'penvio', 'pconf', 'pcusto', 'pacertos'].includes(ativo) && CARGOS !== null) renderModuloCargos();
}

// ------------------------------------------------------------------
// Boot
// ------------------------------------------------------------------
// ------------------------------------------------------------------
// ACESSO POR PESSOA (24/08/2026). A tabela painel_acesso diz quais modulos
// cada pessoa ve; quem nao esta la ve tudo (Neto, Fabio, Hellen seguem iguais).
// Liberar mais tarde e um update no banco, sem deploy.
//
// ISTO ORGANIZA A TELA, NAO E COFRE: 121 das 125 views rodam com o privilegio
// do dono da view e todo logado e o mesmo papel `authenticated`, entao o
// PostgREST entrega qualquer view a quem montar a URL na mao. Resolve o dia a
// dia (a pessoa abre e so tem o que e dela); nao resolve acesso deliberado.
// Fechar de verdade = role separado no JWT ou RLS restritiva + security_invoker.
// ------------------------------------------------------------------
let MEUS_MODULOS = null;   // null = sem restricao

async function carregarAcesso() {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/meus_modulos`, {
      method: 'POST', headers: { ...cabecalhoLeitura(), 'Content-Type': 'application/json' },
      body: '{}' });
    if (!r.ok) return null;
    const m = await r.json();
    return (Array.isArray(m) && m.length) ? m : null;
  } catch (e) { return null; }   // na duvida, nao tranca ninguem fora
}

// Esconde o que a pessoa nao pode abrir. Le o proprio onclick do botao em vez
// de repetir o mapa de modulos — assim modulo novo nao precisa ser cadastrado
// aqui para continuar aparecendo para quem ve tudo.
function aplicarAcesso() {
  if (!MEUS_MODULOS) return;
  const pode = new Set(MEUS_MODULOS);
  document.querySelectorAll('.sidebar-btn').forEach(btn => {
    const m = (btn.getAttribute('onclick') || '').match(/mostrarModulo\('([^']+)'\)/);
    if (!m) { btn.style.display = 'none'; return; }   // atalhos (promos.html) tambem somem
    if (!pode.has(m[1])) btn.style.display = 'none';
  });
  document.querySelectorAll('.sidebar-grupo').forEach(g => {
    const vivos = [...g.querySelectorAll('.sidebar-btn')].filter(b => b.style.display !== 'none');
    const secao = g.previousElementSibling;
    if (!vivos.length) {
      g.style.display = 'none';
      if (secao && secao.classList.contains('sidebar-secao')) secao.style.display = 'none';
    }
  });
  // o cabecalho de unidade/marcas serve aos modulos de venda; sem eles, some
  const topo = document.getElementById('filtrosTopo');
  if (topo && ![...pode].some(m => MODULOS_COM_FILTRO_TOPO.has(m))) topo.style.display = 'none';
}

// 24/10/2026 (bloco 1): telas que nao precisam da carga de vendas do iFood. Quem abre direto numa delas nao espera
// a carga; ela acontece na primeira vez que a pessoa abre outra tela (garantirVendas, chamada pelo mostrarModulo).
const MODULOS_LEVES = new Set(['orcamentos', 'listas', 'listasfin', 'contagem', 'processos', 'plprod', 'separacao', 'ordens', 'producao', 'fechaturno', 'comprateto', 'prodhist', 'conferencias', 'controle', 'posicao', 'caixa', 'phoje', 'cargos', 'pcalc', 'pferias', 'presc', 'penvio', 'pconf', 'pcusto', 'pacertos', 'forafolha', 'rh', 'flash', 'reembolsos', 'fichas', 'engcard', 'rateio']);
let VENDAS_CARREGADAS = false, VENDAS_PROMESSA = null;
async function montarVendas() {
  await carregar();
  montarFiltrosBase();
  renderPerimetro();
  renderTopNav();
  rebuildLojaOptions();
  renderAll();
  VENDAS_CARREGADAS = true;
}
function garantirVendas() {
  if (!VENDAS_PROMESSA) VENDAS_PROMESSA = montarVendas().catch((e) => { VENDAS_PROMESSA = null; throw e; });
  return VENDAS_PROMESSA;
}
async function iniciar() {
  try {
    // quem so abre Listas nao espera as vendas: o acesso vem antes e decide
    const pedidoCasca0 = NA_CASCA ? new URLSearchParams(location.search).get('m') : null;
    MEUS_MODULOS = await carregarAcesso();
    const destino = (pedidoCasca0 && (!MEUS_MODULOS || MEUS_MODULOS.includes(pedidoCasca0))) ? pedidoCasca0
      : (MEUS_MODULOS && !MEUS_MODULOS.includes('estasemana')) ? MEUS_MODULOS[0] : 'estasemana';
    if (MODULOS_LEVES.has(destino)) {
      document.getElementById('loadingMsg').style.display = 'none';
      document.getElementById('painel').style.display = 'block';
      aplicarAcesso();
      mostrarModulo(destino);
      avisarCasca({ tipo: 'casca-pronto', modulo: MODULO_ATUAL || destino });
      return;
    }
    await carregar();
    montarFiltrosBase();
    renderPerimetro();
    renderTopNav();
    rebuildLojaOptions();
    renderAll();
    VENDAS_CARREGADAS = true; VENDAS_PROMESSA = Promise.resolve();
    document.getElementById('loadingMsg').style.display = 'none';
    document.getElementById('painel').style.display = 'block';
    aplicarAcesso();
    // A home "Esta semana" e o modulo inicial; carrega depois que o painel
    // aparece para nao segurar o boot (ela busca avaliacoes/negociacoes/metas).
    // Quem tem acesso restrito abre direto no que e dele — cair numa home que
    // nao pode ver parece painel quebrado.
    // Na casca, ela diz qual tela abrir (?m=); so vale se a pessoa pode ver.
    const pedidoCasca = NA_CASCA ? new URLSearchParams(location.search).get('m') : null;
    if (pedidoCasca && (!MEUS_MODULOS || MEUS_MODULOS.includes(pedidoCasca))) mostrarModulo(pedidoCasca);
    else if (MEUS_MODULOS && !MEUS_MODULOS.includes('estasemana')) mostrarModulo(MEUS_MODULOS[0]);
    else { entrarEstaSemana(); registrarUso('estasemana'); }
    avisarCasca({ tipo: 'casca-pronto', modulo: MODULO_ATUAL || 'estasemana' });
  } catch (err) {
    document.getElementById('loadingMsg').style.display = 'none';
    const erroEl = document.getElementById('erroMsg');
    erroEl.style.display = 'block';
    erroEl.textContent = `Erro ao carregar dados do Supabase: ${err.message}`;
  }
}

// Registro do service worker (so quando servido por http/https — em file:// nao existe).
// Ele deixa o painel instalavel como app no celular e da um modo offline basico.
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// ------------------------------------------------------------------
// A porta do painel (21/08/2026): login do Supabase, um por pessoa.
//
// Ate aqui era uma senha unica conferida por hash NO NAVEGADOR, e ela nao
// protegia nada: o repositorio docs/ e publico, a chave anon esta no
// codigo-fonte acima, e quem achasse o repositorio lia o banco inteiro sem
// digitar senha nenhuma — 76 tabelas, 99 views e 7 materializadas, incluindo
// gasto de reembolso com nome de pessoa. Agora quem decide o que pode ser
// lido e o banco, pelo token de quem entrou (papel authenticated).
//
// A sessao e a MESMA que os modulos Reembolsos, Plano e Transferencias ja
// usavam (chave 'rmbSessao'), entao quem entra na porta ja entra logado neles.
// Criar usuario continua sendo passo do dono, no Supabase.
// ------------------------------------------------------------------
const CHAVES_ACESSO_VELHAS = ['painelIfoodAcessoOk', 'painelIfoodAcessoOk_v2', 'painelIfoodAcessoOk_v3'];

function exigirLogin(recado) {
  localStorage.removeItem('rmbSessao');
  avisarCasca({ tipo: 'casca-login', recado: recado || '' });   // na casca, a porta e a dela
  const gate = document.getElementById('loginGate');
  if (!gate) return;
  gate.style.display = '';
  if (recado) {
    const erro = document.getElementById('loginErro');
    erro.textContent = recado;
    erro.style.display = 'block';
  }
}

async function entrarNoPainel() {
  const email = emailDoLogin(document.getElementById('loginEmail').value);   // 29/10/2026: só o nome basta
  const senha = document.getElementById('loginSenha').value;
  const erro = document.getElementById('loginErro');
  const btn = document.getElementById('loginBtn');
  if (!email || !senha) {
    erro.textContent = 'Preencha e-mail e senha.'; erro.style.display = 'block'; return;
  }
  btn.disabled = true; btn.textContent = 'Entrando...';
  try {
    const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: senha }),
    });
    const d = await r.json();
    if (!r.ok || !d.access_token) {
      erro.textContent = (d.error_description || d.msg || 'E-mail ou senha errados.') +
                         ' Se você ainda não tem conta, peça ao Neto para criar.';
      erro.style.display = 'block';
      document.getElementById('loginSenha').value = '';
      return;
    }
    localStorage.setItem('rmbSessao', JSON.stringify({
      access_token: d.access_token, refresh_token: d.refresh_token,
      email: (d.user && d.user.email) || email,
      expira_em: Date.now() + ((d.expires_in || 3600) * 1000),
    }));
    CHAVES_ACESSO_VELHAS.forEach((k) => localStorage.removeItem(k));
    erro.style.display = 'none';
    document.getElementById('loginGate').style.display = 'none';
    const quem = document.getElementById('rodapeQuem');
    if (quem) quem.textContent = (rmbSessao() || {}).email || '';
    iniciar();
  } catch (e) {
    erro.textContent = 'Não consegui falar com o servidor: ' + e.message;
    erro.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Entrar';
  }
}

['loginEmail', 'loginSenha'].forEach((id) => {
  document.getElementById(id).addEventListener('keydown', (e) => {
    if (e.key === 'Enter') entrarNoPainel();
  });
});

function sairDoPainel() {
  localStorage.removeItem('rmbSessao');
  location.reload();
}

// 24/10/2026: Produção e estoque (Contagem, Planejar, Apontar, Controle, Posição) moram em docs/estoque/estoque.js.

// No boot: so abre o painel se a sessao ainda vale. Token vencido nao e motivo
// para mandar a pessoa digitar de novo — tenta o refresh_token primeiro.
(async function abrirSeLogado() {
  CHAVES_ACESSO_VELHAS.forEach((k) => localStorage.removeItem(k));   // a senha velha nao vale mais
  const sessao = rmbSessao();
  if (!sessao || !sessao.access_token) return;   // fica na porta
  await rmbGarantirTokenValido();                // renova antes, sem piscar erro
  let r = await fetch(`${SUPABASE_URL}/auth/v1/user`, { headers: cabecalhoLeitura() });
  if (r.status === 401 && await rmbRenovarSeExpirado(r)) {
    r = await fetch(`${SUPABASE_URL}/auth/v1/user`, { headers: cabecalhoLeitura() });
  }
  if (!r.ok) {
    // Sem rede nao se apaga sessao de ninguem: so quando o servidor recusa.
    if (r.status === 401 || r.status === 403) exigirLogin();
    return;
  }
  document.getElementById('loginGate').style.display = 'none';
  const quem = document.getElementById('rodapeQuem');
  if (quem) quem.textContent = (rmbSessao() || {}).email || '';
  iniciar();
})();
</script>
