<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Painel Cidadão do Mundo</title>
<meta name="theme-color" content="#111110">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="nucleo/nucleo.css?v=20261105b">
<!-- O PAINEL ANTIGO VIROU UM REDIRECIONAMENTO (dono, quinta 05/11/2026: "Pode fazer").
     Desde 05/11 toda tela do menu tem página própria (blocos 1 a 7 + Sistema) e a entrada é docs/sistema.html.
     Este arquivo fica só para os endereços velhos (favoritos, "Abrir o painel", dashboard.html#tela,
     dashboard.html?m=tela) caírem na entrada nova, na mesma tela. O menu mora em docs/casca/menu.js.
     A versão inteira de antes está no histórico do git (último commit com o painel completo: e1f1405).
     Pode ser apagado depois de umas duas semanas sem ninguém entrar por aqui (painel_uso). -->
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var tela = q.get('m') || location.hash.slice(1) || '';
    // dentro de uma moldura (casca velha em cache) não abre a casca dentro da casca: só avisa
    if (window.parent !== window) {
      document.addEventListener('DOMContentLoaded', function () {
        document.body.innerHTML = '<div class="contexto" style="margin:24px;">Esta tela mudou de lugar. Recarregue a página (puxe para baixo no celular).</div>';
      });
      return;
    }
    location.replace('sistema.html' + (tela ? '#' + encodeURIComponent(tela) : ''));
  })();
</script>
</head>
<body>
<noscript><div class="contexto" style="margin:24px;">O painel mudou de endereço: <a href="sistema.html">abrir o painel</a>.</div></noscript>
</body>
</html>
