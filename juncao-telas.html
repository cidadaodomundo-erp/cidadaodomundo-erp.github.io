 ['edgar', 'líder Ahú', 'Delivery do dia, Chegada, Escala e Clima, Pausados iFood x Site, Avaliações do dia, Consulta de ponto e Ponto ao Vivo da loja'],
 ['gabriel', 'delivery (dia)', 'Delivery do dia, Chegada, Escala e Clima, Pausados iFood x Site, Avaliações do dia'],
 ['alejo', 'delivery (noite)', 'Delivery do dia, Chegada, Escala e Clima, Pausados iFood x Site, Avaliações do dia'],
 ['flavia', 'salão', 'Reservas, Pausados do Salão, Avaliações do Google'],
 ['yaimar', 'salão', 'Reservas, Pausados do Salão, Avaliações do Google'],
 ['arissa', 'RH', 'Consulta de ponto, Ponto ao Vivo, Taxas e Freelas, Ponto dos taxas'],
 ['rita', 'compras e estoque', 'Mercado Livre (já vê), Quem conserta'],
 ['hellen', 'financeiro', 'já vê todas'],
];

const app = document.getElementById('app');
const D = { resp: [], aberto: null };
function sessao() { try { return JSON.parse(localStorage.getItem('rmbSessao') || 'null'); } catch (e) { return null; } }
function sessaoValida() { const s = sessao(); return s && s.access_token && (!s.expira_em || s.expira_em > Date.now() + 60000) ? s : null; }
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const quandoBR = ts => ts ? new Date(ts).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit', timeZone:'America/Sao_Paulo' }) : '';
const H = () => { const s = sessaoValida(); return { apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${s.access_token}`, 'Content-Type':'application/json' }; };

function telaLogin(msg) {
  app.innerHTML = `<div class="login"><p class="eyebrow">Cidadão do Mundo</p><h1 style="font-size:1.3rem">Junção das telas</h1>
    <p class="lede">Entre com o mesmo nome e senha do painel.</p>
    <label>Nome<input id="e" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username" placeholder="seu nome (ex.: fabio)"></label>
    <label>Senha<input id="s" type="password" autocomplete="current-password"></label>
    <button id="b">Entrar</button><p class="erro" id="m">${esc(msg || '')}</p></div>`;
  const ir = async () => {
    const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, { method:'POST',
      headers:{ apikey:SUPABASE_ANON_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ email:((t) => { t = String(t || '').trim(); return !t || t.includes('@') ? t : t.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, '').toLowerCase() + '@cidadaodomundo.com.br'; })(document.getElementById('e').value), password:document.getElementById('s').value }) });
    const s = await r.json();
    if (!r.ok || !s.access_token) { document.getElementById('m').textContent = 'Nome ou senha não conferem.'; return; }
    localStorage.setItem('rmbSessao', JSON.stringify({ access_token:s.access_token, refresh_token:s.refresh_token,
      email:(s.user && s.user.email) || '', expira_em: Date.now() + (s.expires_in || 3600) * 1000 }));
    carregar();
  };
  document.getElementById('b').onclick = ir;
  document.getElementById('s').onkeydown = e => { if (e.key === 'Enter') ir(); };
}
async function carregar() {
  if (!sessaoValida()) return telaLogin();
  // a trava: só quem pode ver o plano lê o plano (mesma RLS do plano de saída)
  const r0 = await fetch(`${SUPABASE_URL}/rest/v1/transicao_itens?select=id&limit=1`, { headers:H() });
  if (r0.status === 401) return telaLogin('Sessão vencida, entre de novo.');
  const ok = r0.ok ? await r0.json() : [];
  if (!ok.length) { app.innerHTML = `<p class="vazio">Este login não tem acesso (a página é só do Neto e do Fabio).</p>
    <button class="sair" onclick="localStorage.removeItem('rmbSessao');carregar()">entrar com outro login</button>`; return; }
  const r = await fetch(`${SUPABASE_URL}/rest/v1/juncao_telas_resposta?select=*&order=criado_em.desc`, { headers:H() });
  D.resp = r.ok ? await r.json() : [];
  desenhar();
}
function respHtml(chave, prop) {
  const ult = D.resp.find(x => x.tela === chave);
  const dito = ult ? `<div class="dito">Respondido: <b class="${ult.resposta}">${ult.resposta === 'sim' ? 'sim' : ult.resposta === 'nao' ? 'não' : 'outro'}</b>${ult.texto ? ' — ' + esc(ult.texto) : ''} · ${esc(ult.quem.replace('@cidadaodomundo.com.br', ''))} · ${esc(quandoBR(ult.criado_em))}</div>` : '';
  const id = chave.replace(/[^a-z0-9]/gi, '_');
  const form = D.aberto === chave
    ? `<div class="resp"><input id="tx_${id}" placeholder="o que fazer com esta? (curto)" maxlength="1000"><button class="bt cheio" onclick="responder('${esc(chave)}','${esc(prop)}','outro')">Enviar</button><button class="bt" onclick="D.aberto=null;desenhar()">Cancelar</button></div>`
    : `<div class="resp"><button class="bt sim" onclick="responder('${esc(chave)}','${esc(prop)}','sim')">Sim</button><button class="bt nao" onclick="responder('${esc(chave)}','${esc(prop)}','nao')">Não</button><button class="bt" onclick="D.aberto='${esc(chave)}';desenhar();document.getElementById('tx_${id}').focus()">Outro…</button></div>`;
  return dito + form + `<div class="aviso" id="av_${id}"></div>`;
}
function card(x) {
  return `<div class="item ${x.p}"><div class="topo"><span class="tit">${esc(x.t)}</span><span class="tag ${x.p}">${x.p}</span><span class="nota">hoje em ${esc(x.g)}</span></div>
    <dl class="grade">
      <dt>O que mostra</dt><dd>${esc(x.o)}</dd>
      <dt>De onde vem</dt><dd>${esc(x.f)}</dd>
      <dt>Dado de hoje</dt><dd>${esc(x.h)}</dd>
      <dt>Uso em 30 dias</dt><dd>${esc(x.u)}</dd>
      <dt>Funciona hoje</dt><dd>${esc(x.ok)}</dd>
      <dt>Tela nossa igual</dt><dd>${esc(x.par.n)} <span class="tag ${x.par.a === 'sim' ? 'JUNTAR' : x.par.a === 'parcial' ? 'parcial' : 'nao'}">${x.par.a === 'sim' ? 'mesmo assunto' : x.par.a === 'parcial' ? 'em parte' : 'não'}</span></dd>
      ${x.par.num && x.par.num !== '—' ? `<dt>Os números</dt><dd>${esc(x.par.num)}</dd>` : ''}
    </dl>
    <div class="prop"><b>Proposta: ${x.p}</b> — ${esc(x.pt)}${x.ng && x.ng !== '—' ? ` <span class="nota">· grupo: ${esc(x.ng)}</span>` : ''}</div>
    ${respHtml(x.k, x.p)}</div>`;
}
function desenhar() {
  const n = p => TELAS.filter(x => x.p === p).length;
  const resp = new Set(D.resp.map(x => x.tela));
  const s = sessao() || {};
  const ordem = ['JUNTAR', 'TIRAR', 'MANTER'];
  app.innerHTML = `
    <p class="eyebrow">Cidadão do Mundo · só Neto e Fabio · medido em ${MEDIDO}</p>
    <h1>Junção das telas</h1>
    <p class="lede">As ${TELAS.length} telas que vieram do portal do Fabio: o que cada uma traz, se a nossa fala da mesma coisa (com os dois números), e a proposta. Regra de 03/11: dinheiro no nosso painel, operação no do Fabio. Marque sim, não ou outro em cada linha. O menu só muda depois das respostas.</p>
    <div class="placar"><div><b style="color:var(--azul)">${n('JUNTAR')}</b><span>juntar</span></div><div><b style="color:var(--acento)">${n('TIRAR')}</b><span>tirar</span></div><div><b style="color:var(--ok)">${n('MANTER')}</b><span>manter</span></div><div><b>${TELAS.filter(x => resp.has(x.k)).length} de ${TELAS.length}</b><span>já respondidas</span></div></div>
    ${ordem.map(p => `<h2>${p === 'JUNTAR' ? 'Juntar: falam da mesma coisa' : p === 'TIRAR' ? 'Tirar do menu: sem página, sem uso ou repetida' : 'Manter'}</h2>${TELAS.filter(x => x.p === p).map(card).join('')}`).join('')}

    <h2>O menu novo, com todos os grupos</h2>
    <p class="nota">Em azul o que entra ou muda de lugar; riscado o que sai.</p>
    <div class="menu">${MENU_NOVO.map(([g, L]) => `<div><b>${esc(g)}</b>${L.map(i => i.startsWith('+') ? `<div class="novo">${esc(i.slice(1))}</div>` : i.startsWith('~') ? `<div class="sai">${esc(i.slice(1))}</div>` : `<div>${esc(i)}</div>`).join('')}</div>`).join('')}</div>
    <div class="item MANTER" style="margin-top:10px;"><div class="topo"><span class="tit">O menu novo inteiro</span></div>${respHtml('menu-novo', 'MENU')}</div>

    <h2>Quem usa o quê</h2>
    <p class="nota"><b>Portal antigo:</b> a lista de quem usa o portal antigo ainda não foi lida: o portal pediu login no Chrome do Neto. Assim que o Neto entrar lá, a lista entra aqui e a proposta abaixo é conferida contra ela.</p>
    <table><thead><tr><th>Quem abriu as telas do Fabio aqui (30 dias)</th><th>Quais e quantas vezes</th></tr></thead><tbody>${USO.map(([u, t]) => `<tr><td>${esc(u)}</td><td>${esc(t)}</td></tr>`).join('')}</tbody></table>
    <p class="nota" style="margin-top:6px;">Hoje só neto, fabio e hellen enxergam as telas do Fabio aqui; a rita vê só o Mercado Livre; os outros 18 logins não veem nenhuma. A equipe ainda usa essas telas pelo portal antigo.</p>
    <h2 style="font-size:1rem;">Proposta: o que cada login daqui passa a ver (pelo cargo, provisória)</h2>
    <p class="nota">Todos já têm login aqui. Quem aparecer só no portal antigo ganha login novo na tela Usuários, pelo Neto (nome em minúsculo, sem e-mail).</p>
    ${LOGINS.map(([u, c, t]) => `<div class="item"><div class="topo"><span class="tit">${esc(u)}</span><span class="nota">${esc(c)}</span></div><div class="nota" style="color:var(--suave)">${esc(t)}</div>${respHtml('login:' + u, 'VER: ' + t)}</div>`).join('')}
    <footer>Entrou como ${esc((s.email || '').replace('@cidadaodomundo.com.br', ''))} · <button class="sair" onclick="localStorage.removeItem('rmbSessao');carregar()">sair</button></footer>`;
}
async function responder(chave, prop, resposta) {
  const id = chave.replace(/[^a-z0-9]/gi, '_'), av = () => document.getElementById('av_' + id);
  const campo = document.getElementById('tx_' + id), texto = campo ? campo.value.trim() : '';
  if (resposta === 'outro' && !texto) { av().className = 'aviso erro'; av().textContent = '! Escreva o que fazer antes de enviar.'; return; }
  av().className = 'aviso'; av().textContent = 'Enviando…';
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/juncao_telas_responder`, { method:'POST', headers:H(),
      body: JSON.stringify({ p_tela: chave, p_proposta: prop, p_resposta: resposta, p_texto: texto || null }) });
    if (!r.ok) { let m = ''; try { m = (await r.json()).message || ''; } catch (e) {} throw new Error(m || 'erro ' + r.status); }
    D.aberto = null; await carregar();
    const a = av(); if (a) { a.className = 'aviso certo'; a.textContent = '✓ Chegou: a resposta ficou gravada.'; }
  } catch (e) {
    const a = av(); a.className = 'aviso erro'; a.innerHTML = `✗ Não chegou: ${esc(e.message)} <button class="bt" onclick="responder('${esc(chave)}','${esc(prop)}','${resposta}')">tentar de novo</button>`;
  }
}
carregar();
</script>
</body>
</html>
