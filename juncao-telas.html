<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Junção das telas</title>
<!-- JUNÇÃO DAS TELAS — o menu inteiro (qua 18/11/2026, chat Telas do painel). Etapa "unificar" da entrega ao Fabio.
     Dono 21:03: "fazer a junção do que fala da mesma coisa, tirar o que não faz sentido, organizar o menu com todas"; 21:33: "essa
     decisão podia ser um compilado de todas as telas, minhas e dele [...] eu preciso que ele também decida o que fica do nosso,
     afinal o painel final vai ficar com o Cidadão". QUEM DECIDE É O FABIO; o Neto comenta.
     Só Neto e Fabio (login + RLS pode_ver_plano). Números medidos em 18/11 à noite (código de cada tela, SELECT no banco, painel_uso
     de 30 dias). Respostas: juncao_telas_resposta pela função juncao_telas_responder (quem e quando); quando o Fabio responde todas,
     entra um item na agenda do dono. O menu NÃO muda antes das respostas. SQL: script/sql/juncao_telas_*.sql -->
<style>
  :root { --fundo:#FAF8F7; --papel:#FFFFFF; --alt:#F3EEEC; --tinta:#241C1B; --suave:#4E4442; --mudo:#756A67;
          --linha:#E4DBD8; --forte:#CFC2BE; --acento:#C8102E; --acento-fundo:#FBE9EC;
          --anda:#8A5A00; --anda-fundo:#FBF0DC; --ok:#2F6B4F; --ok-fundo:#E6F1EB; --azul:#2F5F8A; --azul-fundo:#E5EEF6; --marca-fabio:#2E8BA6; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
          --fundo:#161211; --papel:#1E1817; --alt:#262020; --tinta:#F2EBE9; --suave:#D6CBC8; --mudo:#A29793;
          --linha:#332A29; --forte:#453A38; --acento:#FF5A70; --acento-fundo:#3A1B20;
          --anda:#E8B55A; --anda-fundo:#2E2415; --ok:#7BC4A0; --ok-fundo:#1C2E25; --azul:#8DB8E0; --azul-fundo:#1A2632; --marca-fabio:#5fb3c9; } }
  :root[data-theme="dark"] { --fundo:#161211; --papel:#1E1817; --alt:#262020; --tinta:#F2EBE9; --suave:#D6CBC8; --mudo:#A29793;
          --linha:#332A29; --forte:#453A38; --acento:#FF5A70; --acento-fundo:#3A1B20;
          --anda:#E8B55A; --anda-fundo:#2E2415; --ok:#7BC4A0; --ok-fundo:#1C2E25; --azul:#8DB8E0; --azul-fundo:#1A2632; --marca-fabio:#5fb3c9; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fundo); color:var(--tinta); font-family:"Segoe UI",system-ui,sans-serif; line-height:1.5; }
  .wrap { max-width:1000px; margin:0 auto; padding:24px 16px 64px; }
  .eyebrow { font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--acento); font-weight:600; margin:0; }
  h1 { font-size:1.8rem; line-height:1.1; margin:.35rem 0 .3rem; }
  h2 { font-size:1.15rem; margin:2rem 0 .5rem; }
  h3 { font-size:.8rem; letter-spacing:.1em; text-transform:uppercase; color:var(--mudo); margin:1.4rem 0 .5rem; }
  .lede { color:var(--suave); margin:0 0 1rem; }
  .placar { display:flex; gap:10px; flex-wrap:wrap; margin:.6rem 0 .8rem; }
  .placar div { background:var(--papel); border:1px solid var(--linha); border-radius:6px; padding:10px 14px; min-width:120px; }
  .placar b { display:block; font-size:1.45rem; line-height:1.1; }
  .placar span { font-size:.8rem; color:var(--mudo); }
  .filtros { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 .6rem; position:sticky; top:0; background:var(--fundo); padding:8px 0; z-index:2; }
  .bt { background:var(--papel); color:var(--tinta); border:1px solid var(--forte); border-radius:4px; padding:5px 12px; font:inherit; font-size:.85rem; cursor:pointer; }
  .bt.on { background:var(--tinta); color:var(--fundo); border-color:var(--tinta); }
  .bt.sim { border-color:var(--ok); color:var(--ok); font-weight:600; } .bt.nao { border-color:var(--acento); color:var(--acento); font-weight:600; }
  .bt.cheio { background:var(--acento); color:#fff; border-color:var(--acento); }
  .item { background:var(--papel); border:1px solid var(--linha); border-radius:6px; padding:10px 14px; margin-bottom:8px; }
  .item.JUNTAR { border-left:4px solid var(--azul); } .item.TIRAR { border-left:4px solid var(--acento); } .item.MANTER { border-left:4px solid var(--ok); }
  .topo { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:baseline; }
  .tit { font-weight:600; }
  .tag { font-size:.7rem; font-weight:700; padding:1px 8px; border-radius:999px; background:var(--alt); color:var(--mudo); }
  .tag.JUNTAR { background:var(--azul-fundo); color:var(--azul); } .tag.TIRAR { background:var(--acento-fundo); color:var(--acento); } .tag.MANTER { background:var(--ok-fundo); color:var(--ok); }
  .tag.fabio { background:var(--anda-fundo); color:var(--anda); }
  .fab-marca { color:var(--marca-fabio); font-size:.8rem; }
  .par { display:grid; grid-template-columns:1fr 1fr; gap:8px; align-items:start; margin-bottom:12px; padding:8px; border:1px dashed var(--forte); border-radius:8px; }
  .par > .item { margin:0; }
  .par .nums { grid-column:1 / -1; font-size:.86rem; background:var(--alt); border-radius:4px; padding:6px 10px; }
  @media (max-width:640px) { .par { grid-template-columns:1fr; } }
  .grade { display:grid; grid-template-columns:150px 1fr; gap:1px 12px; font-size:.85rem; margin-top:.35rem; }
  .grade dt { color:var(--mudo); } .grade dd { margin:0; color:var(--suave); }
  .prop { margin-top:.4rem; padding:6px 10px; background:var(--alt); border-radius:4px; font-size:.88rem; }
  .decide { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:.5rem; }
  .decide > div { border:1px solid var(--linha); border-radius:4px; padding:6px 8px; font-size:.84rem; }
  .decide .rot { font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; color:var(--mudo); font-weight:700; }
  .resp { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:.3rem; }
  .resp input { flex:1 1 180px; padding:5px 8px; border:1px solid var(--forte); border-radius:4px; background:var(--fundo); color:var(--tinta); font:inherit; font-size:.85rem; }
  .dito b.sim { color:var(--ok); } .dito b.nao { color:var(--acento); } .dito b.outro { color:var(--anda); }
  .aviso { font-size:.82rem; } .aviso.erro { color:var(--acento); } .aviso.certo { color:var(--ok); }
  .nota { font-size:.82rem; color:var(--mudo); }
  table { border-collapse:collapse; width:100%; font-size:.86rem; background:var(--papel); }
  th, td { border:1px solid var(--linha); padding:5px 8px; text-align:left; vertical-align:top; }
  th { background:var(--alt); font-weight:600; }
  .menu { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:10px; }
  .menu > div { background:var(--papel); border:1px solid var(--linha); border-radius:6px; padding:10px 12px; font-size:.85rem; }
  .menu b { display:block; margin-bottom:4px; }
  .menu .prov { color:var(--mudo); } .menu .dec { font-weight:600; } .menu .sai { color:var(--acento); text-decoration:line-through; }
  .vazio { color:var(--mudo); font-size:.9rem; }
  .login { max-width:360px; margin:12vh auto; background:var(--papel); border:1px solid var(--forte); border-radius:8px; padding:20px; }
  .login input { width:100%; padding:10px; margin:6px 0 10px; border:1px solid var(--forte); border-radius:4px; background:var(--fundo); color:var(--tinta); font:inherit; }
  .login button, .sair { background:var(--acento); color:#fff; border:0; border-radius:4px; padding:10px 14px; font:inherit; cursor:pointer; }
  .sair { background:transparent; color:var(--mudo); border:1px solid var(--forte); padding:4px 10px; font-size:.8rem; }
  .erro { color:var(--acento); font-size:.85rem; }
  footer { margin-top:2rem; color:var(--mudo); font-size:.8rem; }
  @media (max-width:640px) { .grade { grid-template-columns:1fr; } .decide { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="vazio">Carregando…</p></div>
<script>
const SUPABASE_URL = "https://rtmgzsikwglsvpopbfbw.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0bWd6c2lrd2dsc3Zwb3BiZmJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NDgwMjcsImV4cCI6MjEwMTQyNDAyN30.-vwbQkcuAbbonmBVCeUWXjTg54uB5MNN94QmMlBxTA4";
const EMAIL_DONO = 'neto@cidadaodomundo.com.br';
const MEDIDO = 'qua 18/11/2026, noite';
// Todas as telas do menu de hoje, na ordem do menu (de: Neto ou Fabio). Medido; ver o comentário do alto.
// 19/11/2026: os dados do estudo NÃO ficam neste arquivo (o repositório do painel é público): moram no banco, em
// juncao_dados (RLS pode_ver_plano = Neto e Fabio), e chegam no carregar().
let TELAS = [], GRUPOS = [];
const LOGINS = [
 ['diego', 'líder São Braz', 'Delivery do dia, Chegada, Escala e Clima, Pausados iFood x Site, Avaliações do dia, Consulta de ponto e Ponto ao Vivo da loja'],
 ['edgar', 'líder Ahú', 'Delivery do dia, Chegada, Escala e Clima, Pausados iFood x Site, Avaliações do dia, Consulta de ponto e Ponto ao Vivo da loja'],
 ['gabriel', 'delivery (dia)', 'Delivery do dia, Chegada, Escala e Clima, Pausados iFood x Site, Avaliações do dia'],
 ['alejo', 'delivery (noite)', 'Delivery do dia, Chegada, Escala e Clima, Pausados iFood x Site, Avaliações do dia'],
 ['flavia', 'salão', 'Reservas, Pausados do Salão, Avaliações do Google'],
 ['yaimar', 'salão', 'Reservas, Pausados do Salão, Avaliações do Google'],
 ['arissa', 'RH', 'Consulta de ponto, Ponto ao Vivo, Taxas e Freelas, Ponto dos taxas'],
 ['rita', 'compras e estoque', 'Mercado Livre (já vê), Quem conserta'],
 ['hellen', 'financeiro', 'já vê todas'],
];

const app = document.getElementById('app');
const D = { resp: [], aberto: null, filtro: 'todas' };
function sessao() { try { return JSON.parse(localStorage.getItem('rmbSessao') || 'null'); } catch (e) { return null; } }
function sessaoValida() { const s = sessao(); return s && s.access_token && (!s.expira_em || s.expira_em > Date.now() + 60000) ? s : null; }
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const quandoBR = ts => ts ? new Date(ts).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit', timeZone:'America/Sao_Paulo' }) : '';
const H = () => { const s = sessaoValida(); return { apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${s.access_token}`, 'Content-Type':'application/json' }; };
const meu = () => String((sessao() || {}).email || '').toLowerCase();
const souDono = () => meu() === EMAIL_DONO;
const usuario = e => String(e || '').replace('@cidadaodomundo.com.br', '');

function telaLogin(msg) {
  app.innerHTML = `<div class="login"><p class="eyebrow">Cidadão do Mundo</p><h1 style="font-size:1.3rem">Junção das telas</h1>
    <p class="lede">Entre com o mesmo nome e senha do painel.</p>
    <label>Nome<input id="e" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username" placeholder="seu nome (ex.: fabio)"></label>
    <label>Senha<input id="s" type="password" autocomplete="current-password"></label>
    <button id="b">Entrar</button><p class="erro" id="m">${esc(msg || '')}</p></div>`;
  const ir = async () => {
    const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, { method:'POST',
      headers:{ apikey:SUPABASE_ANON_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ email:((t) => { t = String(t || '').trim(); return !t || t.includes('@') ? t : t.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, '').toLowerCase() + '@cidadaodomundo.com.br'; })(document.getElementById('e').value), password:document.getElementById('s').value }) });
    const s = await r.json();
    if (!r.ok || !s.access_token) { document.getElementById('m').textContent = 'Nome ou senha não conferem.'; return; }
    localStorage.setItem('rmbSessao', JSON.stringify({ access_token:s.access_token, refresh_token:s.refresh_token,
      email:(s.user && s.user.email) || '', expira_em: Date.now() + (s.expires_in || 3600) * 1000 }));
    carregar();
  };
  document.getElementById('b').onclick = ir;
  document.getElementById('s').onkeydown = e => { if (e.key === 'Enter') ir(); };
}
async function carregar() {
  if (!sessaoValida()) return telaLogin();
  const r0 = await fetch(`${SUPABASE_URL}/rest/v1/transicao_itens?select=id&limit=1`, { headers:H() });
  if (r0.status === 401) return telaLogin('Sessão vencida, entre de novo.');
  const ok = r0.ok ? await r0.json() : [];
  if (!ok.length) { app.innerHTML = `<p class="vazio">Este login não tem acesso (a página é só do Neto e do Fabio).</p>
    <button class="sair" onclick="localStorage.removeItem('rmbSessao');carregar()">entrar com outro login</button>`; return; }
  const [r, rd] = await Promise.all([
    fetch(`${SUPABASE_URL}/rest/v1/juncao_telas_resposta?select=*&order=criado_em.desc`, { headers:H() }),
    fetch(`${SUPABASE_URL}/rest/v1/juncao_dados?select=dados&chave=eq.estudo`, { headers:H() })]);
  D.resp = r.ok ? await r.json() : [];
  const dd = rd.ok ? await rd.json() : [];
  if (!dd.length) { app.innerHTML = '<p class="erro">✗ Não consegui ler os dados do estudo. <button class="sair" onclick="carregar()">tentar de novo</button></p>'; return; }
  TELAS = dd[0].dados.telas || []; GRUPOS = dd[0].dados.grupos || [];
  desenhar();
}
// decisão = a última resposta de quem não é o dono (o Fabio); comentário = a última do dono
const decisao = k => D.resp.find(x => x.tela === k && x.quem !== EMAIL_DONO);
const comentario = k => D.resp.find(x => x.tela === k && x.quem === EMAIL_DONO);
const ehTela = x => (x.cat || 'tela') === 'tela';
const semUso = x => ehTela(x) && x.u_total === 0 || (x.u_total != null && !String(x.u_pessoas || '').split('·').some(p => p.trim() && !p.trim().startsWith('neto ')));
const repetida = x => ehTela(x) && x.par && x.par.a && x.par.a !== 'não';
function filtradas() {
  return TELAS.filter(x => D.filtro === 'todas' || (D.filtro === 'neto' && ehTela(x) && x.de === 'Neto') || (D.filtro === 'fabio' && ehTela(x) && x.de === 'Fabio')
    || (D.filtro === 'repetidas' && repetida(x)) || (D.filtro === 'semuso' && semUso(x)) || (D.filtro === 'abertas' && !x.sem_decisao && !decisao(x.k))
    || (D.filtro === 'paginas' && x.cat === 'pagina') || (D.filtro === 'artefatos' && x.cat === 'artefato') || (D.filtro === 'rotinas' && x.cat === 'rotina'));
}
const dito = (r, quem) => r ? `<div class="dito"><b class="${r.resposta}">${r.resposta === 'sim' ? 'Sim' : r.resposta === 'nao' ? 'Não' : 'Outro'}</b>${r.texto ? ' — ' + esc(r.texto) : ''} <span class="nota">· ${esc(usuario(r.quem))} ${esc(quandoBR(r.criado_em))}</span></div>` : `<div class="nota">${quem}</div>`;
function blocoResposta(x) {
  const id = x.k.replace(/[^a-z0-9]/gi, '_'), dec = decisao(x.k), com = comentario(x.k);
  const botoes = D.aberto === x.k
    ? `<div class="resp"><input id="tx_${id}" placeholder="${souDono() ? 'seu comentário' : 'o que fazer com esta tela?'}" maxlength="1000"><button class="bt cheio" onclick="responder('${esc(x.k)}','${esc(x.p)}','outro')">Enviar</button><button class="bt" onclick="D.aberto=null;desenhar()">Cancelar</button></div>`
    : souDono() ? `<div class="resp"><button class="bt" onclick="D.aberto='${esc(x.k)}';desenhar();document.getElementById('tx_${id}').focus()">${com ? 'Mudar comentário' : 'Comentar'}</button></div>`
    : `<div class="resp"><button class="bt sim" onclick="responder('${esc(x.k)}','${esc(x.p)}','sim')">Sim</button><button class="bt nao" onclick="responder('${esc(x.k)}','${esc(x.p)}','nao')">Não</button><button class="bt" onclick="D.aberto='${esc(x.k)}';desenhar();document.getElementById('tx_${id}').focus()">Outro…</button></div>`;
  return `<div class="decide"><div><div class="rot">Decisão do Fabio</div>${dito(dec, 'esperando o Fabio')}${souDono() ? '' : botoes}</div>
    <div><div class="rot">Comentário do Neto</div>${dito(com, 'sem comentário')}${souDono() ? botoes : ''}</div></div><div class="aviso" id="av_${id}"></div>`;
}
function card(x) {
  const usos = x.u_total == null ? esc(x.u_pessoas || 'não medido') : x.u_total === 0 ? 'nenhum' : `${x.u_total}${x.u_pessoas ? ' · ' + esc(x.u_pessoas) : ''}`;
  const cls = x.cls || x.p, cat = x.cat || 'tela';
  const lk = cat === 'artefato' ? (souDono() ? x.link : '') : x.link;
  return `<div class="item ${cls}"><div class="topo"><span class="tit">${lk ? `<a href="${esc(lk)}" target="_blank" rel="noopener">${esc(x.t)}</a>` : esc(x.t)}${cat === 'artefato' && !souDono() ? ' <span class="nota">(só o Neto abre)</span>' : ''}${x.de === 'Fabio' ? ' <span class="fab-marca" title="tela da operação (Fabio)">●</span>' : ''}</span>${cat === 'tela' || cat === 'pagina' ? `<span class="tag ${x.de === 'Fabio' ? 'fabio' : ''}">${x.de === 'Fabio' ? 'do Fabio' : 'do Neto'}</span>` : ''}<span class="tag ${cls}">${esc(x.p)}</span></div>
    <dl class="grade"><dt>${cat === 'rotina' ? 'O que faz' : cat === 'tela' ? 'O que mostra' : 'O que é'}</dt><dd>${esc(x.o)}</dd>${cat === 'artefato' ? '' : `<dt>${cat === 'rotina' ? 'Para que serve' : 'Acessos em 30 dias'}</dt><dd>${usos}</dd>`}<dt>${cat === 'tela' ? 'Funciona hoje' : cat === 'rotina' ? 'Onde e como vai' : cat === 'artefato' ? 'Tipo' : 'Tipo e última mudança'}</dt><dd>${esc(x.ok)}</dd>
      ${x.par && x.par.n && x.par.n !== 'nenhuma' ? `<dt>Parecida do outro lado</dt><dd>${esc(x.par.n)}${x.par.num && x.par.num !== '—' ? '<br>' + esc(x.par.num) : ''}</dd>` : ''}</dl>
    <div class="prop"><b>Proposta: ${x.p}</b> — ${esc(x.pt)}${x.ng && x.ng !== '—' && x.p !== 'TIRAR' ? ` <span class="nota">· grupo: ${esc(x.ng)}</span>` : ''}</div>
    ${x.sem_decisao ? '<div class="nota" style="margin-top:6px;">Fora da decisão: ' + (x.p === 'JÁ TIRADA DO SITE' ? 'já resolvida por segurança.' : 'página do plano Neto–Fabio, fica até a entrega fechar.') + '</div>' : blocoResposta(x)}</div>`;
}
// o menu novo: a proposta onde o Fabio disse sim; o menu de hoje onde ele disse não; "outro" mostra o texto; sem resposta, proposta em cinza
function menuNovo() {
  const G = {};
  const por = (g) => (G[g] = G[g] || []);
  TELAS.filter(ehTela).forEach(x => {
    const d = decisao(x.k), vale = !d || d.resposta === 'sim' ? x.p : 'MANTER', grupo = !d || d.resposta === 'sim' ? (x.ng && x.ng !== '—' ? x.ng : x.g) : x.g;
    const cls = d ? 'dec' : 'prov';
    if (d && d.resposta === 'outro') { por(x.g).push(`<div class="dec">${esc(x.t)} <span class="nota">(outro: ${esc(d.texto)})</span></div>`); return; }
    if (vale === 'TIRAR') por(x.g).push(`<div class="sai ${cls}">${esc(x.t)}</div>`);
    else por(grupo).push(`<div class="${cls}">${esc(x.t)}${vale === 'JUNTAR' ? ' <span class="nota">(junta)</span>' : ''}</div>`);
  });
  const ordem = [...GRUPOS, ...Object.keys(G).filter(g => !GRUPOS.includes(g))];
  return ordem.filter(g => G[g]).map(g => `<div><b>${esc(g)}${GRUPOS.includes(g) ? '' : ' (novo)'}</b>${G[g].join('')}</div>`).join('');
}
// 18/11/2026 23:28 (dono: "o filtro repetidas do artefato nao esta funcionando"): em Repetidas, cada tela aparece JUNTO da
// parecida do outro lado (lado a lado, com os dois números embaixo). A parecida é achada pelo nome dela no texto da comparação.
const NOTA_GRUPO = {
  'Páginas avulsas (fora do menu)': 'Páginas publicadas que não estão no menu. Arquivar = sai do site e fica no histórico. As 7 que tinham número da empresa aberto já saíram (18/11, segurança).',
  'Artefatos do claude.ai': 'Páginas de trabalho do Claude: privadas, só o Neto abre. A maioria fica como histórico (não roda, não custa, nada a fazer). As pessoais ficaram fora desta lista. Artefatos do Fabio: só ele vê; ele lista os que quiser manter.',
  'Rotinas (robôs)': 'Os robôs que rodam sozinhos no computador da loja. Os robôs ficam com o Fabio: ele decide manter, pausar ou desligar. Nada é desligado antes da decisão.',
};
function parecidas(x) {
  const txt = String((x.par && x.par.n) || '').toLowerCase();
  return TELAS.filter(y => y.k !== x.k && y.t && txt.includes(y.t.toLowerCase().replace(/\s*[·(].*$/, '').trim()));
}
function pares(L) {
  const visto = new Set(), blocos = [];
  L.slice().sort((a, b) => (a.de === 'Fabio' ? 0 : 1) - (b.de === 'Fabio' ? 0 : 1)).forEach(x => {
    if (visto.has(x.k)) return;
    const outras = parecidas(x).filter(y => !visto.has(y.k));
    visto.add(x.k); outras.forEach(y => visto.add(y.k));
    blocos.push(`<div class="par">${card(x)}<div>${outras.length ? outras.map(card).join('') : `<div class="item"><div class="nota">Parecida: ${esc(x.par.n)}</div></div>`}</div>`
      + (x.par.num && x.par.num !== '—' ? `<div class="nums"><b>Os dois números:</b> ${esc(x.par.num)}</div>` : '') + '</div>');
  });
  return blocos.length ? `<p class="nota">${blocos.length} pares: a tela de um lado e a parecida do outro, com os dois números embaixo.</p>` + blocos.join('') : '<p class="vazio">Nenhuma tela neste filtro.</p>';
}
function desenhar() {
  const comDec = TELAS.filter(x => !x.sem_decisao), dec = comDec.filter(x => decisao(x.k)).length, nc = c => TELAS.filter(x => (x.cat || 'tela') === c).length;
  const n = p => TELAS.filter(ehTela).filter(x => x.p === p).length;
  const L = filtradas(), s = sessao() || {};
  const F = [['todas', `Tudo (${TELAS.length})`], ['neto', `Telas do Neto (${TELAS.filter(x => ehTela(x) && x.de === 'Neto').length})`], ['fabio', `Telas do Fabio (${TELAS.filter(x => ehTela(x) && x.de === 'Fabio').length})`],
             ['repetidas', `Repetidas (${TELAS.filter(repetida).length})`], ['semuso', `Sem uso (${TELAS.filter(semUso).length})`],
             ['paginas', `Páginas avulsas (${nc('pagina')})`], ['artefatos', `Artefatos (${nc('artefato')})`], ['rotinas', `Rotinas (${nc('rotina')})`], ['abertas', `Sem decisão (${comDec.length - dec})`]];
  app.innerHTML = `
    <p class="eyebrow">Cidadão do Mundo · só Neto e Fabio · medido em ${esc(MEDIDO)}</p>
    <h1>Junção das telas</h1>
    <p class="lede">Todas as telas do painel, as do Neto e as do Fabio: o que cada uma mostra, quantas vezes foi aberta em 30 dias, se funciona e a tela parecida do outro lado. O painel fica com o Cidadão, então <b>quem decide é o Fabio</b>: Sim aceita a proposta, Não deixa como está, Outro diz o que fazer. O Neto comenta ao lado. Regra de 03/11: dinheiro no painel do Neto, operação no do Fabio. O menu só muda depois das respostas.</p>
    <div class="placar"><div><b>${dec} de ${comDec.length}</b><span>decididas pelo Fabio</span></div><div><b>${nc('tela')}</b><span>telas (juntar ${n('JUNTAR')} · tirar ${n('TIRAR')} · manter ${n('MANTER')})</span></div><div><b>${nc('pagina')}</b><span>páginas avulsas</span></div><div><b>${nc('artefato')}</b><span>artefatos</span></div><div><b>${nc('rotina')}</b><span>rotinas</span></div></div>
    <div class="filtros">${F.map(([k, t]) => `<button class="bt${D.filtro === k ? ' on' : ''}" onclick="D.filtro='${k}';desenhar()">${t}</button>`).join('')}</div>
    ${D.filtro === 'repetidas' ? pares(L) : (GRUPOS.map(g => { const l = L.filter(x => x.g === g); return l.length ? `<h3>${esc(g)} · ${l.length}</h3>${NOTA_GRUPO[g] ? `<p class="nota">${NOTA_GRUPO[g]}</p>` : ''}${l.map(card).join('')}` : ''; }).join('') || '<p class="vazio">Nenhuma tela neste filtro.</p>')}
    <h2>O menu novo, com todos os grupos</h2>
    <p class="nota">Muda conforme as respostas: em negrito o que o Fabio já decidiu; em cinza a proposta ainda sem resposta; riscado o que sai.</p>
    <div class="menu">${menuNovo()}</div>
    <h2>Quem usa o quê</h2>
    <p class="nota"><b>Portal antigo:</b> a lista de quem usa o portal antigo ainda não foi lida (o login de lá fica só na aba do Neto). Assim que for lida, entra aqui e a proposta abaixo é conferida contra ela.</p>
    <table><thead><tr><th>Quem abriu as telas do Fabio aqui (30 dias)</th><th>Quais e quantas vezes</th></tr></thead><tbody>${USO.map(([u, t]) => `<tr><td>${esc(u)}</td><td>${esc(t)}</td></tr>`).join('')}</tbody></table>
    <p class="nota" style="margin-top:6px;">Hoje só neto, fabio e hellen enxergam as telas do Fabio aqui; a rita vê só o Mercado Livre; os outros logins não veem nenhuma.</p>
    <h3>Proposta: o que cada login daqui passa a ver das telas do Fabio (pelo cargo, provisória)</h3>
    ${LOGINS.map(([u, c, t]) => { const x = { k:'login:' + u, p:'VER: ' + t }; return `<div class="item"><div class="topo"><span class="tit">${esc(u)}</span><span class="nota">${esc(c)}</span></div><div class="nota" style="color:var(--suave)">${esc(t)}</div>${blocoResposta(x)}</div>`; }).join('')}
    <footer>Entrou como ${esc(usuario(s.email))}${souDono() ? ' (você comenta; quem decide é o Fabio)' : ''} · <button class="sair" onclick="localStorage.removeItem('rmbSessao');carregar()">sair</button></footer>`;
}
async function responder(chave, prop, resposta) {
  const id = chave.replace(/[^a-z0-9]/gi, '_'), av = () => document.getElementById('av_' + id);
  const campo = document.getElementById('tx_' + id), texto = campo ? campo.value.trim() : '';
  if (resposta === 'outro' && !texto) { av().className = 'aviso erro'; av().textContent = '! Escreva antes de enviar.'; return; }
  av().className = 'aviso'; av().textContent = 'Enviando…';
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/juncao_telas_responder`, { method:'POST', headers:H(),
      body: JSON.stringify({ p_tela: chave, p_proposta: prop, p_resposta: resposta, p_texto: texto || null }) });
    if (!r.ok) { let m = ''; try { m = (await r.json()).message || ''; } catch (e) {} throw new Error(m || 'erro ' + r.status); }
    D.aberto = null; await carregar();
    const a = av(); if (a) { a.className = 'aviso certo'; a.textContent = '✓ Chegou: ficou gravado.'; }
  } catch (e) {
    const a = av(); a.className = 'aviso erro'; a.innerHTML = `✗ Não chegou: ${esc(e.message)} <button class="bt" onclick="responder('${esc(chave)}','${esc(prop)}','${resposta}')">tentar de novo</button>`;
  }
}
carregar();
</script>
