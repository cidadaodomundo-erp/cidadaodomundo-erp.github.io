<!-- PÁGINA PRÓPRIA DE PESSOAS (26/10/2026, bloco 4 do painel em módulos), no molde de estoque/index.html.
     A casca abre pessoas/index.html#cargos, #forafolha, #rh, #flash ou #reembolsos (docs/casca/paginas.js); a página
     carrega só o núcleo comum e docs/pessoas/pessoas.js — o mesmo código que o painel antigo usa.
     Quem mexe: o chat "Telas do painel". -->
<script>
  // aqui a casca abre a página sem ?casca=1: dentro de moldura da mesma origem é casca
  const NA_CASCA = window.parent !== window;
  if (NA_CASCA) document.documentElement.classList.add('na-casca');
  function avisarCasca(msg) { if (NA_CASCA) { try { parent.postMessage(msg, location.origin); } catch (e) {} } }
</script>
<link rel="stylesheet" href="../nucleo/nucleo.css?v=20261107t">
<link rel="stylesheet" href="ponto-cartao.css?v=20261110b">
<link rel="stylesheet" href="eventos-ausencias.css?v=20261110a">
<style>
  .na-casca body::before { display:none !important; }
  /* 06/11/2026 (dono): cabeçalho claro, letra escura — não se confunde com as linhas */
  div[id^="tabela"] th { background:var(--th-claro) !important; color:var(--th-claro-tx) !important; border-color:var(--line-2); }
  div[id^="tabela"] th a, div[id^="tabela"] th span { color:var(--th-claro-tx) !important; }
  /* cabeçalho de duas linhas: gruda o thead inteiro, não cada th (cada th com top:0 fazia a 2ª linha deslizar sobre a 1ª) */
  div[id^="tabela"] thead { position:sticky; top:0; z-index:4; }
  div[id^="tabela"] thead th { position:static !important; }
  /* campo obrigatório vazio: amarelo claro até ser preenchido (dono 06/11 17:37) */
  .cg-obrig-vazio { background:var(--campo-obrigatorio) !important; color:var(--th-claro-tx) !important; border-color:var(--farol-perto) !important; }
</style>

<script>
// O que é desta página: qual das cinco telas abrir, o atalho entre elas e a porta quando a sessão vence.
// 02/11/2026 (dono): Pagamento fora da folha virou aba de Cálculos da folha; o endereço antigo cai nela
if (location.hash === '#forafolha') { try { sessionStorage.setItem('pesAbaPedida', 'fora'); } catch (e) {} history.replaceState(null, '', '#pcalc'); }
const TELAS = { phoje: entrarPesHoje, pcartao: entrarPesPonto, peventos: entrarPesEventos, padm: entrarPesAdm, cargos: entrarPesCargos, pcalc: entrarPesCalc, pferias: entrarPesFerias, presc: entrarPesResc, penvio: entrarPesEnvio, pconf: entrarPesConf, pcusto: entrarPesCusto, pacertos: entrarPesAcertos, macertos: entrarMotoboyAcertos, forafolha: entrarForaFolha, rh: entrarRh, flash: entrarFlashRh, reembolsos: entrarReembolsos };
const TELA = TELAS[location.hash.slice(1)] ? location.hash.slice(1) : 'cargos';
function exigirLogin(recado) {
  localStorage.removeItem('rmbSessao');
  if (NA_CASCA) { avisarCasca({ tipo: 'casca-login', recado: recado || '' }); return; }
  location.href = '../sistema.html#' + TELA;   // aberta solta (botão "abrir"): a porta é a da casca
}
// atalho de uma tela para outra (ex.: gerar ordem → Apontar): na casca, ela abre a outra tela; solta, troca o endereço
function mostrarModulo(nome) {
  if (NA_CASCA) { avisarCasca({ tipo: 'casca-modulo', nome }); return; }
  location.hash = nome;
}
function abrirTela() {
  document.getElementById('modulo-' + TELA).style.display = '';
  registrarUso(TELA);
  avisarCasca({ tipo: 'casca-modulo', nome: TELA });
  try { TELAS[TELA](); }
  catch (e) {
    const el = document.getElementById('erroMsg');
    el.style.display = 'block'; el.textContent = 'Erro ao abrir a tela: ' + e.message;
  }
}
// a casca reabre a tela já carregada: recarrega os dados, como o painel antigo faz no mostrarModulo
window.reentrarTela = () => { try { TELAS[TELA](); } catch (e) {} };
window.addEventListener('hashchange', () => location.reload());
abrirTela();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('../sw.js').catch(() => {});
}
</script>
