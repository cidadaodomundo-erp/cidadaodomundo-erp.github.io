<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>TV · Cidadão do Mundo</title>
<style>
  :root { --bg:#111110; --tx:#f7edd8; --tx2:#e8e6dc; --brand:#c8102e; --amarelo:#f6c63e; --laranja:#ee8a3c; --linha:#34332f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); color:var(--tx); font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow:hidden; cursor:none; }
  .tela { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:6vh 6vw; opacity:0; transition:opacity .8s; }
  .tela.on { opacity:1; }
  .faixa { position:absolute; left:0; right:0; bottom:0; height:1.2vh; background:linear-gradient(90deg,var(--brand),var(--laranja),var(--amarelo)); }
  .logo { width:28vh; height:auto; margin-bottom:4vh; }
  h1 { font-size:9vh; line-height:1.05; font-weight:800; }
  h2 { font-size:6vh; color:var(--amarelo); margin-bottom:4vh; font-weight:800; }
  p { font-size:4.5vh; color:var(--tx2); margin-top:3vh; line-height:1.3; }
  .grande { font-size:24vh; font-weight:800; letter-spacing:-.02em; }
  .passos { display:flex; gap:4vw; margin-top:4vh; }
  .passo { border:.4vh solid var(--linha); border-radius:2vh; padding:4vh 3vw; width:24vw; }
  .passo b { display:block; font-size:12vh; color:var(--brand); }
  .passo span { font-size:4.5vh; }
  ul.check { list-style:none; text-align:left; font-size:6vh; line-height:1.6; }
  ul.check li::before { content:"☐  "; color:var(--amarelo); }
  .rodape { position:absolute; bottom:3vh; right:3vw; font-size:2.4vh; color:#7d858c; }
  #aviso { position:absolute; top:2vh; left:2vw; font-size:2.4vh; color:#7d858c; }
</style>
</head>
<body>
<div id="palco"></div>
<div class="faixa"></div>
<div class="rodape" id="rodape"></div>
<div id="aviso"></div>
<script>
const params = new URLSearchParams(location.search);
const CODIGO = params.get('tv') || 'totem';
const LOGO = '../logo.png';
let prog = null, fila = [], i = 0, timer = null;

const TELAS = {
  'boas-vindas': () => `<img class="logo" src="${LOGO}" alt=""><h1>Bem-vindo ao<br>Cidadão do Mundo</h1><p>Burgers &amp; Arts</p>`,
  'como-pedir':  () => `<h2>Peça aqui no totem</h2><div class="passos">
      <div class="passo"><b>1</b><span>Toque na tela e escolha seu lanche</span></div>
      <div class="passo"><b>2</b><span>Confira o pedido</span></div>
      <div class="passo"><b>3</b><span>Pague e aguarde</span></div></div>`,
  'marca':       () => `<img class="logo" src="${LOGO}" alt=""><h1>Burgers &amp; Arts</h1><p>Feito na hora, com capricho.</p>`,
  'relogio':     () => { const d = new Date(); return `<div class="grande" id="hora">${hora(d)}</div><p>${d.toLocaleDateString('pt-BR',{weekday:'long', day:'numeric', month:'long'})}</p>`; },
  'sacola':      () => `<h2>Antes de fechar a sacola</h2><ul class="check"><li>Todos os lanches do pedido</li><li>Bebida</li><li>Molhos e talheres</li><li>Lacre na sacola</li></ul>`,
  'recado':      () => `<h2>Recado do dia</h2><h1 style="font-size:7vh">${esc(prog.recado_do_dia || '')}</h1>`,
  'padrao':      () => `<h2>Padrão da casa</h2><ul class="check"><li>Pão selado</li><li>Ponto da carne certo</li><li>Montagem igual à foto da ficha</li><li>Embalagem limpa e fechada</li></ul>`
};

function hora(d){ return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function carregar(){
  try {
    const r = await fetch('programacao.json?t=' + Date.now(), {cache:'no-store'});
    const novo = await r.json();
    const tv = novo.tvs.find(t => t.codigo === CODIGO);
    document.getElementById('aviso').textContent = tv ? '' : 'TV "' + CODIGO + '" não está na central';
    const novaFila = (tv ? tv.telas : ['marca']).filter(n => TELAS[n]);
    const mudou = JSON.stringify(novaFila) !== JSON.stringify(fila) || !prog;
    prog = novo; fila = novaFila;
    document.getElementById('rodape').textContent = tv ? tv.nome : CODIGO;
    if (mudou) { i = 0; mostrar(); }
  } catch(e) { document.getElementById('aviso').textContent = 'sem internet, mostrando a última programação'; if (!prog) { prog = {}; fila = ['marca']; mostrar(); } }
}

function mostrar(){
  clearTimeout(timer);
  const palco = document.getElementById('palco');
  const el = document.createElement('div');
  el.className = 'tela';
  el.innerHTML = TELAS[fila[i % fila.length]]();
  palco.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('on')));
  [...palco.children].slice(0, -1).forEach(v => { v.classList.remove('on'); setTimeout(() => v.remove(), 900); });
  i++;
  timer = setTimeout(mostrar, ((prog && prog.segundos_por_tela) || 15) * 1000);
}

setInterval(() => { const h = document.getElementById('hora'); if (h) h.textContent = hora(new Date()); }, 10000);
setInterval(carregar, 120000);
setTimeout(() => location.reload(), 6 * 3600 * 1000);
carregar();
</script>
</body>
</html>
