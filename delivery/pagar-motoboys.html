     pagar_motoboys_dia(dia), que só responde para o dono e quem cuida do pessoal (pode_ver_pessoal). Entregas e taxas vêm do
     TrackEat, horários combinados da escala do Jaison, lanches da comanda Z Motoboys do Saipos, a régua de motoboy_param.
     Chegada = hora no pátio (fila do TrackEat/GPS, robô do Escritório 2); sem ela, 1ª coleta só avisa. Tolerância 15 min corta garantido e refeição do dia (Fábio 16/11). Esta página não grava nada. -->

<script>
function exigirLogin(recado) {
  if (NA_CASCA) { avisarCasca({ tipo: 'casca-login', recado: recado || '' }); return; }
  location.href = '../sistema.html';
}
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const brl = (v) => 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const LOJAS = ['Água Verde', 'São Braz', 'Ahú'];
  let DADOS = null, LOJA = 'todas', ABERTO = {}, SEQ = 0;

  function hojeSP() { return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo' }).format(new Date()); }
  function somaDias(d, n) { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); }
  function horasTxt(h) { if (h == null) return '—'; const m = Math.round(Number(h) * 60); return Math.floor(m / 60) + 'h' + String(m % 60).padStart(2, '0'); }

  async function carregar() {
    const dia = $('dia').value; const seq = ++SEQ;
    $('btnDepois').disabled = dia >= somaDias(hojeSP(), -1);
    $('conteudo').innerHTML = '<div class="pm-vazio">Carregando o dia…</div>'; $('avisos').innerHTML = '';
    let r;
    const cheg = await lerChegadas(dia);
    if (seq !== SEQ) return;
    CHEG_OK = cheg !== null;
    try { r = await trRpc('pagar_motoboys_dia', { p_dia: dia, p_chegadas: cheg || [] }); } catch (e) { if (seq === SEQ) erro('Sem conexão com o banco agora. Tente de novo.'); return; }
    if (seq !== SEQ) return;
    if (r.status === 401) { exigirLogin('Sua sessão venceu.'); return; }
    if (!r.ok) { erro(r.status === 403 || r.status === 400 ? 'Esta tela é só do dono e de quem cuida do pessoal.' : await trErroDe(r)); return; }
    DADOS = await r.json(); ABERTO = {};
    await juntarConferencia(dia, seq);
    if (seq === SEQ) desenhar();
    if (seq === SEQ && !$('painelObra').hidden) carregarAbas();
  }
  // 26/11 [dono] Planilha da Hellen, Pix feito e diferença: função à parte do Financeiro (c2c1378), sem mexer na conta do Fabio.
  // Cruza pelo loja + id_entregador. Se falhar, as colunas ficam "—" e a conta segue igual.
  async function juntarConferencia(dia, seq) {
    let c = null;
    try { const r = await trRpc('pagar_motoboys_conferencia', { p_dia: dia }); if (r.ok) c = await r.json(); } catch (e) {}
    if (seq !== SEQ || !c || !DADOS) return;
    DADOS.conf = c;
    const m = {};
    (c.linhas || []).forEach((x) => { m[x.loja + '|' + x.id_entregador] = x; });
    (DADOS.linhas || []).forEach((l) => {
      const x = m[l.loja + '|' + l.id_entregador]; if (!x) return;
      l.planilha = x.planilha; l.pix_pago = x.pix_pago; l.diferenca = x.diferenca;
      l.pix_segunda_somado = x.pix_segunda_somado; l.pix_sem_mapa = x.pix_sem_mapa;
    });
  }
  // Chegada no pátio: a MESMA fonte da tela Chegada (fila do TrackEat, GPS do pátio, anotado no balcão e a decisão à mão
  // de garantido/refeição). Só leitura (GET). Se falhar, a conta sai sem hora do pátio e não corta ninguém.
  const CHEG_URL = 'https://kqvoatdprjwxyadhvtdd.supabase.co/functions/v1/fabio-delivery-chegada';
  let CHEG_OK = false;
  async function lerChegadas(dia) {
    const auth = (typeof cabecalhoLeitura === 'function' ? cabecalhoLeitura() : {}) || {};
    if (!auth.Authorization) return null;
    const lojas = ['AGUA VERDE', 'SAO BRAZ', 'AHU'];
    const res = await Promise.allSettled(lojas.map((u) => fetch(CHEG_URL + '?dia=' + encodeURIComponent(dia) + '&unidade=' + encodeURIComponent(u),
      { method: 'GET', headers: { Authorization: auth.Authorization }, cache: 'no-store', credentials: 'omit' }).then((x) => (x.ok ? x.json() : null))));
    const out = []; let algum = false;
    res.forEach((x) => {
      const j = x.status === 'fulfilled' ? x.value : null;
      (j && j.por_unidade || []).forEach((u) => {
        if (u.status !== 'ok' || !Array.isArray(u.linhas)) return; algum = true;
        u.linhas.forEach((l) => out.push({ unidade: u.unidade, motoboy: l.motoboy, fila: l.chegada_fila_txt, gps: l.patio_gps_txt, anotado: l.anotado_txt, escala: l.escala_txt,
          gar_manual: l.garantido_manual, rango_manual: l.rango_manual }));
      });
    });
    return algum ? out : null;
  }
  function erro(msg) { $('conteudo').innerHTML = '<div class="pm-aviso">' + esc(msg) + '</div>'; }

  function linhasVisiveis() { return (DADOS.linhas || []).filter((l) => LOJA === 'todas' || l.loja === LOJA); }

  function desenharLojas() {
    const cont = (k) => (DADOS ? (DADOS.linhas || []).filter((l) => k === 'todas' || l.loja === k).length : 0);
    $('lojas').innerHTML = '<span class="rot">LOJA</span>' + ['todas'].concat(LOJAS).map((k) =>
      '<button type="button" data-loja="' + esc(k) + '" class="' + (LOJA === k ? 'on' : '') + '">' + esc(k) + ' <span class="pm-fraco">' + cont(k) + '</span></button>').join('');
  }

  // Escala combinada: uma linha por turno (almoço / jantar), com entrada, saída e horas.
  function turnosEsc(l) {
    const t = [];
    if (l.esc_alm) t.push({ r: 'alm', ini: l.esc_alm, fim: l.esc_alm_fim, h: l.esc_alm_horas });
    if (l.esc_jan) t.push({ r: 'jan', ini: l.esc_jan, fim: l.esc_jan_fim, h: l.esc_jan_horas });
    return t;
  }
  // O que fez: com 2 turnos, uma linha por turno (almoço até a última entrega antes das 17h; jantar a partir da 1ª coleta depois das 17h).
  function chTxt(patio, coleta, corta) {
    if (!patio) return esc(coleta || '—');
    return '<span class="' + (corta ? 'pm-nao' : '') + '" title="Entrou no pátio (fila TrackEat/GPS)">' + esc(patio) + '</span>' + (coleta ? '<small class="pm-sub">coleta ' + esc(coleta) + '</small>' : '');
  }
  function celReal(l, campo) {
    if (!l.saida_alm && !l.chegada_jan) {
      if (campo !== 'ch') return esc(l.saida || '—');
      return chTxt(l.patio_alm || l.patio_jan, l.chegada, l.corta_alm || l.corta_jan);
    }
    const a = campo === 'ch' ? [chTxt(l.patio_alm, l.chegada, l.corta_alm), chTxt(l.patio_jan, l.chegada_jan, l.corta_jan)] : [esc(l.saida_alm || '—'), esc(l.saida || '—')];
    return '<span class="pm-turno"><i>alm</i>' + a[0] + '</span><span class="pm-turno"><i>jan</i>' + a[1] + '</span>';
  }
  function horasEsc(l) {
    const t = turnosEsc(l); if (!t.length || t.some((x) => x.h == null)) return null;
    return t.reduce((a, x) => a + Number(x.h), 0);
  }
  function celEsc(l, campo) {
    const t = turnosEsc(l);
    if (!t.length) return campo === 'ini' ? '<span class="pm-tarde">fora da escala</span>' : '';
    return t.map((x) => '<span class="pm-turno">' + (t.length > 1 ? '<i>' + x.r + '</i>' : '') +
      (campo === 'ini' ? esc(x.ini) : campo === 'fim' ? (x.fim ? esc(x.fim) : '<span class="pm-tarde">fecha</span>') :
        (x.h != null ? horasTxt(x.h) : '<span class="pm-tarde">?</span>')) + '</span>').join('');
  }
  function refeicaoTxt(l) {
    if (!l.direito_refeicoes) return '<span class="pm-nao">Não</span>';
    if (l.direito_refeicoes > 1) return '<span class="pm-sim">' + l.direito_refeicoes + ' turnos</span>';
    return '<span class="pm-sim">Sim</span>';
  }

  // 20/11/2026 (Hellen): com 2 turnos, a ficha separa 1º turno, 2º turno e Total, para ver quando ele perde o garantido
  // e a refeição de um turno e ganha no outro. SÓ MOSTRA: o valor pago continua o da linha (l.pagar).
  // Corridas de cada turno: n_t1/tx_t1 e n_t2/tx_t2 de pagar_motoboys_dia (entregues antes da entrada do jantar na escala contam no 1º).
  const TURNO_VER = {};
  function turnosConta(l) {
    if (!(l.alm_conta && l.jan_conta) || l.n_t1 == null) return null;
    const gm = l.garantido_manual, rm = l.rango_manual;
    const tu = ['alm', 'jan'].map((r, i) => {
      const ini = l['esc_' + r], fim = l['esc_' + r + '_fim'], h = l['esc_' + r + '_horas'], tar = l['tar_' + r];
      const patio = l['patio_' + r], atrP = l['atr_real_' + r], col = r === 'alm' ? l.chegada : (l.chegada_jan || null), atrC = l['atraso_' + r];
      const corta = !!l['corta_' + r];
      const perde = gm === false ? true : gm === true ? false : corta;
      const rango = rm === false ? false : rm === true ? true : !corta;
      const g = (h != null && tar != null) ? Math.round(h * tar * 100) / 100 : (Number(l['piso_' + r]) || null);

    const dias = [], nomes = ['seg', 'ter', 'qua', 'qui', 'sex', 'sáb', 'dom'], hoje = hojeSP();
    for (let i = 0; i < 7; i++) dias.push(somaDias(ESC_INI, i));
    const f = (iso) => iso.slice(8, 10) + '/' + iso.slice(5, 7);
    const at = ESC.atualizado ? new Date(ESC.atualizado).toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
    let h = '<div class="pm-caixa"><div class="rot">📅 Escala dos motoboys · semana de ' + f(dias[0]) + ' a ' + f(dias[6]) + '</div>' +
      '<button type="button" class="pm-btn" data-escpula="-1">◀ semana anterior</button> <button type="button" class="pm-btn" data-escpula="0">esta semana</button> <button type="button" class="pm-btn" data-escpula="1">semana seguinte ▶</button></div>' +
      '<div class="pm-aviso info">Vem da escala que o Jaison manda no grupo MOTOBOYS CIDADÃO JAISON' + (at ? ' · última atualização ' + esc(at) : '') + '. Esta aba só mostra; não muda nenhum valor a pagar.</div>';
    const L = ESC.linhas || []; let lojas = ['Água Verde', 'São Braz', 'Ahú'];
    L.forEach((r) => { if (!lojas.includes(r.unidade)) lojas.push(r.unidade); });
    if (LOJA !== 'todas') lojas = lojas.filter((l) => l === LOJA);
    let aviso = 0;
    lojas.forEach((loja) => {
      const rs = L.filter((r) => r.unidade === loja);
      const pes = [...new Set(rs.map((r) => r.nome))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
      h += '<div class="pm-caixa"><div class="rot">' + esc(loja) + ' · ' + pes.length + ' motoboy(s) na semana</div><div class="pm-tab-wrap"><table class="pm-tab"><thead><tr><th>Motoboy</th>';
      dias.forEach((d, i) => { const vazio = !rs.some((r) => r.data === d); h += '<th' + (d === hoje ? ' style="color:var(--brand,#c98500)"' : '') + '>' + nomes[i] + ' ' + f(d) + (vazio ? '<div class="pm-ruim" style="text-transform:none">⚠ sem escala</div>' : '') + '</th>'; });
      h += '</tr></thead><tbody>';
      pes.forEach((n) => {
        const casa = rs.some((r) => r.nome === n && r.nome_casa); if (!casa) aviso++;
        h += '<tr><td><b>' + esc(n) + '</b>' + (casa ? '' : '<div class="pm-ruim" style="font-size:11.5px">⚠ nome não bate com o TrackEat</div>') + '</td>';
        dias.forEach((d) => {
          const t = rs.filter((r) => r.nome === n && r.data === d);
          h += '<td' + (d === hoje ? ' style="background:rgba(255,200,0,.08)"' : '') + '>' + (t.length ? t.map((r) => '<div style="white-space:nowrap"><small>' + esc(r.turno || '') + '</small> ' + esc(r.entrada || '?') + '–' + (r.saida ? esc(r.saida) : 'fechar') + '</div>').join('') : '—') + '</td>';
        });
        h += '</tr>';
      });
      if (!pes.length) h += '<tr><td colspan="8" class="pm-ruim">⚠ Nenhuma escala desta loja nesta semana.</td></tr>';
      h += '</tbody></table></div></div>';
    });
    h += '<div class="pm-aviso info">“fechar” = escala sem hora de saída: a conta vai até o fechamento da loja.' + (aviso ? ' “nome não bate com o TrackEat” = o nome na escala não foi ligado a nenhum motoboy do aplicativo; nesse caso a tela pode achar que a pessoa estava sem escala.' : '') + '</div>';
    $('painelObra').innerHTML = h;
  }
  $('painelObra').addEventListener('click', (ev) => { const b = ev.target.closest('button[data-escpula]'); if (b) abaEscalas(Number(b.dataset.escpula)); });

  // 26/11/2026 (pedido da Hellen): horários da escala do dia acima da lista de cada loja. Só mostra.
  const ESCDIA = {};
  function escDoDia(loja, dia) {
    if (!dia) return '';
    const ini = segDe(dia), w = ESCDIA[ini];
    if (!w) {
      ESCDIA[ini] = 'carregando';
      trRpc('pagar_motoboys_escala_semana', { p_ini: ini }).then((r) => r.ok ? r.json() : Promise.reject())
        .then((j) => { ESCDIA[ini] = j; if (DADOS) desenhar(); }).catch(() => { ESCDIA[ini] = 'erro'; });
      return '';
    }
    if (typeof w === 'string') return '';
    const ls = (w.linhas || []).filter((r) => r.unidade === loja && r.data === dia);
    if (!ls.length) return '<div class="pm-aviso">📅 <b>Escala do dia:</b> nenhuma escala do Jaison para esta loja neste dia.</div>';
    const g = [];
    ls.forEach((r) => { const k = (r.entrada || '?') + '–' + (r.saida || 'fechar'); let x = g.find((y) => y.k === k); if (!x) { x = { k, t: r.turno, n: [] }; g.push(x); } x.n.push(r.nome); });
    return '<div class="pm-caixa" style="display:block">📅 <b>Escala do dia</b> <small>(do Jaison)</small><div style="display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:4px">' +
      g.map((x) => '<div><b>' + esc(x.k) + '</b> <small>' + esc(x.t || '') + '</small> · ' + x.n.map(esc).join(', ') + '</div>').join('') + '</div></div>';
  }

  function desenharAba() {
    if (!ABAS) return;
    if (ABA === 'escalas') { abaEscalas(); return; }
    if (ABA === 'maquininha') abaMaquininha(); else if (ABA === 'dobro') abaDobro(); else if (ABA === 'acerto') abaAcerto();
  }

  function abaMaquininha() {
    const ls = porLoja(ABAS.maquininha);
    let h = '<div class="pm-aviso info">Cada venda paga com cartão ou vale na porta, procurada na Rede pelo mesmo valor até 45 min da entrega (vale: até 7 dias). A Rede chega no dia seguinte: hoje ela está carregada até <b>' + esc(dm(ABAS.rede_ate)) + '</b>.</div>';
    if (!ls.length) { $('painelObra').innerHTML = h + '<div class="pm-vazio">Nenhuma venda de cartão na porta neste dia' + (LOJA !== 'todas' ? ' nesta loja' : '') + '.</div>'; return; }
    const ach = ls.filter((x) => x.cobrado).length, esp = ls.filter((x) => !x.cobrado && x.aguardando).length, nao = ls.length - ach - esp;
    h += '<div class="pm-caixa pm-resumo"><span><b>' + ls.length + '</b> vendas</span><span class="pm-ok">' + ach + ' achadas na Rede</span>' +
      (esp ? '<span class="pm-espera">' + esp + ' esperando a Rede</span>' : '') + (nao ? '<span class="pm-ruim">' + nao + ' não achadas</span>' : '') + '</div>';
    h += '<div class="pm-tab-wrap"><table class="pm-tab"><thead><tr><th>Motoboy</th><th>Loja</th><th>Hora</th><th>Forma</th><th>Valor</th><th>Rede</th></tr></thead><tbody>';
    ls.forEach((x) => {
      const st = x.cobrado ? '<span class="pm-ok">✓ achada</span>' : x.aguardando ? '<span class="pm-espera">esperando</span>' : '<span class="pm-ruim">✗ não achada</span>';
      h += '<tr><td data-rot="Motoboy">' + esc(x.motoboy || '—') + '</td><td data-rot="Loja">' + esc(x.loja) + '</td><td data-rot="Hora">' + esc(x.hora || '—') + '</td><td data-rot="Forma">' + esc(x.tipo || x.grupo) +
        '</td><td data-rot="Valor">' + brl(x.valor) + '</td><td data-rot="Rede">' + st + '</td></tr>';
    });
    h += '</tbody></table></div><p class="pm-nota">"Não achada" é aviso para conferir com o motoboy e com o comprovante, não é desconto automático. A conferência pelo GPS da casa do cliente segue no portal antigo.</p>';
    $('painelObra').innerHTML = h;
  }

  function abaDobro() {
    const ls = porLoja(ABAS.corridas);
    let h = '<div class="pm-aviso info">Corrida <b>Reprovada</b> no TrackEat (corrida repetida) fica <b>fora</b> da conta. <b>Pendente</b> ainda conta até alguém aprovar ou reprovar no TrackEat. O robô que reprova sozinho a 2ª corrida quando o GPS mostra uma ida só continua rodando; o que ele reprova aparece aqui. TrackEat lido até ' + esc(dm(ABAS.trackeat_ate)) + '.</div>';
    if (!ls.length) { $('painelObra').innerHTML = h + '<div class="pm-vazio">Nenhuma corrida reprovada ou pendente neste dia' + (LOJA !== 'todas' ? ' nesta loja' : '') + '.</div>'; return; }
    const rep = ls.filter((x) => x.status_financeiro === 'Reprovado'), pen = ls.filter((x) => x.status_financeiro !== 'Reprovado');
    const soma = (a) => a.reduce((t, x) => t + Number(x.taxa_entrega || 0), 0);
    h += '<div class="pm-caixa pm-resumo"><span class="pm-ok">' + rep.length + ' reprovada(s) · ' + brl(soma(rep)) + ' fora da conta</span>' +
      (pen.length ? '<span class="pm-espera">' + pen.length + ' pendente(s) · ' + brl(soma(pen)) + ' ainda contam</span>' : '') + '</div>';
    h += '<div class="pm-tab-wrap"><table class="pm-tab"><thead><tr><th>Motoboy</th><th>Loja</th><th>Pedido</th><th>Hora</th><th>Distância</th><th>Taxa</th><th>TrackEat</th></tr></thead><tbody>';
    ls.forEach((x) => {
      const st = x.status_financeiro === 'Reprovado' ? '<span class="pm-ok">Reprovada</span>' : '<span class="pm-espera">Pendente</span>';
      h += '<tr><td data-rot="Motoboy">' + esc(x.motoboy || '—') + '</td><td data-rot="Loja">' + esc(x.loja) + '</td><td data-rot="Pedido">' + esc(x.numero_venda || x.codigo || '—') + '</td><td data-rot="Hora">' + esc(x.hora || '—') +
        '</td><td data-rot="Distância">' + (x.dist_km != null ? Number(x.dist_km).toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + ' km' : '—') + '</td><td data-rot="Taxa">' + brl(x.taxa_entrega) + '</td><td data-rot="TrackEat">' + st + '</td></tr>';
    });
    h += '</tbody></table></div>';
    $('painelObra').innerHTML = h;
  }

  function abaAcerto() {
    const ac = porLoja(ABAS.acertos), fc = porLoja(ABAS.faltas_caixa);
    const mot = ((DADOS && DADOS.linhas) || []).filter((l) => l.id_entregador != null && (LOJA === 'todas' || l.loja === LOJA));
    let h = '<div class="pm-aviso info">Acerto é um valor à mão somado (ou descontado) no pagamento do motoboy neste dia. Ele entra na hora na conta do <b>Quanto pagar</b>. A falta do caixa do delivery confirmada na conferência do caixa já é descontada sozinha, no 1º dia em que o motoboy roda depois da confirmação.</div>';
    h += '<div class="pm-caixa"><div class="pm-form">' +
      '<select id="acMot"><option value="">Motoboy…</option>' + mot.map((l, i) => '<option value="' + i + '">' + esc((l.nome || l.motoboy || '?') + ' · ' + l.loja) + '</option>').join('') + '</select>' +
      '<select id="acSinal"><option value="-1">Descontar</option><option value="1">Pagar a mais</option></select>' +
      '<input type="number" id="acValor" min="0" step="0.01" placeholder="R$ 0,00">' +
      '<input type="text" id="acMotivo" placeholder="Motivo (ex.: desconto combinado no Pix)">' +
      '<button type="button" class="pm-btn" id="acLancar">Lançar acerto</button></div>' +
      (mot.length ? '' : '<p class="pm-nota">Nenhum motoboy rodou neste dia' + (LOJA !== 'todas' ? ' nesta loja' : '') + ': escolha outro dia ou loja.</p>') + '<div id="acMsg" class="pm-nota"></div></div>';
    h += '<h3 style="font-size:14px;margin:14px 0 6px">Acertos lançados à mão</h3>';
    if (!ac.length) h += '<div class="pm-vazio">Nenhum acerto à mão neste dia.</div>';
    else {
      h += '<div class="pm-tab-wrap"><table class="pm-tab"><thead><tr><th>Motoboy</th><th>Loja</th><th>Valor</th><th>Motivo</th><th>Lançado</th><th></th></tr></thead><tbody>';
      ac.forEach((x) => {
        h += '<tr' + (x.cancelado ? ' class="pm-riscado"' : '') + '><td data-rot="Motoboy">' + esc(x.motoboy || '—') + '</td><td data-rot="Loja">' + esc(x.loja) + '</td><td data-rot="Valor">' + brl(x.valor) +
          '</td><td data-rot="Motivo" style="white-space:normal;text-align:left">' + esc(x.motivo || '') + (x.cancelado ? '<br><small>cancelado: ' + esc(x.motivo_cancelamento || '') + '</small>' : '') +
          '</td><td data-rot="Lançado">' + esc((x.lancado_em || '') + (x.lancado_por ? ' · ' + x.lancado_por.split('@')[0] : '')) + '</td><td>' +
          (x.cancelado ? '' : '<button type="button" class="pm-btn" data-cancelar="' + esc(x.id) + '">Cancelar</button>') + '</td></tr>';
      });
      h += '</tbody></table></div>';
    }
    h += '<h3 style="font-size:14px;margin:14px 0 6px">Falta do caixa descontada neste dia</h3>';
    if (!fc.length) h += '<div class="pm-vazio">Nenhuma falta do caixa cai neste dia.</div>';
    else {
      h += '<div class="pm-tab-wrap"><table class="pm-tab"><thead><tr><th>Motoboy</th><th>Loja</th><th>Valor</th><th>Venda</th><th>Caixa de</th><th>Confirmada</th></tr></thead><tbody>';
      fc.forEach((x) => {
        h += '<tr><td data-rot="Motoboy">' + esc(x.motoboy || '—') + '</td><td data-rot="Loja">' + esc(x.loja) + '</td><td data-rot="Valor">' + brl(x.valor) + '</td><td data-rot="Venda">' + esc(x.numero_venda || '—') +
          '</td><td data-rot="Caixa de">' + esc(x.dia_caixa || '—') + '</td><td data-rot="Confirmada">' + esc(x.confirmada_em || '—') + '</td></tr>';
      });
      h += '</tbody></table></div>';
    }
    $('painelObra').innerHTML = h;
    $('acLancar').onclick = () => lancarAcerto(mot);
  }

  async function lancarAcerto(mot) {
    const msg = (t, ruim) => { $('acMsg').innerHTML = '<span class="' + (ruim ? 'pm-ruim' : 'pm-ok') + '">' + esc(t) + '</span>'; };
    const l = mot[Number($('acMot').value)]; const v = Number(String($('acValor').value).replace(',', '.')); const motivo = $('acMotivo').value.trim();
    if (!$('acMot').value || !l) return msg('Escolha o motoboy.', true);
    if (!(v > 0)) return msg('Digite o valor.', true);
    if (motivo.length < 3) return msg('Escreva o motivo.', true);
    $('acLancar').disabled = true; msg('Gravando…');
    let r;
    try { r = await trRpc('motoboy_acerto_lancar', { p_dia: $('dia').value, p_id_entregador: l.id_entregador, p_motoboy: l.nome || l.motoboy, p_unidade: UNID[l.loja] || l.loja, p_valor: Math.round(v * 100) / 100 * Number($('acSinal').value), p_motivo: motivo }); }
    catch (e) { $('acLancar').disabled = false; return msg('Sem conexão. Nada foi gravado.', true); }
    if (!r.ok) { $('acLancar').disabled = false; return msg('Não gravou: ' + (await trErroDe(r)), true); }
    await carregar();
  }

  $('painelObra').addEventListener('click', async (ev) => {
    const b = ev.target.closest('button[data-cancelar]'); if (!b) return;
    const tr = b.closest('tr'); let inp = tr.querySelector('input.pm-mc');
    if (!inp) { b.insertAdjacentHTML('beforebegin', '<input class="pm-mc" type="text" placeholder="Motivo do cancelamento" style="font:inherit;font-size:12px;padding:4px 6px;margin-right:6px">'); b.textContent = 'Confirmar'; return; }
    const m = inp.value.trim(); if (m.length < 3) { inp.focus(); return; }
    b.disabled = true;
    let r; try { r = await trRpc('motoboy_acerto_cancelar', { p_id: Number(b.dataset.cancelar), p_motivo: m }); } catch (e) { b.disabled = false; return; }
    if (!r.ok) { b.disabled = false; b.textContent = 'Não cancelou'; b.title = await trErroDe(r); return; }
    await carregar();
  });

  $('abas').addEventListener('click', (ev) => {
    const b = ev.target.closest('button[data-aba]'); if (!b) return;
    document.querySelectorAll('#abas button').forEach((x) => x.classList.toggle('on', x === b));
    ABA = b.dataset.aba; const a = ABA;
    $('painelPagar').hidden = a !== 'pagar'; $('painelRegras').hidden = a !== 'regras'; $('painelObra').hidden = a === 'pagar' || a === 'regras';
    $('diaRot').textContent = ROTULOS[a] || ROTULOS.pagar;
    document.querySelector('.pm-dia').style.display = a === 'escalas' ? 'none' : '';
    if (a === 'regras') regras();
    if (a === 'escalas') { abaEscalas(); return; }
    if (!$('painelObra').hidden) carregarAbas();
  });
  $('lojas').addEventListener('click', (ev) => { const b = ev.target.closest('button[data-loja]'); if (!b || !DADOS) return; LOJA = b.dataset.loja; desenhar(); desenharAba(); });
  $('conteudo').addEventListener('click', (ev) => { const tv = ev.target.closest('button[data-tva]'); if (tv) { TURNO_VER[tv.dataset.tv] = tv.dataset.tva; desenhar(); return; } const tr = ev.target.closest('tr.lin'); if (!tr) return; ABERTO[tr.dataset.k] = !ABERTO[tr.dataset.k]; desenhar(); });
  $('btnAntes').onclick = () => { $('dia').value = somaDias($('dia').value, -1); carregar(); };
  $('btnDepois').onclick = () => { $('dia').value = somaDias($('dia').value, 1); carregar(); };
  $('dia').onchange = carregar;
  $('btnAtualizar').onclick = () => { for (const k in ESCDIA) delete ESCDIA[k]; carregar(); };
  // 26/11/2026 [dono] (Organizador 11:59): a loja escolhida no topo do painel vale aqui também
  const LOJA_NOME = { 'AGUA VERDE': 'Água Verde', 'SÃO BRAZ': 'São Braz', 'SAO BRAZ': 'São Braz', 'AHU': 'Ahú' };
  const lojaDaCasca = () => { const l = typeof lojaAtual === 'function' ? lojaAtual() : null; return !l || l === 'REDE' ? 'todas' : (LOJA_NOME[l] || l); };
  LOJA = lojaDaCasca();
  if (typeof aoMudarLoja === 'function') aoMudarLoja(() => { LOJA = lojaDaCasca(); if (DADOS) { desenhar(); desenharAba(); } });
  $('dia').max = somaDias(hojeSP(), -1);
  $('dia').value = somaDias(hojeSP(), -1);
  (async () => { try { if (typeof lojaCarregar === 'function') await lojaCarregar(); } catch (e) {} LOJA = lojaDaCasca(); carregar(); })();
})();
</script>
</body>
</html>
