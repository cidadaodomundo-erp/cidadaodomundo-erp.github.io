     pagar_motoboys_dia(dia), que só responde para o dono e quem cuida do pessoal (pode_ver_pessoal). Entregas e taxas vêm do
     TrackEat, horários combinados da escala do Jaison, lanches da comanda Z Motoboys do Saipos, a régua de motoboy_param.

<script>
function exigirLogin(recado) {
  if (NA_CASCA) { avisarCasca({ tipo: 'casca-login', recado: recado || '' }); return; }
  location.href = '../sistema.html';
}
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const brl = (v) => 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const LOJAS = ['Água Verde', 'São Braz', 'Ahú'];
  let DADOS = null, LOJA = 'todas', ABERTO = {}, SEQ = 0;

  function hojeSP() { return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo' }).format(new Date()); }
  function somaDias(d, n) { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); }
  function horasTxt(h) { if (h == null) return '—'; const m = Math.round(Number(h) * 60); return Math.floor(m / 60) + 'h' + String(m % 60).padStart(2, '0'); }

  async function carregar() {
    const dia = $('dia').value; const seq = ++SEQ;
    $('btnDepois').disabled = dia >= somaDias(hojeSP(), -1);
    $('conteudo').innerHTML = '<div class="pm-vazio">Carregando o dia…</div>'; $('avisos').innerHTML = '';
    let r;
    const cheg = await lerChegadas(dia);
    if (seq !== SEQ) return;
    CHEG_OK = cheg !== null;
    try { r = await trRpc('pagar_motoboys_dia', { p_dia: dia, p_chegadas: cheg || [] }); } catch (e) { if (seq === SEQ) erro('Sem conexão com o banco agora. Tente de novo.'); return; }
    if (seq !== SEQ) return;
    if (r.status === 401) { exigirLogin('Sua sessão venceu.'); return; }
    if (!r.ok) { erro(r.status === 403 || r.status === 400 ? 'Esta tela é só do dono e de quem cuida do pessoal.' : await trErroDe(r)); return; }
    DADOS = await r.json(); ABERTO = {};
    if (seq === SEQ) desenhar();
  }
  // Chegada no pátio: a MESMA fonte da tela Chegada (fila do TrackEat, GPS do pátio, anotado no balcão e a decisão à mão
  // de garantido/refeição). Só leitura (GET). Se falhar, a conta sai sem hora do pátio e não corta ninguém.
  const CHEG_URL = 'https://kqvoatdprjwxyadhvtdd.supabase.co/functions/v1/fabio-delivery-chegada';
  let CHEG_OK = false;
  async function lerChegadas(dia) {
    const auth = (typeof cabecalhoLeitura === 'function' ? cabecalhoLeitura() : {}) || {};
    if (!auth.Authorization) return null;
    const lojas = ['AGUA VERDE', 'SAO BRAZ', 'AHU'];
    const res = await Promise.allSettled(lojas.map((u) => fetch(CHEG_URL + '?dia=' + encodeURIComponent(dia) + '&unidade=' + encodeURIComponent(u),
      { method: 'GET', headers: { Authorization: auth.Authorization }, cache: 'no-store', credentials: 'omit' }).then((x) => (x.ok ? x.json() : null))));
    const out = []; let algum = false;
    res.forEach((x) => {
      const j = x.status === 'fulfilled' ? x.value : null;
      (j && j.por_unidade || []).forEach((u) => {
        if (u.status !== 'ok' || !Array.isArray(u.linhas)) return; algum = true;
        u.linhas.forEach((l) => out.push({ unidade: u.unidade, motoboy: l.motoboy, fila: l.chegada_fila_txt, gps: l.patio_gps_txt, anotado: l.anotado_txt, escala: l.escala_txt,
          gar_manual: l.garantido_manual, rango_manual: l.rango_manual }));
      });
    });
    return algum ? out : null;
  }
  function erro(msg) { $('conteudo').innerHTML = '<div class="pm-aviso">' + esc(msg) + '</div>'; }

  function linhasVisiveis() { return (DADOS.linhas || []).filter((l) => LOJA === 'todas' || l.loja === LOJA); }

  function desenharLojas() {
    const cont = (k) => (DADOS ? (DADOS.linhas || []).filter((l) => k === 'todas' || l.loja === k).length : 0);
    $('lojas').innerHTML = '<span class="rot">LOJA</span>' + ['todas'].concat(LOJAS).map((k) =>
      '<button type="button" data-loja="' + esc(k) + '" class="' + (LOJA === k ? 'on' : '') + '">' + esc(k) + ' <span class="pm-fraco">' + cont(k) + '</span></button>').join('');
  }

  // Escala combinada: uma linha por turno (almoço / jantar), com entrada, saída e horas.
  function turnosEsc(l) {
    const t = [];
    if (l.esc_alm) t.push({ r: 'alm', ini: l.esc_alm, fim: l.esc_alm_fim, h: l.esc_alm_horas });
    if (l.esc_jan) t.push({ r: 'jan', ini: l.esc_jan, fim: l.esc_jan_fim, h: l.esc_jan_horas });
    return t;
  }
  // O que fez: com 2 turnos, uma linha por turno (almoço até a última entrega antes das 17h; jantar a partir da 1ª coleta depois das 17h).
  function chTxt(patio, coleta, corta) {
    if (!patio) return esc(coleta || '—');
    return '<span class="' + (corta ? 'pm-nao' : '') + '" title="Entrou no pátio (fila TrackEat/GPS)">' + esc(patio) + '</span>' + (coleta ? '<small class="pm-sub">coleta ' + esc(coleta) + '</small>' : '');
  }
  function celReal(l, campo) {
    if (!l.saida_alm && !l.chegada_jan) {
      if (campo !== 'ch') return esc(l.saida || '—');
      return chTxt(l.patio_alm || l.patio_jan, l.chegada, l.corta_alm || l.corta_jan);
    }
    const a = campo === 'ch' ? [chTxt(l.patio_alm, l.chegada, l.corta_alm), chTxt(l.patio_jan, l.chegada_jan, l.corta_jan)] : [esc(l.saida_alm || '—'), esc(l.saida || '—')];
    return '<span class="pm-turno"><i>alm</i>' + a[0] + '</span><span class="pm-turno"><i>jan</i>' + a[1] + '</span>';
  }
  function horasEsc(l) {
    const t = turnosEsc(l); if (!t.length || t.some((x) => x.h == null)) return null;
    return t.reduce((a, x) => a + Number(x.h), 0);
  }
  function celEsc(l, campo) {
    const t = turnosEsc(l);
    if (!t.length) return campo === 'ini' ? '<span class="pm-tarde">fora da escala</span>' : '';
    return t.map((x) => '<span class="pm-turno">' + (t.length > 1 ? '<i>' + x.r + '</i>' : '') +
      (campo === 'ini' ? esc(x.ini) : campo === 'fim' ? (x.fim ? esc(x.fim) : '<span class="pm-tarde">fecha</span>') :
        (x.h != null ? horasTxt(x.h) : '<span class="pm-tarde">?</span>')) + '</span>').join('');
  }
  function refeicaoTxt(l) {
    if (!l.direito_refeicoes) return '<span class="pm-nao">Não</span>';
    if (l.direito_refeicoes > 1) return '<span class="pm-sim">' + l.direito_refeicoes + ' turnos</span>';
    return '<span class="pm-sim">Sim</span>';
  }

  // 20/11/2026 (Hellen): com 2 turnos, a ficha separa 1º turno, 2º turno e Total, para ver quando ele perde o garantido
  // e a refeição de um turno e ganha no outro. SÓ MOSTRA: o valor pago continua o da linha (l.pagar).
  // Corridas de cada turno: n_t1/tx_t1 e n_t2/tx_t2 de pagar_motoboys_dia (entregues antes da entrada do jantar na escala contam no 1º).
  const TURNO_VER = {};
  function turnosConta(l) {
    if (!(l.alm_conta && l.jan_conta) || l.n_t1 == null) return null;
    const gm = l.garantido_manual, rm = l.rango_manual;
    const tu = ['alm', 'jan'].map((r, i) => {
      const ini = l['esc_' + r], fim = l['esc_' + r + '_fim'], h = l['esc_' + r + '_horas'], tar = l['tar_' + r];
      const patio = l['patio_' + r], atrP = l['atr_real_' + r], col = r === 'alm' ? l.chegada : (l.chegada_jan || null), atrC = l['atraso_' + r];
      const corta = !!l['corta_' + r];
      const perde = gm === false ? true : gm === true ? false : corta;
      const rango = rm === false ? false : rm === true ? true : !corta;
      const g = (h != null && tar != null) ? Math.round(h * tar * 100) / 100 : (Number(l['piso_' + r]) || null);
      const n = Number(i ? l.n_t2 : l.n_t1) || 0, v = Number(i ? l.tx_t2 : l.tx_t1) || 0;
      const paga = (perde || g == null) ? v : Math.max(v, g);
      return { nome: r === 'alm' ? 'almoço' : 'jantar', ini, fim, h, tar, patio, atrP, col, atrC, corta, perde, rango, g, piso: !(h != null && tar != null), n, v, paga, vale: (!perde && g != null && g > v) ? 'gar' : 'cor' };
    });
    const dir = tu.filter((t) => t.rango).length;
    const lp = Array.isArray(l.lanches_precos) ? l.lanches_precos : [];
    const ref = Math.round(lp.slice(dir).reduce((a, x) => a + (Number(x) || 0), 0) * 100) / 100;
    const semPreco = lp.slice(dir).some((x) => x == null);
    const aj = Number(l.ajustes || 0);
    const total = Math.round((tu[0].paga + tu[1].paga - ref + aj) * 100) / 100;
    return { tu, dir, ref, semPreco, aj, total, corte: l.corte_turno, bate: Math.abs(Number(l.tx_t1) + Number(l.tx_t2) - Number(l.taxas || 0)) < 0.01 };
  }
  function turnosBox(l, k) {
    const C = turnosConta(l); if (!C) return '';
    const a = TURNO_VER[k] || 'tot', tol = DADOS.tolerancia_min;
    const bt = (id, t) => '<button type="button" data-tv="' + esc(k) + '" data-tva="' + id + '" class="' + (a === id ? 'on' : '') + '">' + t + '</button>';
    let h = '<div class="pm-tv"><div class="k">Conta separada por turno</div><div class="bts">' + bt('t0', '1º turno') + bt('t1', '2º turno') + bt('tot', 'Total') + '</div>';
    const ln = (e, d) => '<div class="ln"><span>' + e + '</span><span>' + d + '</span></div>';
    if (a === 't0' || a === 't1') {
      const i = a === 't0' ? 0 : 1, t = C.tu[i];
      h += ln('Combinado (' + t.nome + ')', t.ini ? '<b>' + esc(t.ini) + ' → ' + esc(t.fim || 'sem hora de saída') + '</b>' + (t.h != null ? ' · ' + horasTxt(t.h) : '') : '<span class="pm-tarde">fora da escala</span>');
      const min = (x) => (Number(x) > 0 ? Number(x) + ' min depois' : Math.abs(Number(x)) + ' min antes');
      let ch;
      const hm = (x, d) => { const [a1, a2] = x.split(':'); let t = (+a1 * 60 + +a2 + Number(d)) % 1440; if (t < 0) t += 1440; return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };
      // A chegada que vale é o MENOR entre o pátio e a 1ª entrega do turno (atr_real_*), a mesma que decide o corte.
      if (t.patio && t.atrP != null && t.ini) { const h1 = hm(t.ini, t.atrP); ch = '<b>' + esc(h1) + '</b> · ' + min(t.atrP) + ' <span class="pm-fraco">(' + (h1 === t.patio ? 'pátio' : 'pátio ' + esc(t.patio) + ', 1ª coleta ' + esc(h1)) + ')</span> · ' + (t.corta ? '<span class="pm-nao">passou da tolerância de ' + esc(tol) + ' min</span>' : '<span class="pm-sim">dentro da tolerância</span>'); }
      else if (t.patio) ch = '<b>' + esc(t.patio) + '</b> no pátio · ' + (t.corta ? '<span class="pm-nao">passou da tolerância de ' + esc(tol) + ' min</span>' : '<span class="pm-sim">dentro da tolerância</span>');
      else ch = (t.col ? '1ª coleta <b>' + esc(t.col) + '</b>' + (t.atrC != null ? ' · ' + min(t.atrC) : '') : '—') + ' · <span class="pm-tarde">sem hora do pátio, não corta</span>';
      h += ln('Chegou', ch);
      h += ln('Garantido do turno', t.g == null ? '<span class="pm-tarde">sem valor</span>' : (t.perde ? '<span class="pm-nao">perdeu</span> (' + brl(t.g) + ')' : '<span class="pm-sim">ganhou</span> ' + brl(t.g)) + (t.piso ? ' <span class="pm-fraco">piso do turno</span>' : ''));
      h += ln('Refeição do turno', t.rango ? '<span class="pm-sim">tem direito</span>' : '<span class="pm-nao">sem direito</span>');
      h += ln('Corridas ' + (i ? 'a partir das ' : 'antes das ') + esc(C.corte), t.n + ' = <b>' + brl(t.v) + '</b>');
      h += '<div class="ln tot"><span>Este turno paga</span><span><b>' + brl(t.paga) + '</b> ' + (t.vale === 'gar' ? '(o garantido)' : '(as corridas)') + '</span></div>';
    } else {
      C.tu.forEach((t, i) => { h += ln((i ? '2º' : '1º') + ' turno · ' + (t.vale === 'gar' ? 'garantido' : 'corridas') + (t.perde ? ' <span class="pm-nao">(perdeu o garantido)</span>' : ''), brl(t.paga)); });
      if (C.ref > 0) h += ln('Lanche além do direito (' + C.dir + ' de ' + (Array.isArray(l.lanches_precos) ? l.lanches_precos.length : 0) + ' com direito)', '− ' + brl(C.ref));
      if (Math.abs(C.aj) > 0.004) h += ln('Acerto à mão' + (l.ajuste_motivos ? ' (' + esc(l.ajuste_motivos) + ')' : ''), (C.aj > 0 ? '+ ' : '− ') + brl(Math.abs(C.aj)));
      h += '<div class="ln tot"><span>Total pela conta por turno</span><span><b>' + brl(C.total) + '</b></span></div>';
      if (C.semPreco) h += '<div class="av">Falta o preço de um lanche: não foi cobrado.</div>';
      if (Math.abs(C.total - Number(l.pagar || 0)) >= 0.01) h += '<div class="av">⚠ A tela hoje paga <b>' + brl(l.pagar) + '</b>, pela conta do dia inteiro. Pela conta por turno daria <b>' + brl(C.total) + '</b> (diferença de ' + brl(Math.abs(C.total - Number(l.pagar || 0))) + '). <b>O valor pago não mudou</b>: mudar a regra é decisão de vocês.</div>';
      else h += '<div class="av ok">✓ Bate com o valor que a tela paga (' + brl(l.pagar) + ').</div>';
    }
    if (!C.bate) h += '<div class="av">⚠ A soma das corridas dos dois turnos não bate com o total das taxas (' + brl(l.taxas) + '): confira antes de pagar.</div>';
    h += '<span class="fo">escala do Jaison · chegada: hora no pátio da tela Chegada (fila do TrackEat, GPS ou anotado) · corridas: TrackEat; as entregues antes das ' + esc(C.corte) + ' contam no 1º turno · lanche: Saipos, comanda Z Motoboys</span></div>';
    return h;
  }

  function linhaHtml(l, i) {
    const k = l.loja + '|' + l.id_entregador;
    const tarde = !!l.coleta_tarde;
    const prev = horasEsc(l) != null ? horasEsc(l) : (Number(l.horas_garantido) || null);
    const dif = prev ? Number(l.horas) - prev : null;
    const curta = dif != null && dif < -DADOS.tolerancia_min / 60;
    let h = '<tr class="lin" data-k="' + esc(k) + '">' +
      '<td data-rot="Motoboy"><span class="pm-nome">' + esc(l.nome) + (l.conferir ? '<span class="pm-conf">⚠ conferir</span>' : '') +
        (l.turnos > 1 ? '<small>2 turnos</small>' : '') + (l.corta_dia ? '<small class="pm-nao">✂ atrasou: sem garantido e refeição</small>' : '') + '</span></td>' +
      '<td data-rot="Escala: entrada" class="esc" title="Escala do Jaison">' + celEsc(l, 'ini') + '</td>' +
      '<td data-rot="Escala: saída" class="esc">' + celEsc(l, 'fim') + '</td>' +
      '<td data-rot="Escala: horas" class="esc fim"><b>' + (horasEsc(l) != null ? horasTxt(horasEsc(l)) : (turnosEsc(l).length ? '<span class="pm-tarde">?</span>' : '—')) + '</b></td>' +
      '<td data-rot="Chegou" class="real' + (tarde ? ' pm-tarde' : '') + '" title="1ª coleta no TrackEat">' + celReal(l, 'ch') + '</td>' +
      '<td data-rot="Saiu" class="real" title="Última entrega no TrackEat">' + celReal(l, 'sai') + '</td>' +
      '<td data-rot="Rodou" class="real' + (curta ? ' pm-tarde' : '') + '"' + (curta ? ' title="Rodou menos que o combinado na escala (da 1ª coleta à última entrega)"' : '') + '><b>' + horasTxt(l.horas) + '</b>' +
        (dif != null ? '<span class="pm-dif ' + (curta ? 'pm-tarde' : 'pm-fraco') + '">' + (dif >= 0 ? '+' : '−') + horasTxt(Math.abs(dif)) + '</span>' : '') + '</td>' +
      '<td data-rot="Entregas">' + esc(l.entregas) + '</td>' +
      '<td data-rot="Taxas">' + brl(l.taxas) + '</td>' +
      '<td data-rot="R$/hora"><span class="pm-vh">' + brl(l.valor_hora) + '</span></td>' +
      '<td data-rot="Garantido">' + (Number(l.garantido) > 0 ? '<span class="pm-sim">' + brl(l.garantido) + '</span>' : '<span class="pm-nao">Não</span>') + '</td>' +
      '<td data-rot="Refeição">' + refeicaoTxt(l) + (Number(l.cobrar_refeicao) > 0 ? '<br><small class="pm-nao">cobra ' + brl(l.cobrar_refeicao) + '</small>' : '') + '</td>' +
      '<td data-rot="A pagar" class="pm-pagar">' + brl(l.pagar) + '</td>' +
      '<td data-rot="Pix">' + (l.chave_pix ? '<span class="pm-sim">tem</span>' : '<span class="pm-nao">sem chave</span>') + '</td>' +
      '<td class="pm-fraco">' + (ABERTO[k] ? '▾' : '▸') + '</td></tr>';
    if (ABERTO[k]) {
      const itens = String(l.detalhe || '').split(' · ').filter(Boolean);
      itens.unshift('Taxas das entregas ' + brl(l.taxas) + ' × garantido ' + brl(l.garantido) + ': paga o maior' +
        (Number(l.ajustes) ? ', ' + (l.ajustes > 0 ? '+ ' : '− ') + brl(Math.abs(l.ajustes)) + ' de acerto' : '') +
        (Number(l.cobrar_refeicao) ? ', − ' + brl(l.cobrar_refeicao) + ' de lanche além do direito' : '') + ' = ' + brl(l.pagar) + '.');
      if (turnosEsc(l).length) itens.push('Escala do Jaison: ' + turnosEsc(l).map((x) => (x.r === 'alm' ? 'almoço ' : 'jantar ') + x.ini + ' às ' + (x.fim || 'fecha') + (x.h != null ? ' (' + horasTxt(x.h) + ')' : '')).join(' · ') +
        (horasEsc(l) != null ? ' = ' + horasTxt(horasEsc(l)) + ' combinadas; rodou ' + horasTxt(l.horas) : ''));
      itens.push('Lanches na comanda Z Motoboys: ' + l.lanches + ' (direito: ' + l.direito_refeicoes + ')');
      if (l.reprovadas) itens.push(l.reprovadas + ' corrida(s) reprovada(s) no TrackEat ficaram fora');
      h += '<tr class="pm-det"><td colspan="15">' + turnosBox(l, k) + '<ul>' + itens.map((t) => '<li>' + esc(t) + '</li>').join('') + '</ul></td></tr>';
    }
    return h;
  }

  function desenhar() {
    desenharLojas();
    const d = DADOS, ls = linhasVisiveis();
    $('diaRot').innerHTML = '💵 Quanto pagar a cada motoboy · ' + esc(d.dia_semana) + ', ' + esc(d.dia_texto) + ' · tarifas por loja e turno';
    const f = d.fontes || {};
    let av = '';
    if (d.dia >= hojeSP()) av += '<div class="pm-aviso">⏳ <b>Este dia ainda está em andamento.</b> Pague pelo dia que já fechou.</div>';
    av += '<div class="pm-aviso info">De onde vêm os números: entregas e taxas do <b>TrackEat</b> (carregado ' + esc(f.trackeat_carregado_em || '—') +
      '), horário combinado da <b>escala</b> (gravada ' + esc(f.escala_gravada_em || '—') + '), lanches do <b>Saipos</b> (carregado ' + esc(f.saipos_carregado_em || '—') +
      '). A <b>chegada</b> é a hora em que entrou no pátio, da mesma fonte da tela Chegada (fila do TrackEat, GPS do pátio ou anotado no balcão)' + (CHEG_OK ? '' : ' <b>— indisponível agora, ninguém foi cortado</b>') + '. Passou de ' + esc(d.tolerancia_min) + ' min da escala, perde garantido e refeição do dia (em vermelho). Quando ainda não há hora do pátio, vale a 1ª coleta só como aviso, em laranja, sem cortar.</div>';
    const conf = ls.filter((l) => l.conferir).length;
    if (conf) av += '<div class="pm-aviso"><b>Conferir antes de pagar:</b> ' + conf + ' motoboy(s) com escala incompleta ou lanche sem preço. O total inclui prévias.</div>';
    $('avisos').innerHTML = av;
    if (!ls.length) { $('conteudo').innerHTML = '<div class="pm-vazio">Nenhuma entrega do TrackEat neste dia' + (LOJA !== 'todas' ? ' em ' + esc(LOJA) : '') + '. O TrackEat entra no portal novo uma vez por dia, de manhã, com o dia anterior.</div>'; return; }
    const tot = ls.reduce((a, l) => a + Number(l.pagar || 0), 0);
    let h = '<div class="pm-caixa pm-totais"><div class="grande"><div class="k">Total a pagar</div><div class="v">' + brl(tot) + '</div></div>' +
      '<div><div class="k">Motoboys</div><div class="v">' + ls.length + '</div></div>' +
      '<div class="alerta"><div class="k">Sem chave Pix</div><div class="v">' + ls.filter((l) => !l.chave_pix).length + '</div></div>' +
      '<div><div class="k">Entregas</div><div class="v">' + ls.reduce((a, l) => a + Number(l.entregas || 0), 0) + '</div></div></div>';
    (LOJA === 'todas' ? LOJAS : [LOJA]).forEach((lj) => {
      const g = ls.filter((l) => l.loja === lj); if (!g.length) return;
      h += '<div class="pm-loja"><h2>' + esc(lj) + '</h2><span class="meta">' + g.length + ' motoboy(s) · <b>' + brl(g.reduce((a, l) => a + Number(l.pagar || 0), 0)) + '</b></span></div>' +
        '<div class="pm-tab-wrap"><table class="pm-tab"><thead><tr><th></th><th colspan="3" class="grp esc fim">COMBINADO NA ESCALA</th><th colspan="3" class="grp real">O QUE FEZ (TRACKEAT)</th><th colspan="8"></th></tr>' +
        '<tr><th>Motoboy</th><th class="esc">Entrada</th><th class="esc">Saída</th><th class="esc fim">Horas</th><th class="real">Chegou</th><th class="real">Saiu</th><th class="real">Rodou</th><th>Entregas</th><th>Taxas</th><th>R$/hora</th><th>Garantido</th><th>Refeição</th><th>A pagar</th><th>Pix</th><th></th></tr></thead><tbody>' +
        g.map(linhaHtml).join('') + '</tbody></table></div>';
    });
    const sd = (d.lanches_sem_dono || []).filter((x) => LOJA === 'todas' || x.loja === LOJA);
    if (sd.length) h += '<div class="pm-aviso" style="margin-top:12px">🍔 <b>' + sd.length + ' lanche(s) sem dono</b> na comanda Z Motoboys — ninguém está sendo cobrado: ' +
      sd.map((x) => esc(x.loja) + ' venda ' + esc(x.numero_venda) + ' (' + esc(x.produto) + ')').join(' · ') + '. Falta o nome do motoboy na observação do lanche.</div>';
    h += '<p class="pm-nota">Clique na linha para ver a conta daquele motoboy. Planilha dos meninos, Pix feito e diferença (a Prova real) ainda estão no portal antigo. Quem decide é você.</p>';
    $('conteudo').innerHTML = h;
  }

  function regras() {
    $('painelRegras').innerHTML = '<div class="pm-caixa pm-regras">' +
      '<h3>Quanto cada motoboy recebe</h3><ul>' +
      '<li>Recebe o <b>maior</b> entre a soma das taxas das entregas e o <b>garantido</b> do dia, mais acertos à mão, menos lanche além do direito.</li>' +
      '<li><b>Garantido</b> = horas da escala de cada turno × valor da hora. Turno conta quando ele estava na escala e rodou, ou rodou mais de 1h fora da escala.</li>' +
      '<li><b>Valor da hora</b>: R$ 20 de segunda a sexta e R$ 25 no fim de semana na Água Verde; R$ 20 no São Braz; no Ahú, R$ 25 no jantar e no almoço R$ 25 com 1 motoboy ou R$ 20 com 2.</li>' +
      '<li>Escala sem hora de saída: usa o piso do turno da loja e marca <b>conferir</b>.</li>' +
      '<li>A coluna <b>Horas</b> mostra as horas feitas (da 1ª coleta à última entrega no TrackEat) e, embaixo, as horas que o garantido paga. Fica laranja quando faltam mais de ' + esc((DADOS && DADOS.tolerancia_min) || 30) + ' min. É só aviso: quem decide é você.</li>' +
      '<li>Corrida <b>reprovada</b> no TrackEat (repetida) fica fora da conta.</li></ul>' +
      '<h3>Refeição</h3><ul>' +
      '<li>Direito a 1 lanche por turno rodado. Lanche a mais na comanda <b>Z Motoboys</b> é cobrado: R$ 24,50, ou R$ 29,90 com batata ou onion de funcionário.</li>' +
      '<li>O lanche é ligado ao motoboy pelo nome escrito na observação do item.</li></ul>' +
      '<h3>Chegada e atraso</h3><ul>' +
      '<li>Regra da casa: chegou no pátio mais de ' + esc((DADOS && DADOS.tolerancia_min) || 15) + ' min depois do combinado na escala, perde o garantido e a refeição <b>do dia</b> (fica com as taxas das entregas).</li>' +
      '<li>A hora do pátio vem da fila do TrackEat e do GPS, pelo robô do Escritório 2. Se num dia não houver essa hora, a 1ª coleta aparece em laranja só como aviso e <b>não corta</b>, porque a 1ª coleta costuma ser bem depois da chegada.</li></ul></div>';
  }

  $('abas').addEventListener('click', (ev) => {
    const b = ev.target.closest('button[data-aba]'); if (!b) return;
    document.querySelectorAll('#abas button').forEach((x) => x.classList.toggle('on', x === b));
    const a = b.dataset.aba;
    $('painelPagar').hidden = a !== 'pagar'; $('painelRegras').hidden = a !== 'regras'; $('painelObra').hidden = a === 'pagar' || a === 'regras';
    if (a === 'regras') regras();
    if (!$('painelObra').hidden) $('painelObra').innerHTML = '<div class="pm-aviso info">Esta parte ainda está no portal antigo e vem para cá nos próximos passos.</div>';
  });
  $('lojas').addEventListener('click', (ev) => { const b = ev.target.closest('button[data-loja]'); if (!b || !DADOS) return; LOJA = b.dataset.loja; desenhar(); });
  $('conteudo').addEventListener('click', (ev) => { const tv = ev.target.closest('button[data-tva]'); if (tv) { TURNO_VER[tv.dataset.tv] = tv.dataset.tva; desenhar(); return; } const tr = ev.target.closest('tr.lin'); if (!tr) return; ABERTO[tr.dataset.k] = !ABERTO[tr.dataset.k]; desenhar(); });
  $('btnAntes').onclick = () => { $('dia').value = somaDias($('dia').value, -1); carregar(); };
  $('btnDepois').onclick = () => { $('dia').value = somaDias($('dia').value, 1); carregar(); };
  $('dia').onchange = carregar;
  $('btnAtualizar').onclick = carregar;
  $('dia').max = somaDias(hojeSP(), -1);
  $('dia').value = somaDias(hojeSP(), -1);
  carregar();
})();
</script>
</body>
</html>
