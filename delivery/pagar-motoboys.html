     pagar_motoboys_dia(dia), que só responde para o dono e quem cuida do pessoal (pode_ver_pessoal). Entregas e taxas vêm do
     TrackEat, horários combinados da escala do Jaison, lanches da comanda Z Motoboys do Saipos, a régua de motoboy_param.
     Chegada = hora no pátio (fila do TrackEat/GPS, robô do Escritório 2); sem ela, 1ª coleta só avisa. Tolerância 15 min corta garantido e refeição do dia (Fábio 16/11). Esta página não grava nada. -->

<script src="../nucleo/nucleo.js?v=20261122d"></script>

<script>
function exigirLogin(recado) {
  if (NA_CASCA) { avisarCasca({ tipo: 'casca-login', recado: recado || '' }); return; }
  location.href = '../sistema.html';
}
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const brl = (v) => 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const LOJAS = ['Água Verde', 'São Braz', 'Ahú'];
  let DADOS = null, LOJA = 'todas', ABERTO = {}, SEQ = 0;
  let DOBRO = {}, ORD = { k: null, dir: 1 };

  function hojeSP() { return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo' }).format(new Date()); }
  function somaDias(d, n) { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); }
  function horasTxt(h) { if (h == null) return '—'; const m = Math.round(Number(h) * 60); return Math.floor(m / 60) + 'h' + String(m % 60).padStart(2, '0'); }

  async function carregar() {
    const dia = $('dia').value; const seq = ++SEQ;
    $('btnDepois').disabled = dia >= somaDias(hojeSP(), -1);
    $('conteudo').innerHTML = '<div class="pm-vazio">Carregando o dia…</div>'; $('avisos').innerHTML = '';
    let r;
    const cheg = await lerChegadas(dia);
    if (seq !== SEQ) return;
    CHEG_OK = cheg !== null;
    try { r = await trRpc('pagar_motoboys_dia', { p_dia: dia, p_chegadas: cheg || [] }); } catch (e) { if (seq === SEQ) erro('Sem conexão com o banco agora. Tente de novo.'); return; }
    if (seq !== SEQ) return;
    if (r.status === 401) { exigirLogin('Sua sessão venceu.'); return; }
    if (!r.ok) { erro(r.status === 403 || r.status === 400 ? 'Esta tela é só do dono e de quem cuida do pessoal.' : await trErroDe(r)); return; }
    DADOS = await r.json(); ABERTO = {};
    await juntarConferencia(dia, seq);
    if (seq === SEQ) desenhar();
    if (seq === SEQ && !$('painelObra').hidden) carregarAbas();
    if (seq === SEQ) carregarConferir(dia, seq);
  }
  // 26/11/2026 [dono]: selo de corrida em dobro (pagar_motoboys_abas). Só leitura.
  async function carregarConferir(dia, seq) {
    DOBRO = {};
    let ra = null;
    try { ra = await trRpc('pagar_motoboys_abas', { p_dia: dia }); } catch (e) { return; }
    if (seq !== SEQ || !DADOS || !ra || !ra.ok) return;
    const a = await ra.json();
    (a.corridas || []).forEach((c) => { const k = c.loja + '|' + c.id_entregador; const d = DOBRO[k] || (DOBRO[k] = { rep: 0, pen: 0 }); if (c.status_financeiro === 'Reprovado') d.rep++; else d.pen++; });
    if (seq === SEQ) desenhar();
  }
  function pixEsperando() { const c = DADOS && DADOS.conf; return !!(c && c.pix_cai_em && c.pix_cai_em >= hojeSP()); }
  function dm2(d) { const p = String(d || '').slice(0, 10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] : ''; }
  // O clique no motoboy: o resumo em bolinhas (verde = certo, vermelho = problema, laranja = esperando), como no portal antigo
  function veredito(l, k) {
    const it = []; const add = (c, t, f) => it.push('<li class="' + c + '">' + t + (f ? '<span class="fo">' + esc(f) + '</span>' : '') + '</li>');
    const tol = DADOS.tolerancia_min, te = turnosEsc(l);
    if (!te.length) add('alerta', 'Sem escala do Jaison com este nome neste dia: <b>confira na Chegada</b> antes de pagar', 'escala do Jaison');
    te.forEach((t) => {
      const nome = t.r === 'alm' ? 'almoço' : 'jantar', patio = l['patio_' + t.r], corta = !!l['corta_' + t.r];
      if (corta) add('alerta', 'Turno do ' + nome + ' (escala ' + esc(t.ini) + '): chegou ' + esc(patio || '—') + ', <b>passou da tolerância de ' + esc(tol) + ' min</b>', 'chegada no pátio · escala do Jaison');
      else if (patio) add('ok', 'Turno do ' + nome + ' (escala ' + esc(t.ini) + '): chegou ' + esc(patio) + ', dentro da tolerância', 'chegada no pátio · escala do Jaison');
      else add('esp', 'Turno do ' + nome + ' (escala ' + esc(t.ini) + '): sem hora do pátio, não corta', 'vale a 1ª coleta só como aviso');
    });
    if (l.garantido_manual === true) add('ok', 'Garantido <b>mantido por decisão do dono</b> na Chegada', 'botão da tela Chegada');
    else if (l.garantido_manual === false) add('alerta', 'Garantido <b>tirado por decisão do dono</b> na Chegada', 'botão da tela Chegada');
    if (Number(l.garantido) > 0) add('ok', 'Garantido: <b>tem direito</b> (' + brl(l.garantido) + ')' + (Number(l.taxas) >= Number(l.garantido) ? ', mas as entregas deram mais: vale ' + brl(l.taxas) : ''), 'R$/hora × horas da escala');
    else add('alerta', 'Garantido: <b>sem direito</b>' + (l.corta_dia ? ' · atrasou além da tolerância' : '') + '. Paga só as entregas (' + brl(l.taxas) + ')', 'TrackEat');
    if (l.rango_manual === true) add('ok', 'Refeição <b>liberada pelo dono</b> na Chegada');
    else if (l.rango_manual === false) add('alerta', 'Refeição <b>tirada pelo dono</b> na Chegada');
    if (Number(l.cobrar_refeicao) > 0) add('alerta', 'Lanche além do direito: <b>desconta ' + brl(l.cobrar_refeicao) + '</b> (' + l.lanches + ' lanche(s), direito a ' + l.direito_refeicoes + ')', 'Saipos, comanda Z Motoboys');
    else if (Number(l.lanches) > 0) add('ok', 'Refeição: ' + l.lanches + ' lanche(s), dentro do direito', 'Saipos, comanda Z Motoboys');
    if (Array.isArray(l.lanches_precos) && l.lanches_precos.some((x) => x == null)) add('alerta', 'Falta o preço de um lanche: <b>não foi cobrado</b>');
    if (Number(l.ajustes)) add(l.ajustes < 0 ? 'alerta' : 'ok', 'Acerto: ' + (l.ajustes > 0 ? '+ ' : '− ') + brl(Math.abs(l.ajustes)) + (l.ajuste_motivos ? ' · ' + esc(l.ajuste_motivos) : ''), 'aba Acerto e conferência do caixa');
    if (l.conferir) add('alerta', '<b>Conferir a regra antes de pagar</b>: o valor é uma prévia');
    const d = DOBRO[k];
    if (d && d.pen) add('alerta', d.pen + ' corrida(s) <b>pendente(s)</b> no TrackEat ainda contam: confira na aba 🔎 Corrida em dobro');
    if (d && d.rep) add('ok', d.rep + ' corrida(s) reprovada(s) no TrackEat ficaram fora da conta');
    if (l.planilha == null) add('esp', 'Planilha da Hellen: <b>ainda sem este motoboy</b> neste dia');
    else { const df = Math.round((Number(l.pagar || 0) - Number(l.planilha)) * 100) / 100; add(Math.abs(df) < 0.01 ? 'ok' : 'alerta', 'Planilha da Hellen: ' + brl(l.planilha) + (Math.abs(df) < 0.01 ? ', <b>igual</b>' : ', sistema paga <b>' + brl(Math.abs(df)) + (df > 0 ? ' a mais' : ' a menos') + '</b>'), 'Fechamento Motoboys da Hellen'); }
    if (l.pix_pago != null) {
      const df = Math.round((Number(l.pix_pago) - Number(l.pagar || 0)) * 100) / 100;

  function regras() {

  // 25/11/2026 (dono): Maquininha do dia, Corrida em dobro e Acerto — leitura em pagar_motoboys_abas;
  // o acerto à mão grava por motoboy_acerto_lancar / motoboy_acerto_cancelar (o mesmo que a conta do "Quanto pagar" lê).
  let ABA = 'pagar', ABAS = null, ABAS_SEQ = 0;
  const ROTULOS = { pagar: '💵 Quanto pagar a cada motoboy', maquininha: '🧾 Cartão cobrado na porta', dobro: '🔎 Corridas reprovadas ou pendentes no TrackEat', acerto: '📒 Acertos do dia', regras: '💵 Quanto pagar a cada motoboy' };
  const UNID = { 'Água Verde': 'AGUA VERDE', 'São Braz': 'SÃO BRAZ', 'Ahú': 'AHU' };
  const dm = (d) => (d ? String(d).slice(8, 10) + '/' + String(d).slice(5, 7) : '—');
  function porLoja(lista) { return (lista || []).filter((x) => LOJA === 'todas' || x.loja === LOJA); }

  async function carregarAbas() {
    const dia = $('dia').value; const seq = ++ABAS_SEQ;
    $('painelObra').innerHTML = '<div class="pm-vazio">Carregando…</div>';
    let r;
    try { r = await trRpc('pagar_motoboys_abas', { p_dia: dia }); } catch (e) { if (seq === ABAS_SEQ) $('painelObra').innerHTML = '<div class="pm-aviso">Sem conexão com o banco agora. Tente de novo.</div>'; return; }
    if (seq !== ABAS_SEQ) return;
    if (r.status === 401) { exigirLogin('Sua sessão venceu.'); return; }
    if (!r.ok) { $('painelObra').innerHTML = '<div class="pm-aviso">' + esc(r.status === 403 || r.status === 400 ? 'Esta parte é só do dono e de quem cuida do pessoal.' : await trErroDe(r)) + '</div>'; return; }
    ABAS = await r.json();
    // 26/11/2026 [dono]: conferência da maquininha venda a venda (Rede, Pix e GPS na casa do cliente), como no portal antigo
    try { const rm = await trRpc('pagar_motoboys_maquininha', { p_dia: dia }); ABAS.maq = rm.ok ? await rm.json() : null; } catch (e) { ABAS.maq = null; }
    if (seq === ABAS_SEQ) desenharAba();
  }

  function desenharAba() {
    if (!ABAS) return;
    if (ABA === 'maquininha') abaMaquininha(); else if (ABA === 'dobro') abaDobro(); else if (ABA === 'acerto') abaAcerto();
  }

  const MAQ_SIT = {

    SEM_COBRANCA_LONGE: ['❓ Sem cobrança e GPS longe', 'pm-ruim', 'Nenhuma cobrança achada, e o GPS não mostra o motoboy no endereço na hora da entrega.'],
    SEM_COBRANCA_SEM_GPS: ['❓ Sem cobrança e sem GPS', 'pm-espera', 'Nenhuma cobrança achada e não há leitura de GPS para provar a entrega.'],
    SO_A_COMIDA: ['⚠️ Só a comida', 'pm-espera', 'Passou o valor sem a taxa de entrega. Faltou cobrar a taxa.'],
    COBROU_A_MAIS: ['⚠️ Cobrou a mais', 'pm-espera', 'Passou o total na maquininha, mas parte já estava paga pelo app (voucher).'],

  function abaMaquininhaGps() {
    const M = ABAS.maq, ls = porLoja(M.linhas.map((x) => Object.assign({ loja: x.unidade }, x)));

    if (ABAS.maq && Array.isArray(ABAS.maq.linhas) && ABAS.maq.copiado_em) { abaMaquininhaGps(); return; }

      '<select id="acMot"><option value="">Motoboy…</option>' + mot.map((l, i) => '<option value="' + i + '">' + esc((l.nome || l.motoboy || '?') + ' · ' + l.loja) + '</option>').join('') + '</select>' +
      '<select id="acSinal"><option value="-1">Descontar</option><option value="1">Pagar a mais</option></select>' +
      '<input type="number" id="acValor" min="0" step="0.01" placeholder="R$ 0,00">' +
      '<input type="text" id="acMotivo" placeholder="Motivo (ex.: desconto combinado no Pix)">' +
      '<button type="button" class="pm-btn" id="acLancar">Lançar acerto</button></div>' +
      (mot.length ? '' : '<p class="pm-nota">Nenhum motoboy rodou neste dia' + (LOJA !== 'todas' ? ' nesta loja' : '') + ': escolha outro dia ou loja.</p>') + '<div id="acMsg" class="pm-nota"></div></div>';
    h += '<h3 style="font-size:14px;margin:14px 0 6px">Acertos lançados à mão</h3>';
    if (!ac.length) h += '<div class="pm-vazio">Nenhum acerto à mão neste dia.</div>';
    else {
      h += '<div class="pm-tab-wrap"><table class="pm-tab"><thead><tr><th>Motoboy</th><th>Loja</th><th>Valor</th><th>Motivo</th><th>Lançado</th><th></th></tr></thead><tbody>';
      ac.forEach((x) => {
        h += '<tr' + (x.cancelado ? ' class="pm-riscado"' : '') + '><td data-rot="Motoboy">' + esc(x.motoboy || '—') + '</td><td data-rot="Loja">' + esc(x.loja) + '</td><td data-rot="Valor">' + brl(x.valor) +
          '</td><td data-rot="Motivo" style="white-space:normal;text-align:left">' + esc(x.motivo || '') + (x.cancelado ? '<br><small>cancelado: ' + esc(x.motivo_cancelamento || '') + '</small>' : '') +
          '</td><td data-rot="Lançado">' + esc((x.lancado_em || '') + (x.lancado_por ? ' · ' + x.lancado_por.split('@')[0] : '')) + '</td><td>' +
          (x.cancelado ? '' : '<button type="button" class="pm-btn" data-cancelar="' + esc(x.id) + '">Cancelar</button>') + '</td></tr>';
      });
      h += '</tbody></table></div>';
    }
    h += '<h3 style="font-size:14px;margin:14px 0 6px">Falta do caixa descontada neste dia</h3>';
    if (!fc.length) h += '<div class="pm-vazio">Nenhuma falta do caixa cai neste dia.</div>';
    else {
      h += '<div class="pm-tab-wrap"><table class="pm-tab"><thead><tr><th>Motoboy</th><th>Loja</th><th>Valor</th><th>Venda</th><th>Caixa de</th><th>Confirmada</th></tr></thead><tbody>';
      fc.forEach((x) => {
        h += '<tr><td data-rot="Motoboy">' + esc(x.motoboy || '—') + '</td><td data-rot="Loja">' + esc(x.loja) + '</td><td data-rot="Valor">' + brl(x.valor) + '</td><td data-rot="Venda">' + esc(x.numero_venda || '—') +
          '</td><td data-rot="Caixa de">' + esc(x.dia_caixa || '—') + '</td><td data-rot="Confirmada">' + esc(x.confirmada_em || '—') + '</td></tr>';
      });
      h += '</tbody></table></div>';
    }
    $('painelObra').innerHTML = h;
    $('acLancar').onclick = () => lancarAcerto(mot);
  }

  async function lancarAcerto(mot) {
    const msg = (t, ruim) => { $('acMsg').innerHTML = '<span class="' + (ruim ? 'pm-ruim' : 'pm-ok') + '">' + esc(t) + '</span>'; };
    const l = mot[Number($('acMot').value)]; const v = Number(String($('acValor').value).replace(',', '.')); const motivo = $('acMotivo').value.trim();
    if (!$('acMot').value || !l) return msg('Escolha o motoboy.', true);
    if (!(v > 0)) return msg('Digite o valor.', true);
    if (motivo.length < 3) return msg('Escreva o motivo.', true);
    $('acLancar').disabled = true; msg('Gravando…');
    let r;
    try { r = await trRpc('motoboy_acerto_lancar', { p_dia: $('dia').value, p_id_entregador: l.id_entregador, p_motoboy: l.nome || l.motoboy, p_unidade: UNID[l.loja] || l.loja, p_valor: Math.round(v * 100) / 100 * Number($('acSinal').value), p_motivo: motivo }); }
    catch (e) { $('acLancar').disabled = false; return msg('Sem conexão. Nada foi gravado.', true); }
    if (!r.ok) { $('acLancar').disabled = false; return msg('Não gravou: ' + (await trErroDe(r)), true); }
    await carregar();
  }

  $('painelObra').addEventListener('click', async (ev) => {
    const b = ev.target.closest('button[data-cancelar]'); if (!b) return;
    const tr = b.closest('tr'); let inp = tr.querySelector('input.pm-mc');
    if (!inp) { b.insertAdjacentHTML('beforebegin', '<input class="pm-mc" type="text" placeholder="Motivo do cancelamento" style="font:inherit;font-size:12px;padding:4px 6px;margin-right:6px">'); b.textContent = 'Confirmar'; return; }
    const m = inp.value.trim(); if (m.length < 3) { inp.focus(); return; }
    b.disabled = true;
    let r; try { r = await trRpc('motoboy_acerto_cancelar', { p_id: Number(b.dataset.cancelar), p_motivo: m }); } catch (e) { b.disabled = false; return; }
    if (!r.ok) { b.disabled = false; b.textContent = 'Não cancelou'; b.title = await trErroDe(r); return; }
    await carregar();
  });

  $('abas').addEventListener('click', (ev) => {
    const b = ev.target.closest('button[data-aba]'); if (!b) return;
    document.querySelectorAll('#abas button').forEach((x) => x.classList.toggle('on', x === b));
    ABA = b.dataset.aba; const a = ABA;
    $('painelPagar').hidden = a !== 'pagar'; $('painelRegras').hidden = a !== 'regras'; $('painelObra').hidden = a === 'pagar' || a === 'regras';
    $('diaRot').textContent = ROTULOS[a] || ROTULOS.pagar;
    if (a === 'regras') regras();
    if (!$('painelObra').hidden) carregarAbas();
  });
  $('lojas').addEventListener('click', (ev) => { const b = ev.target.closest('button[data-loja]'); if (!b || !DADOS) return; LOJA = b.dataset.loja; desenhar(); desenharAba(); });
  $('conteudo').addEventListener('click', (ev) => {
    const th = ev.target.closest('th[data-ord]'); if (th) { const k = th.dataset.ord; ORD = ORD.k === k ? { k, dir: -ORD.dir } : { k, dir: k === 'nome' || k === 'chegada' || k === 'saida' ? 1 : -1 }; desenhar(); return; }
    const pb = ev.target.closest('button[data-pix]'); if (pb) { const ok = () => { pb.textContent = 'Pix copiado ✓'; setTimeout(() => { pb.textContent = 'Copiar a chave Pix'; }, 1800); };
      try { navigator.clipboard.writeText(pb.dataset.pix).then(ok, () => {}); } catch (e) {} }
  });
  $('conteudo').addEventListener('click', (ev) => { const tv = ev.target.closest('button[data-tva]'); if (tv) { TURNO_VER[tv.dataset.tv] = tv.dataset.tva; desenhar(); return; } if (ev.target.closest('th[data-ord],button[data-pix],tr.pm-det')) return; const tr = ev.target.closest('tr.lin'); if (!tr) return; ABERTO[tr.dataset.k] = !ABERTO[tr.dataset.k]; desenhar(); });
  $('btnAntes').onclick = () => { $('dia').value = somaDias($('dia').value, -1); carregar(); };
  $('btnDepois').onclick = () => { $('dia').value = somaDias($('dia').value, 1); carregar(); };
  $('dia').onchange = carregar;
  $('btnAtualizar').onclick = carregar;
  // 26/11/2026 [dono] (Organizador 11:59): a loja escolhida no topo do painel vale aqui também
  const LOJA_NOME = { 'AGUA VERDE': 'Água Verde', 'SÃO BRAZ': 'São Braz', 'SAO BRAZ': 'São Braz', 'AHU': 'Ahú' };
  const lojaDaCasca = () => { const l = typeof lojaAtual === 'function' ? lojaAtual() : null; return !l || l === 'REDE' ? 'todas' : (LOJA_NOME[l] || l); };
  LOJA = lojaDaCasca();
  if (typeof aoMudarLoja === 'function') aoMudarLoja(() => { LOJA = lojaDaCasca(); if (DADOS) { desenhar(); desenharAba(); } });
  $('dia').max = somaDias(hojeSP(), -1);
  $('dia').value = somaDias(hojeSP(), -1);
  (async () => { try { if (typeof lojaCarregar === 'function') await lojaCarregar(); } catch (e) {} LOJA = lojaDaCasca(); carregar(); })();
})();
</script>
